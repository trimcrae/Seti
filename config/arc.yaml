# ARC channel — every physical constant and threshold in one place.
#
# Signature S59 (docs/necrofrontier.md §2, "The arc"): superflares ABOVE the
# starspot energy ceiling.  A flare's energy is bounded by the magnetic energy
# its spots store, E_mag = f (B^2/8pi) A_spot^(3/2); the spot area follows from
# the rotational amplitude.  xi = log10 E_flare - log10 E_mag(f = 1, B = 3 kG,
# A_conservative).  A star with xi > 0 on >= 2 independent flares, that
# survives the companion / blend / evolved / pulsator vetoes, is a candidate
# PENDING the stage-2 pixel-centroid test (docs/arc.md §6).
#
# Table ids below are PREFERRED seeds.  The probe stage lists every table under
# each id in VizieR's TAP_SCHEMA, reads the real column names, resolves the
# roles it needs and falls back to the keyword search when the seed is dead.
# Nothing is queried by a column name that was not seen in TAP_SCHEMA.columns.
# TAPVizieR table names carry literal double quotes; the helpers quote them.
#
# ACCESS PATH (shared helper: src/seti/metronome/acquire.py).  Each id is asked
# of TAPVizieR first, then of every mirror in config/metronome.yaml
# §vizier_routes.  When NO TAP host answers -- TAPVizieR 503'd for hours on
# 2026-09-13/14 -- the id is resolved over VizieR's NON-TAP ASU interface
# instead: ASU has no TAP_SCHEMA, so existence is established by asking for ONE
# ROW of `-source=<id>` and the real column names are read off the TSV header.
# The rows are then pulled the same way and every catalogue records the route
# that served it (`route: asu_tsv`).  A run where nothing answers stays
# QUERY_FAILED with every endpoint and its verbatim error on the record.
access:
  # verify: the ASU parameter spelling is ASSERTED from the VizieR ASU
  # documentation and unconfirmed from the sandbox (no egress); the canonical
  # copy, also marked verify, is config/metronome.yaml §vizier_routes.asu_params.
  non_tap_existence_check: "-source=<table>&-out.max=1&-out.all&-out.form=TSV"

physics:
  b_gauss: 3000.0             # sunspot-umbra field; Okamoto+2021's adopted value
  f_max: 1.0                  # release efficiency at the ceiling (Okamoto's envelope: ~0.1)
  geometric_factor: 3.0       # spot-latitude marginalisation: true area <= 3x amplitude-implied
  independent_gap_days: 0.5   # events closer than this are one energy release
  fallback_teff_k: 5777.0     # used (and FLAGGED stellar_params_assumed) when the catalogue has none
  fallback_radius_rsun: 1.0
  band_fraction_kepler: 0.35  # verify: fraction of L_bol in the Kepler band for a solar-type star
  amplitude_min_frac: 1.0e-4  # below this the "amplitude" is noise, not spots: unassessable

catalogues:
  kepler_okamoto2021:
    mission: kepler
    kind: flares
    preferred: "J/ApJ/906/72/table2"   # Okamoto+2021 ApJ 906, 72 — superflares on solar-type stars, per flare
    keywords: ["superflare", "solar-type"]
    energy: {kind: bolometric, factor: 1.0, log10: auto}
    amplitude_unit: auto
    enabled: true
  kepler_shibayama2013:
    mission: kepler
    kind: flares
    preferred: "J/ApJS/209/5"          # Shibayama+2013 ApJS 209, 5 — 1547 superflares on 279 G dwarfs
    keywords: ["superflare", "Kepler"]
    energy: {kind: bolometric, factor: 1.0, log10: auto}
    amplitude_unit: auto
    enabled: true
  tess_tu2022:
    mission: tess
    kind: flares
    preferred: "J/ApJ/935/90/table2"   # Tu+2022 ApJ 935, 90 — TESS superflare candidates
    keywords: ["superflare", "TESS"]
    energy: {kind: bolometric, factor: 1.0, log10: auto}
    amplitude_unit: auto
    enabled: true
  kepler_yang2019:
    mission: kepler
    kind: flares
    preferred: "J/ApJS/241/29/table2"  # Yang & Liu 2019 ApJS 241, 29 — 162,262 flares (bolometric E)
    keywords: ["flare", "Kepler"]
    energy: {kind: bolometric, factor: 1.0, log10: auto}
    amplitude_unit: auto
    enabled: true
  tess_gunther2020:
    mission: tess
    kind: flares
    preferred: "J/AJ/159/60/table1"    # Günther+2020 AJ 159, 60 — TESS sectors 1-2 flares (E from 9000 K BB)
    keywords: ["flare", "TESS"]
    energy: {kind: bolometric, factor: 1.0, log10: auto}
    amplitude_unit: auto
    enabled: true
  # kepler_davenport2016 was declared here as a FLARES table and is not one.
  # MEASURED (run 34798862983): J/ApJ/829/23/table1 has columns
  #   KIC, g-i, Mass, Prot, Nfl, Nfl68, Lfl/Lkp, e_Lfl/Lkp, alpha, beta, M14, C16
  # — a per-star flare-frequency-distribution summary. `alpha` and `beta` are
  # the FFD power-law coefficients, `Nfl` a count; there is no per-flare energy
  # and no equivalent duration in it at all, so it could never have supplied a
  # flare to the ceiling test and was correctly scored 0. It is moved to
  # star_catalogues below, where its Prot and Mass are real contributions.

# Per-star context by mission, in PRIORITY order for Teff / radius / logg /
# Prot; the rotational amplitude is the MAX over every source that has one
# (the amplitude is a lower bound on the spot area, so the largest is the
# conservative choice — docs/arc.md §3).
star_catalogues:
  kepler:
    - {name: okamoto2021_stars, preferred: "J/ApJ/906/72", keywords: [], amplitude_unit: auto}
    - {name: shibayama2013_stars, preferred: "J/ApJS/209/5/stars", keywords: [], amplitude_unit: auto}
    - {name: yang2019_stars, preferred: "J/ApJS/241/29/table1", keywords: [], amplitude_unit: auto}
    - {name: mcquillan2014, preferred: "J/ApJS/211/24/table1", keywords: [], amplitude_unit: ppm}   # Rper in ppm
    # Santos+2021 carries Sph for tens of thousands of Kepler stars — by far the
    # largest source of the rotational amplitude the ceiling needs. Run
    # 34798862983 lost it because -meta.all named only J/ApJS/255/17/table1 (a
    # per-quarter Teff table) for the bare catalogue id and the rotation table
    # was never listed; the ReadMe union in asu_catalogue_tables now enumerates
    # the whole catalogue. 3,920 of 5,785 stars in that run had NO ceiling for
    # want of an amplitude, which is what this entry is for.
    # amplitude_scale (verify): Sph is a STANDARD DEVIATION of the light curve
    # over 5 x Prot windows, while Notsu's brightness-variation amplitude and
    # McQuillan's Rper are RANGES (top-1 % minus bottom-1 %, 95th minus 5th
    # percentile).  For a sinusoid range = 2 sqrt(2) x std = 2.828 x Sph.  An
    # unscaled Sph understates the spot area by ~2.8, the ceiling by ~4.7 and
    # inflates xi by +0.67 dex; both stage-1 interest stars of run 35055720417
    # were santos2021-sourced.  Scaling up is the conservative direction.
    - {name: santos2021, preferred: "J/ApJS/255/17", keywords: ["rotation", "Kepler"], amplitude_unit: ppm, amplitude_scale: 2.828}  # Sph in ppm, std -> range
    # Per-star Prot and Mass only (no amplitude): see the note in `catalogues`.
    - {name: davenport2016_stars, preferred: "J/ApJ/829/23/table1", keywords: [], amplitude_unit: auto}
  tess:
    - {name: gunther2020_stars, preferred: "J/AJ/159/60/table2", keywords: [], amplitude_unit: auto}
    - {name: tu2022_stars, preferred: "J/ApJ/935/90", keywords: [], amplitude_unit: auto}

# Positions + stellar parameters for the shortlist (assess stage), by id.
param_tables:
  # Berger+2020 is two tables: table2 carries Teff / logg / R* / M* / evolutionary
  # state (no positions), table1 the Gaia id, RUWE and positions.  Run
  # 35055720417 asked table1 and the bare catalogue id only, so every Yang &
  # Liu star kept a SOLAR radius (stellar_params_assumed).  The fetcher merges
  # per column across tables in this order; the KIC is the last resort.
  kepler: ["J/AJ/159/280/table2", "J/AJ/159/280/table1", "V/133/kic"]
  tess: ["IV/39/tic82", "IV/38/tic"]

gaia:
  table: "I/355/gaiadr3"        # RUWE, NSS, Plx, Gmag, VarFlag, neighbours
  vari_table: "I/358/vclassre"  # Gaia DR3 variability class
  cone_radius_arcsec: 12.0
  match_arcsec: 2.0

vet:
  ruwe_max: 1.4
  logg_min: 4.0
  radius_max_rsun: 1.6
  neighbour_radius_arcsec: 12.0
  neighbour_dg_max: 3.0
  min_flares_above: 2
  pulsator_classes: ["ECL", "DSCT", "GDOR", "SXPHE", "RR", "CEP", "T2CEP", "ACEP", "ACV", "CP",
                     "MCP", "ROAM", "ROAP", "SXARI", "WD", "AGN", "YSO", "BE", "GCAS", "SDB",
                     "MICROLENSING", "ELL"]
  doubtful_flag_patterns: ["doubt", "bin", "contam", "eclips", "pollut", "bad", "^[fF]$", "^[bB]$", "^[dD]$"]

shortlist:
  max_stars: 3000               # Gaia cones per run (xi_conservative > 0 first, then xi_nominal > 0)
  include_watch: true

assess:
  # MEASURED (run 35675114711): the assess stage sat in the parameter / Gaia
  # block for 4 h 54 m and the workflow cap killed the job with NO summary
  # written -- the whole run's screening was thrown away for one wedged VizieR
  # async job.  pyvo's run_async polls a remote job with no time limit, so the
  # bound has to be imposed here: every query gets query_timeout_s, and the
  # block as a whole gets budget_s.  A shortlist star the clock did not reach
  # carries gaia_reached = False (the veto UNAPPLIED, not passed) and the run
  # is degraded with assess_context:budget_spent -- never silently clean.
  budget_s: 2400.0              # 40 min for the whole parameter + cone block
  query_timeout_s: 240.0        # one TAP query / one cone; 0 = unbounded

probe:
  # MEASURED (run 35038502122): the probe stage ran for FIFTY MINUTES and was
  # still going. Discovery walks the whole route ladder per catalogue, and a
  # slow or flaky TAP multiplies that by every catalogue and every candidate
  # table. Nothing was written until the last catalogue returned, so a run
  # killed by the workflow cap would have committed nothing at all.
  # probe.json is now written after EVERY catalogue, and a catalogue the wall
  # clock did not reach is DISCOVERY_NOT_ATTEMPTED with the reason recorded —
  # which is NOT the same fact as QUERY_RETURNED_ZERO_ROWS and must never be
  # read as "this table does not exist". Set to 0 or null for no ceiling.
  budget_s: 1800.0

acquire:
  chunk_rows: 50000
  max_rows: 0                   # 0 = no cap

# STAGE 2 — IS THE FLARE ON THE TARGET? (src/seti/arc/stage2.py, docs/arc.md §6)
# For every shortlisted star: the catalogue's own flare rows (Yang & Liu 2019
# give the quarter and a Begin / End time), Berger+2020 + Gaia FLAME
# parameters, the Gaia census inside one Kepler pixel (4") and the 12"
# aperture, the quarter's light curve (flare re-detection, re-measured energy,
# the quarter's own rotational amplitude) and target pixel file (the
# flux-weighted centroid shift and the difference-image centroid per flare).
stage2:
  tiers: ["interest", "watch"]  # interest first, then watch, by xi
  # A HARD VETO IS A SUSPICION THE PIXELS CAN ADJUDICATE.  companion_suspect
  # is raised from RUWE / NSS / a 12" neighbour and keeps a star out of every
  # tier, so it never reaches stage 2 -- and it is exactly the mechanism the
  # centroid test exists to settle.  MEASURED (run 35738218021): the channel's
  # ONLY star above the conservative ceiling on measured parameters, KIC
  # 9418692 (xi_conservative = +0.462 on 4 flares, 13 independent events),
  # is first_veto = companion_suspect and appears in no tier at all.  These
  # stars are now shortlisted AHEAD of every watch star.
  include_vetoed_excess: true
  vetoed_first_vetoes: ["companion_suspect", "blend", "catalogue_doubtful"]
  missions: ["kepler", "tess"]
  max_stars: 40
  max_flares_per_star: 6        # the largest exceeding flares per star
  budget_s: 9000.0              # the whole stage (2.5 h); a star the clock does not reach is centroid_untestable
  per_star_budget_s: 1500.0
  retries: 2
  retry_pause_s: 5.0
  max_products: 4               # products per star per fetch (a quarter is one product)
  quality_bitmask: "default"
  # flare finder (Chang+2015 style: consecutive points above n sigma)
  window_days: 0.5              # running-median detrend window
  n_sigma: 3.0
  min_consecutive: 2            # Kepler long cadence: 2 x 29.4 min
  peak_sigma: 4.0
  extend_sigma: 1.0
  t_flare_k: 9000.0             # the white-light blackbody of Shibayama+2013 / Yang & Liu 2019
  # the centroid test
  baseline_days: 1.0            # out-of-flare window either side
  exclude_cadences: 3           # padding around the flare left out of the baseline
  core_fraction: 0.2            # difference image from cadences above this fraction of the peak
  sys_floor_px: 0.1             # verify: centroid systematic floor on 4" pixels
  n_sigma_centroid: 3.0
  min_snr: 3.0                  # difference-image peak SNR needed to attribute at all
  unresolved_px: 0.5            # a non-excluded neighbour this close to the target -> ambiguous
  trend_order: 1
  # the census
  census_radius_arcsec: 12.0
  pixel_radius_arcsec: 4.0      # one Kepler pixel
  target_match_arcsec: 2.0
  max_neighbour_amplitude: 20.0 # verify: a neighbour needing > 2000 % brightening is excluded by arithmetic
  prf_sigma_px_kepler: 0.7      # verify: Kepler PRF FWHM ~1.5-1.7 px
  prf_sigma_px_tess: 0.9
  # parameters
  flame_table: "I/355/paramp"   # Gaia DR3 astrophysical parameters: Radius-Flame, Mass-Flame, ...
  gaia_table: "I/355/gaiadr3"
  sph_to_range: 2.828           # applied to a stage-1 record whose amplitude is an UNSCALED Sph
