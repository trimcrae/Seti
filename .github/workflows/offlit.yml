name: offlit

# Literature survey acquisition: sources that DISAPPEAR / signatures that TURN
# OFF. Prior-art reconnaissance for a proposed "IR excess in IRAS, absent in
# WISE" search: VASCO/vanishing stars, disappearing IR excesses, ceased
# technosignatures, and the Carrigan/G-HAT/Hephaistos Dyson-sphere lineage.
# The sandbox blocks arxiv.org / ADS / Semantic Scholar / IOP (CONNECT 403);
# the runner has egress (CLAUDE.md acquisition pattern). Results are committed
# back to the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offlit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch literature evidence (soft 45-min deadline, partials kept)
        run: |
          timeout -k 30 2700 python scripts/offlit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== files ==="
          ls -la results/offlit/ || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/offlit/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "offlit: arXiv/S2/OpenAlex metadata for disappearing-signature literature survey"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offlit-outputs
          path: results/offlit/
          if-no-files-found: warn
