name: midden-deepdive

# HD 217522 deep-dive (docs/midden.md + results/midden/REPORT.md verdict):
# every triplet-covering high-resolution ESO spectrum of the target plus a
# roAp comparison panel, measured with the NIST-gated MIDDEN machinery, then
# scored for epoch stability (Tc must be static) and panel standing.  Every
# stage checkpoints; resume_run_id seeds a rerun from a prior artifact.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (discover|measure|score|all)"
        required: false
        default: "all"
      epochs_per_star:
        description: "Epoch cap per comparison star"
        required: false
        default: "30"
      target_epochs:
        description: "Epoch cap for HD 217522 itself"
        required: false
        default: "80"
      resume_run_id:
        description: "Prior run id whose checkpoint artifact should seed this run"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  midden-deepdive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify line list against NIST (hard gate)
        run: python -m seti.cli midden --stage verify-lines
      - name: Seed checkpoints from a prior run's artifact
        if: ${{ github.event.inputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: midden-deepdive-outputs
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: results/midden_deepdive/
      - name: Run deep-dive
        run: |
          ls -la results/midden_deepdive/ 2>/dev/null || true
          python -m seti.cli midden-deep \
            --stage ${{ github.event.inputs.stage || 'all' }} \
            --epochs-per-star ${{ github.event.inputs.epochs_per_star || '30' }} \
            --target-epochs ${{ github.event.inputs.target_epochs || '80' }}
          echo "=== summary ==="
          cat results/midden_deepdive/deepdive_summary.json || true
      - name: Commit results (summary + report + epoch table)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in results/midden_deepdive/deepdive_summary.json \
                   results/midden_deepdive/target_epochs.csv \
                   results/midden_deepdive/DEEPDIVE.md; do
            [ -f "$f" ] && git add -f -- "$f" || true
          done
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "midden-deepdive: HD 217522 multi-instrument epoch audit results"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midden-deepdive-outputs
          path: results/midden_deepdive/
          if-no-files-found: warn
