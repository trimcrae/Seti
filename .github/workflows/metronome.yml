name: metronome

# METRONOME — clocks in stellar flare timing (docs/metronome.md).
#
#   probe+acquire ──▶ screen (catalogue × shard matrix) ──▶ assess ──▶ commit-back
#   lit (independent): the prior-art sweep, scripts/metronomelit_fetch.py
#
# Signature S28: STRUCTURE IN TIMING SERIES.  Do any star's catalogued flares
# occur on a strict clock?  Natural flares are Poisson-like; the only natural
# quasi-periodicity (rotational modulation of flare visibility) carries a phase
# jitter of order a tenth of a cycle.  A pulsed transmitter / duty-cycled
# engine / beacon is a clock with jitter far below that.
#
# THE GOVERNING DISCIPLINES (docs/metronome.md §4):
#  * the null carries the cadence and the gaps BY CONSTRUCTION — event times
#    are resampled from each star's own observing windows and snapped to the
#    mission cadence, so quarter gaps / sector gaps / 30-min quantisation are
#    inside the null rather than inside the signal;
#  * cross-star coincidences (momentum dumps, Argabrightenings) are removed
#    from every star BEFORE any star is scanned, and counted;
#  * every rejection is a named mechanism with its own counter;
#  * schema discovery at runtime — no column name is queried that was not
#    seen in TAP_SCHEMA.columns; QUERY_FAILED and QUERY_RETURNED_ZERO_ROWS are
#    kept apart in the artefact.
#
# Operational design inherited from knell.yml / herdsman.yml: checkpointing
# (every shard writes its own stars_*.csv), sharding (fail-fast: false matrix),
# artifact passthrough (acquisition happens once), reduce_only_run_id, and
# commit-back through scripts/commit_results.sh, which VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          Which stages to run: "all" (probe+acquire, screen matrix, assess),
          "probe" (schema discovery only — cheap, run this first),
          "assess" with reduce_only_run_id to re-vet a prior run's shards,
          "redetect" with reduce_only_run_id to run ONLY the light-curve
          verdict (catalogue-epoch stack + photometric veto) over a prior
          run's shortlist — one runner, MAST only, or
          "vetstar" to run the single-star eclipsing-binary vet on ONE star
          (variability catalogues + fold at P and 2P + flare phase in orbital
          phase + Gaia astrometry).  reduce_only_run_id is optional there and
          only supplies the catalogued epochs.
        required: false
        default: "all"
      catalogues:
        description: >-
          Comma-separated catalogue keys from config/metronome.yaml
          (default: every enabled one).  e.g. "kepler_yang2019,tess_tu2022"
        required: false
        default: "kepler_yang2019,kepler_okamoto2021,kepler_shibayama2013,tess_gunther2020,tess_tu2022,tess_pietras2022"
      n_shards:
        description: "Shards per catalogue in the screen matrix"
        required: false
        default: "8"
      run_redetect:
        description: >-
          After assess, re-detect flares in the MAST light curves of the
          shortlist (watch or better + the most flare-rich stars) and rerun
          the clock test on them (true/false)
        required: false
        default: "true"
      redetect_max_stars:
        description: "Cap on stars whose light curves are fetched in the redetect job"
        required: false
        default: "40"
      max_stars:
        description: "Cap on stars scanned per shard (0 = no cap)"
        required: false
        default: "0"
      max_rows:
        description: "Cap on rows pulled per catalogue (0 = no cap)"
        required: false
        default: "0"
      run_lit:
        description: "Run the prior-art sweep (scripts/metronomelit_fetch.py) (true/false)"
        required: false
        default: "true"
      reduce_only_run_id:
        description: "Skip probe/acquire/screen; assess from this prior run's artifacts"
        required: false
        default: ""
      vet_star:
        description: 'vetstar: the star to vet, as mission:id (e.g. kepler:5879574)'
        required: false
        default: "kepler:5879574"
      vet_period:
        description: 'vetstar: the clock period in days'
        required: false
        default: "0.42328185409991"

permissions:
  contents: write
  # A permissions block REPLACES the defaults, so without this every
  # cross-run `actions/download-artifact` (reduce_only_run_id, in assess-only,
  # redetect-only and vetstar) gets 403 and silently brings back nothing.
  # MEASURED: run 35796061650's vetstar job reported n_catalogue_epochs = 0
  # because the acquire artifact never arrived.
  actions: read

jobs:
  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      catalogues: ${{ steps.mk.outputs.catalogues }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          raw = """${{ github.event.inputs.catalogues }}""".strip()
          cats = [c.strip() for c in raw.split(",") if c.strip()]
          n = int("${{ github.event.inputs.n_shards || '8' }}" or 8)
          combos = [{"catalogue": c, "shard": i} for c in cats for i in range(n)]
          print("matrix=" + json.dumps({"include": combos}))
          print("catalogues=" + ",".join(cats))
          PY

  acquire:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — injected clock must be recovered on this runner
        run: python -m pytest tests/test_metronome.py -q -p no:cacheprovider -k "injected or poisson or no_data"
      - name: Probe (schema discovery, row counts, time-system guesses)
        run: |
          python -m seti.metronome.run --stage probe \
            --catalogues "${{ needs.plan.outputs.catalogues }}"
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/metronome/probe.json"))
          for k, v in d["catalogues"].items():
              print(k, v["status"], v.get("table"), v.get("n_rows"), v.get("time_system_guess"), v.get("roles"))
              print("   time column:", v.get("time_column"), v.get("time_column_meta"))
              for b in v.get("scoreboard", [])[:12]:
                  print("   board:", b.get("table"), b.get("score"), b.get("reason"))
          cen = d.get("census") or {}
          for name, c in cen.items():
              print(f"=== census {name}: {c.get('status')} n={c.get('n')}")
              for r in c.get("rows", [])[:120]:
                  print("   ", r["table"], "|", r["description"])
          PY
      - name: Acquire (event tables + rotation tables, chunked, logged)
        if: ${{ github.event.inputs.stage != 'probe' }}
        run: |
          MR=""
          if [ "${{ github.event.inputs.max_rows || '0' }}" != "0" ]; then
            MR="--max-rows ${{ github.event.inputs.max_rows }}"
          fi
          python -m seti.metronome.run --stage acquire \
            --catalogues "${{ needs.plan.outputs.catalogues }}" $MR
          echo "=== acquire ==="
          python - <<'PY'
          import json
          d = json.load(open("results/metronome/acquire.json"))
          for k, v in d["catalogues"].items():
              print(k, v["status"], v.get("n_events"), "events", v.get("n_stars"), "stars", v.get("time_system_guess"))
          for m, v in d["rotation"].items():
              print("rotation", m, v["n_rows"], "rows")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-acquire
          path: |
            results/metronome/probe.json
            results/metronome/acquire.json
            results/metronome/acquisition_log.json
            results/metronome/data/
          if-no-files-found: warn

  screen:
    needs: [plan, acquire]
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: metronome-acquire
          path: results/metronome/
      - name: Screen ${{ matrix.catalogue }} shard ${{ matrix.shard }}
        run: |
          MS=""
          if [ "${{ github.event.inputs.max_stars || '0' }}" != "0" ]; then
            MS="--max-stars ${{ github.event.inputs.max_stars }}"
          fi
          python -m seti.metronome.run --stage screen \
            --catalogues "${{ matrix.catalogue }}" \
            --shard ${{ matrix.shard }} --n-shards ${{ github.event.inputs.n_shards || '8' }} $MS
          python - <<'PY'
          import glob, json
          for p in sorted(glob.glob("results/metronome/screen_*.json")):
              d = json.load(open(p))
              print(p, "grid:", d.get("time_grid"), "pool nulls:", d.get("n_pool_null_computed"))
          PY
          ls -la results/metronome/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-screen-${{ matrix.catalogue }}-${{ matrix.shard }}
          path: |
            results/metronome/stars_*.csv
            results/metronome/screen_*.json
          if-no-files-found: warn

  assess:
    needs: [acquire, screen]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: metronome-*
          merge-multiple: true
          path: results/metronome/
      - name: Assess (BH-FDR, vetting context, tiers, calibration)
        run: |
          ls results/metronome/ | head -60
          python -m seti.metronome.run --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/metronome/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("acquisition", "config", "cross_star_epochs")}, indent=2)[:6000])
          PY
      # A verdict must never read as a science null when no data was scanned.
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/metronome/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), s.get("n_stars_scanned", s.get("funnel", {}).get("stars_scanned", 0))
          if n == 0 and not any(x in v for x in ("NO_DATA_REACHED", "QUERY_RETURNED_ZERO_ROWS", "NO_STAR_REACHED_N_MIN")):
              print(f"::error::verdict {v!r} with 0 scanned stars is a disguised no-data run"); sys.exit(1)
          if "NO_CLOCK_CANDIDATES" in v:
              print(f"::notice::{n} stars scanned, no clock at interest tier. A COUNT, NOT AN OCCURRENCE LIMIT — see docs/metronome.md.")
          if "CLOCK_CANDIDATES_PENDING_VET" in v:
              print(f"::notice::{s.get('n_candidates')} candidate / {s.get('n_interest')} interest stars — PENDING light-curve vet, see results/metronome/candidates.json")
          PY
      # A run that queued for hours commits at the code it was DISPATCHED
      # from, and commit_results.sh is last-writer-wins by design, so a late
      # arrival silently overwrites newer results (measured: run 35741300225,
      # 2026-09-22 — see scripts/metronome_stale_guard.py).  The artefact's
      # own generated_utc is what distinguishes it; an ancestry test cannot.
      - name: Guard — do not overwrite newer results
        id: guard
        if: always()
        run: python scripts/metronome_stale_guard.py "${{ github.ref_name }}" results/metronome/summary.json results/metronome/probe.json
      - name: Commit results
        if: ${{ always() && steps.guard.outputs.stale != 'true' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The result of the push is VERIFIED against the remote, and a
          # failure turns this run red rather than dropping the results in a
          # green one.  See scripts/commit_results.sh -- run 33029076779 spent
          # 169 minutes walking the ATLAS queue and landed nothing.
          scripts/commit_results.sh \
            "metronome: clocks in flare timing — probe/acquire/screen/assess" \
            results/metronome/probe.json \
            results/metronome/acquire.json \
            results/metronome/acquisition_log.json \
            results/metronome/summary.json \
            results/metronome/candidates.json \
            results/metronome/stars_vetted.csv \
            $(ls results/metronome/screen_*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-final
          path: results/metronome/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Flare RE-DETECTION on the shortlist's own light curves (MAST).  Needs
  # stars_vetted.csv from assess and the data/ parquet from acquire (the
  # catalogued times are the detector's calibration set).  `tess` extra brings
  # lightkurve; growth.stage2 falls back to astroquery.mast + FITS without it.
  # ------------------------------------------------------------------
  redetect:
    needs: [acquire, assess]
    if: ${{ always() && github.event.inputs.run_redetect != 'false' && github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - uses: actions/download-artifact@v4
        with:
          name: metronome-acquire
          path: results/metronome/
      - uses: actions/download-artifact@v4
        with:
          name: metronome-final
          path: results/metronome/
      - name: Offline gate — the detector must recover injected flares and the clock on them
        run: python -m pytest tests/test_metronome.py -q -p no:cacheprovider -k "redetect"
      - name: Re-detect flares and rerun the clock test (bounded)
        run: |
          ls results/metronome/ | head -40
          python -m seti.metronome.run --stage redetect \
            --max-stars ${{ github.event.inputs.redetect_max_stars || '40' }} \
            --budget-s 6000
          echo "=== redetect ==="
          python - <<'PY'
          import json
          d = json.load(open("results/metronome/redetect.json"))
          print(d["verdict"], "targets", d["n_targets"], "fetched", d["n_fetched"], "scanned", d["n_scanned"],
                "confirmed", d["n_confirms_catalogue_clock"], "recovery", d["catalogue_recovery_frac_median"])
          for t in d["targets"][:60]:
              print(t["star_key"], t["tier"], t["why"], t["status"], "n_cat", t["n_events"], "n_lc", t["n_flares"],
                    "rec", t["catalogue_recovery_frac"], "Pcat", t["period_catalogue"], "Plc", t["rd_period"],
                    "Q", t["rd_Q"], "jit", t["rd_jitter"], "p", t["rd_p_window"], "confirms", t["confirms_catalogue_clock"],
                    "Pphot", t.get("phot_period"), "Aphot", t.get("phot_amplitude_frac"),
                    "is_phot", t.get("period_is_photometric"), "duty", t.get("rd_duty_cycle"),
                    "rise", t.get("rd_rise_frac_median"))
          PY
      # A run that queued for hours commits at the code it was DISPATCHED
      # from, and commit_results.sh is last-writer-wins by design, so a late
      # arrival silently overwrites newer results (measured: run 35741300225,
      # 2026-09-22 — see scripts/metronome_stale_guard.py).  The artefact's
      # own generated_utc is what distinguishes it; an ancestry test cannot.
      - name: Guard — do not overwrite newer results
        id: guard
        if: always()
        run: python scripts/metronome_stale_guard.py "${{ github.ref_name }}" results/metronome/redetect.json results/metronome/summary.json
      - name: Commit results
        if: ${{ always() && steps.guard.outputs.stale != 'true' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "metronome: flare re-detection on the shortlist's light curves" \
            results/metronome/redetect.json \
            results/metronome/stars_redetect.csv \
            results/metronome/summary.json \
            results/metronome/candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-redetect
          path: |
            results/metronome/redetect.json
            results/metronome/stars_redetect.csv
            results/metronome/summary.json
            results/metronome/candidates.json
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Re-detection ALONE, over a prior run's acquire + assess artifacts.
  # The light-curve tests (the catalogue-epoch stack and the photometric
  # veto) are what decide a shortlist, and they need one runner and no
  # archive but MAST.  Waiting for a whole acquire + screen matrix to
  # repeat before they can be re-run costs an hour of queue for nothing.
  # ------------------------------------------------------------------
  redetect-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' && github.event.inputs.stage == 'redetect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - name: Fetch artifacts from a prior run
        uses: actions/download-artifact@v4
        with:
          pattern: metronome-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/metronome/
      - name: Offline gate — the detector must recover injected flares and the clock on them
        run: python -m pytest tests/test_metronome.py -q -p no:cacheprovider -k "redetect or catalogue_epoch or reconcile"
      - name: Re-detect flares, stack the catalogue epochs, rerun the clock test
        run: |
          ls results/metronome/ | head -40
          ls results/metronome/data 2>/dev/null | head -20
          python -m seti.metronome.run --stage redetect \
            --max-stars ${{ github.event.inputs.redetect_max_stars || '40' }} \
            --budget-s 11000
          echo "=== redetect ==="
          python - <<'PY'
          import json
          d = json.load(open("results/metronome/redetect.json"))
          print(d["verdict"], "targets", d["n_targets"], "fetched", d["n_fetched"],
                "scanned", d["n_scanned"], "confirmed", d["n_confirms_catalogue_clock"],
                "epochs_absent", d.get("n_catalogue_epochs_absent"),
                "epochs_confirmed", d.get("n_catalogue_epochs_confirmed"),
                "recovery", d["catalogue_recovery_frac_median"])
          print("reconciliation:", json.dumps(d.get("reconciliation", {}))[:2000])
          for t in d["targets"]:
              print(t["star_key"], t["tier"], t["status"],
                    "n_cat", t["n_events"], "n_lc", t["n_flares"],
                    "rec", t["catalogue_recovery_frac"],
                    "Pcat", t["period_catalogue"], "Plc", t["rd_period"],
                    "confirms", t["confirms_catalogue_clock"],
                    "Pphot", t.get("phot_period"), "is_phot", t.get("period_is_photometric"),
                    "| epochs", t.get("cat_n_epochs"),
                    "sig", t.get("cat_epoch_sigma_median"),
                    "ctl", t.get("cat_control_sigma_median"),
                    "p", t.get("cat_p_empirical"),
                    "real", t.get("catalogue_epochs_are_brightenings"),
                    "off", t.get("cat_best_offset_days"),
                    "off_sig", t.get("cat_best_offset_sigma_median"))
          PY
          echo "=== summary after reconciliation ==="
          python -c "import json;d=json.load(open('results/metronome/summary.json'));print(d['verdict']);print(json.dumps(d.get('redetect',{}).get('demoted'),indent=1));print(json.dumps(d.get('funnel'),indent=1))"
      # A run that queued for hours commits at the code it was DISPATCHED
      # from, and commit_results.sh is last-writer-wins by design, so a late
      # arrival silently overwrites newer results (measured: run 35741300225,
      # 2026-09-22 — see scripts/metronome_stale_guard.py).  The artefact's
      # own generated_utc is what distinguishes it; an ancestry test cannot.
      - name: Guard — do not overwrite newer results
        id: guard
        if: always()
        run: python scripts/metronome_stale_guard.py "${{ github.ref_name }}" results/metronome/redetect.json results/metronome/summary.json
      - name: Commit results
        if: ${{ always() && steps.guard.outputs.stale != 'true' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "metronome: light-curve verdict on the shortlist (epoch stack + photometric veto)" \
            results/metronome/redetect.json \
            results/metronome/stars_redetect.csv \
            results/metronome/summary.json \
            results/metronome/candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-redetect
          path: |
            results/metronome/redetect.json
            results/metronome/stars_redetect.csv
            results/metronome/summary.json
            results/metronome/candidates.json
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # THE SINGLE-STAR VET.  One star, every mundane explanation asked
  # explicitly (docs/metronome.md, "the vet").  A clock at 0.4233 d sits in
  # the contact-binary range, and `period_is_photometric: false` only says the
  # clock is not the star's DOMINANT periodicity — a grazing or diluted
  # eclipsing binary never is, and still makes a strict clock.  Needs VizieR
  # + Gaia TAP + MAST; one runner, no matrix, no shards.  reduce_only_run_id
  # is optional and only brings the catalogued epochs along.
  # ------------------------------------------------------------------
  vetstar:
    if: ${{ github.event.inputs.stage == 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - name: Fetch artifacts from a prior run (optional — the catalogued epochs)
        if: ${{ github.event.inputs.reduce_only_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: metronome-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/metronome/
      - name: Offline gate — the vet must recover an injected EB and null a real clock
        run: python -m pytest tests/test_metronome_vetstar.py -q -n auto -p no:cacheprovider
      - name: Vet the star
        run: |
          ls results/metronome/ | head -40
          ls results/metronome/data 2>/dev/null | head -20
          python -m seti.metronome.run --stage vetstar \
            --star-key "${{ github.event.inputs.vet_star || 'kepler:5879574' }}" \
            --period "${{ github.event.inputs.vet_period || '-1' }}" \
            --budget-s 7200
      - name: Report the vet verbatim
        if: always()
        run: python scripts/metronome_vetstar_report.py results/metronome/vetstar.json
      # A run that queued for hours commits at the code it was DISPATCHED
      # from, and commit_results.sh is last-writer-wins by design, so a late
      # arrival silently overwrites newer results (measured: run 35741300225,
      # 2026-09-22 — see scripts/metronome_stale_guard.py).  The artefact's
      # own generated_utc is what distinguishes it; an ancestry test cannot.
      - name: Guard — do not overwrite newer results
        id: guard
        if: always()
        run: python scripts/metronome_stale_guard.py "${{ github.ref_name }}" results/metronome/vetstar.json results/metronome/summary.json
      - name: Commit results
        if: ${{ always() && steps.guard.outputs.stale != 'true' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "metronome: the single-star vet on the surviving clock" \
            results/metronome/vetstar.json \
            results/metronome/vetstar_fold.csv \
            results/metronome/summary.json \
            results/metronome/candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-vetstar
          path: |
            results/metronome/vetstar.json
            results/metronome/vetstar_fold.csv
            results/metronome/summary.json
            results/metronome/candidates.json
          if-no-files-found: warn

  assess-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' && github.event.inputs.stage != 'redetect' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch artifacts from a prior run
        uses: actions/download-artifact@v4
        with:
          pattern: metronome-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/metronome/
      - name: Assess
        run: |
          python -m seti.metronome.run --stage assess
          cat results/metronome/summary.json | head -120
      # A run that queued for hours commits at the code it was DISPATCHED
      # from, and commit_results.sh is last-writer-wins by design, so a late
      # arrival silently overwrites newer results (measured: run 35741300225,
      # 2026-09-22 — see scripts/metronome_stale_guard.py).  The artefact's
      # own generated_utc is what distinguishes it; an ancestry test cannot.
      - name: Guard — do not overwrite newer results
        id: guard
        if: always()
        run: python scripts/metronome_stale_guard.py "${{ github.ref_name }}" results/metronome/summary.json
      - name: Commit results
        if: ${{ always() && steps.guard.outputs.stale != 'true' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "metronome: re-assess of a prior run's shards" \
            results/metronome/summary.json \
            results/metronome/candidates.json \
            results/metronome/stars_vetted.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronome-final
          path: results/metronome/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Prior-art sweep.  Independent of the search so an arXiv outage cannot
  # cost the run, and vice versa.  Verbatim abstracts only; the novelty
  # position in docs/metronome.md is "to be verified by metronomelit".
  # ------------------------------------------------------------------
  lit:
    if: ${{ github.event.inputs.run_lit != 'false' && github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'vetstar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch prior-art evidence (soft 45-min deadline, partials kept)
        run: |
          timeout -k 30 2700 python scripts/metronomelit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== summary ==="
          python -c "import json;d=json.load(open('results/metronomelit/summary.json'));print(d['n_ok'],'ok /',d['n_urls'],'urls')" || true
          python -c "import json;d=json.load(open('results/metronomelit/concept_scan.json'));print(d['n_abstracts_scanned'],'abstracts,',d['n_target_regex_hits'],'hits,',d['n_after_decoy_removal'],'decoy-free')" || true
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "metronomelit: METRONOME prior-art sweep (verbatim arXiv abstracts)" \
            results/metronomelit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metronomelit
          path: results/metronomelit/
          if-no-files-found: warn
