# DERELICT — thin-film / high area-to-mass debris search thresholds.
#
# Every selection number the channel uses lives here; code never hard-codes a
# threshold.  See docs/derelict.md for the physics and the novelty argument.

physics:
  # Radiation-pressure efficiency assumed when converting beta -> area-to-mass.
  # Q_pr = 1 is pure absorption (a black regolith body, and the convention
  # Bialy & Loeb 2018 used for 'Oumuamua).  Q_pr = 2 is perfect specular
  # reflection (an aluminised sail) and HALVES the implied area-to-mass for a
  # given beta.  We report the Q_pr = 1 value as the headline because it is the
  # CONSERVATIVE one: it maximises the implied area-to-mass and therefore makes
  # the "this must be a film" claim harder, not easier.
  q_pr: 1.0
  # Bulk density (kg/m^3) assumed for the natural-body comparison AMR_natural
  # = 3 / (2 D rho).  1000 is deliberately LOW (a rubble pile / cometary
  # density), which maximises AMR_natural and therefore SHRINKS R.  Again the
  # conservative direction.
  rho_natural_kg_m3: 1000.0
  # Albedo assumed when a diameter must be derived from H.  0.15 is the usual
  # NEO working value.  Sensitivity to this is reported per object: D scales as
  # p^(-1/2), so R scales as p^(-1/2) too.
  albedo_assumed: 0.15
  # Bracketing albedos for the R-statistic sensitivity interval.  R is LINEAR
  # in D, so a darker assumed albedo (larger body, more mass behind the same
  # cross-section) makes the same measured acceleration MORE anomalous.
  albedo_lo: 0.05     # dark carbonaceous -> larger D -> R_hi
  albedo_hi: 0.60     # very bright      -> smaller D -> R_lo (the conservative end)

screen_a1_only:
  # Screen 1: the dark-comet COMPLEMENT.  Significant radial acceleration with
  # the non-radial components consistent with zero -- exactly the population the
  # dark-comet papers selected AGAINST.
  a1_snr_min: 3.0        # A1 / sigma_A1 (signed: must be POSITIVE and > this)
  a2_snr_max: 1.0        # |A2| / sigma_A2 must be below this
  a3_snr_max: 1.0        # |A3| / sigma_A3 must be below this
  # Orbit-quality gates that kill short-arc garbage.  MPC condition code U runs
  # 0 (best) to 9 (worst); a spurious A1 is overwhelmingly a short-arc artefact.
  condition_code_max: 4
  data_arc_days_min: 30.0
  n_obs_min: 30
  # Objects with a fitted cometary delay parameter DT, or a reported coma, are
  # outgassing and leave the channel.
  require_no_coma: true

screen_r:
  # Screen 2: the normalised outlier statistic R = AMR_implied / AMR_natural.
  # R ~ 1 is an ordinary body of the observed size; R >> 1 cannot be one.
  r_flag: 10.0        # worth a look
  r_strong: 100.0     # cannot be a monolith of the observed cross-section
  r_extreme: 1000.0   # film territory ('Oumuamua sits at ~1e5 for D = 100 m)

screen_negative_a1:
  # Screen 3: radiation pressure cannot push sunward.  A significant A1 < 0 is
  # a systematic or something very strange.  Cheap, and never published.
  a1_snr_min: 3.0     # |A1| / sigma_A1 with A1 < 0

screen_albedo:
  # Screen 4: geometric albedo impossible for natural regolith, trivial for
  # aluminised film.  Fresh ice and E-type enstatite reach ~0.6; a bare metal
  # film is >0.8.
  albedo_min: 0.70
  albedo_snr_min: 2.0   # require the albedo to exceed the cut significantly

dark_comets:
  # The named-target census (docs/derelict.md section 3).  Seligman et al.
  # selected on large NON-RADIAL acceleration -- the complement of what this
  # channel wants -- so the question these objects answer is: which of them have
  # a JPL-fitted A1 at all, and where does it put them in R?
  #
  # PROVENANCE IS MANDATORY.  This repository has been bitten TWICE by
  # identifiers recalled from memory (docs/derelict.md section 2.1: two wrong
  # arXiv papers fetched successfully).  Every designation below was read
  # VERBATIM from the fetched full text committed in results/derelictlit/, not
  # recalled:
  #
  #   seligman2023_psj  -> results/derelictlit/txt_seligman2023_dark_comets.txt
  #                        "Dark Comets? Unexpectedly Large Nongravitational
  #                        Accelerations on a Sample of Small Asteroids",
  #                        arXiv:2212.08115v2, Table 1 (7 objects).
  #   seligman2024_pnas -> results/derelictlit/txt_seligman2024_two_populations.txt
  #                        "Two Distinct Populations of Dark Comets Delineated by
  #                        Orbits and Sizes", PNAS 121(51), doi
  #                        10.1073/pnas.2406424121, Tables 1-2 (14 total; the 7
  #                        below are the ones NOT already in the 2023 table).
  #
  # Note: the 2023 ABSTRACT prints "2016 RH120", which is a typo -- its own
  # Table 1, figure captions and notes all print 2006 RH120, and that is the
  # designation used here.  Designations are resolved through sbdb.api at run
  # time and an unresolvable one is REPORTED, never silently dropped.
  targets:
    seligman2023_psj:
      - "1998 KY26"
      - "2005 VL1"
      - "2016 NJ33"
      - "2010 VL65"
      - "2010 RF12"
      - "2006 RH120"
      - "2003 RM"
    seligman2024_pnas:
      - "2001 ME1"
      - "2005 UY6"
      - "1998 FR11"
      - "2012 UR158"
      - "2013 BA74"
      - "2016 GW221"
      - "2013 XY20"
  # Outer/inner population labels from Seligman et al. 2024 Fig. 1 panels and the
  # printed Tisserand parameter (the bold/italic font coding that Table 1's
  # caption uses does not survive PDF text extraction, so this is INFERRED from
  # T_J and the figure labels, not read as a literal string).
  populations:
    outer: ["2001 ME1", "2005 UY6", "1998 FR11", "2012 UR158", "2003 RM"]
    inner: ["2005 VL1", "2010 RF12", "1998 KY26", "2016 NJ33", "2010 VL65",
            "2013 BA74", "2006 RH120", "2016 GW221", "2013 XY20"]

census:
  # Completeness cross-check of the sb-cdata={"AND":["A1|DF"]} constraint.
  # 22 rows is small enough that "the constraint is subtly wrong" and "the
  # population really is that small" are indistinguishable without pulling the
  # catalogue unconstrained and comparing designation SETS (not just counts:
  # two different sets can have the same size).
  completeness_fields:
    [spkid, full_name, pdes, kind, class, A1, A2, A3]
  completeness_max_listed: 500       # cap on designations listed in the report
  # Fallback chunking axis, used ONLY if the single unconstrained pull fails.
  # NOT asserted to be exhaustive -- the union's row count is compared against
  # the server's own reported count and a shortfall is reported.
  asteroid_class_chunks:
    [IEO, ATE, APO, AMO, MCA, IMB, MBA, OMB, TJN, CEN, TNO, AST, PAA, HYA]
  comet_class_chunks: [COM, CTc, ETc, HTC, JFc, JFC, PAR, HYP]
  # Independent, catalogue-wide albedo screen: how many survivors get an IRSA
  # (NEOWISE) cross-check.  A single-source albedo above the cut is a fit
  # artefact until a second measurement agrees.
  high_albedo_crosscheck: true
  high_albedo_max_crosscheck: 500
  # Cap on how many query records are inlined into summary.json.  The COMPLETE
  # log always goes to results/derelict/queries.json; truncation of the inline
  # copy is recorded explicitly and never silent.
  max_queries_in_summary: 4000

vet:
  # Human hardware is the DOMINANT contaminant: JPL/MPC already use exactly this
  # area-to-mass test to unmask rocket bodies.  Anything with a high implied AMR
  # on a near-Earth, low-eccentricity, low-inclination orbit is a spent upper
  # stage until proven otherwise.
  earthlike_a_au_lo: 0.90
  earthlike_a_au_hi: 1.15
  earthlike_e_max: 0.20
  earthlike_i_deg_max: 10.0
  # An object discovered before the space age cannot be human hardware.
  space_age_year: 1957
  # Below this diameter a *natural* body genuinely has a measurable SRP signal;
  # the R statistic handles it, but we label it so nothing is over-read.
  small_body_diameter_m: 10.0
