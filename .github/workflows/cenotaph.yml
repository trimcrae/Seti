name: cenotaph

# CENOTAPH — the cold-Dyson search in the unprobed T < 100 K regime.
# docs/cenotaph.md
#
#   smoke ─▶ sample ─▶ twins ─▶ grey (sharded) ─▶ farir ─▶ reduce
#
# Design copied from herdsman.yml, which encodes what previous channels learned:
#  * checkpointing — each parallax shell and each stage writes its own file and
#    uploads with `if: always()`, so a killed job loses minutes, not the pull;
#  * the Gaia pull happens ONCE and the table travels as an artifact;
#  * `reduce_only_run_id` re-reduces a prior run without refetching;
#  * the offline synthetic smoke test runs first and gates the archive work, so
#    a code bug is caught in 90 seconds rather than after a 3-hour fetch.

on:
  workflow_dispatch:
    inputs:
      poe_min:
        description: "Minimum parallax_over_error"
        required: false
        default: "20"
      plx_min_mas:
        description: "Minimum parallax (mas); 1.0 = within 1 kpc"
        required: false
        default: "1.0"
      teff_lo:
        description: "Teff lower bound (K)"
        required: false
        default: "4000"
      teff_hi:
        description: "Teff upper bound (K)"
        required: false
        default: "7000"
      logg_min:
        description: "log g lower bound (dwarfs)"
        required: false
        default: "3.8"
      z_min:
        description: "Leg-1 grey significance threshold"
        required: false
        default: "3.0"
      t_assumed_k:
        description: "Assumed re-radiation temperature for the closure test (K)"
        required: false
        default: "50"
      max_fit:
        description: "Cap on grey fits (blank = all)"
        required: false
        default: ""
      reduce_only_run_id:
        description: "Skip fetch; reduce from this prior run's artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # A code error must never cost an archive pull. This runs the whole funnel
  # offline against a synthetic population in ~1 minute and gates everything.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline test suite (the CI gate)
        run: python -m pytest tests/test_cenotaph.py -q
      - name: Synthetic end-to-end funnel
        run: |
          python -m seti.cli cenotaph --synthetic --n-synth 4000 \
            --out results/cenotaph/_smoke
          cat results/cenotaph/_smoke/summary.json

  sample:
    needs: smoke
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Official Lindegren et al. 2021 Z5/Z6 parallax zero-point tables.
          # The channel falls back to the global -17 uas offset if this fails
          # and records which method it used, but the full function is worth
          # having: the zero-point varies by +-30 uas with G and colour, which
          # at 1 mas is 0.065 mag of distance modulus -- exactly a grey offset.
          pip install gaiadr3-zeropoint || \
            echo "zero-point package unavailable; channel will use the fallback"
      - name: Fetch Gaia DR3 GSP-Spec sample + 2MASS + AllWISE
        run: |
          python -m seti.cli cenotaph --stage sample \
            --poe-min ${{ github.event.inputs.poe_min || '20' }} \
            --plx-min-mas ${{ github.event.inputs.plx_min_mas || '1.0' }} \
            --teff-lo ${{ github.event.inputs.teff_lo || '4000' }} \
            --teff-hi ${{ github.event.inputs.teff_hi || '7000' }} \
            --logg-min ${{ github.event.inputs.logg_min || '3.8' }}
          cat results/cenotaph/sample_meta.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenotaph-sample
          path: |
            results/cenotaph/sample.parquet
            results/cenotaph/sample_meta.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenotaph-shells
          path: results/cenotaph/checkpoints/
          if-no-files-found: warn

  analyse:
    needs: sample
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: cenotaph-sample
          path: results/cenotaph/
      - name: Twins (leg-0 estimator) then grey + mid-IR (legs 1 and 2)
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.max_fit }}" ]; then
            EXTRA="--max-fit ${{ github.event.inputs.max_fit }}"
          fi
          python -m seti.cli cenotaph --stage twins
          python -m seti.cli cenotaph --stage grey \
            --z-min ${{ github.event.inputs.z_min || '3.0' }} $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenotaph-analysis
          path: |
            results/cenotaph/twins.parquet
            results/cenotaph/greyfit.parquet
          if-no-files-found: warn

  farir:
    needs: analyse
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: cenotaph-sample
          path: results/cenotaph/
      - uses: actions/download-artifact@v4
        with:
          name: cenotaph-analysis
          path: results/cenotaph/
      - name: Far-IR association and energy closure (leg 3)
        run: |
          python -m seti.cli cenotaph --stage farir \
            --t-assumed-k ${{ github.event.inputs.t_assumed_k || '50' }}
          cat results/cenotaph/farir_meta.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenotaph-farir
          path: |
            results/cenotaph/farir.parquet
            results/cenotaph/farir_meta.json
            results/cenotaph/checkpoints/
          if-no-files-found: warn

  reduce:
    needs: farir
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: cenotaph-*
          merge-multiple: true
          path: results/cenotaph/
      - name: Reduce (vet, funnel, summary)
        run: |
          python -m seti.cli cenotaph --stage reduce \
            --z-min ${{ github.event.inputs.z_min || '3.0' }}
          echo "=== summary ==="
          cat results/cenotaph/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add ONLY the small outputs by name. A glob-with-excludes would
          # sweep in the shell parquets and the 427k-row AKARI/IRAS catalogue
          # caches that arrive flattened from the artifact merge.
          git add -f -- \
            results/cenotaph/summary.json \
            results/cenotaph/sample_meta.json \
            results/cenotaph/farir_meta.json \
            results/cenotaph/candidates.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "cenotaph: cold-Dyson grey-attenuation + far-IR closure run"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenotaph-final
          path: |
            results/cenotaph/
            !results/cenotaph/sample.parquet
            !results/cenotaph/twins.parquet
          if-no-files-found: warn

  reduce-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: cenotaph-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/cenotaph/
      - name: Reduce from prior run
        run: |
          ls -la results/cenotaph/ | head -40
          python -m seti.cli cenotaph --stage reduce \
            --z-min ${{ github.event.inputs.z_min || '3.0' }}
          cat results/cenotaph/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add ONLY the small outputs by name. A glob-with-excludes would
          # sweep in the shell parquets and the 427k-row AKARI/IRAS catalogue
          # caches that arrive flattened from the artifact merge.
          git add -f -- \
            results/cenotaph/summary.json \
            results/cenotaph/sample_meta.json \
            results/cenotaph/farir_meta.json \
            results/cenotaph/candidates.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "cenotaph: re-reduction of run ${{ github.event.inputs.reduce_only_run_id }}"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cenotaph-final
          path: results/cenotaph/
          if-no-files-found: warn
