name: cronwatch

# THE SECOND PAIR OF EYES, and the reason it exists is a hole found in the first.
#
# `seti.cronwatch` watches whether GitHub actually fired each scheduled
# workflow -- but it ran only INSIDE `watchdog`, which is itself an hourly
# scheduled workflow.  So the one failure it exists to catch, applied to
# `watchdog` itself, also switches it off: when the hourly cron is dropped, the
# check that would have noticed is exactly the thing that did not run.
#
# It is not hypothetical.  On 2026-08-26 `watchdog`'s last scheduled run was
# 22:10 UTC and the next was still missing 2 h 15 m later -- past its own two
# hour grace window -- and nothing said so, because saying so was its job.
#
# So the sweep runs from two independent crons on different cadences.  Both have
# to be dropped for the watch to go blind, and each reports the other, because
# `cronwatch` reads every scheduled workflow in the repository including these
# two.
#
# THIS ONE ALMOST ONLY REPORTS.  Catch-up dispatches are the `watchdog` sweep's
# job alone, so that two schedules cannot race between reading the catch-up
# ledger and writing it and double-fire the same missed slot; two that both
# merely report cannot.  The failure this guards against is the watch going
# SILENT, and a silent watch is fixed by a second reporter, not a second actor.
#
# WITH ONE EXCEPTION, AND IT IS CIRCULAR.  `watchdog` cannot re-fire `watchdog`,
# because the case in question is precisely that `watchdog` did not run.  On
# 2026-08-27 its 04:17 AND 05:17 UTC firings were both dropped, and at 05:36 --
# 2 h 23 m past a 2 h grace -- the only lane that could see it was the one
# forbidden to act.  Reported, never recovered, until a human noticed.
#
# So `--self-heal-only` lets this lane dispatch `watchdog` and nothing else
# (seti.cronwatch.SELF_HEAL_ONLY).  There is no race to create: `watchdog`
# cannot be the competing writer here, because a `watchdog` that were running is
# a `watchdog` that is not overdue.

on:
  schedule:
    # Every six hours at :43 -- a different cadence AND a different minute from
    # watchdog's hourly :17, so a scheduler that is dropping one particular slot
    # does not take both.
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pyyaml + requests only)
        run: python -m pip install --quiet --upgrade pip pyyaml requests
      - name: Did the scheduled screens actually FIRE?
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/cron_watch.py --self-heal-only \
            --ref "${{ github.event.repository.default_branch || 'main' }}"
      - name: Commit the scheduler ledger
        if: always()
        run: |
          # VERIFIED against the remote, and a failure turns this run red.  The
          # pattern this replaces exited 0 after a conflicted rebase stranded
          # the commit -- see scripts/commit_results.sh.
          scripts/commit_results.sh \
            "cronwatch: second-lane sweep ($(date -u +%FT%TZ))" \
            results/cronwatch/status.json \
            results/cronwatch/state.json
