# Single source of truth for every selection / rejection threshold.
# The whole contamination funnel is re-tunable by editing this file alone.

sample:
  # Gentile Fusillo et al. 2021 white-dwarf confidence (Pwd). Nominal cut 0.75;
  # we tighten to 0.90 for the technosignature sample to suppress QSO/subdwarf interlopers.
  pwd_min: 0.90
  # Only keep WDs with a usable temperature for SED prediction.
  teff_min_k: 4000.0
  teff_max_k: 40000.0

excess:
  # Per-band excess significance chi = (F_obs - F_pred) / sigma.
  chi_w1_min: 5.0          # W1 (3.4 um) is the deepest, most reliable band
  chi_w2_min: 3.0          # W2 (4.6 um) is shallower / noisier -> looser cut
  # Systematic floor (mag) folded into sigma to absorb model + zero-point error.
  sys_floor_mag: 0.05
  # Require the W1-W2 colour to be redder than the photospheric locus by this many sigma.
  color_excess_sigma_min: 2.0

contamination:
  astrometry:
    ruwe_max: 1.4                 # single-source astrometry; rejects unresolved blends
    parallax_over_error_min: 10.0 # reliable distance -> reliable absolute photometry
    astrometric_excess_noise_max_mas: 1.0
  wise_quality:
    allowed_cc_flags: "0000"      # no diffraction spikes / halos / ghosts / latents (W1W2)
    allowed_ph_qual: ["A", "B"]
    ext_flg_max: 0                # 0 = not flagged extended (galaxy)
    w1_saturation_mag_min: 8.0    # brighter than this saturates W1
    w2_snr_min: 5.0
  crowding:
    # Reject if more than one IR counterpart within the WISE PSF, or a second Gaia
    # source within the confusion radius.
    max_wise_neighbours: 1
    gaia_neighbour_radius_arcsec: 6.0   # ~W1 PSF FWHM
    # unWISE and CatWISE fluxes must agree within this fraction or the source is a blend.
    unwise_catwise_max_frac_diff: 0.30
  comovement:
    # Gaia<->WISE proper-motion / epoch-propagated position consistency.
    # A non-co-moving IR source at the WD position is background, not waste heat.
    max_position_offset_arcsec: 1.0    # after propagating Gaia position to the WISE epoch
    pm_consistency_sigma_max: 3.0      # |pm_gaia - pm_catwise| / sigma
  extragalactic:
    # WISE AGN/galaxy wedge: reject very red W1-W2 typical of AGN/QSO.
    w1_w2_agn_min: 0.8
    cross_match_galaxy_radius_arcsec: 2.0

discriminate:
  # Empirical WD debris-disk locus (calibrated from control catalogues at build time).
  # Sources OUTSIDE this locus become prioritised anomalies.
  dust_locus:
    t_dust_min_k: 600.0     # WD debris disks are warm, sublimation-limited
    # Upper bound at the dust sublimation temperature (~2500 K). Conservative:
    # excess hotter than this is still treated as (carbon/silicate) dust rather
    # than a technosignature, so hot debris disks are NOT mis-flagged as anomalies.
    t_dust_max_k: 2500.0
    tau_min: 1.0e-4         # fractional IR luminosity L_IR / L_WD
    tau_max: 1.0e-1
  anomaly:
    # A swarm-like excess approaches order-unity covering fraction.
    tau_swarm_flag: 0.3

# Multi-modal anomaly indicators (independent evidence axes). An object is an
# "exciting" candidate when flagged on >= multimodal_min_axes axes at once.
indicators:
  multimodal_min_axes: 2
  uv_deficit:
    sigma_min: 3.0          # GALEX UV flux below photosphere by this many sigma
    sys_frac: 0.30          # systematic on the UV photosphere extrapolation
  energy_balance:
    ratio_lo: 0.3           # UV-absorbed / IR-reemitted fractional luminosity
    ratio_hi: 3.0
    min_tau: 5.0e-3
  optical_variability:
    ztf_frac_rms_min: 0.03  # fractional RMS of the ZTF light curve
  periodicity:
    ls_fap_max: 1.0e-3      # Lomb-Scargle false-alarm probability of the top peak
    ls_amp_mag_min: 0.02    # min semi-amplitude (mag) so micro-peaks are not flagged
  ir_variability:
    neowise_frac_rms_min: 0.05
  kinematic:
    vtan_km_s_hi: 200.0

stats:
  upper_limit_confidence: 0.95   # Poisson/binomial confidence for occurrence-rate limit
  injection:
    t_dust_grid_k: [150, 300, 500, 800, 1200]
    tau_grid: [0.003, 0.01, 0.03, 0.1, 0.3]
    n_per_cell: 200

# ---------------------------------------------------------------------------
# OSSUARY — warm dust around stars that cannot make it (docs/ossuary.md).
# The claim: an unmaintained megastructure grinds itself to dust (Lacki 2025,
# arXiv:2504.21151). The natural null is strongest for metal-poor / halo-
# kinematic / old stars, which have no planetesimal reservoir to grind.
# ---------------------------------------------------------------------------
ossuary:
  sample:
    feh_max: -1.0              # metal-poor definition [Fe/H] < -1
    feh_max_strict: -1.5       # "very metal-poor" tier
    parallax_over_error_min: 5.0
    ruwe_max: 1.4
    g_max: 18.0                # fainter than this, WISE is confusion-limited
    bp_rp_min: 0.35            # bluer than this the empirical photosphere locus is unanchored
    bp_rp_max: 3.0
    # LAMBDA BOOTIS VETO. lambda Boo stars are A/early-F stars whose *surface* is
    # metal-depleted by accretion of gas-depleted ISM -- not primordially metal-poor
    # -- and Murphy et al. 2020 (arXiv:2008.02392) find 21 of 34 have infrared
    # excesses, with some previously misclassified as blue horizontal branch stars.
    # They are the single largest false-positive risk for this channel. They live at
    # 6500-9000 K, so a T_eff ceiling removes essentially all of them while keeping
    # the metal-poor FGK dwarfs and subdwarfs the claim is actually about.
    teff_max_k: 6500.0
    teff_min_k: 3800.0
    # Dwarf/giant split. Metal-poor giants have winds and dusty envelopes and are
    # analysed separately; they never enter the clean-candidate table.
    mg_dwarf_min: 4.0          # absolute G fainter than this => dwarf
    mg_giant_max: 3.0          # absolute G brighter than this => giant
    logg_dwarf_min: 3.8
    logg_giant_max: 3.5

  kinematics:
    # Solar peculiar motion w.r.t. the LSR (Schoenrich, Binney & Dehnen 2010).
    solar_u_kms: 11.1
    solar_v_kms: 12.24
    solar_w_kms: 7.25
    v_lsr_kms: 238.0           # circular speed at R0 (GRAVITY/Gaia-consistent)
    halo_v_tot_kms: 200.0      # |v - v_LSR| above this => halo kinematics
    thick_disk_v_tot_kms: 70.0
    thin_disk_v_tot_kms: 50.0
    # A tangential velocity is a strict LOWER BOUND on the space velocity, so a
    # large v_tan is *sufficient* for halo membership even with no radial velocity.
    halo_v_tan_kms: 200.0
    max_v_tot_err_kms: 40.0    # reject stars whose velocity error makes the class meaningless

  excess:
    # Empirical photosphere locus, fitted from the sample itself in colour bins.
    locus_color_bin: 0.10      # bp_rp bin width for the running robust locus
    locus_min_per_bin: 25      # below this a bin is unusable -> NaN prediction
    locus_scatter_floor_mag: 0.02
    sys_floor_mag: 0.03        # zero-point + model systematic folded into sigma
    # 5 sigma, not 3. Huang, Liu, Wyatt & Kennedy 2025 (arXiv:2505.07602) searched
    # the 10 pc sample (339 stars) for W3 excess at 3 sigma, got 5 candidates, and
    # found ALL FIVE spurious (photosphere-model failures, silicate clouds); their
    # explicit recommendation is 5 sigma. Detection rate 0/339.
    chi_min: 5.0               # per-band excess significance to flag
    # LEDGER RULE: the excess must appear in a star-dominated band. W4-only is cirrus.
    # W3 (Wien peak 241 K) is the workhorse for warm dust; W4 (132 K) is the only
    # route below ~200 K and is unusable, so the claim leans on W3 + W1-W2 support.
    require_bands: ["W1", "W2", "W3"]
    color_excess_sigma_min: 3.0
    w1_w2_min: -0.05           # LEDGER RULE: negative W1-W2 is a blend, not a photosphere
    w1_w2_agn_max: 0.8         # redder than this is the WISE AGN/QSO wedge
    # Warm floor set by W3, not by ambition: W3's Wien peak is 241 K and W3/W4
    # depth is frozen at the 2010 cryogenic mission (NEOWISE-R, CatWISE2020 and
    # unWISE are W1/W2 only). Below ~200 K only W4 reaches, and W4 cannot be
    # believed. This is the channel's honest sensitivity floor.
    t_dust_min_k: 200.0        # "warm" dust floor for the headline claim
    t_dust_max_k: 1800.0       # hotter than grains survive => unresolved companion
    nir_excess_sigma_max: 3.0  # a J/H/Ks excess means a companion photosphere, not dust
    mc_draws: 400              # Monte-Carlo draws for (T_dust, tau) uncertainties

  contamination:
    wise_quality:
      allowed_ph_qual: ["A", "B"]
      forbidden_cc: "DPHO"     # diffraction spike / persistence / halo / optical ghost
      w1_bright_limit_mag: 8.0 # brighter saturates W1
      max_number_of_mates: 0   # AllWISE xmatch mates: >0 means an ambiguous match
      max_number_of_neighbours: 1
    astrometry:
      # The decisive extragalactic test: the WISE centroid must sit at the Gaia
      # position PROPAGATED to the WISE epoch. Halo stars have large proper
      # motions, so this has real leverage -- and a background galaxy fails it.
      gaia_ref_epoch: 2016.0
      wise_mean_epoch: 2010.5
      max_registration_arcsec: 1.0
      pm_consistency_sigma_max: 3.0
      min_pm_for_leverage_mas_yr: 30.0   # below this the epoch test has no power
    beam:
      wise_beam_arcsec: 6.5
      max_neighbour_flux_frac: 0.10      # a neighbour supplying >10% of W1 ruins it
    extragalactic:
      # AllWISE cumulative source counts, anchored on 747e6 sources over 41253 deg^2
      # at the W1 5-sigma depth 16.9: log10 N(<W1)[deg^-2] = norm + slope*(W1 - 16.9).
      counts_log10_norm_per_deg2: 4.26
      counts_slope_per_mag: 0.50
      counts_ref_w1_mag: 16.9
      # Hot DOG sky density that "can probably account for the contamination of all
      # 7" Project Hephaistos candidates (arXiv:2405.14921); JWST/MIRI later resolved
      # two of them into a z~0.9 Hot DOG and a z~0.4 dusty starburst (arXiv:2607.09460).
      hot_dog_density_per_arcsec2: 9.0e-6
      # Colour of the interloper population that matters: dusty galaxies, Hot DOGs
      # and AGN are red. Used to convert an excess measured in W2/W3/W4 into the
      # equivalent W1 magnitude at which AllWISE actually catalogues such a source.
      interloper_w1_minus_w2: 0.8
      interloper_w1_minus_w3: 3.0
      interloper_w1_minus_w4: 4.5
      # Only bands carrying a real detection may drive the interloper prior; a
      # sub-sigma positive fluctuation implies an absurdly faint (hence common)
      # equivalent source and would veto genuine cool-dust detections.
      min_chi_for_prior: 3.0
      max_chance_superposition_p: 1.0e-3 # per-candidate a-priori interloper probability
    globular_cluster:
      # Boyer et al. 2010 (arXiv:1002.1348) showed a *published* red-giant-branch-wide
      # infrared excess in 47 Tuc was entirely stellar blending plus imaging
      # artefacts. Metal-poor stars concentrate toward globular clusters, which are
      # the most crowded fields on the sky, so cluster sightlines are vetoed outright
      # rather than vetted.
      veto_radius_arcmin: 15.0
      veto_radius_multiplier: 3.0   # x the catalogued half-light radius, if known
    cirrus:
      max_ebv_sfd: 0.10        # SFD E(B-V) above this the 12/22 um background is cirrus
      min_gal_lat_deg: 15.0    # |b| below this the cirrus + stellar confusion is fatal
      # Population-level test: the flag rate must not correlate with E(B-V).
      cirrus_corr_p_min: 0.01

# ---------------------------------------------------------------------------
# TAILINGS — the sparse chemical anomaly (docs/tailings.md).
# The claim: natural abundance space is low-dimensional and every natural
# process moves an element FAMILY (alpha, Fe-peak, s-process, r-process);
# industrial refining moves ONE element. So the artificial signature is a
# SPARSE anomaly and a DENSE one is a rejection. Restricted to cool dwarfs,
# where the convective envelope suppresses the atomic diffusion and radiative
# levitation that make natural single-element peculiarity in Ap/Am/HgMn stars.
# ---------------------------------------------------------------------------
tailings:
  sample:
    # Convective-envelope regime. Above ~6000 K the envelope thins and
    # diffusion/levitation start producing genuine single-element anomalies —
    # that is exactly the Am/Fm domain and it is excluded by construction.
    teff_max: 6000.0
    # GALAH's release notes: cool stars carry systematic trends "that can reach
    # values of 0.5 dex for some elements" and "dwarf stars are most affected at
    # Teff < 4600 K". The M-dwarf tail is the least trustworthy part of any
    # abundance sample, so it is bounded out rather than silently included;
    # survivors between 4000 and 4600 K carry a cool_star_caveat flag.
    teff_min: 4000.0
    logg_min: 4.0            # dwarfs only; giants mix C/N and dilute everything
    snr_min: 40.0            # below this the residual tails go non-Gaussian
    # LEDGER RULE: convective protection depends on METALLICITY as well as Teff
    # and logg. A ~0.85 Msun metal-poor turnoff star has an envelope below
    # 1e-7 Msun -- four orders of magnitude thinner than a solar-metallicity
    # dwarf -- and passes a Teff/logg cut while keeping exactly the thin
    # envelope that makes diffusive peculiarity possible (Matrozis et al.).
    # Measured diffusion runs 0.3 dex at [Fe/H]=-2.3 falling to 0.1 dex at -1.1,
    # so a floor at -1.0 caps the natural effect an order of magnitude below the
    # signal. NB: OSSUARY deliberately SELECTS the stars this excludes.
    feh_min: -1.0
  manifold:
    degree: 2                # quadratic in ([Fe/H], Teff/1000, logg, alpha_LOO)
    clip_sigma: 4.0          # so a real 6-8 sigma anomaly cannot fit its own surface
    clip_iterations: 4
    min_rows: 200            # below this an element gets no manifold at all
    scatter_min_count: 40    # stars needed in a (SNR, Teff) cell to trust its sigma
    scatter_floor_dex: 0.005 # no denominator smaller than any survey achieves
  sparse:
    # 6 sigma on an empirical 0.03-0.05 dex width is a 0.2-0.3 dex single-element
    # excursion — an order of magnitude above the 0.01-0.03 dex intrinsic scatter
    # of co-natal stars (Bovy 2016; Cheng 2020; Patil 2022; Casamiquela 2021).
    # NOT a p-value: the residual tails are not Gaussian, so the false-positive
    # control is empirical (flag rates, fields, cross-survey, re-measurement).
    z_flag: 6.0
    z_quiet: 2.0             # "everything else is normal"
    max_discrepant: 2        # the "one or two elements" rule
    max_quiet_excess: 1
    # Huang, Tao & Zhang 2026 (arXiv:2605.29811) showed quantitatively that a
    # 1-2-element anomaly can carry a large Bayes factor while being
    # information-starved. Their cases are records where the OTHER elements were
    # never MEASURED. The answer here is to require many elements measured AND
    # quiet: n_quiet is reported per candidate and is the actual evidence.
    min_elements: 12         # a floor, not a target
    min_contrast: 3.0        # z_max / max(z_background_rms, 1)
    family_max_mean_z: 2.0   # LEDGER RULE: a co-moving family is a natural event
    dense_min_discrepant: 3
  vet:
    snr_min: 40.0
    feh_min: -1.0            # re-applied after acquisition; see sample.feh_min
    teff_min: 4000.0
    teff_caveat_below: 4600.0
    chi2_max: 4.0
    ruwe_max: 1.4            # LEDGER RULE: unresolved binaries masquerade as anomalies
    rv_scatter_max_kms: 1.0  # spectroscopic binary
    vbroad_max_kms: 15.0     # fast rotators blend the lines the abundance rests on
    min_good_elements: 8
    # LEDGER RULE: an element flagged in >2% of the sample is a line-list
    # systematic, not a population of anomalies.
    max_element_flag_rate: 0.02
    # LEDGER RULE (abundance-space form of "a feature recurring across unrelated
    # sightlines is instrumental"): a field flagging one element far above the
    # global rate has a calibration problem, not a discovery.
    max_field_flag_rate_ratio: 5.0
    require_cross_survey: false
  twins:
    # Budget ceiling. The largest engulfed mass ever inferred is ~28 Earth masses
    # (Kronos/Krios, HD 240430/240429, ~0.20-0.23 dex differential); 100 Me is
    # ~3.5x that and above the runaway-gas-accretion core mass, so more rock than
    # this is outside every formation model as well as every observation.
    max_engulfed_earth_masses: 100.0
    # Scales the convective envelope DOWN, which shrinks the implied engulfed
    # mass and makes the "unexplainable" verdict strictly harder to reach.
    mcz_safety_factor: 0.5
    z_flag: 4.0              # differential analysis cancels most systematics
    z_quiet: 2.0
    max_discrepant: 2
    min_elements: 6
    min_refractories: 4
    tcond_slope_sigma: 3.0   # a real engulfment is a condensation-temperature TREND
    max_r_chance_align: 0.1  # El-Badry+2021 purity cut; a chance pair shares no birth

# ISOTHERM — shape of the infrared excess in temperature space (docs/isotherm.md).
# These gate the shape statistics, not the excess amplitude.
isotherm:
  min_points: 25                  # resolution elements after rebinning
  min_median_snr: 5.0
  max_reduced_chi2: 8.0
  # Feature veto needs BOTH significance AND a physically meaningful width.
  # A significance-only cut flagged a pure blackbody at every redshift offered.
  feature_veto_sigma: 4.0
  feature_veto_abs_ew_um: 0.15
  # beta upper 1-sigma bound below which the emitter is called a true Planck
  # function. Real grains sit at beta ~ 1-2.
  beta_planck_max: 0.35
  # A component must EARN its place: 10 is "very strong" on Kass & Raftery.
  delta_bic_component: 10.0
  delta_bic_vs_gradient: 10.0
  # RMS scatter of log10 of successive temperature ratios for a cascade.
  geometric_tol_dex: 0.06
  # Spitzer/IRS SL-vs-LL stitching step: above this the two halves of the
  # spectrum are not the same object's flux.
  max_order_step_frac: 0.25
  n_components_max: 4
  # Hotter than grains survive -> unresolved companion photosphere.
  t_companion_k: 1800.0

# ---------------------------------------------------------------------------
# TIDEMARK --- population-level spatial-structure test on anomaly catalogues.
# Channel adapters live in config/tidemark.yaml; these are the statistics knobs.
tidemark:
  matched_null:
    n_feature_bins: 5        # quantile bins per detectability covariate
    min_pool: 25             # min parent rows per stratum before collapsing
    n_null: 500              # matched draws for the gradient/age statistics
  covariates:
    # strict: heliocentric distance IS matched out, so a radial gradient must be
    # a difference between DIRECTIONS at matched distance. Immune to every
    # distance-dependent selection effect; the primary claim.
    strict: [phot_g_mean_mag, dist_pc, bp_rp, ebv, log_local_density, n_obs]
    # permissive: distance free. More sensitive, but distance-dependent
    # detectability leaks into the radial gradient. Cross-check only.
    permissive: [phot_g_mean_mag, bp_rp, ebv, log_local_density]
  gradient:
    n_bins: 10
    coordinates: [R_gal_kpc, abs_z_gal_kpc, l_deg]   # l_deg is fitted as a dipole
  edge:
    n_bins_1d: 24
    widths: [1, 2, 3, 4, 6]      # step half-widths, in bins
    n_null_scan: 300
    shell_centres_per_axis: 4    # 3D bubble-centre grid (+ Sun + anomaly centroid)
    shell_n_bins: 20
    cap_directions: 96
    # Order of the smooth log-rate trend absorbed into the edge null. Measured
    # on injections: a pure 0.8/kpc gradient fires the edge detector 15% of the
    # time at order 2 and 5% (nominal) at order 3, with no loss of bubble power.
    smooth_order: 3
    min_expected: 3.0            # windows below this expectation carry no information
  age:
    n_bins: 8
    n_null: 400
  calibration:
    contrasts: [2.0, 4.0]
    radii_pc: [400.0, 900.0]
    n_null: 200
    n_trials: 2
