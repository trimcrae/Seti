# GRAVE — a technological extinction in Earth's sedimentary record (docs/grave.md).
# Signature S56.  Every threshold the channel uses lives here; the reservoir
# vectors and their citations live in src/seti/grave/references.py.

sources: [sgp, earthchem, georoc]      # georoc is the volcanic reference, never a candidate source

# ---------------------------------------------------------------------------
# SGP — Sedimentary Geochemistry and Paleoenvironments Project (sgp-search.io)
# The API shape was established from the published Stockey et al. 2024 call
# and the Macrostrat integration (see acquire.py); the field codes are LEARNED
# by the probe, one two-row request per candidate code.
# ---------------------------------------------------------------------------
sgp:
  hosts: ["https://sgp-search.io", "https://archive.sgp-search.io"]
  post_paged_url: "https://sgp-search.io/api/frontend/post-paged"
  archive_post_paged_url: "https://archive.sgp-search.io/api/frontend/post-paged"
  type: "samples"                       # the Macrostrat call; "nhhxrf" = no hand-held XRF (Stockey)
  type_variants: ["samples", "nhhxrf"]
  timeout_s: 180
  probe_age_window: [60, 70]
  # the published Stockey body (known to work), used as the base call
  base_show: [height_meters, section_name, fe, fe_hr_fe_t, fe_py_fe_hr, toc, alu, mo, u, fe_t_al,
              site_type, coord_lat, coord_long, basin_type, meta_bin, strat_name, strat_name_long,
              environment_bin, interpreted_age, max_age, min_age, lithology_name]
  anchor_show: [interpreted_age, coord_lat]
  max_code_tests: 220
  # candidate field codes, each tested on the runner; accepted ones are pulled
  show_candidates:
    # metadata
    - sample_name
    - original_name
    - original_sample_name
    - sample_identifier
    - section_name
    - site_type
    - site_name
    - country
    - state_province
    - coord_lat
    - coord_long
    - height_meters
    - strat_name
    - strat_name_long
    - lithology_name
    - lithology_type
    - lithology_text
    - lithology_comp
    - basin_type
    - basin_name
    - environment_bin
    - meta_bin
    - interpreted_age
    - interpreted_age_notes
    - max_age
    - min_age
    - age_iss
    - ref_short
    - ref_long
    - reference
    - ref_doi
    - doi
    - data_source
    - analytical_method
    - ana_method
    - run_id
    - batch
    - project
    - collector
    - collection_year
    # majors / bulk
    - alu
    - al
    - si
    - ti
    - fe
    - mn
    - mg
    - ca
    - na
    - k
    - p
    - s
    - c
    - toc
    - tic
    - tot_c
    - loi
    - fe_hr_fe_t
    - fe_py_fe_hr
    - fe_t_al
    # trace: the fission panel, the reservoir tracers, the PGE/alloy panel
    - li
    - be
    - b
    - sc
    - v
    - cr
    - co
    - ni
    - cu
    - zn
    - ga
    - ge
    - as
    - se
    - rb
    - sr
    - y
    - zr
    - nb
    - mo
    - ru
    - rh
    - pd
    - ag
    - cd
    - in
    - sn
    - sb
    - te
    - i
    - cs
    - ba
    - la
    - ce
    - pr
    - nd
    - sm
    - eu
    - gd
    - tb
    - dy
    - ho
    - er
    - tm
    - yb
    - lu
    - hf
    - ta
    - w
    - re
    - os
    - ir
    - pt
    - au
    - hg
    - tl
    - pb
    - bi
    - th
    - u
  # bulk pull: pages of page_count rows per age bin; a bin ends when a page is short
  page_count: 5000
  max_pages_per_bin: 60
  age_bin_edges_ma: [0, 20, 40, 60, 80, 100, 130, 160, 200, 240, 280, 320, 360, 400, 440, 480,
                     520, 560, 600, 650, 700, 800, 900, 1000, 1200, 1400, 1600, 1800, 2000, 2200,
                     2400, 2600, 2800, 3000, 3300, 3600, 4000]

# ---------------------------------------------------------------------------
# EarthChem Portal REST search service (50-row pages; sedimentary via level/keyword)
# ---------------------------------------------------------------------------
earthchem:
  rest_url: "https://portal.earthchem.org/restsearchservice"
  timeout_s: 120
  page_size: 50
  max_rows: 20000                       # general pull cap (400 requests)
  max_rows_per_window: 1500             # per boundary window
  window_half_width_myr: 5.0
  count_queries:
    level1_sedimentary: {level1: sedimentary}
    level2_sedimentary: {level2: sedimentary}
    material_sedimentary: {material: sedimentary}
    keyword_shale: {keyword: shale}
    keyword_mudstone: {keyword: mudstone}
    keyword_black_shale: {keyword: "black shale"}
    keyword_boundary_clay: {keyword: "boundary clay"}
    keyword_iridium: {keyword: iridium}
    level3_shale: {level3: shale}
    level4_shale: {level4: shale}
  distinct_items: [level1, level2, level3, material]
  distinct_base_params: {keyword: shale}

# ---------------------------------------------------------------------------
# GEOROC via the Goettingen Dataverse (DIGIS); igneous — the ash reference
# ---------------------------------------------------------------------------
georoc:
  dataverse_api: "https://data.goettingen-research-online.de/api"
  subtree: digis
  search_q: "*"
  max_datasets: 500
  dataset_regex: "(?i)rock types|sediment|ocean|volcanic"
  file_regex: "(?i)sediment|tuff|tephra|ash|pyroclast|volcaniclast"
  max_files: 12
  max_total_bytes: 150000000
  timeout_s: 300

# ---------------------------------------------------------------------------
# Detector thresholds (mirrored in seti.grave.vectors.GraveConfig)
# ---------------------------------------------------------------------------
detector:
  horizon_yr: 1000000.0                 # 1 Myr: the pattern that outlives its makers (Tc -> Ru)
  anchor: Nd
  sigma_major_dex: 0.05
  sigma_trace_dex: 0.10
  sigma_ultratrace_dex: 0.20
  systematic_dex: 0.05
  ultratrace_ppm: 0.05
  min_elements: 8
  min_fission_elements: 4
  lr_min: 8.0
  ambiguity_margin: 2.0
  max_reduced_chi2: 4.0
  refine_lr: 2.0
  null_quantile: 0.999
  n_heavy: 2
  n_light: 1
  peak_sigma: 2.0
  redox_ef_u: 3.0
  redox_ef_v: 3.0
  redox_toc_pct: 2.0
  femn_ef_mn: 5.0
  zr_hf_natural: [25.0, 60.0]
  monazite_th_ef: 3.0
  hydro_ef_ba: 5.0
  pge_ef_anom: 10.0
  pge_ratio_tol: 3.0
  ipge_pd_ir_max: 0.3
  ta_ef_anom: 10.0
  nb_ta_natural: [5.0, 40.0]
  w_ef_anom: 20.0
  w_partner_ef_max: 3.0
  dl_repeat_min: 20
  dl_floor_fraction: 0.5

screen:
  min_element_count: 50                 # an element enters the design if >= this many samples carry it
  floor_max_rows: 4000
  null_max_rows: 2000
  max_assess: 5000                      # above-threshold samples put through the full vet (highest LR first)
  min_age_ma: 0.0
  max_age_ma: 4000.0
  # site types whose samples carry a modern-contamination provenance flag (not a kill)
  provenance_flag_regex: "(?i)core|drill|well|borehole|mine|quarry|tailing"

agestack:
  width_scale: 1.0                      # multiplies each boundary's half-width
  max_span_myr: 20.0
  cluster_p: 0.01
  histogram_bin_myr: 10.0
