name: ignition

# IGNITION — an infrared excess being born on an old star (docs/ignition.md).
#
#   sample ──▶ acquire+screen (N parallel shards) ──▶ assess ──▶ commit-back
#     ▲
#   probe (first, cheap): the Gaia x AllWISE join, the NEOWISE cone on a
#   resolved star, and the TAP_UPLOAD join — decides the acquire route.
#
# Signature S61 (docs/necrofrontier.md §2 XIV): a takeover's resource-
# acquisition phase is exponential over decades, so the residue in a decade-
# baseline archive is a MONOTONIC W1/W2 RISE sustained >= 5 yr on a Gaia-
# astrometric, kinematically old field star that was photospheric in AllWISE
# 2010, with a flat optical light curve.  The natural background differs in
# TIME SIGNATURE: born excesses (impacts, comet swarms) rise in < 1 yr and
# decay; obscured-AGN turn-ons rise for a decade but have no parallax.
#
# What VIGIL's run taught, encoded below:
#  * per-star NEOWISE cones cost ~92 s each; the field-wide cone + local
#    KD-tree grouping (VIGIL's fix) is the proven route, and the upload join
#    is PROBED before it is relied on;
#  * VIGIL's summary.json said NO_DATA_REACHED over eight field summaries that
#    said SEARCHED: the aggregator ran without the per-field artefacts.  The
#    assess job here LISTS what it downloaded, and FAILS if the acquire matrix
#    ran but no shard output reached it (a disguised no-data run);
#  * every shard checkpoints (CSV append + progress JSON) and uploads with
#    `if: always()`, so a killed shard loses one batch, not a run;
#  * commit-back through scripts/commit_results.sh, which VERIFIES the push.
#
# What run 34787803862 (`--stage probe`, GREEN, 25 min, nothing committed) taught:
#  * its flat three-table Gaia x AllWISE join could not return even TOP 5 inside a
#    1-degree cone (`canceling statement due to statement timeout`), and its 503
#    says it went to the SYNCHRONOUS endpoint.  The probe now tries the candidate
#    query SHAPES in order (inner sub-select on gaia_source first, flat last),
#    async-first, under a per-shape wall-clock budget, and records the shape and
#    queue that answered so the sample stage does not re-derive them;
#  * it committed NOTHING: the probe path uploaded an artifact and the assess job
#    that owns the commit-back is skipped for stage=probe, so the only evidence
#    was a log read by hand.  The sample job now commits results/ignition/probe.json
#    itself, artifact AND commit.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, sample, acquire+screen matrix, assess), "probe" (the
          archive probe only — run this first), or "assess" with
          reduce_only_run_id to re-assess a prior run's shard artifacts.
        required: false
        default: "all"
      shards:
        description: "Number of acquire+screen shards"
        required: false
        default: "8"
      max_stars:
        description: >-
          Cap on stars per shard (sample rows per shard AND stars fetched per
          shard).  The pilot's honest denominator; 0 = config default (20000).
        required: false
        default: "2000"
      mode:
        description: "Sample mode: fields (proven field-cone route) or allsky (needs the upload route)"
        required: false
        default: "fields"
      route:
        description: "NEOWISE route: auto (from probe.json) | upload | field | cone"
        required: false
        default: "auto"
      reduce_only_run_id:
        description: "Skip probe/sample/acquire; assess from this prior run's artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      n_shards: ${{ steps.mk.outputs.n_shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.shards || '8' }}" or 8)
          print("matrix=" + json.dumps({"include": [{"shard": i} for i in range(n)]}))
          print(f"n_shards={n}")
          PY

  sample:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — injected ramp recovered, impact rejected, on this runner
        run: python -m pytest tests/test_ignition.py -q -p no:cacheprovider -k "injected or impact or no_data or one_band"
      - name: Probe the archives (Gaia query shapes, NEOWISE cone, TAP_UPLOAD join)
        # Run 34787803862 spent 1,490 s on four retries of a flat three-table join
        # that could not succeed.  The probe now tries the candidate query shapes
        # in order under a wall-clock budget (config/ignition.yaml -> probe:
        # budget_s per shape, total_budget_s for the stage), records which shape
        # and which queue answered, and moves on rather than waiting.
        run: |
          python -m seti.ignition.run --stage probe
          echo "=== probe.json ==="
          python - <<'PY'
          import json
          d = json.load(open("results/ignition/probe.json"))
          print("gaia_shape_working:", d.get("gaia_shape_working"))
          for s in d.get("gaia_shapes", []):
              print(f"  {s.get('shape')}: {s.get('status')} in {s.get('elapsed_s')} s "
                    f"queue={s.get('queue')} {str(s.get('error') or '')[:200]}")
          print(json.dumps({k: d[k] for k in d
                            if k not in ("allwise_columns_seen", "gaia_shapes")},
                           indent=2)[:6000])
          PY
      - name: Sample (Gaia DR3 x AllWISE parent, with the COUNT(*) denominator)
        if: ${{ github.event.inputs.stage != 'probe' }}
        run: |
          MS=""
          if [ "${{ github.event.inputs.max_stars || '0' }}" != "0" ]; then
            MS="--max-stars ${{ github.event.inputs.max_stars }}"
          fi
          python -m seti.ignition.run --stage sample \
            --shards ${{ needs.plan.outputs.n_shards }} \
            --mode "${{ github.event.inputs.mode || 'fields' }}" $MS
          echo "=== sample.json ==="
          python - <<'PY'
          import json
          d = json.load(open("results/ignition/sample.json"))
          print(json.dumps({k: d[k] for k in d if k not in ("ledger", "per_unit")}, indent=2)[:4000])
          for u in d.get("per_unit", []):
              print(u)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-sample
          path: |
            results/ignition/probe.json
            results/ignition/sample.json
            results/ignition/parent.parquet
          if-no-files-found: warn
      - name: Commit the probe and sample evidence
        # A GREEN RUN THAT COMMITS NOTHING IS A LOST RUN.  `--stage probe` used to
        # end here with its 25 minutes of evidence only in an artifact and a log
        # someone had to read by hand: the assess job (which owns the other
        # commit-back) is skipped for stage=probe.  Every other channel commits
        # its probe; so does this one now, through the script that VERIFIES the
        # push.  The artifact upload above stays — it runs first, so the evidence
        # is safe even if the push cannot be landed and turns the job red.
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ignition: probe — which Gaia query shape and which queue answered" \
            results/ignition/probe.json \
            $(ls results/ignition/sample.json 2>/dev/null)

  acquire:
    needs: [plan, sample]
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4          # be a good citizen toward the IRSA TAP service
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: ignition-sample
          path: results/ignition/
      - name: Acquire shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} (NEOWISE frames -> epochs, checkpointed)
        run: |
          MS=""
          if [ "${{ github.event.inputs.max_stars || '0' }}" != "0" ]; then
            MS="--max-stars ${{ github.event.inputs.max_stars }}"
          fi
          python -m seti.ignition.run --stage acquire \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} \
            --route "${{ github.event.inputs.route || 'auto' }}" $MS
      - name: Screen shard ${{ matrix.shard }} (rise statistics, two-band rule, injections)
        if: always()
        run: |
          python -m seti.ignition.run --stage screen \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }}
          ls -la results/ignition/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-shard-${{ matrix.shard }}
          path: |
            results/ignition/epochs_s*.csv
            results/ignition/neowise_stars_s*.csv
            results/ignition/acquire_s*.json
            results/ignition/stars_s*.csv
            results/ignition/screen_s*.json
          if-no-files-found: warn

  assess:
    needs: [plan, sample, acquire]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: ignition-*
          merge-multiple: true
          path: results/ignition/
      - name: What reached this job (VIGIL's aggregator ran on an empty tree and called it a null)
        run: |
          ls -la results/ignition/ | head -80
          N=$(ls results/ignition/screen_s*.json 2>/dev/null | wc -l)
          echo "shard screen files found: $N of ${{ needs.plan.outputs.n_shards }}"
          if [ "$N" = "0" ] && [ "${{ needs.acquire.result }}" != "skipped" ]; then
            echo "::error::the acquire matrix ran (result=${{ needs.acquire.result }}) but no shard output reached assess — artifact passthrough failed; refusing to write a verdict over nothing"
            exit 1
          fi
      - name: Assess (merge shards, contaminant ladder, candidates.csv, summary.json)
        run: |
          python -m seti.ignition.run --stage assess --shards ${{ needs.plan.outputs.n_shards }}
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/ignition/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("config",)}, indent=2)[:8000])
          PY
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/ignition/summary.json")
          if not p.exists():
              print("::error::no summary.json — the assess stage produced nothing"); sys.exit(1)
          s = json.loads(p.read_text())
          v = s.get("verdict", "")
          n = int((s.get("stage_counts") or {}).get("screened", 0) or 0)
          if n == 0 and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with 0 screened stars is a disguised no-data run"); sys.exit(1)
          if "NO_DATA_REACHED" in v:
              print(f"::warning::NO_DATA_REACHED ({s.get('reason')}) — nothing was tested; see summary.json")
          if "NO_IGNITION_CANDIDATE" in v:
              print(f"::notice::{n} stars screened, no sustained two-band rise survived. A COUNT, NOT AN OCCURRENCE LIMIT — see docs/ignition.md.")
          if "IGNITION_CANDIDATES" in v:
              print(f"::notice::{s.get('n_candidates')} candidate(s) ({s.get('n_clean')} with the optical checked) — see results/ignition/candidates.csv")
          if s.get("degraded"):
              print(f"::warning::degraded: {s['degraded']}")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # Small files only: the epochs CSVs and parent.parquet travel as artifacts.
          scripts/commit_results.sh \
            "ignition: an infrared excess being born — probe/sample/acquire/screen/assess" \
            results/ignition/probe.json \
            results/ignition/sample.json \
            results/ignition/summary.json \
            results/ignition/candidates.csv \
            results/ignition/stars_vetted.csv \
            $(ls results/ignition/screen_s*.json 2>/dev/null) \
            $(ls results/ignition/acquire_s*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-final
          path: results/ignition/
          if-no-files-found: warn

  assess-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch artifacts from a prior run
        uses: actions/download-artifact@v4
        with:
          pattern: ignition-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/ignition/
      - name: Assess
        run: |
          ls results/ignition/ | head -80
          N=$(ls results/ignition/screen_s*.json 2>/dev/null | wc -l)
          echo "shard screen files found: $N"
          if [ "$N" = "0" ]; then
            echo "::error::no shard output in run ${{ github.event.inputs.reduce_only_run_id }}'s artifacts; refusing to write a verdict over nothing"
            exit 1
          fi
          python -m seti.ignition.run --stage assess
          head -c 6000 results/ignition/summary.json
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ignition: re-assess of a prior run's shards" \
            results/ignition/summary.json \
            results/ignition/candidates.csv \
            results/ignition/stars_vetted.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-final
          path: results/ignition/
          if-no-files-found: warn
