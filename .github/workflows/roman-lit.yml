name: roman-lit

# ROMAN prior-art sweep (scripts/romanlit_fetch.py; docs/roman.md §4).
#
# Five novelty questions, each a query group with its own decoys, fetched on
# purpose so a null is interpretable:
#   g1_opaque_lens  microlensing by an occulting / opaque lens (Agol 2002),
#                   lensing by Dyson spheres / megastructures, finite-LENS-size
#                   effects, black-hole-shadow microlensing.  Decoys: planetary
#                   caustics, finite-SOURCE effects, transit surveys.
#   g2_nir_laser    near-infrared laser SETI (1064 / 1550 nm), NIRSPEC laser
#                   lines, Euclid / Roman grism SETI, slitless "laser line".
#                   Decoys: laser guide stars, Ti:sapphire instrumentation, lidar.
#   g3_ramp_flash   up-the-ramp jump detection, cosmic-ray rejection in
#                   non-destructive reads, snowballs, pulsed optical SETI
#                   (Howard 2004, Wright 2001, Maire 2019), sub-second
#                   transients.  Decoys: GRB afterglows, FRB optical
#                   counterparts, satellite glints.
#   g4_statite      statites / solar-sail station-keeping (Forward 1993),
#                   non-Keplerian astrometry in direct imaging, artificial
#                   satellites of exoplanets / Clarke exobelts
#                   (Socas-Navarro 2018), Roman coronagraph technosignatures.
#                   Decoys: hovering asteroid probes, our own sail missions.
#   g5_roman_seti   any technosignature / SETI proposal for Roman / WFIRST
#                   (GBTDS, HLTDS, HLWAS, CGI).  Decoys: Roman exoplanet
#                   demographics papers with no SETI content.
#
# The sandbox blocks arxiv.org / OpenAlex; the runner has egress.  Verbatim
# atom feeds and JSON only; every asserted arXiv id is title-verified in
# id_title_check.json; every fetch's HTTP status is in fetch_log.json.  Full
# texts (pdftotext) are pulled only for anchors whose id/title check PASSED.
# Independent of the search workflow so an arXiv outage cannot cost a run, and
# vice versa.  Commit-back through scripts/commit_results.sh, which VERIFIES
# the push.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RESULTS_BRANCH: ${{ github.ref_name }}

jobs:
  romanlit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Prior-art sweep (soft 75-min deadline, partials kept)
        run: |
          timeout -k 30 4500 python scripts/romanlit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== summary ==="
          python -c "import json;d=json.load(open('results/romanlit/summary.json'));print(d['n_ok'],'ok /',d['n_urls'],'urls;',d['n_failed'],'failed')" || true
          python -c "import json;d=json.load(open('results/romanlit/id_title_check.json'));print(d['n_id_mismatch'],'id/title mismatches,',d['n_title_search_miss'],'title-search misses')" || true
          python -c "import json;d=json.load(open('results/romanlit/concept_scan.json'));print(d['n_abstracts_scanned'],'abstracts');print(json.dumps(d['per_group_counts'],indent=2))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: romanlit
          path: results/romanlit/
          if-no-files-found: warn
      - name: Commit results
        if: always()
        run: |
          scripts/commit_results.sh \
            "romanlit: ROMAN prior-art evidence (opaque lens, NIR laser, ramp flash, statite, Roman SETI)" \
            results/romanlit
