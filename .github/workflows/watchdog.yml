name: watchdog

# Hourly sweep that survives any Claude session dying: runs on GitHub's
# scheduler from the default branch, needs no external state.
#
# TWO DIFFERENT FAILURES, and the second one is invisible to the first:
#  1. RUNS THAT FAILED.  `seti.failsweep` finds runs from the last 24 h that
#     ended failure / cancelled / timed_out and re-runs their failed jobs --
#     but only where re-running can help.  It refuses when the run's commit is
#     no longer its branch's head, because a re-run checks out the RUN'S OWN
#     commit: on 2026-08-27 that resurrected a four-hour ATLAS pass at a commit
#     six merges stale, whose bug had already been fixed.  Every refusal is
#     recorded with its reason in results/watchdog/status.json.
#  2. RUNS THAT NEVER STARTED.  GitHub's scheduler is best effort and drops
#     firings under load -- `tocsin-altfeeds` lost its first scheduled slot on
#     2026-08-26, and this workflow itself, nominally hourly at :17, fired that
#     day at 19:16, 16:33, 14:02, 13:13, 11:42, 10:50, 09:55 and 09:00 UTC.  A
#     dropped firing leaves NO failed run for step 1 to find, and no stale
#     result until the staleness window in alerts.py expires days later.  So
#     `seti.cronwatch` asks the API when each scheduled workflow last actually
#     ran on a schedule event, reports anything past its own grace window, and
#     re-dispatches it once (workflow_dispatch is one of the two events GitHub
#     exempts from the no-recursive-triggering rule, so the token here can).
#
# BOTH SWEEPS ARE PYTHON, NOT INLINE SHELL, and that is the point.  The failure
# sweep used to be twenty lines of `gh api | jq` in this file -- logic no test
# could reach, which could only be exercised by merging it and waiting an hour.
# It is now `src/seti/failsweep.py` with `tests/test_failsweep.py` around it,
# and the incident above is the first test in that file.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pyyaml + requests only)
        # NOT `pip install -e .`: this job runs every hour, and both sweeps need
        # to read YAML and make a handful of HTTP calls, not the whole
        # scientific stack.  scripts/*_sweep.py import their modules directly
        # for exactly this reason.
        run: python -m pip install --quiet --upgrade pip pyyaml requests

      # ---------------------------------------------------------------------
      # 1. Runs that failed.
      # ---------------------------------------------------------------------
      - name: Sweep recent runs and retry the failures a retry can fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/fail_sweep.py

      # ---------------------------------------------------------------------
      # 2. Runs that never started.
      # ---------------------------------------------------------------------
      - name: Did the scheduled screens actually FIRE?
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/cron_watch.py \
            --ref "${{ github.event.repository.default_branch || 'main' }}"

      # ---------------------------------------------------------------------
      # One commit for both ledgers.  Two commits meant two `git pull --rebase`
      # races against each other inside one job.
      # ---------------------------------------------------------------------
      - name: Commit the ledgers
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `bash -e`: an `[ -f ] && ...` list that ends false at the end of a
          # loop kills the step, so the test is a real `if`.
          for f in results/watchdog/status.json results/cronwatch/status.json \
                   results/cronwatch/state.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "ledgers unchanged"
          else
            git commit -m "watchdog: failure + scheduler sweep ($(date -u +%FT%TZ))"
            git pull --rebase --autostash || true
            git push || echo "ledger push failed (non-fatal)"
          fi
