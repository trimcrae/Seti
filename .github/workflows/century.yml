name: century

# CENTURY — S50: cessation, secular fade and rising season scatter on the
# DASCH DR7 century baseline (1885–1992; 252,458,490 sources, 23.6 billion
# measurements).  docs/century.md.
#
#   targets ──▶ sweep (N shards: acquire + screen) ──▶ assess
#   probe (reconnaissance, on request only, in parallel with everything)
#
# WHY A PROBE STAGE EXISTS.  Nothing in this repository has ever spoken to the
# DASCH DR7 web API.  The probe stage is the cheapest possible way to learn its
# real shapes on a runner: it saves the documentation pages as text, the
# OpenAPI schema if one is served, the `daschlab` source (which is where the
# AFLAGS / BFLAGS bit meanings live), then runs one live
# queryexps → querycat → lightcurve chain on four bright catalogued variables
# and prints the columns that came back.  Run it alone (`stages: probe`) before
# committing a runner-hour to a sweep.
#
# THE GOVERNING METHODOLOGY (docs/century.md §3).  Three plate-specific rules:
#  1. every non-detection is normalised by an injection-measured efficiency
#     CENSORED against that block's own per-plate limiting magnitudes and
#     smeared by its own exposure times — a plate archive's sensitivity varies
#     by two magnitudes between series, so an un-normalised "the period
#     stopped" is a statement about the emulsion;
#  2. the Menzel gap (no plates 1954–1970) and the pre/post-gap photometric
#     offset are modelled as a STEP, never as a trend.  Hippke et al. 2016 and
#     Lund et al. 2016 showed that fitting a line across that gap is precisely
#     how KIC 8462852 acquired its "century dimming";
#  3. every statistic is re-done at a deeper plate-limit margin and inside the
#     single dominant plate series.  A result that depends on shallow plates or
#     on a change of series is a property of the archive, not of the star.
#
# Operational design inherited from knell.yml / rust.yml:
#  * checkpointing — the acquire stage appends acquire.jsonl per star and
#    rewrites lightcurves.npz every `checkpoint_every` stars, and RESUMES from
#    both, so a killed shard loses minutes rather than the run;
#  * sharding — fail-fast:false matrix, max-parallel bounded to be a good
#    citizen toward the DASCH API;
#  * artifact passthrough — targets.csv travels to the shards, the shard
#    directories travel to assess;
#  * COMMIT-BACK STAGES ONE PATHSPEC AT A TIME.  `git add` with several
#    pathspecs is ATOMIC: one unmatched glob stages NOTHING, `|| true` swallows
#    the failure, and the run's results are silently discarded.  This has cost
#    this repository whole runs.

on:
  workflow_dispatch:
    inputs:
      stages:
        description: >-
          full (targets+sweep+assess) | targets | sweep | assess | probe.
          `probe` is reconnaissance and runs ONLY when asked for by name: it
          reads documentation and the daschlab source, writes nothing a later
          job consumes, and on a starved queue costs `full` an entire extra
          runner wait.
        required: false
        default: "full"
      fields:
        description: >-
          Semicolon-separated ra,dec[,name] field centres.  Empty = the
          config/century.yaml set (DASCH-dense fields).
        required: false
        default: ""
      radius_deg:
        description: "Cone radius per field (deg)"
        required: false
        default: "1.0"
      n_shards:
        description: "Number of parallel acquire+screen shards"
        required: false
        default: "6"
      max_variables:
        description: "Cap on catalogued variables per field"
        required: false
        default: "150"
      max_bright:
        description: "Cap on bright reference stars per field (0 = variables only)"
        required: false
        default: "80"
      max_targets:
        description: "Cap on stars fetched per shard (0 = no cap)"
        required: false
        default: "0"
      time_budget_s:
        description: "Per-shard DASCH wall-clock budget (s)"
        required: false
        default: "9000"
      screen_budget_s:
        description: >-
          Per-shard SCREEN wall-clock budget (s).  Acquire + screen share one
          job's timeout-minutes; the sum of the two budgets must leave room for
          the install and the upload.
        required: false
        default: "9000"
      pause_s:
        description: "Pause between DASCH requests (s)"
        required: false
        default: "0.5"
      run_gaia:
        description: "Gaia DR3 context for candidates in assess (true/false)"
        required: false
        default: "true"
      reduce_only_run_id:
        description: "Skip acquisition; assess from this prior run's shard artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # probe — learn the API on the runner.  Cheap, and the only stage that
  # can be run alone before any commitment.
  # ------------------------------------------------------------------
  # `stages: probe` ONLY — `full` no longer re-probes.  The probe is a
  # reconnaissance job, not a pipeline stage: it reads documentation and the
  # daschlab source and writes nothing any later job consumes.  Re-running it
  # inside `full` spent a whole runner AND a whole queue wait (measured: 95
  # minutes on run 35745660073, which had not started its probe by the time
  # four other channels finished entire sweeps) to re-learn a schema already
  # committed under results/century/probe/.  The acquire stage logs
  # `flag_definitions` with its source on every shard, so the flag parse is
  # still verified on real data every run.
  probe:
    if: >-
      ${{ github.event.inputs.reduce_only_run_id == ''
      && github.event.inputs.stages == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe the DASCH DR7 API
        run: |
          python -m seti.century.run --stage probe
          echo "=== probe verdict ==="
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("results/century/probe/probe.json")
          if not p.exists():
              print("::error::probe wrote nothing"); raise SystemExit(1)
          r = json.loads(p.read_text())
          print("verdict:", r.get("verdict"))
          for k, v in (r.get("docs") or {}).items():
              print(f"  doc {k}: HTTP {v.get('status')} {v.get('bytes')} bytes")
          for tag, d in (r.get("field_density") or {}).items():
              print(f"  field {tag}: n_plates={d.get('n_plates')} "
                    f"pre={d.get('n_pre_gap')} post={d.get('n_post_gap')} "
                    f"years={d.get('year_min')}..{d.get('year_max')} ok={d.get('ok')}")
          for ch in (r.get("chains") or []):
              nm = ch.get("star", {}).get("name")
              qc, lc = ch.get("querycat", {}), ch.get("lightcurve", {})
              print(f"  {nm}: querycat HTTP {qc.get('status')} rows={qc.get('n_rows')} "
                    f"payload={qc.get('payload')}")
              if qc.get("columns"):
                  print(f"    refcat columns: {qc['columns']}")
              if lc:
                  print(f"    lightcurve HTTP {lc.get('status')} rows={lc.get('n_rows')} "
                        f"payload={lc.get('payload')}")
                  if lc.get("columns"):
                      print(f"    lc columns: {lc['columns']}")
                  if not lc.get("ok"):
                      print(f"    lc body: {lc.get('body_head')}")
              if ch.get("normalised"):
                  print(f"    normalised: {json.dumps(ch['normalised'])[:900]}")
          PY
      - name: Commit probe output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/century/probe/probe.json || echo "no probe.json"
          git add -f -- results/century/probe/flag_bits.json || echo "no flag_bits.json"
          git add -f -- results/century/probe/flag_bit_evidence.json || echo "no flag evidence"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No probe changes to commit."
          else
            git commit -m "century: DASCH DR7 API probe (runner)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: century-probe
          path: results/century/probe/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # targets — VSX/GCVS periodic variables + bright refcat stars per field.
  # ------------------------------------------------------------------
  # NOT `needs: [probe]`.  The probe produces nothing this job reads, so the
  # dependency was pure serialisation — and on a starved queue each job waits
  # for a runner SEPARATELY, so it cost `full` an entire extra queue wait
  # before target selection could even start.  Observed 2026-09-22: run
  # 35745660073 sat queued from 15:12Z to at least 15:38Z without its probe
  # job starting, with 87 runs queued account-wide.  The two run in parallel;
  # they touch different endpoints.
  targets:
    if: >-
      ${{ github.event.inputs.reduce_only_run_id == ''
      && (github.event.inputs.stages == 'targets' || github.event.inputs.stages == 'sweep'
          || github.event.inputs.stages == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
      n_targets: ${{ steps.count.outputs.n }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Select targets
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.fields }}" ]; then
            EXTRA="--fields '${{ github.event.inputs.fields }}'"
          fi
          eval python -m seti.century.run --stage targets \
            --radius-deg ${{ github.event.inputs.radius_deg || '1.0' }} \
            --max-variables ${{ github.event.inputs.max_variables || '150' }} \
            --max-bright ${{ github.event.inputs.max_bright || '80' }} \
            $EXTRA
          echo "=== targets summary ==="
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("results/century/targets_summary.json")
          s = json.loads(p.read_text()) if p.exists() else {}
          print(json.dumps({k: v for k, v in s.items() if k != "acquisition"}, indent=1)[:4000])
          PY
      - id: count
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("results/century/targets_summary.json")
          s = json.loads(p.read_text()) if p.exists() else {}
          print(f"n={int(s.get('n_targets', 0))}")
          PY
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.n_shards || '6' }}" or 6)
          print("shards=" + json.dumps([f"{i}/{n}" for i in range(max(n, 1))]))
          PY
      - name: Commit targets
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/century/targets.csv || echo "no targets.csv"
          git add -f -- results/century/targets_summary.json || echo "no targets_summary.json"
          # plate_exptime.csv holds the exposure DURATION of every plate, from
          # the same queryexps that measured the field density.  DR7 light
          # curves carry no exposure time, and the shards join this on.
          git add -f -- results/century/plate_exptime.csv || echo "no plate_exptime.csv"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No target changes to commit."
          else
            git commit -m "century: target selection (VSX/GCVS variables + bright DASCH refcat stars)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: century-targets
          path: |
            results/century/targets.csv
            results/century/targets_summary.json
            results/century/plate_exptime.csv
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # sweep — one shard = acquire (DASCH light curves) + screen (the three
  # statistics).  Keeping both in one job means the .npz never leaves the
  # runner that wrote it.
  # ------------------------------------------------------------------
  sweep:
    needs: targets
    if: >-
      ${{ always() && needs.targets.result == 'success'
      && github.event.inputs.reduce_only_run_id == ''
      && (github.event.inputs.stages == 'sweep' || github.event.inputs.stages == 'full')
      && needs.targets.outputs.n_targets != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3          # be a good citizen toward the DASCH API
      matrix:
        shard: ${{ fromJSON(needs.targets.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The gate runs on the runner's OWN pandas (3.x from `pandas>=2.0`), not
      # the sandbox's 2.x, so it is also the version check.  `dr7` and
      # `exposure` are in the selection because the schema contract — column
      # spellings, the JD time scale, the exposure-time join — is what fails
      # first on real data, and failing it here costs a minute instead of an
      # acquisition budget.
      - name: Offline gate — the Menzel step, the efficiency nulls, the DR7 schema
        run: |
          python -c "import pandas, numpy, astropy; print('versions', pandas.__version__, numpy.__version__, astropy.__version__)"
          python -m pytest tests/test_century.py -q -p no:warnings \
            -k "gap or step or efficiency or censor or dr7 or exposure"
      - uses: actions/download-artifact@v4
        with:
          name: century-targets
          path: results/century/
      - name: Acquire shard ${{ matrix.shard }}
        run: |
          MT=""
          if [ "${{ github.event.inputs.max_targets || '0' }}" != "0" ]; then
            MT="--max-targets ${{ github.event.inputs.max_targets }}"
          fi
          python -m seti.century.run --stage acquire \
            --shard "${{ matrix.shard }}" \
            --time-budget-s ${{ github.event.inputs.time_budget_s || '9000' }} \
            --pause-s ${{ github.event.inputs.pause_s || '0.5' }} \
            $MT
          echo "=== acquire summary ==="
          cat results/century/shards/*/acquire_summary.json || true
      - name: Screen shard ${{ matrix.shard }}
        if: always()
        run: |
          python -m seti.century.run --stage screen --shard "${{ matrix.shard }}" \
            --screen-budget-s ${{ github.event.inputs.screen_budget_s || '9000' }}
          echo "=== screen summary ==="
          cat results/century/shards/*/screen_summary.json || true
      - name: Shard tag
        id: nm
        if: always()
        run: echo "tag=$(echo '${{ matrix.shard }}' | tr '/' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: century-shard-${{ steps.nm.outputs.tag }}
          path: results/century/shards/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # assess — field common mode, confirmation at full injection depth,
  # Gaia context, the gauntlet, summary.json.
  # ------------------------------------------------------------------
  assess:
    needs: [targets, sweep]
    if: >-
      ${{ always() && github.event.inputs.reduce_only_run_id == ''
      && (github.event.inputs.stages == 'assess' || github.event.inputs.stages == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: century-targets
          path: results/century/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          pattern: century-shard-*
          merge-multiple: true
          path: results/century/shards/
        continue-on-error: true
      - name: Assess
        run: |
          ls -R results/century/shards 2>/dev/null | head -40 || echo "no shard dirs"
          GAIA=""
          if [ "${{ github.event.inputs.run_gaia || 'true' }}" = "false" ]; then
            GAIA="--no-gaia"
          fi
          python -m seti.century.run --stage assess $GAIA
      # A verdict must never read as a science null when no data was tested.
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/century/summary.json")
          if not p.exists():
              print("::error::assess wrote no summary.json"); sys.exit(1)
          s = json.loads(p.read_text())
          v, f = s.get("verdict_code"), s.get("funnel", {})
          print(json.dumps({k: s[k] for k in s if k != "acquisition"}, indent=1)[:8000])
          if f.get("n_usable", 0) == 0 and v not in ("NO_DATA_REACHED", "NO_TARGETS",
                                                     "NO_LIGHTCURVES_RETURNED",
                                                     "NO_TESTABLE_LIGHT_CURVES",
                                                     "NO_SHARDS_PRESENT"):
              print(f"::error::verdict {v!r} with 0 usable light curves is a disguised no-data run")
              sys.exit(1)
          if v == "NO_SHARDS_PRESENT":
              print("::warning::no shard directory reached assess — the sweep did not run or "
                    "its artifacts are gone. This is NOT a statement about DASCH.")
          if v == "NO_CANDIDATES":
              print(f"::notice::{f.get('n_usable')} century light curves tested, no cessation / "
                    "fade / rising-scatter candidate at demonstrated sensitivity. "
                    "A COUNT, NOT AN OCCURRENCE LIMIT — see docs/century.md.")
          PY
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/century/summary.json || echo "no summary.json"
          git add -f -- results/century/candidates.csv || echo "no candidates.csv"
          git add -f -- results/century/survivors.csv || echo "no survivors.csv"
          git add -f -- results/century/century_screen.csv.gz || echo "no screen table"
          git add -f -- results/century/targets_summary.json || echo "no targets_summary"
          for f in results/century/shards/*/acquire_summary.json; do
            [ -e "$f" ] && { git add -f -- "$f" || echo "skip $f"; }
          done
          for f in results/century/shards/*/screen_summary.json; do
            [ -e "$f" ] && { git add -f -- "$f" || echo "skip $f"; }
          done
          echo "=== staged ==="
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "century: S50 sweep — cessation / fade / rising scatter on DASCH DR7"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: century-final
          path: |
            results/century/summary.json
            results/century/candidates.csv
            results/century/survivors.csv
            results/century/century_screen.csv.gz
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # assess-only — re-reduce a prior run's shards without refetching DASCH.
  # ------------------------------------------------------------------
  assess-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: century-targets
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/century/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          pattern: century-shard-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/century/shards/
      - name: Assess
        run: |
          GAIA=""
          if [ "${{ github.event.inputs.run_gaia || 'true' }}" = "false" ]; then
            GAIA="--no-gaia"
          fi
          python -m seti.century.run --stage assess $GAIA
          cat results/century/summary.json || true
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/century/summary.json || echo "no summary.json"
          git add -f -- results/century/candidates.csv || echo "no candidates.csv"
          git add -f -- results/century/survivors.csv || echo "no survivors.csv"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "century: re-assess of a prior sweep's shard artifacts"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: century-final
          path: results/century/
          if-no-files-found: warn
