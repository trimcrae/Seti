# GROWTH channel — every threshold, coefficient and list in one place.
#
# Signature S57 (docs/necrofrontier.md §2, "The growing transit"): a shell or
# swarm being BUILT around a transiting planet grows its transit depth
# achromatically over years.  Stage 1 compares the Kepler-era depth (KOI
# cumulative table, 2009–2013) with the TESS-era depth (TOI table, 2018–2026)
# for every Kepler planet/candidate TESS re-detected, after the deterministic
# corrections, and flags growth (or shrinkage) at fixed impact parameter.
#
# Every number marked `verify` was set from memory of the cited source in a
# sandbox with no archive egress and must be checked against the source before
# any candidate is written up.

archive:
  exoarchive_tap: "https://exoplanetarchive.ipac.caltech.edu/TAP/sync"
  tables:
    koi: "cumulative"
    toi: "toi"
    ps: "ps"
  ps_where: "disc_facility like '%Kepler%'"
  # The same predicate is re-applied in code (fetch_ps_kepler).  MEASURED (run
  # 34787801172): the recorded ADQL DID carry the WHERE and the server returned
  # 28,592 rows — that is the multi-REFERENCE row count over the Kepler-
  # discovered planets (ps has one row per published solution, `default_flag`
  # marks the adopted one), not the whole table.  The re-filter makes a dropped
  # WHERE observable instead of assumed: `join.n_ps_rows_not_kepler_discovered`
  # in acquire.json is the number of returned rows the predicate excludes.
  ps_require_kepler_in_disc_facility: true

join:
  pos_radius_arcsec: 2.0          # KOI <-> TOI / KOI <-> ps positional match radius
  period_tol: 1.0e-3              # |ΔP/P| for the same planet
  alias_max: 4                    # integer aliases n / 1/n tried (recorded as period_alias; a veto)
  # The four routes from a KOI to a TOI, tried in this order and counted
  # separately in acquire.json["join"]["joined_by_route"].  Drop a name from
  # this list to switch that route off.
  #
  #   name_planet     cumulative.kepler_name == ps.pl_name  -> ps.tic_id
  #   name_host       the KOI's host (its own kepler_name, or inherited from a
  #                   sibling KOI on the same kepid) == ps.hostname -> ps.tic_id
  #   position_tic    KOI position -> nearest ps row with a tic_id (NO names;
  #                   this is the route for the ~6,800 KOIs that have no
  #                   kepler_name at all, and needs no column beyond the
  #                   ra/dec/tic_id already pulled and verified in probe.json)
  #   position_period KOI position -> TOI position + period (no crossmatch)
  routes: ["name_planet", "name_host", "position_tic", "position_period"]
  # `verify` — ASSERTED COLUMN FORMAT.  ps.tic_id is a STRING spelled
  # "TIC 122298563", not an integer.  This is the 2026-09-13 defect: a bare
  # pd.to_numeric on it was all-NaN, the dropna that followed emptied the
  # name -> TIC map, and the run reported koi_with_tic_id: 0 while holding
  # 28,592 ps rows.  acquire.parse_tic_id accepts "TIC <n>", "tic<n>" and a
  # bare integer, and acquire.json records n_ps_tic_id_parsed /
  # n_ps_tic_id_unparsed plus three verbatim samples of the column, so the
  # assertion is CHECKED on every run instead of trusted.  A format the parser
  # does not recognise shows up as n_ps_tic_id_unparsed > 0 and a zero yield on
  # the name routes — a recorded status, never a crash.
  ps_tic_id_is_string: true
  ps_tic_id_prefix: "TIC"
  # toi.tid is numeric (verified in probe.json, run 34787801172) and is the
  # same TIC id; no parsing needed on that side.
  toi_tid_is_numeric: true

gaia:
  neighbour_radius_arcsec: 21.0   # one TESS pixel
  chunk: 300                      # targets per upload crossmatch
  retries: 3                      # attempts on the upload route before falling back
  # `verify` — ASSERTED SERVICE.  MEASURED (run 34787801172): the astroquery
  # tap_upload crossmatch against gaiadr3.gaia_source returned
  #   HTTPError('Error 500: SQL exception: ERROR: canceling statement due to
  #   statement timeout')
  # on all three attempts for a single 108-target chunk, and every star ended
  # `not_checked`.  The anonymous ESA queue will not finish an upload JOIN over
  # the whole gaia_source.  When the upload route raises, each chunk falls back
  # to per-target SYNC CONES through pyvo against tap_url (the transport
  # src/seti/baffle/acquire.py uses), retried cone_retries times, with finished
  # chunks checkpointed under results/growth/data/gaia_checkpoint/.  A target
  # neither route reaches stays QUERY_FAILED -> `neighbours_not_checked`, and
  # may never be called isolated.
  tap_url: "https://gea.esac.esa.int/tap-server/tap"
  fallback_cones: true
  cone_retries: 2
  checkpoint: true
  # MEASURED (run 34789826297): the cone fallback ran for THREE HOURS without
  # finishing and would have been killed by the workflow's 180-minute cap with
  # nothing committed — not even the probe. pyvo's run_sync takes no timeout,
  # so one hung ESA request blocks the whole loop. Two ceilings now bound it:
  #   cone_timeout_s — a hard per-request timeout, imposed through the session;
  #   cone_budget_s  — wall clock for the WHOLE fallback across all chunks.
  # A target the budget did not reach is QUERY_FAILED -> `not_checked`, exactly
  # as an unreachable one is. The ceilings change what is ATTEMPTED, never what
  # is claimed. Set cone_budget_s to 0 or null for no ceiling.
  cone_timeout_s: 120.0
  cone_budget_s: 3600.0

aperture:
  # Aperture-capture weight for a neighbour at separation d:
  #   w(d) = 0.5 erfc((d − radius) / (√2 σ_psf))
  # ~1 well inside, 0.5 at the edge, ~0 a few σ beyond.  Approximate: the real
  # TESS PRF is undersampled and position-dependent; the UNWEIGHTED sum
  # (contam_max) is carried alongside as the upper bound and drives the
  # neighbour veto.
  radius_arcsec: 21.0
  psf_sigma_arcsec: 10.5

drift:
  sigma_sys: 0.05                 # floor on σ(ln R): pipeline-to-pipeline depth heterogeneity
  sigma_dur_sys: 0.05             # floor on σ(ln T14 ratio)
  n_consistent: 3.0               # |z| below this: CONSISTENT
  n_candidate: 5.0                # z at or above this (and every gate): GROWTH_CANDIDATE
  n_duration: 3.0                 # |z_duration| below this: the change is at fixed b
  # The TOI depths from SPOC are fitted on PDCSAP flux, which already carries
  # the CROWDSAP crowding correction; QLP depths are corrected with the TIC
  # contamination ratio.  Applying the Gaia term as well can double-correct,
  # which is why the neighbour veto asks a candidate to survive the full
  # dilution range [0, contam_max].  Set false to compare uncorrected ratios.
  apply_dilution_to_tess: true
  # Han et al. 2025: public TESS radii are ~6 % low from residual blending,
  # i.e. a ~12 % depth deficit is the EXPECTED sign for an ordinary planet.
  # The population median ln R is measured on the joined sample and subtracted
  # before classification, so "growth" means growth relative to the
  # population's own systematic offset.  Both numbers are reported.
  han2025_expected_deficit: 0.12   # verify against Han et al. 2025
  subtract_population_median: true

long_period:
  min_period_days: 30.0           # every joined or TESS-only planet above this is listed for stage 2

limb_darkening:
  # Quadratic-law coefficients (u1, u2) at [Fe/H] = 0, logg 4.5, for the
  # Kepler band (Claret & Bloemen 2011, A&A 529, A75 — ATLAS, flux-conserving
  # method) and the TESS band (Claret 2017, A&A 600, A30).  Values are
  # approximate and transcribed from memory: `verify` every row against the
  # VizieR tables (J/A+A/529/A75, J/A+A/600/A30) before a candidate is written
  # up.  The correction is a few per cent (±4 % between b = 0 and b = 0.9 for
  # a solar-type star), so an error of 0.05 in u1 moves ln R by ~0.01.
  source: "Claret & Bloemen 2011 (Kepler); Claret 2017 (TESS) — verify"
  default_teff: 5800.0
  grids:
    - logg: 4.5
      teff:   [3500, 4000, 4500, 5000, 5500, 5800, 6000, 6500, 7000]
      kepler: [[0.50, 0.25], [0.60, 0.16], [0.62, 0.13], [0.53, 0.20],
               [0.45, 0.24], [0.40, 0.26], [0.37, 0.27], [0.31, 0.30], [0.26, 0.32]]
      tess:   [[0.25, 0.35], [0.42, 0.22], [0.45, 0.20], [0.40, 0.22],
               [0.34, 0.24], [0.31, 0.25], [0.28, 0.26], [0.23, 0.29], [0.19, 0.31]]

# ---------------------------------------------------------------------------
# STAGE 2 — measure the TESS depth FROM THE LIGHT CURVE (src/seti/growth/stage2.py)
#
# WHY.  Stage 1 compares two heterogeneous CATALOGUE depths and its error model
# is demonstrably not a sigma scale: run 35038510064 measured 108 planets and
# 31 of them sit above 5 sigma of the population median, 37 above 3.  A third
# of a sample cannot be five-sigma outliers unless the formal errors fail to
# describe the pipeline-to-pipeline scatter, so the z = 8.67 on K00897.01
# (Kepler-718 b) is not an 8.67-sigma statement.  Stage 2 does not argue about
# that: it FITS the TESS depth itself and compares THREE numbers — the Kepler
# catalogue depth (carried into the TESS band by the limb-darkening ratio), the
# TOI catalogue depth, and the measured one.
#
# AND THEN THE ASYMMETRY WAS REMOVED.  Comparing our TESS fit against koi_depth
# is still a comparison with A CATALOGUE NUMBER, which is the very heterogeneity
# stage 2 exists to escape.  So BOTH eras are now fitted here by the SAME code
# (mast.kepler_enabled below), and the PRIMARY result is the like-for-like
# verdict — MEASURED_DEPTH_CHANGED / _UNCHANGED / _UNRESOLVED / _ERA_UNMEASURED.
# The three-number catalogue comparison is KEPT and is now a diagnostic of the
# CATALOGUES rather than of the sky: it says which table is right about the TESS
# era.  Our Kepler-era fit is separately checked against koi_depth in the Kepler
# band (no band ratio); a disagreement there is a finding about the KOI TABLE.
#
# WHAT IT CANNOT DO.  A deeper TESS transit cannot be caused by dilution
# (dilution makes a transit SHALLOWER), but a signal ORIGINATING ON A DIFFERENT
# STAR inside the ~21" TESS pixel produces exactly this.  Nothing in stage 2
# tests that; the odd-even statistic below catches one flavour of it (an EB at
# twice the period) and the centroid test is stage 3.
stage2:
  # The shortlist.  Config entries win over candidates.csv on a duplicate KOI.
  shortlist_from_candidates_csv: true
  shortlist:
    - kepoi_name: "K00897.01"
      kepler_name: "Kepler-718 b"
      kepid: 7849854
      tic_id: 268924036
      toi: 4490.01
      # `verify` — ASSERTED IDENTIFICATION, from results/growth/candidates.csv
      # (run 35038510064, join route name_planet).  Kepler-era koi_depth
      # 14,280.6 +/- 17.9 ppm; TOI pl_trandep 34,476 +/- 2,349 ppm; the stage-2
      # job is to say which (if either) the light curve supports.
      note: "the single stage-1 GROWTH_CANDIDATE of run 35038510064"

  mast:
    # SPOC 2-minute where it exists, TESS-SPOC / QLP FFI otherwise.  WHICH
    # product and WHICH sectors were used is recorded per target in
    # sectors.csv — a depth from a 30-minute FFI cadence on a 2-hour transit is
    # smeared, and that must be visible in the record, not hidden.
    authors: ["SPOC", "TESS-SPOC", "QLP"]
    # WALL-CLOCK CEILINGS, the same discipline as gaia.cone_budget_s above and
    # for the same reason: run 34789826297 sat three hours in an unbounded
    # fetch loop and would have been killed with nothing committed.  A target
    # the budget did not reach is UNMEASURED with reason BUDGET_EXHAUSTED —
    # never a depth, never an agreement.
    target_timeout_s: 600.0
    per_target_budget_s: 900.0
    budget_s: 5400.0
    archive_timeout_s: 300.0
    archive_retries: 3
    retries: 2
    retry_pause_s: 5.0
    max_sectors: 60
    download_dir: null

    # --- THE KEPLER ERA, measured with the SAME fitter --------------------
    # WHY.  Run 35041932130 fitted the TESS era from the light curve and then
    # compared it against `cumulative.koi_depth` — A CATALOGUE NUMBER, from a
    # different pipeline, a different decade and a different aperture.  That is
    # exactly the heterogeneity that broke stage 1's error model (31 of 108
    # planets above 5 sigma of the population median), so the comparison
    # inherited the flaw it existed to remove.  Stage 2 now fits BOTH eras with
    # the same code — same fold, same transit-masked local baseline, same
    # exposure-shrunk core, same bootstrap, same dedupe — and the LIKE-FOR-LIKE
    # verdict (MEASURED_DEPTH_CHANGED / _UNCHANGED / _UNRESOLVED /
    # _ERA_UNMEASURED) is the PRIMARY result.  Either answer is valuable: if our
    # Kepler-era fit also gives ~30,000 ppm then nothing changed and koi_depth
    # is simply wrong for this object; if it gives ~14,000 ppm the change
    # survives a comparison in which nothing but the sky differs.
    #
    # `kepler_enabled` is FALSE in the code's own defaults on purpose: a caller
    # that has not thought about the Kepler era must not silently open a socket
    # to MAST (tests/conftest.py raises on any socket, and an exception swallowed
    # by the retry loop would read as QUERY_FAILED).  IT IS TRUE HERE, and
    # growth_stage2.yml FAILS THE RUN if summary.json comes back with it off —
    # so a dropped key is loud rather than a quietly one-sided comparison.
    kepler_enabled: true
    # There is one official Kepler reduction (the mission pipeline).  The
    # community products are K2, not Kepler, and are deliberately not asked
    # for: the point of this stage is that BOTH eras go through THIS fitter.
    kepler_authors: ["Kepler"]
    # SEPARATE wall-clock ceilings from the TESS side, same discipline and same
    # reason as gaia.cone_budget_s: a slow fetch on one side must not starve the
    # other and leave the like-for-like comparison one-sided.  Kepler is 18
    # quarters (and, where short cadence exists, three month-files per quarter),
    # so the per-target ceiling is larger than the TESS one.  What the budget
    # does not reach is UNMEASURED with reason BUDGET_EXHAUSTED — never a depth.
    kepler_budget_s: 5400.0
    kepler_per_target_budget_s: 1800.0
    kepler_target_timeout_s: 1200.0
    kepler_max_quarters: 60
    kepler_retries: 2
    # SHORT CADENCE IS PREFERRED WHERE IT EXISTS.  Kepler long cadence is 270
    # co-added frames = 1765.5 s = 29.4 minutes; on K00897.01's 2.078-hour
    # transit that is 0.24 T14, above `fit.smear_fraction`, so a long-cadence
    # quarter carries the `smeared` flag exactly as a 30-minute TESS FFI sector
    # does.  Nothing is asked of the archive by cadence: every product is
    # fetched, short-cadence MONTH-files are merged into quarters
    # (merge_kepler_segments — three files carry one quarter and keying dedupe
    # on the quarter without merging would throw two thirds of them away), and
    # dedupe_sectors then keeps the shortest-cadence reduction of each quarter.
    # WHETHER SHORT CADENCE EXISTS FOR KIC 7849854 IS A RUNNER FACT: it is
    # recorded per target as `kepler_has_short_cadence` / `kepler_cadences`.

  # ---------------------------------------------------------------------
  # THE REDUCTION ENSEMBLE — the systematic that enters the total error
  # ---------------------------------------------------------------------
  # WHY.  The quoted TESS error did not describe the real scatter, and the
  # evidence is in this channel's own output.  Before dedupe_sectors existed,
  # run 35041932130 measured THE SAME SEVEN SECTORS under two pipelines
  # (results/growth/stage2/sectors.csv at commit 050402a): the 2-minute SPOC
  # reductions gave 25,425–35,498 ppm and the FFI TESS-SPOC reductions OF THE
  # SAME PIXELS gave 33,078–39,798 ppm.  Two reductions of identical photons
  # disagreeing by 20–30 % is a systematic FAR LARGER than the 1,521 ppm the
  # bootstrap quotes.  And the out-of-transit scatter is 414 ppm in Kepler
  # against 67,631 ppm in TESS — a factor of 163: at G = 15.23 the TESS light
  # curve is faint and systematics-limited.  Stage 1's whole failure was a
  # quoted error that did not describe the real scatter (31 of 108 planets above
  # 5 sigma of the population median); repeating that one level down, on a
  # single object, would be worse.
  #
  # WHAT IT DOES.  For each era, for each (pipeline author, flux column)
  # combination the archive serves, measure the depth.  Report the spread over
  # those members — half the 16th-to-84th percentile range — and ADD IT IN
  # QUADRATURE to the statistical error.  THE LIKE-FOR-LIKE VERDICT THEN USES
  # THE TOTAL.  A ratio that survives the ensemble is a much stronger statement
  # than one that survives only the bootstrap; a ratio that does NOT survive it
  # comes back MEASURED_DEPTH_UNRESOLVED, and that is the correct answer.
  #
  # WHAT IT DOES NOT DO.  It does not move the depth.  The reported depth stays
  # the DEDUPLICATED one — dedupe_sectors keeps one reduction per sector and the
  # primary measurement is unchanged by adding ensemble members.  Re-stacking
  # the members would count every transit as many times as the archive serves
  # it, which is exactly the error run 35041932130 made.  The ensemble sets the
  # ERROR, and only the error.
  #
  # SAP_FLUX IS IN THE GRID DELIBERATELY.  PDC is where the crowding and
  # background corrections are applied, so a faint star in a crowded aperture
  # with an OVER-SUBTRACTED BACKGROUND yields an INFLATED transit depth — a
  # specific, testable, entirely mundane explanation for this whole result.  It
  # is answered with a number (sap_minus_pdcsap_ppm and its significance, paired
  # within a pipeline author) and a named finding when the two disagree beyond
  # their errors, rather than left as a worry.
  #
  # `enabled` is FALSE in the code's own defaults on purpose, exactly as
  # mast.kepler_enabled is: the grid multiplies the number of archive requests,
  # and a caller that has not thought about it must not silently open a socket
  # (tests/conftest.py raises on any socket use).  IT IS TRUE HERE, and
  # growth_stage2.yml FAILS THE RUN if summary.json comes back with it off.
  ensemble:
    enabled: true
    # Enumerated, NOT chosen.  Most combinations do not exist (QLP has never
    # served PDCSAP_FLUX, SPOC has never served KSPSAP_FLUX); those come back
    # FLUX_COLUMN_NOT_PRESENT, which is a RECORDED ABSENCE and is a different
    # fact from QUERY_FAILED (the archive errored), QUERY_RETURNED_ZERO_ROWS
    # (it answered with nothing) and AUTHOR_NOT_SERVED (it answered with
    # ANOTHER PIPELINE'S products).  A member that vanished silently would
    # shrink the spread, so every one of them keeps its reason in reductions.csv
    # and the era is flagged `ensemble_incomplete`.
    #
    # AUTHOR_NOT_SERVED is not hypothetical: run bcc670c hit it.  QLP serves
    # nothing for TIC 268924036 and lightkurve drops its author filter when
    # nothing matches, so the three QLP members came back carrying SPOC's light
    # curves — byte-identical duplicates that double-weighted one reduction in
    # the spread (9,303 instead of 9,661 ppm) and turned 2 genuine SAP/PDCSAP
    # pairs into 3 (error 977 instead of 1,226 ppm).  A member is measured only
    # if the products really carry BOTH the author and the column asked for.
    tess_authors: ["SPOC", "TESS-SPOC", "QLP"]
    tess_flux_columns: ["PDCSAP_FLUX", "KSPSAP_FLUX", "DET_FLUX", "SAP_FLUX"]
    kepler_authors: ["Kepler"]
    kepler_flux_columns: ["PDCSAP_FLUX", "SAP_FLUX"]
    # SEPARATE wall-clock ceilings again, and for the same reason as
    # gaia.cone_budget_s and mast.kepler_budget_s: the ensemble is up to 12
    # fetches per era where the primary measurement is one, and a SYSTEMATIC
    # ESTIMATE must never be able to consume the budget of the measurement it
    # exists to qualify.  A member the budget did not reach is recorded
    # BUDGET_EXHAUSTED — never silently absent.
    budget_s: 5400.0
    kepler_budget_s: 5400.0
    per_member_budget_s: 600.0
    member_timeout_s: 600.0
    retries: 2
    max_sectors: 60
    # The spread is half the range between the (100 - p)th and pth percentiles
    # of the member depths: the robust analogue of one standard deviation, and
    # not moved by one pathological reduction the way max - min is.  Below
    # min_members_for_spread the spread is NaN with status TOO_FEW_MEMBERS —
    # NEVER 0, because a zero spread would assert that every reduction agreed
    # when in truth only one was reached.
    spread_percentile: 84.0
    min_members_for_spread: 2
    # |SAP - PDCSAP| / sigma at or above this is BACKGROUND_TEST_DISAGREES and
    # is surfaced as a named finding in summary.json["reduction_ensemble"].
    background_n_agree: 3.0

  fit:
    # The ephemeris is FIXED to the KOI values (koi_period, koi_time0bk,
    # koi_duration): this stage measures a DEPTH, it does not re-derive an
    # ephemeris.  BKJD = BJD - 2454833 and BTJD = BJD - 2457000, so the epoch
    # conversion is t_BTJD = t_BKJD - 2167.0 exactly (tested against a
    # hand-worked value in tests/test_growth_stage2.py).
    core_fraction: 0.7              # flat-bottom window = 0.7 * T14, centred
    baseline_window_durations: 1.5  # local window half-width, in T14
    baseline_guard_durations: 0.75  # the baseline must lie beyond this, in T14
    min_core_points: 2
    min_baseline_points: 8
    require_baseline_both_sides: true
    # exptime > smear_fraction * T14 sets the `smeared` flag.  The core window
    # is ALSO shrunk by half the exposure so a point whose integration straddles
    # ingress is not counted as flat-bottom flux; when nothing survives that
    # shrink the fit is marked `depth_is_lower_bound`.
    smear_fraction: 0.2
    # Errors: the bootstrap over transits once there are enough of them, the
    # analytic propagation below that.  `depth_measured_err_method` always says
    # which one was quoted.
    err_method: "auto"              # auto | bootstrap | analytic | chi2_scaled
    bootstrap_draws: 2000
    min_transits_for_bootstrap: 8
    fold_bins: 121
    odd_even_sigma: 3.0             # |odd - even| at or above this sigma is flagged
    sector_scatter_chi2_per_dof: 3.0
    seed: 7

  compare:
    # |ln(D_measured / D_reference)| / sigma below n_agree is "agrees with".
    # sigma^2 = (e_meas/D_meas)^2 + (e_ref/D_ref)^2 + sigma_sys_ln^2.
    n_agree: 3.0
    # `verify` — ASSERTED FLOOR, not a measurement.  0.05 in ln depth is the
    # same stated floor stage 1 uses for pipeline-to-pipeline heterogeneity
    # (drift.sigma_sys).  It is NOT derived from the stage-2 residuals, because
    # a shortlist of one cannot measure its own scatter; a larger shortlist
    # should replace it with the measured spread.
    sigma_sys_ln: 0.05
    # The two catalogue depths are in DIFFERENT BANDPASSES.  The Kepler depth is
    # multiplied by band_ratio(Teff, logg, b) = F_TESS(b)/F_Kepler(b) before any
    # comparison, so the band difference is not charged to "growth".  The LD
    # grid itself is still `verify` (see limb_darkening above).
    #
    # The same ratio is applied to OUR Kepler-era MEASUREMENT before the
    # like-for-like comparison, by the same code and for the same reason.
    apply_band_ratio: true
    # THE POWER FLOOR for the like-for-like verdict.  Two measured depths that
    # agree only justify MEASURED_DEPTH_UNCHANGED if the comparison could have
    # SEEN the change under test: the smallest log ratio it could have called
    # changed is n_agree * sigma, and that must be no larger than the change
    # being claimed.  The claim is the catalogue separation itself,
    # ln(TOI / KOI-in-TESS-band) — ~0.88 for K00897.01 — which is used whenever
    # both catalogue depths are usable; this number is the fallback when they
    # are not.  0.10 in ln depth is a 10 % depth change.  Without this floor a
    # fit too noisy to tell 14,000 ppm from 30,000 ppm would "refute" the
    # candidate by failing to measure it — stage 1's error in the opposite
    # direction.  An agreement without power is MEASURED_DEPTH_UNRESOLVED.
    min_detectable_ln_ratio: 0.10
    # OUR Kepler-era fit against cumulative.koi_depth.  BOTH are in the Kepler
    # band, so NO band ratio is applied there — there is no band change to
    # correct.  |z| at or above this is KOI_DEPTH_CONTRADICTED, which is a
    # finding about the KOI TABLE (stage 1's own input) and is reported as one
    # in summary.json["koi_catalogue_check"] rather than buried.
    koi_check_n_agree: 3.0

vet:
  # Known large-TTV Kepler systems (Holczer et al. 2016, ApJS 225, 9 and the
  # named literature cases).  INCOMPLETE and from memory — `verify`; a system
  # can be listed by Kepler name, KOI host ("K00142" / "KOI-142") or "KIC n".
  ttv_systems:
    - "Kepler-9"
    - "Kepler-11"
    - "Kepler-18"
    - "Kepler-19"
    - "Kepler-24"
    - "Kepler-25"
    - "Kepler-26"
    - "Kepler-27"
    - "Kepler-28"
    - "Kepler-29"
    - "Kepler-30"
    - "Kepler-31"
    - "Kepler-32"
    - "Kepler-36"
    - "Kepler-46"
    - "Kepler-49"
    - "Kepler-51"
    - "Kepler-56"
    - "Kepler-57"
    - "Kepler-60"
    - "Kepler-79"
    - "Kepler-80"
    - "Kepler-87"
    - "Kepler-88"
    - "Kepler-117"
    - "Kepler-138"
    - "Kepler-223"
    - "Kepler-289"
    - "Kepler-411"
    - "Kepler-419"
    - "Kepler-450"
    - "Kepler-1705"
    - "KOI-142"
    - "KOI-984"
  toi_candidate_dispositions: ["PC", "CP", "KP"]
  koi_candidate_dispositions: ["CONFIRMED", "CANDIDATE"]
  # Nodal-precession cases named in the brief; they are caught by `grazing` or
  # the duration test, listed here so a reader can check they were.
  precession_reference_cases: ["KOI-120", "Kepler-13", "Kepler-47"]

# ---------------------------------------------------------------------------
# STAGE 3 — IS THE TRANSIT ON THE TARGET? (src/seti/growth/centroid.py)
#
# WHY.  Stage 2 measured K00897.01's TESS-era depth from the light curve at
# 30,614 +/- 1,195 ppm against a Kepler-era 13,884 ppm in the same band — 2.2x
# deeper.  DILUTION CANNOT DO THAT: extra light in the aperture makes a transit
# SHALLOWER, and TESS's ~21" pixels admit more light than Kepler's ~4" ones, so
# on the same star TESS must read shallower.  The reading that CAN produce it is
# that the two apertures are not measuring the same source.  Stage 1 counted 7
# Gaia sources within 21" of this target and the out-of-transit scatter is
# 56,698 ppm (5.7 %), nearly twice the depth; stage 2 lists
# per_pixel_centroid_test in checks_not_performed.  This is that test.
#
# TWO MEASUREMENTS, NOT AN ASSERTION:
#   census    every Gaia DR3 source in the aperture, its flux fraction, and THE
#             DEPTH IT WOULD NEED in its own light to make the observed aperture
#             depth (depth / flux_fraction).  Above 100 % that is impossible and
#             the neighbour is excluded by arithmetic alone — no pixel needed.
#   difference  mean in-transit minus mean out-of-transit image per sector; the
#             transit source is where the difference peaks.  The offset between
#             the difference-image centroid and the out-of-transit centroid,
#             per sector AND combined, with an uncertainty.
#
# VERDICTS: TRANSIT_ON_TARGET / TRANSIT_OFFSET_FROM_TARGET / OFFSET_UNRESOLVED /
# NO_DATA_REACHED.  An offset that cannot be distinguished from zero PRECISELY
# ENOUGH is OFFSET_UNRESOLVED — never TRANSIT_ON_TARGET.
centroid:
  # Empty: inherit stage 2's shortlist (the target whose depth was measured is
  # the target whose transit gets located).  Entries here win.
  shortlist: []
  inherit_stage2_shortlist: true

  census:
    radius_arcsec: 21.0            # one TESS pixel
    aperture_radius_arcsec: 21.0   # the erfc capture model (same as `aperture` above)
    psf_sigma_arcsec: 10.5
    target_match_arcsec: 1.5       # the Gaia source that IS the target
    # A star cannot fade by more than all of its light.  A neighbour whose
    # required depth exceeds this fraction is excluded BY ARITHMETIC, and the
    # census reports the number that excluded it rather than a verdict word.
    max_depth_fraction: 1.0
    # The same ceilings as gaia.cone_budget_s above, for the same reason: a
    # cone that does not answer is QUERY_FAILED, never "no neighbours".
    tap_url: "https://gea.esac.esa.int/tap-server/tap"
    cone_timeout_s: 120.0
    cone_retries: 2
    cone_budget_s: 600.0

  difference:
    in_transit_fraction: 0.7       # the in-transit image is the flat bottom, 0.7 * T14
    oot_inner_durations: 0.75      # the out-of-transit image starts beyond 0.75 T14 ...
    oot_outer_durations: 2.5       # ... and ends at 2.5 T14, so it is LOCAL to the transit
    min_in_cadences: 3
    min_oot_cadences: 6
    moment_threshold: 0.2          # pixels above 0.2 * peak enter the first moment
    min_pixels: 3
    subtract_background: true
    err_method: "auto"             # auto | bootstrap | analytic (over CADENCES)
    bootstrap_draws: 400
    min_cadences_for_bootstrap: 8
    # `verify` — ASSERTED FLOOR, not a measurement.  A thresholded first moment
    # on 21" pixels cannot be trusted below ~1": the PRF is undersampled and
    # position-dependent, and the direct image's faint wings move its centroid
    # by a fraction of a pixel that the difference image does not share.
    # MEASURED on the synthetic gate: an on-target injection gives a 0.12"
    # offset with a 0.05" cadence-bootstrap error — 2.6 sigma of nothing.  The
    # floor is added in quadrature per sector AND to the combined error,
    # because stacking sectors averages down what is random, not what they
    # share.  Set 0 to see the bare statistical error.
    centroid_sys_floor_arcsec: 1.0
    n_offset: 3.0                  # |offset| / sigma at or above this is an OFFSET
    # TRANSIT_ON_TARGET also requires the measurement to have been able to SEE
    # the offset that matters: n_offset * sigma must be no larger than the
    # separation of the nearest neighbour the census could not exclude, or this
    # value when the census named none.  Otherwise: OFFSET_UNRESOLVED.
    on_target_max_offset_arcsec: 21.0
    sector_scatter_chi2_per_dof: 3.0
    seed: 7

  tpf:
    # SPOC 2-minute target pixel files where they exist, TESS-SPOC FFI cutouts
    # otherwise.  QLP publishes no pixel product, so it is absent on purpose.
    authors: ["SPOC", "TESS-SPOC"]
    sectors: []                    # empty: whatever the archive has, capped below
    # TARGET PIXEL FILES ARE LARGE (tens of MB per sector).  The cap and the
    # budget are the gaia.cone_budget_s discipline: run 34789826297 sat three
    # hours in an unbounded fetch and would have been killed at the workflow's
    # cap with nothing committed.  What the budget does not reach is
    # NO_DATA_REACHED with reason BUDGET_EXHAUSTED — never an offset, and never
    # an on-target verdict.
    max_sectors: 8
    per_target_budget_s: 1800.0
    budget_s: 5400.0
    target_timeout_s: 900.0
    retries: 2
    retry_pause_s: 5.0
    download_dir: null
    archive_timeout_s: 300.0
    archive_retries: 3

# ---------------------------------------------------------------------------
# STAGE "DIRECT" — the TESS depth of EVERY Kepler planet, from the light curves
# (src/seti/growth/direct.py, workflow growth_direct.yml, docs/growth.md §11)
#
# WHY.  Stage 1 reached 108 of 9,564 KOIs because it joined Kepler to TESS
# through the TOI ALERT catalogue: 3,055 KOIs resolve a TIC id but only 94 of
# their 1,975 stars ever had a TOI.  This stage skips the TOI table entirely:
# for every confirmed/candidate KOI with a TIC id it fetches every TESS light
# curve MAST serves (SPOC 2-min, TESS-SPOC and QLP FFI), folds on the KOI
# ephemeris propagated to the TESS epoch (searching a small window in phase
# for the transit), fits the depth with the STAGE-2 FITTER on BOTH the raw
# SAP and the corrected PDCSAP family, profiles the duration, and compares
# with the KOI depth carried into the TESS band — with the spread over
# pipeline authors within each family entering the error as a systematic.
#
# THE KEPLER-718 b RULE.  A bigger aperture admits MORE contaminating light,
# so the raw TESS SAP depth must read SHALLOWER than Kepler, never deeper.  A
# PDCSAP-only change with PDC deeper than SAP is `crowding_correction`, not
# growth.  A candidate must change at n_candidate sigma on the TOTAL error in
# BOTH families, in the same direction, at fixed impact parameter, with no
# odd-even signature, the transit recovered, and no KOI flag; every survivor
# goes to stage 2 and stage 3 through the `vet` stage.
direct:
  targets:
    dispositions: ["CONFIRMED", "CANDIDATE"]
    pos_radius_arcsec: 2.0
    long_period_min_days: 30.0
    archive_timeout_s: 600.0
    archive_retries: 3
    # KOIs the ps routes cannot give a TIC stay in the list; the shard tries
    # the TIC's own KIC cross-id (fetch.tic_fallback) before giving up.
    include_unresolved: true
  fetch:
    authors: ["SPOC", "TESS-SPOC", "QLP"]
    # One download per PRODUCT, every flux column read from it: the SAP and
    # PDCSAP families cost one fetch, not two.  Products per star are capped;
    # 20-second products are skipped (several times the size, same transits).
    max_products: 45
    min_exptime_s: 60.0
    quality_bitmask: "default"
    # WALL-CLOCK CEILINGS (the gaia.cone_budget_s discipline).  A star the
    # per-target budget cuts off is not_measured BUDGET_EXHAUSTED; a target the
    # shard budget never reaches is absent from the shard file and the
    # aggregate marks it NOT_REACHED.  Neither is ever `consistent`.  The shard
    # budget sits inside the job's timeout-minutes with room for the commit.
    per_target_budget_s: 420.0
    shard_budget_s: 16200.0
    retries: 2
    retry_pause_s: 5.0
    download_dir: null
    clean_downloads: true
    tic_fallback: true
    tic_radius_arcsec: 6.0
    tic_mag_tolerance: 1.5
  epoch_search:
    # half-width = n_sigma * sigma_T0(propagated) + min_halfwidth_durations * T14,
    # capped; the transit is RECOVERED when the best-offset depth has S/N >=
    # min_snr, else the target is transit_not_recovered (never consistent).
    n_sigma: 3.0
    min_halfwidth_durations: 0.25
    max_halfwidth_days: 0.6
    max_halfwidth_periods: 0.3
    coarse_step_durations: 0.25
    fine_step_durations: 0.0833
    max_trials: 161
    min_snr: 3.0
    flag_offset_sigma: 5.0
    # THE LOOK-ELSEWHERE NULL.  The search above takes the MAXIMUM fitted S/N
    # over up to max_trials offsets and the depth is then fitted at the winner.
    # A maximum over trials is biased upward and the bias grows as the signal
    # weakens — precisely the regime that would manufacture a spuriously DEEPER
    # TESS depth — and nothing in the depth's formal error knows about it.  The
    # `control` stage repeats the identical search at these phases of the
    # period, where the planet is not, so every planet that changed carries the
    # depth its own star's noise yields under the same maximisation.  0 and 0.5
    # are excluded: the transit and the secondary eclipse live there.
    control_phases: [0.17, 0.27, 0.37, 0.63, 0.73, 0.83]
  duration:
    # The duration profile on the detrended fold: wider baseline window than
    # the depth fitter's, so a duration that GREW is not masked into the
    # baseline; a trapezoid of the KOI's own ingress fraction, integrated over
    # each point's exposure; T14 from the chi-square minimum, its error from
    # delta chi2 = 1 on the reduced-chi-square-scaled profile.
    window_durations: 2.5
    guard_durations: 1.25
    factor_min: 0.4
    factor_max: 2.5
    n_factors: 61
    oversample: 9
    default_ingress_fraction: 0.15
    sigma_dur_sys: 0.05
    n_duration: 3.0
  classify:
    n_candidate: 5.0
    n_background: 3.0
    # `verify` — the same stated floor stage 1 and stage 2 use.  On this sample
    # it is no longer the only term: the population's own robust z-scatter is
    # measured per family and, when above one, divides every z before the gate
    # (scale_by_population_scatter), which is the honesty check stage 1 failed
    # (31 of 108 above 5 sigma) turned into a correction.
    sigma_sys_ln: 0.05
    min_expected_snr: 3.0
    min_measured_snr_for_ln: 2.0
    apply_band_ratio: true
    subtract_population_median: true
    scale_by_population_scatter: true
    min_population_for_offset: 20
    odd_even_sigma: 3.0
    dispositions: ["CONFIRMED", "CANDIDATE"]
    # Stage 2 + stage 3 per candidate cost up to ~4 fetch budgets each; the
    # vet job takes the strongest this many and lists the rest as not vetted.
    vet_max_targets: 12
