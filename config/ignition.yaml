# IGNITION --- an infrared excess being born on an old star (docs/ignition.md, S61).
#
# The observable is a MONOTONIC W1/W2 rise sustained for >= 5 yr on a
# Gaia-astrometric, kinematically old field star that was photospheric in
# AllWISE 2010, with a flat optical light curve.  Natural born excesses rise in
# < 1 yr and decay; obscured-AGN turn-ons have no parallax.  Every threshold
# below exists to separate those time signatures, and every one is read by the
# offline suite (tests/test_ignition.py).

sample:
  mode: fields                # fields | allsky (allsky needs the upload route; see probe.json)
  g_max: 14.5
  parallax_min_mas: 3.0       # d < 333 pc
  parallax_over_error_min: 10.0
  abs_b_min_deg: 15.0
  ruwe_max: 1.4
  bp_rp_min: 0.6              # F5 ...
  bp_rp_max: 2.5              # ... M4 dwarfs
  # Absolute-magnitude dwarf cut: M_G > intercept + slope * (bp_rp - colour0),
  # M_G = G + 5 log10(plx) - 10.  Sits ~1.5-3 mag above the main sequence:
  # removes giants and subgiants, keeps equal-mass binaries.
  dwarf_cut: {intercept: 2.0, slope: 3.3, colour0: 0.6}
  w1w2_max: 0.15              # photospheric in 2010 (AllWISE)
  w1w2_min: -0.10             # a negative W1-W2 is a blend (channel-brief §4)
  v_tan_old_kms: 25.0         # kinematic-age proxy: a FLAG, not a cut
  cap_per_shard: 20000        # rows per shard; the pilot's honest denominator
  parallax_shell_edges_mas: [3.0, 4.0, 5.0, 7.0, 10.0, 15.0, 25.0, 50.0, 1000.0]
  count_parent: true          # archive COUNT(*) of the full selection = the denominator
  # AllWISE mirror column names; the probe stage re-resolves them (ext_flag vs ext_flg).
  allwise_columns: {designation: designation, ext_flag: ext_flag, ph_qual: ph_qual,
                    cc_flags: cc_flags, var_flag: var_flag}
  # QUERY PLAN.  Run 34787803862 asked for TOP 5 inside a 1-degree cone and was
  # killed by `canceling statement due to statement timeout` four times: five
  # rows is not a volume problem, it is a plan problem.  The flat WHERE over the
  # three-table join let the planner start from the ~750-million-row AllWISE
  # mirror; the cone now goes in an inner sub-select on gaia_source ALONE and
  # AllWISE is joined to that small result.  "auto" tries the shapes in order
  # (inner_cone, inner_cone_postfilter, flat) and keeps the one that answered;
  # probe.json's gaia_shape_working seeds the sample stage.  The science cuts are
  # identical in all three (src/seti/ignition/sample.py: gaia_predicates,
  # allwise_predicates) --- only where they are written changes.
  #
  # A FOURTH shape, `gaia_only`, exists and is deliberately NOT one of those
  # three: it selects from gaiadr3.gaia_source ALONE, with every Gaia cut and no
  # AllWISE table anywhere in the statement.  probe.json on main (97c3f99) has
  # ALL THREE joined shapes TIMED_OUT at 420-480 s, and the one thing they have
  # in common is gaiadr1.allwise_original_valid reached through
  # gaiadr3.allwise_best_neighbour -- so no rearrangement of the same join can
  # help and the only shape that can is the one that never touches it.  It is
  # not a parent sample by itself (no W1/W2), so it is used only by the IRSA
  # route below, which supplies the other half.
  query_shape: auto
  inner_top_multiplier: 200   # inner TOP = cap x this (capped below); never on COUNT(*)
  inner_top_max: 2000000
  query_timeout_s: 1200.0     # per attempt; bulk queries run async-only

  # THE SECOND ROUTE to the same parent sample (src/seti/ignition/irsa_route.py).
  # The Gaia half stays at ESA under the `gaia_only` shape -- an indexed cone on
  # gaia_source alone, with every Gaia cut still in SQL -- and the AllWISE half
  # comes from IRSA's own TAP service (https://irsa.ipac.caltech.edu/TAP), the
  # archive AllWISE actually lives in and the one this channel already uses for
  # NEOWISE.  So the only thing this route gives up relative to ESA is the
  # in-archive allwise_best_neighbour cross-match, which it replaces with the
  # same PM-propagated 2016.0 -> 2010.5 positional match the VizieR route uses
  # (seti.ignition.vizier_route.match_allwise, reused, not re-written).
  #
  # EVERY table and column name below is ASSERTED AND UNVERIFIED (verify): there
  # is no network in the sandbox, so verify_service() asks IRSA's own
  # TAP_SCHEMA.tables / TAP_SCHEMA.columns at runtime -- before a single science
  # row is fetched -- and writes the answer to probe.json.  A wrong table is
  # CATALOGUE_NOT_FOUND with the table names the service DID return; an
  # unresolvable column list is COLUMNS_UNRESOLVED with the service's own text.
  # A TAP_SCHEMA that does not answer is QUERY_FAILED and is NEVER collapsed
  # into CATALOGUE_NOT_FOUND: a service that did not answer has told you nothing
  # about the sky.
  irsa:
    enabled: true
    allwise_table: allwise_p3as_psd     # verify: the AllWISE Source Catalogue at IRSA
    table_candidates:                   # verify: other spellings seen for the same catalogue
      - allwise_p3as_psd
      - allwise.allwise_p3as_psd
      - wise_allwise_p3as_psd
      - allwise_p3as_psd_v1
    cone_pad_arcmin: 1.0        # the AllWISE cone is the Gaia cone plus this
    match_radius_arcsec: 3.0    # Gaia (2016.0 -> 2010.5, PM-propagated) x AllWISE
    max_rows: 400000            # TOP per cone; a cone at the cap is reported `capped`
    count_cone: true            # COUNT(*) alongside it, so truncation is MEASURED
    timeout_s: 900.0
    allow_sync: true            # IRSA has no 150-job sync ceiling of ESA's kind
    w1_max: null                # optional server-side W1 bound; null = unfiltered cone
    # verify: IRSA's column names; first spelling that is present wins, and a
    # missing one is recorded (a cut that cannot be applied is named, not skipped).
    # NOTE the colour/flag cuts are NOT sent in the cone's WHERE: filtering the
    # AllWISE side BEFORE the positional match would let a star whose true
    # counterpart was cut match a different source inside 3", and would make
    # allwise_n_neighbours count only the survivors of a cut.  The archive joins
    # first and filters second; so does this route.
    columns:
      allwise_designation: [designation, allwise, source_name]
      ra: [ra, ra_pm, raj2000]
      dec: [dec, dec_pm, dej2000]
      w1mpro: [w1mpro]
      w1mpro_error: [w1sigmpro]
      w2mpro: [w2mpro]
      w2mpro_error: [w2sigmpro]
      w3mpro: [w3mpro]
      w3mpro_error: [w3sigmpro]
      cc_flags: [cc_flags, ccf]
      ph_qual: [ph_qual, qph]
      ext_flag: [ext_flg, ext_flag, ex]

  # THE THIRD ROUTE to the same parent sample (src/seti/ignition/vizier_route.py).
  # results/ignition/probe.json (2026-09-14T00:22Z) records NO_DATA_REACHED with
  # ALL THREE query shapes TIMED_OUT (480/480/420 s) and the run before it
  # recording `Error 500 ... canceling statement due to statement timeout` and
  # `Error 503 ... maximum number of synchronous queued jobs (150) reached`: the
  # block is at the ESA archive itself, so no shape and no queue can get past it.
  # VizieR's NON-TAP ASU interface (viz-bin/asu-tsv) served ULINE's IRC+10216
  # table the same night while TAPVizieR itself was answering 503, so it is the
  # transport that demonstrably works.  ESA STAYS FIRST (it is authoritative and
  # owns the in-archive allwise_best_neighbour cross-match) and the IRSA route
  # second (it keeps ESA's own Gaia cuts in SQL); this runs only for a unit
  # neither answered, and a sample drawn from more than one route is DEGRADED.
  #
  # EVERY id, column name and parameter spelling below is ASSERTED AND
  # UNVERIFIED (verify): no network in the sandbox, so the probe stage checks
  # them live and writes the answer to probe.json.  A wrong id comes back as
  # CATALOGUE_NOT_FOUND / COLUMNS_UNRESOLVED with the URL and VizieR's own error
  # text -- a recorded status, never a crash and never a fabricated row.
  vizier:
    enabled: true
    gaia_catalogue: I/355/gaiadr3        # verify: VizieR's Gaia DR3 mirror
    gaia_params_catalogue: I/355/paramp  # verify: the astrophysical-parameters companion
    allwise_catalogue: II/328/allwise    # verify: VizieR's AllWISE mirror
    out_max: 150000             # ASU row cap; a chunk that hits it is reported `capped`
    allwise_out_max: 150000
    out_add: []                 # verify: extra computed columns, e.g. ["_r"]
    server_side_constraints: true   # ASU column constraints; select_parent re-applies all
    cone_pad_arcmin: 1.0        # the AllWISE cone is the Gaia cone plus this
    match_radius_arcsec: 3.0    # Gaia (2016.0 -> 2010.5, PM-propagated) x AllWISE
    timeout_s: 300.0
    bases: []                   # empty -> seti.metronome.acquire.VIZIER_ASU_MIRRORS
    # verify: the mirrors' column names; first spelling that is present wins, and
    # a missing one is recorded (a cut that cannot be applied is named, not skipped).
    gaia_columns:
      source_id: [Source, DR3Name, GaiaDR3]
      ra: [RA_ICRS, RAJ2000, _RAJ2000]
      dec: [DE_ICRS, DEJ2000, _DEJ2000]
      parallax: [Plx]
      parallax_over_error: [RPlx]
      pmra: [pmRA]
      pmdec: [pmDE]
      ruwe: [RUWE]
      phot_g_mean_mag: [Gmag]
      bp_rp: [BP-RP, BPRP]
      phot_variable_flag: [VarFlag, Var]
      non_single_star: [NSS]
      teff_gspphot: [Teff]
      random_index: [RandomI, Rand]
    allwise_columns:
      allwise_designation: [AllWISE, AllWISEid, designation]
      ra: [RAJ2000, RA_ICRS, _RAJ2000]
      dec: [DEJ2000, DE_ICRS, _DEJ2000]
      w1mpro: [W1mag, w1mpro]
      w1mpro_error: [e_W1mag, w1sigmpro]
      w2mpro: [W2mag, w2mpro]
      w2mpro_error: [e_W2mag, w2sigmpro]
      w3mpro: [W3mag, w3mpro]
      w3mpro_error: [e_W3mag, w3sigmpro]
      cc_flags: [ccf, cc_flags]
      ph_qual: [qph, ph_qual]
      ext_flag: [ex, ext_flg, ext_flag]
    # Which Gaia cut is sent to the server as an ASU constraint.  Each is an
    # OPTIMISATION only: select_parent re-applies every one of them locally, so a
    # wrong spelling costs rows, never a silently different selection.
    constraint_columns:
      phot_g_mean_mag: Gmag
      parallax: Plx
      parallax_over_error: RPlx
      ruwe: RUWE
      bp_rp: BP-RP

  # Fields for mode=fields: high ecliptic latitude (NEOWISE visits pile up
  # toward the ecliptic poles, so the per-star epoch count is highest) AND
  # |b| > 15 (cirrus and crowding suppressed at selection).  The north-ecliptic
  # set is VIGIL's (matched 186/187 stars with one field query each); the
  # south-ecliptic set doubles the sky.  1-degree radii: ~4x VIGIL's area per
  # query at a W1 < 13 row cut.
  fields:
    - {ra: 266.0, dec: 65.0, radius_deg: 1.0}
    - {ra: 270.0, dec: 66.5, radius_deg: 1.0}
    - {ra: 262.0, dec: 63.5, radius_deg: 1.0}
    - {ra: 274.0, dec: 64.0, radius_deg: 1.0}
    - {ra: 258.0, dec: 67.0, radius_deg: 1.0}
    - {ra: 280.0, dec: 65.5, radius_deg: 1.0}
    - {ra: 253.0, dec: 65.0, radius_deg: 1.0}
    - {ra: 286.0, dec: 63.0, radius_deg: 1.0}
    - {ra: 250.0, dec: 61.0, radius_deg: 1.0}
    - {ra: 290.0, dec: 67.5, radius_deg: 1.0}
    - {ra: 278.0, dec: 69.5, radius_deg: 1.0}
    - {ra: 262.0, dec: 69.0, radius_deg: 1.0}
    - {ra: 90.0, dec: -66.5, radius_deg: 1.0}
    - {ra: 86.0, dec: -64.0, radius_deg: 1.0}
    - {ra: 94.0, dec: -64.5, radius_deg: 1.0}
    - {ra: 82.0, dec: -67.0, radius_deg: 1.0}
    - {ra: 98.0, dec: -67.5, radius_deg: 1.0}
    - {ra: 90.0, dec: -70.0, radius_deg: 1.0}
    - {ra: 78.0, dec: -63.5, radius_deg: 1.0}
    - {ra: 102.0, dec: -65.0, radius_deg: 1.0}

probe:
  # The probe spent 1,490 s of run 34787803862 on four retries of a query that
  # could not succeed.  A broken plan now costs minutes: each candidate shape
  # gets budget_s, after which it is recorded TIMED_OUT with its elapsed seconds
  # and the probe moves to the next shape.
  budget_s: 480.0             # per candidate query shape (~8 min)
  total_budget_s: 2400.0      # the whole probe stage (3 joined shapes + 2 fallback routes)
  columns_timeout_s: 120.0    # the AllWISE column peek
  neowise_timeout_s: 300.0    # each NEOWISE route test
  cap: 5                      # TOP n for the join test
  # gaia_only is listed for the record; the probe's shape ladder runs only the
  # three JOINED shapes (a shape with no W1/W2 cannot be `gaia_shape_working`),
  # and gaia_only is probed inside the IRSA route, with its AllWISE partner.
  shapes: [inner_cone, inner_cone_postfilter, flat, gaia_only]
  irsa_timeout_s: 600.0       # the SECOND parent route (gaia_only x IRSA), probed every run
  vizier_timeout_s: 300.0     # the THIRD parent route (VizieR ASU), probed every run

acquire:
  # WHAT RUN 35039105536 TAUGHT (2026-09-16, results/ignition/acquire_s*.json).
  # The field route at 1 degree near the ecliptic poles is 2.4-4.7 M single
  # exposures a cone (every source there has ~4,000 epochs): 1.5 GB VOTables,
  # IncompleteRead / RemoteDisconnected / 502 on the transfer, 20-65 min per
  # query that did complete, TOP-4M truncation, and two shards killed at the
  # job limit with no checkpoint.  314 of 336 attempted stars were lost.  The
  # upload join was refused with `QUERY must be set` -- pyvo's multipart form
  # on the async queue, a TRANSPORT failure -- so it is now a ladder
  # (src/seti/ignition/acquire.py UPLOAD_TRANSPORTS: pyvo_sync, http_sync,
  # http_async, gator) that the probe walks on two stars and records.  The
  # per-star cone (4,110 rows in 15.6 s on the probe star) is the fallback,
  # per chunk and per shard, and runs `cone_workers` at a time.  `field` is
  # only ever used when asked for explicitly.
  route: auto                 # auto (from probe.json: upload if a rung answered, else cone) | upload | field | cone
  cone_radius_arcsec: 2.5
  match_tol_arcsec: 2.5       # local row -> star assignment radius, widened by half the PM sweep
  field_w1_max: 13.0          # G < 14.5 FGKM dwarfs sit at W1 < ~13; bounds the row count
  field_max_rows: 4000000
  upload_chunk: 200           # stars per upload query, the CEILING ...
  upload_target_rows: 300000  # ... shrunk so a query returns about this many rows (NEP: ~60 stars)
  upload_max_rows: 3000000    # TOP on the join; a chunk that hits it is halved and re-asked
  upload_transport: auto      # auto (from probe.json) | pyvo_sync | http_sync | http_async | gator
  upload_timeout_s: 900.0     # per upload query (the async rung polls up to this)
  upload_fallback_cone: true  # a chunk no rung answered goes to per-star cones, never lost
  cone_workers: 3             # concurrent per-star cones
  checkpoint_every: 50        # cone route: stars per CSV append
  epoch_gap_days: 90.0        # > 90 d gap starts a new epoch (visits are ~183 d apart)
  min_exp_per_epoch: 5
  epoch_err_floor_mag: 0.005
  clip_sigma: 5.0             # MAD clip of single bad frames inside an epoch
  qual_frame_min: 1
  cc_flags_ok: ["0000"]
  ph_qual_ok: ["A", "B"]
  time_budget_s: 18000.0      # per shard; the workflow's timeout is longer

# ALL-SKY TILING (mode=tiles; src/seti/ignition/tiles.py).  Boxes of
# dec_step_deg on a side, ~equal in area, each queried as the smallest cone
# that covers it and cut to the box, so every star is owned by exactly one
# tile and a partial sweep is exact over the tiles that finished.  Tiles wholly
# inside |b| < abs_b_min_deg are never queried.  The sweep order is a fixed
# permutation, so a time-limited dispatch samples the sky uniformly.
tiles:
  dec_step_deg: 4.0           # ~2,600 boxes over the sky, ~1,900 at |b| > 15
  cover_pad_deg: 0.02
  seed: 20260921

# The tiles-mode shard stage (`--stage sweep`): sample + acquire per tile under
# one wall clock, tile-level checkpoints, resume from the shard's own artifact.
sweep:
  time_budget_s: 9000.0       # stop STARTING tiles after this (2.5 h); the job timeout is longer
  sample_timeout_s: 300.0     # one tile's parent query, PER ATTEMPT
  # And what one tile may cost across the WHOLE route ladder.  Run 35653615329's
  # fields-mode sample step spent 2 h 22 min on 20 cones without finishing, and
  # the acquire matrix never started; in the all-sky sweep the same stall is
  # paid for in tiles never reached.  A tile that spends this is recorded
  # QUERY_FAILED with the routes that were SKIPPED_ON_UNIT_BUDGET named, and the
  # sweep moves on.  The ladder's ORDER is untouched -- ESA is still asked first
  # and still answers first -- and every science cut is unchanged: this bounds
  # only how long one tile may be chased.
  sample_unit_budget_s: 600.0
  max_tiles: 0                # 0 = every tile of the shard

# The screen's ensemble zero-point correction (src/seti/ignition/ensemble.py).
# Run 35039105536 labelled 97 of 172 stars FADING at 5 sigma in both bands: a
# common drift is the survey's zero point, not the stars.  Per band and 0.25-yr
# bin, the median of (mag - star median) over the shard's stars is subtracted
# when the bin holds >= ensemble_min_stars; the offsets and the per-star RAW
# slope significance are recorded, so the correction is auditable.  No rise
# threshold changes.
screen:
  ensemble_correct: true
  ensemble_bin_yr: 0.25
  ensemble_min_stars: 8

rise:
  min_epochs: 10
  min_baseline_yr: 5.0
  slope_sigma_min: 5.0        # weighted slope significance, error inflated by sqrt(chi2_red)
  rise_sigma_min: 3.0         # first-minus-last epoch, scan-cleaned
  tau_p_max: 1.0e-3           # Kendall tau
  mono_frac_min: 0.6          # fraction of consecutive epochs that brighten (scan-cleaned)
  dbic_min: 6.0               # BIC(step+decay) - BIC(ramp) must exceed this
  scan_amp_frac_max: 0.3333   # scan-direction sinusoid amplitude < a third of the rise
  scan_period_days: [345.0, 385.0]
  scan_period_step_days: 5.0
  decay_tau_grid_yr: [0.3, 0.5, 1.0, 1.5, 2.0, 3.0, 5.0]      # the impact model
  growth_tau_grid_yr: [1.0, 1.5, 2.0, 3.0, 5.0, 8.0, 12.0, 20.0]  # the exponential ramp
  err_floor_mag: 0.005

vet:
  parallax_over_error_min: 10.0
  pm_sig_min: 5.0
  galactic_latitude_min_deg: 15.0
  w1_saturation_mag: 8.0
  w2_saturation_mag: 7.0
  frac_nb_gt1_max: 0.2
  frac_na_gt0_max: 0.2
  ph_qual_cut_frac_max: 0.5
  agn_w1w2_min: 0.8
  w1w2_2010_max: 0.15
  optical_slope_sigma_max: 3.0
  optical_rms_max: 0.05
  optical_min_points: 20
  # Known star-forming regions / young associations (generous boxes, degrees).
  star_forming_boxes:
    - {name: Taurus, ra: [60.0, 75.0], dec: [15.0, 32.0]}
    - {name: Orion, ra: [78.0, 92.0], dec: [-12.0, 12.0]}
    - {name: Perseus, ra: [50.0, 58.0], dec: [29.0, 34.0]}
    - {name: Ophiuchus, ra: [243.0, 250.0], dec: [-27.0, -21.0]}
    - {name: UpperSco, ra: [235.0, 250.0], dec: [-30.0, -15.0]}
    - {name: Lupus, ra: [232.0, 246.0], dec: [-43.0, -33.0]}
    - {name: Chamaeleon, ra: [160.0, 172.0], dec: [-80.0, -74.0]}
    - {name: Serpens, ra: [275.0, 280.0], dec: [-3.0, 3.0]}
    - {name: CoronaAustralis, ra: [283.0, 288.0], dec: [-39.0, -35.0]}
    - {name: Cepheus, ra: [310.0, 340.0], dec: [60.0, 72.0]}

sensitivity:
  amps_mag: [0.1, 0.2, 0.4]   # linear ramps over `over_yr`, injected on both bands
  over_yr: 10.0
  max_stars: 200              # per shard
