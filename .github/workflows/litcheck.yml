name: litcheck

# HERDSMAN literature novelty check: fetch verbatim arXiv abstracts, citation
# lists (Semantic Scholar / OpenAlex), and full-text HTML of candidate-overlap
# papers. The sandbox blocks these hosts; the runner has egress (CLAUDE.md
# acquisition pattern). Results are committed back to the branch.

on:
  workflow_dispatch:
    inputs:
      pass:
        description: "Which fetch pass to run (1, 2, or compass)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  litcheck:
    runs-on: ubuntu-latest
    # Both 25-min runs timed out mid-fetch (politeness sleeps + retry backoff)
    # and died before the commit step, losing everything.  Generous job budget
    # plus a soft deadline on the fetch step so partial evidence always lands.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch literature evidence (soft 75-min deadline, partials kept)
        run: |
          if [ "${{ github.event.inputs.pass }}" = "2" ]; then
            timeout -k 30 4500 python scripts/litcheck_fetch2.py \
              || echo "fetcher hit soft deadline or errored; committing partials"
          elif [ "${{ github.event.inputs.pass }}" = "compass" ]; then
            timeout -k 30 4500 python scripts/compasslit_fetch.py \
              || echo "fetcher hit soft deadline or errored; committing partials"
          else
            timeout -k 30 4500 python scripts/litcheck_fetch.py \
              || echo "fetcher hit soft deadline or errored; committing partials"
          fi
          echo "=== summary ==="
          tail -20 results/litcheck/summary*.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/litcheck/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "litcheck: HERDSMAN novelty-check literature evidence (arXiv abstracts + citation lists)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litcheck-outputs
          path: results/litcheck/
          if-no-files-found: warn
