name: tocsin-ztf

# TOCSIN on the LIVE ZTF public alert stream (docs/tocsin-ztf.md), while Rubin
# is dark.
#
#   probe ──▶ targets (cached, dec > -31) ──▶ sweep objects that alerted in the
#   window ──▶ match to nearby stars ──▶ fetch their history + upper limits ──▶
#   quadrant footprint from IRSA (the denominator) ──▶ funnel, both polarities
#   ──▶ fold the ZTF ledger ──▶ commit-back
#
# WHY.  Rubin stopped on the night of 2026-07-14 (docs/rubin-outage.md).  On
# 2026-09-05 the same check measured ZTF LIVE from three independent public
# sources, after this repository had inferred the opposite from two facts about
# brokers.  ZTF is the one public stream shaped like Rubin's: nightly, both
# difference polarities issued as alerts, r <~ 20.5 per 30 s visit, northern
# sky.  The funnel, ledger and target model are the Rubin channel's, untouched.
#
# THE DENOMINATOR is IRSA's public science-quadrant table: every exposure that
# covered each star, with its own 5-sigma limit.  Strictly better than the Rubin
# path's 1-degree detection-footprint proxy, and independent of any broker.
#
# CREDENTIALS: none.  ALeRCE's ZTF REST API and IRSA's TAP are public.
#
# Scheduled runs fire from the DEFAULT BRANCH and commit back to the ref they
# ran on, exactly like tocsin.yml.

on:
  schedule:
    # 15:25 UTC = 11:25 EDT: a Palomar night ends ~13:00 UTC and ALeRCE ingests
    # the stream in near real time; IRSA's exposure table lags more and is what
    # caps the window.  Offset from tocsin (14:10), loom (15:40) and alerts
    # (17:05), and from the hour.
    - cron: "25 15 * * *"
  workflow_dispatch:
    inputs:
      chunks:
        description: >-
          Consecutive windows to walk in one run (each up to max_nights_per_run
          nights).  The first runs BACKFILL from 2026-01-01; raising this walks
          more of it per dispatch.  Stops early at the services' frontier.
        required: false
        default: "2"
      mjd_lo:
        description: "Explicit window start MJD (blank = the watermark)"
        required: false
        default: ""
      mjd_hi:
        description: "Explicit window end MJD (blank = the frontier)"
        required: false
        default: ""
      probe_only:
        description: "Run only the probe (records both services' live shapes)"
        required: false
        default: "false"
      rebuild_targets:
        description: "Force a fresh Gaia pull of the northern nearby-star list"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: tocsin-ztf-ledger
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # STAGE 0 --- the probe, first and always.  Every field name in
      # ztf_live.py is documentation-derived until this has recorded the live
      # response; the record is committed so a change at either service shows
      # up as a diff rather than as a quiet null.
      - name: Probe ALeRCE's ZTF API and IRSA's exposure table
        if: always()
        run: python -m seti.cli tocsin-ztf-probe

      - name: Restore the northern nearby-star target list
        id: targets-cache
        uses: actions/cache@v4
        with:
          path: .cache/tocsin_ztf
          key: tocsin-ztf-targets-${{ hashFiles('config/tocsin.yaml') }}-v1

      - name: Build the Gaia DR3 northern nearby-star target list
        if: github.event.inputs.probe_only != 'true' && (steps.targets-cache.outputs.cache-hit != 'true' || github.event.inputs.rebuild_targets == 'true')
        run: python -m seti.cli tocsin-ztf-targets

      - name: Screen the window(s)
        if: github.event.inputs.probe_only != 'true'
        run: |
          args=""
          if [ -n "${{ github.event.inputs.chunks }}" ]; then
            args="$args --chunks ${{ github.event.inputs.chunks }}"
          else
            args="$args --chunks 2"
          fi
          if [ -n "${{ github.event.inputs.mjd_lo }}" ]; then
            args="$args --mjd-lo ${{ github.event.inputs.mjd_lo }}"
          fi
          if [ -n "${{ github.event.inputs.mjd_hi }}" ]; then
            args="$args --mjd-hi ${{ github.event.inputs.mjd_hi }}"
          fi
          echo "tocsin-ztf-screen$args"
          python -m seti.cli tocsin-ztf-screen $args

      - name: Re-assess the ZTF ledger (offline)
        if: always() && github.event.inputs.probe_only != 'true'
        run: python -m seti.cli tocsin-ztf-assess || echo "assess skipped (no ledger yet)"

      - name: Summarise
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("results/tocsin_ztf/probe.json")
          if p.exists():
              pr = json.loads(p.read_text())
              print("probe:", pr.get("verdict"),
                    "| alerce frontier", pr.get("alerce_ztf", {}).get("frontier_mjd"),
                    "| irsa frontier", pr.get("irsa_exposures", {}).get("frontier_mjd"),
                    "lag", pr.get("irsa_exposures", {}).get("frontier_lag_days"), "d")
          p = pathlib.Path("results/tocsin_ztf/summary.json")
          if not p.exists():
              print("no summary.json --- the screen did not reach the report stage")
              raise SystemExit(0)
          s = json.loads(p.read_text())
          print("verdict:", s.get("verdict"))
          print("window MJD:", s.get("mjd_lo"), "->", s.get("mjd_hi"), "| frontiers:", s.get("frontiers"))
          print("denominator:", s.get("denominator"), "| timings:", s.get("timings_s"))
          for k in sorted(s.get("counts", {})):
              print(f"  {k}: {s['counts'][k]}")
          led = s.get("ledger", {})
          print("cumulative target-nights:", led.get("cumulative_target_visits"))
          print("ensemble rate per target-night:", led.get("ensemble_rate_per_target_visit"))
          print("tiers:", led.get("tier_counts"))
          for n in s.get("notes", [])[:40]:
              print("note:", n)
          PY

      - name: Commit the probe, the ledger and the night's tables
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "tocsin-ztf: nightly ZTF alert screen while Rubin is dark — S30 flash/dip" \
            results/tocsin_ztf/probe.json \
            results/tocsin_ztf/summary.json \
            results/tocsin_ztf/ledger.json \
            results/tocsin_ztf/assessment.json \
            results/tocsin_ztf/watchlist.csv \
            results/tocsin_ztf/events_latest.csv \
            results/tocsin_ztf/rejected_latest.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tocsin-ztf
          path: results/tocsin_ztf/
