name: bafflelit

# BAFFLE prior-art sweep (scripts/bafflelit_fetch.py).
#
# The channel's claim: under the zoo hypothesis a warden civilisation shields
# the solar system's technosignatures from other stars with band-selective
# screens on the Sun->observer lines in the outer solar system; by reciprocity,
# from Earth such a screen makes the target star (and its few-arcminute
# surroundings) appear DEFICIENT in the mid-IR or in deep radio source counts,
# with an annual-parallax signature.  Five novelty questions, each a query group
# with its own decoys: mid-IR DEFICIT stars (vs. the thousands of excess
# searches); observational tests of the zoo / planetarium hypothesis; artificial
# occulters and Planet-Nine-style parallax searches in WISE/Planck/AKARI/IRAS;
# radio voids around stars; directional technosignature concealment.
#
# The sandbox blocks arxiv.org; the runner has egress (CLAUDE.md acquisition
# pattern).  Verbatim atom feeds and abstracts only; every asserted arXiv id is
# title-verified in id_title_check.json; every fetch's HTTP status is in
# summary.json.  Independent of the search so an arXiv outage cannot cost a run,
# and vice versa.  Commit-back through scripts/commit_results.sh, which
# VERIFIES the push.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bafflelit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch prior-art evidence (soft 45-min deadline, partials kept)
        run: |
          timeout -k 30 2700 python scripts/bafflelit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== summary ==="
          python -c "import json;d=json.load(open('results/bafflelit/summary.json'));print(d['n_ok'],'ok /',d['n_urls'],'urls')" || true
          python -c "import json;d=json.load(open('results/bafflelit/id_title_check.json'));print(d['n_id_mismatch'],'id/title mismatches,',d['n_title_search_miss'],'title-search misses')" || true
          python -c "import json;d=json.load(open('results/bafflelit/concept_scan.json'));print(d['n_abstracts_scanned'],'abstracts');print(json.dumps(d['per_group_counts'],indent=2))" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bafflelit
          path: results/bafflelit/
          if-no-files-found: warn
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "bafflelit: BAFFLE prior-art evidence" \
            results/bafflelit
