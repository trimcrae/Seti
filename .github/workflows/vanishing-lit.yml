name: vanishing-lit

# Literature survey acquisition: disappearing / failed supernovae and vanishing
# massive stars. Fetches verbatim arXiv abstracts, full-text HTML and citation
# lists. The sandbox blocks arxiv.org / Semantic Scholar; the runner has egress
# (CLAUDE.md acquisition pattern). Results are committed back to the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vanishing-lit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch literature evidence (soft 45-min deadline, partials kept)
        run: |
          timeout -k 30 2700 python scripts/vanishing_lit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== files ==="
          ls -la results/vanishlit/ || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/vanishlit/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "vanishing-lit: arXiv abstracts + full text for failed-SN / vanishing-star survey"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanishing-lit-outputs
          path: results/vanishlit/
          if-no-files-found: warn
