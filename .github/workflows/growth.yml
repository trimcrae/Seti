name: growth

# GROWTH — the growing transit: construction around a planet (docs/growth.md).
#
#   probe ──▶ acquire (KOI + TOI + ps, join, Gaia neighbours) ──▶ screen ──▶ assess ──▶ commit-back
#
# Signature S57 (docs/necrofrontier.md §2): a shell or swarm being BUILT
# around a transiting planet grows its transit depth achromatically over
# years.  Stage 1 compares every Kepler planet/candidate's KOI depth
# (2009–2013) with its TOI depth (2018–2026) after the limb-darkening band
# ratio, the Gaia-neighbour dilution term and a systematic floor, and flags
# growth at fixed impact parameter (the duration must change as k, not as b).
#
# THE GOVERNING DISCIPLINES (docs/growth.md §5):
#  * the expected sign is a ~12 % TESS depth DEFICIT (Han et al. 2025); the
#    population median is measured on the sample and subtracted, so growth
#    means growth relative to the population's own offset;
#  * a candidate must survive the full dilution ambiguity [0, contam_max];
#  * a Gaia cone that failed leaves its star "not_checked" — never isolated;
#  * NO_DATA_REACHED and NO_DEPTH_DRIFT_CANDIDATE are different statements
#    and neither is written up.
#
# The whole pass is three ~10k-row TAP pulls, one chunked Gaia crossmatch and
# pure arithmetic: one job, no sharding.  Commit-back is through
# scripts/commit_results.sh, which VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, acquire, screen, assess), "probe" (reachability and
          column names only — run this first), or "assess" to re-vet the
          committed screened.csv without touching any archive.
        required: false
        default: "all"
      skip_gaia:
        description: "Skip the Gaia neighbour cones (every star then not_checked) (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The gate covers the injected signal AND the two defects run
      # 34787801172 exposed: the ps.tic_id string parse (the join produced 0 by
      # name) and the Gaia upload -> cone fallback with its recorded error text.
      - name: Offline gate — injected growth must be recovered on this runner
        run: python -m pytest tests/test_growth.py -q -p no:cacheprovider -k "injected or precession or han2025 or no_data or tic_id or empty_kepler_name or fall_back or not_checked or large_joined"
      - name: Probe (reachability, column names)
        if: ${{ github.event.inputs.stage != 'assess' }}
        run: |
          python -m seti.growth.run --stage probe
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/growth/probe.json"))
          for k, v in d["tables"].items():
              print(k, v["status"], v.get("table"), len(v.get("columns") or []), "columns")
          PY
      - name: Acquire (KOI + TOI + ps, join, Gaia neighbours)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == '' }}
        run: |
          SG=""
          if [ "${{ github.event.inputs.skip_gaia || 'false' }}" = "true" ]; then SG="--skip-gaia"; fi
          python -m seti.growth.run --stage acquire $SG
          echo "=== acquire ==="
          python - <<'PY'
          import json
          d = json.load(open("results/growth/acquire.json"))
          print(json.dumps({k: d[k] for k in ("tables", "join", "gaia")}, indent=2)[:12000])
          print("=== join ===");  print(d["join"].get("join_statement", ""))
          # Every Gaia attempt's exception TEXT, not a bare count (the 2026-09-13
          # failure mode): if the upload route was refused, this says so and says
          # whether the per-target cone fallback carried the chunk.
          for e in d["gaia"].get("errors") or []:
              print(f"::warning::gaia {e['stage']} route={e.get('route')} "
                    f"failed={e.get('n_targets_failed')}/{e.get('n_targets')}")
              for a in e.get("attempts") or []:
                  print("   ", a.get("transport") or a.get("key"), a.get("error"))
          PY
          # The join must not silently collapse to one route again.
          python - <<'PY'
          import json, sys
          j = json.load(open("results/growth/acquire.json"))["join"]
          by = j.get("joined_by_route") or {}
          print("::notice::" + j.get("join_statement", ""))
          if j.get("n_ps_tic_id_parsed", 0) == 0 and j.get("n_ps_rows_kepler", 0) > 0:
              print("::error::ps.tic_id parsed 0 of %d rows — the column format changed; "
                    "samples: %r" % (j.get("n_ps_rows_kepler"), j.get("ps_tic_id_samples")))
              sys.exit(1)
          if sum(by.get(r, 0) for r in ("name_planet", "name_host", "position_tic")) == 0:
              print("::error::every TIC route yielded 0 — this is the 2026-09-13 defect again")
              sys.exit(1)
          PY
      - name: Screen (band ratio, dilution, corrected ratio, duration test)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == '' }}
        run: python -m seti.growth.run --stage screen
      - name: Assess (vetoes, population offset, classes, verdict)
        if: ${{ github.event.inputs.stage != 'probe' }}
        run: |
          python -m seti.growth.run --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/growth/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("acquisition_tables", "config")}, indent=2)[:8000])
          PY
      # A verdict must never read as a science null when nothing was measured.
      - name: Assert the verdict is not a disguised no-data run
        if: ${{ github.event.inputs.stage != 'probe' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/growth/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), s.get("n_measured", 0)
          if n == 0 and v != "NO_DATA_REACHED":
              print(f"::error::verdict {v!r} with 0 measured planets is a disguised no-data run"); sys.exit(1)
          if v == "NO_DEPTH_DRIFT_CANDIDATE":
              print(f"::notice::{n} planets measured, no growth candidate. A COUNT, NOT AN OCCURRENCE LIMIT — see docs/growth.md.")
          if v == "DEPTH_DRIFT_CANDIDATES":
              print(f"::notice::{s.get('n_candidates')} GROWTH_CANDIDATE — PENDING the stage-2 light-curve k(t) fit; see results/growth/candidates.csv")
          for d in s.get("degraded") or []:
              print(f"::warning::degraded: {d}")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The push is VERIFIED against the remote (scripts/commit_results.sh);
          # the raw archive pulls under data/ stay in the artifact only.
          scripts/commit_results.sh \
            "growth: Kepler -> TESS transit-depth drift — probe/acquire/screen/assess" \
            results/growth/probe.json \
            results/growth/acquire.json \
            results/growth/acquisition_log.json \
            results/growth/screen.json \
            results/growth/summary.json \
            results/growth/candidates.csv \
            results/growth/joined.csv \
            results/growth/long_period.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-final
          path: results/growth/
          if-no-files-found: warn
