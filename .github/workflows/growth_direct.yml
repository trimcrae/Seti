name: growth-direct

# GROWTH stage "direct" — the TESS-era depth of EVERY confirmed/candidate KOI,
# fitted from the light curves (docs/growth.md §11).
#
#   targets ──▶ measure (N shards, checkpointed, each commits its own file)
#           ──▶ assess (aggregate, population offsets, classify, funnel)
#           ──▶ control (the look-elsewhere null on everything that changed)
#           ──▶ vet (stage 2 + stage 3 on every candidate)
#
# WHY.  Stage 1 reached 108 of 9,564 KOIs through the TOI alert catalogue.  This
# stage skips the TOI table: for every KOI with a TIC id it fetches every TESS
# light-curve product MAST serves (SPOC 2-min, TESS-SPOC and QLP FFI), folds on
# the KOI ephemeris (searching a small window in phase), fits the depth with the
# stage-2 fitter on BOTH raw SAP and corrected PDCSAP, profiles the duration and
# compares with the KOI depth — with the per-planet sensitivity on the record.
#
# THE RULE FROM KEPLER-718 b: raw SAP must read SHALLOWER than Kepler, never
# deeper; a PDCSAP-only change is a crowding-correction case, not growth.
#
# Sharding is BY STAR (kepid mod n_shards), so a multi-planet system's planets
# share one shard and one download.  Every shard checkpoints its CSV after each
# star and commits it `if: always()`, so a killed shard loses one star, and a
# re-dispatch with resume=true skips what is already committed.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (targets, measure, assess, control, vet), "targets", "measure"
          (needs a targets.csv on the branch or targets_run_id), "assess"
          (aggregate the committed shard files), "control" (the look-elsewhere
          null on everything that changed), or "vet".
        required: false
        default: "all"
      n_shards:
        description: "Parallel measure shards (by kepid mod n)"
        required: false
        default: "24"
      shard_budget_min:
        description: "Wall clock per shard inside the job (minutes)"
        required: false
        default: "270"
      resume:
        description: "Skip targets already in the committed shard files"
        required: false
        default: "true"
      targets_run_id:
        description: "Reuse the targets artifact from this prior run id (skips the targets job)"
        required: false
        default: ""
      vet_shards:
        description: >-
          Parallel vet shards (candidates split round-robin by rank). One job
          can only carry classify.vet_max_targets; raise this when the
          candidate list is longer, so stage 3 reaches EVERY survivor.
        required: false
        default: "4"

permissions:
  contents: write
  # download-artifact@v4 with an explicit run-id goes through the Actions API,
  # which needs this even for the run's own artifacts.
  actions: read

concurrency:
  group: growth-direct-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  targets:
    if: ${{ (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'targets' || github.event.inputs.stage == '') && github.event.inputs.targets_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - name: Offline gate — injected depth change recovered on SAP+PDCSAP, PDC-only is crowding, missing LC is not_measured
        run: python -m pytest tests/test_growth_direct.py -q -p no:cacheprovider
      - name: Probe + targets (KOI cumulative + ps TIC routes)
        run: |
          python -m seti.growth.direct --stage probe,targets
          echo "=== targets ==="
          python - <<'PY'
          import json
          d = json.load(open("results/growth/direct/targets.json"))
          print(json.dumps({k: d[k] for k in d if k != "acquisition"}, indent=2)[:6000])
          if d.get("koi_status") != "OK":
              print("::error::the KOI cumulative table was not reached: " + str(d.get("koi_status")))
          if d.get("ps_status") != "OK":
              print("::warning::the ps table was not reached; TIC ids rest on the shard fallback")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: growth-direct-targets
          path: |
            results/growth/direct/targets.csv
            results/growth/direct/targets.json
            results/growth/direct/probe.json
          if-no-files-found: error
      - name: Commit targets
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "growth direct: the target list (every confirmed/candidate KOI with its TIC route)" \
            results/growth/direct/targets.csv \
            results/growth/direct/targets.json \
            results/growth/direct/probe.json \
            results/growth/direct/acquisition_log.json

  plan:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'measure' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 -c "import json; print('shards=' + json.dumps(list(range(int('${{ github.event.inputs.n_shards || '24' }}')))))" >> "$GITHUB_OUTPUT"

  vetplan:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'vet' || github.event.inputs.stage == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 -c "import json; print('shards=' + json.dumps(list(range(int('${{ github.event.inputs.vet_shards || '4' }}')))))" >> "$GITHUB_OUTPUT"

  measure:
    needs: [targets, plan]
    if: ${{ always() && needs.plan.result == 'success' && (needs.targets.result == 'success' || needs.targets.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.targets_run_id != '' || needs.targets.result == 'success' }}
        with:
          name: growth-direct-targets
          run-id: ${{ github.event.inputs.targets_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: results/growth/direct/
      - name: Refresh the committed shard files (resume)
        run: |
          git fetch --quiet origin "${{ github.ref_name }}" || true
          git checkout --quiet "origin/${{ github.ref_name }}" -- results/growth/direct/shards 2>/dev/null || true
          ls results/growth/direct/shards 2>/dev/null | head -50 || true
      - name: Measure shard ${{ matrix.shard }}
        run: |
          RESUME=""
          if [ "${{ github.event.inputs.resume || 'true' }}" != "true" ]; then RESUME="--no-resume"; fi
          python -m seti.growth.direct --stage measure \
            --shard ${{ matrix.shard }} \
            --n-shards ${{ github.event.inputs.n_shards || '24' }} \
            --budget-s $(( ${{ github.event.inputs.shard_budget_min || '270' }} * 60 )) $RESUME
          echo "=== shard ${{ matrix.shard }} ==="
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob("results/growth/direct/shards/shard_*.json")):
              d = json.load(open(p))
              if d.get("shard") != ${{ matrix.shard }}:
                  continue
              print(json.dumps({k: d[k] for k in d if k not in ("acquisition_failures",)}, indent=2)[:5000])
              for f in d.get("acquisition_failures") or []:
                  print(f"::warning::{f.get('stage')}: {f.get('error')}")
              if d.get("budget_exhausted"):
                  print(f"::warning::shard {d['shard']} exhausted its budget: "
                        f"{d.get('n_not_reached_budget')} target(s) NOT reached (re-dispatch with resume)")
          PY
      # ONLY THIS SHARD'S FILES.  The glob used to be shard_*.csv, which also
      # swept up every OTHER shard's file as checked out at job start; assess
      # merges all artifacts with merge-multiple, so a shard that finished
      # early re-delivered stale copies of the shards still running.  Run
      # 35859780689's assess aggregated 4,358 rows and 368 "NOT_REACHED"
      # while the committed shard files held all 4,725 --- a summary that did
      # not describe its own run.
      - name: Shard tag
        id: tag
        if: always()
        run: echo "s=$(printf '%02d' ${{ matrix.shard }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-direct-shard-${{ matrix.shard }}
          path: |
            results/growth/direct/shards/shard_${{ steps.tag.outputs.s }}.csv
            results/growth/direct/shards/shard_${{ steps.tag.outputs.s }}.json
            results/growth/direct/shards/shard_${{ steps.tag.outputs.s }}_members.csv
            results/growth/direct/shards/shard_${{ steps.tag.outputs.s }}_folds/
          if-no-files-found: warn
      - name: Commit this shard's files
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
          RESULTS_PUSH_ATTEMPTS: "12"
        run: |
          S=$(printf "%02d" ${{ matrix.shard }})
          scripts/commit_results.sh \
            "growth direct: shard $S measured (checkpointed per star)" \
            results/growth/direct/shards/shard_${S}.csv \
            results/growth/direct/shards/shard_${S}.json \
            results/growth/direct/shards/shard_${S}_members.csv

  assess:
    needs: [targets, measure]
    if: ${{ always() && github.event.inputs.stage != 'targets' && (needs.targets.result == 'success' || needs.targets.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - name: Refresh the committed shard files
        run: |
          git fetch --quiet origin "${{ github.ref_name }}" || true
          git checkout --quiet "origin/${{ github.ref_name }}" -- results/growth/direct 2>/dev/null || true
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.targets_run_id != '' || needs.targets.result == 'success' }}
        with:
          name: growth-direct-targets
          run-id: ${{ github.event.inputs.targets_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: results/growth/direct/
      - uses: actions/download-artifact@v4
        if: ${{ needs.measure.result != 'skipped' }}
        continue-on-error: true
        with:
          pattern: growth-direct-shard-*
          merge-multiple: true
          path: results/growth/direct/shards/
      - name: Assess (aggregate, population offsets, classify, funnel)
        run: |
          python -m seti.growth.direct --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json, sys
          s = json.load(open("results/growth/direct/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("candidates", "crowding_correction_cases", "transit_not_recovered")}, indent=2)[:12000])
          print("candidates:", json.dumps(s.get("candidates"), indent=1)[:6000])
          f = s.get("funnel") or {}
          if s.get("verdict") == "NO_DATA_REACHED":
              print("::warning::NO_DATA_REACHED — not a null result, not written up (CLAUDE.md)")
          for d in s.get("degraded") or []:
              print(f"::warning::{d}")
          pop = s.get("population") or {}
          for fam, sc in (pop.get("z_robust_scatter") or {}).items():
              if sc and sc > 1.5:
                  print(f"::warning::{fam}: the population's robust z-scatter is {sc:.2f} — the quoted errors "
                        "do not describe the scatter; every z was divided by it before the gate")
          print("::notice::classes " + json.dumps(f.get("classes")))
          print("::notice::" + str(s.get("verdict")) + " — " + str(s.get("reason")))
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
          RESULTS_PUSH_ATTEMPTS: "12"
        run: |
          scripts/commit_results.sh \
            "growth direct: aggregate — every KOI's TESS depth on SAP and PDCSAP against Kepler, classified" \
            results/growth/direct/measurements.csv \
            results/growth/direct/candidates.csv \
            results/growth/direct/long_period.csv \
            results/growth/direct/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-direct-final
          path: results/growth/direct/
          if-no-files-found: warn

  # The look-elsewhere null: the epoch search maximises S/N over up to 161
  # offsets and the depth is fitted at the winner, which is biased upward and
  # is not in the formal error.  Every planet the measurement said CHANGED gets
  # the identical search repeated at phases where the planet is not.
  control:
    needs: [assess]
    if: ${{ always() && (needs.assess.result == 'success' || github.event.inputs.stage == 'control') && github.event.inputs.stage != 'targets' && github.event.inputs.stage != 'measure' && github.event.inputs.stage != 'vet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - name: Refresh the committed aggregate
        run: |
          git fetch --quiet origin "${{ github.ref_name }}" || true
          git checkout --quiet "origin/${{ github.ref_name }}" -- results/growth/direct 2>/dev/null || true
      - name: Control-phase null on every class that changed
        run: |
          python -m seti.growth.direct --stage control \
            --budget-s $(( ${{ github.event.inputs.shard_budget_min || '270' }} * 60 ))
          echo "=== control ==="
          python - <<'PY'
          import json
          c = json.load(open("results/growth/direct/control/summary.json"))
          print(json.dumps(c, indent=2)[:8000])
          if c.get("budget_exhausted"):
              print("::warning::the control stage exhausted its budget; "
                    "targets it did not reach are CONTROL_UNAVAILABLE, never a pass")
          print("::notice::control " + str(c.get("n_above_control")) + " above, "
                + str(c.get("n_within_search_noise")) + " within search noise, "
                + str(c.get("n_control_unavailable")) + " unavailable")
          PY
      - name: Commit control results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
          RESULTS_PUSH_ATTEMPTS: "12"
        run: |
          scripts/commit_results.sh \
            "growth direct: the control-phase null on every planet that changed" \
            results/growth/direct/control/control.csv \
            results/growth/direct/control/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-direct-control
          path: results/growth/direct/control/
          if-no-files-found: warn

  # Stage 2 + stage 3 cost several fetch budgets per target, so one job carries
  # only classify.vet_max_targets.  The candidates are split ROUND-ROBIN BY RANK
  # across vet_shards jobs, so every shard gets a mix of strong and weak ones and
  # the difference image reaches EVERY survivor, not just the top of the list.
  vet:
    needs: [assess, control, vetplan]
    if: ${{ always() && needs.vetplan.result == 'success' && needs.assess.result == 'success' && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'vet' || github.event.inputs.stage == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.vetplan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tess]"
      - name: Refresh the committed aggregate
        run: |
          git fetch --quiet origin "${{ github.ref_name }}" || true
          git checkout --quiet "origin/${{ github.ref_name }}" -- results/growth/direct 2>/dev/null || true
      - name: Vet shard ${{ matrix.shard }} (stage 2 both eras + ensemble; stage 3 census + difference image)
        run: |
          python -m seti.growth.direct --stage vet \
            --shard ${{ matrix.shard }} \
            --n-shards ${{ github.event.inputs.vet_shards || '4' }}
          echo "=== vet shard ${{ matrix.shard }} ==="
          python - <<'PY'
          import json
          v = json.load(open("results/growth/direct/vet/shard_%02d/summary.json"
                             % ${{ matrix.shard }}))
          print(json.dumps(v, indent=2)[:12000])
          if v.get("n_not_vetted_over_cap"):
              print(f"::warning::shard {v.get('shard')} left {v['n_not_vetted_over_cap']} "
                    "candidate(s) unvetted — raise vet_shards and re-dispatch")
          for t in v.get("targets") or []:
              print(f"::notice::{t.get('kepoi_name')}: direct {t.get('direct_class')} | stage2 "
                    f"{t.get('stage2_like_for_like_verdict')} z={t.get('stage2_z_measured_eras')} "
                    f"bg={t.get('stage2_sap_vs_pdcsap_verdict')} | stage3 {t.get('stage3_verdict')} "
                    f"offset={t.get('stage3_offset_arcsec')}\" | control {t.get('control_verdict')}"
                    f" | survives={t.get('survives_vet')}")
          PY
      - name: Commit this vet shard
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
          RESULTS_PUSH_ATTEMPTS: "12"
        run: |
          S=$(printf "%02d" ${{ matrix.shard }})
          scripts/commit_results.sh \
            "growth direct: vet shard $S — stage 2 and stage 3 on its candidates" \
            results/growth/direct/vet/shard_${S}/summary.json \
            results/growth/direct/vet/shard_${S}/vetted.csv \
            results/growth/direct/vet/shard_${S}/stage2/measurements.csv \
            results/growth/direct/vet/shard_${S}/stage2/reductions.csv \
            results/growth/direct/vet/shard_${S}/stage2/summary.json \
            results/growth/direct/vet/shard_${S}/centroid/summary.json \
            results/growth/direct/vet/shard_${S}/centroid/verdicts.csv \
            results/growth/direct/vet/shard_${S}/centroid/census.csv \
            results/growth/direct/vet/shard_${S}/centroid/offsets.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-direct-vet-${{ matrix.shard }}
          path: results/growth/direct/vet/
          if-no-files-found: warn

  vet_gather:
    needs: [vet]
    if: ${{ always() && needs.vet.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Refresh the committed vet shards
        run: |
          git fetch --quiet origin "${{ github.ref_name }}" || true
          git checkout --quiet "origin/${{ github.ref_name }}" -- results/growth/direct 2>/dev/null || true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: growth-direct-vet-*
          merge-multiple: true
          path: results/growth/direct/vet/
      - name: Gather the vet shards
        run: |
          python -m seti.growth.direct --stage vet-gather
          echo "=== vet ==="
          python - <<'PY'
          import json
          v = json.load(open("results/growth/direct/vet/summary.json"))
          print(json.dumps(v, indent=2)[:14000])
          if v.get("n_candidates_not_vetted"):
              print(f"::warning::{v['n_candidates_not_vetted']} candidate(s) had NO stage-3 "
                    "difference image run on them — an open question, not a pass")
          print("::notice::vet " + str(v.get("n_vetted")) + " of "
                + str(v.get("n_candidates")) + " candidates, "
                + str(v.get("n_survive_vet")) + " survive")
          PY
      - name: Commit the merged vet
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
          RESULTS_PUSH_ATTEMPTS: "12"
        run: |
          scripts/commit_results.sh \
            "growth direct: vet — merged across shards" \
            results/growth/direct/vet/summary.json \
            results/growth/direct/vet/vetted.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-direct-vet-merged
          path: results/growth/direct/vet/
          if-no-files-found: warn
