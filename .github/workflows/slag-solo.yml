name: slag-solo

# SLAG-WD in ONE job (docs/slag.md).  Same code, same verdict, one runner slot.
#
# slag.yml splits the channel into prepare -> acquire -> screen (matrix) ->
# assess, which is the right shape when runners are free: six jobs, six
# parallel slots, ~20 minutes end to end.  It is the wrong shape when they are
# not.  With eighteen channels on one account's concurrency the queue has run
# to 146 jobs, and a six-job run has to win a slot SIX times in sequence before
# it commits anything -- a dispatch waited 52 minutes without its first job
# starting.  This workflow wins a slot once.
#
# The cost is wall clock inside the job: the screen stage runs unsharded.  That
# is affordable because the population is small where it is expensive --- 168
# of 3547 panels reach the 5-element floor and carry the calibration, the rest
# are seconds (docs/slag.md §6).
#
# Dispatch this when the queue is deep; dispatch slag.yml when it is not.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: '"all" (probe, acquire, screen, assess) or one of probe / acquire / screen / assess'
        required: false
        default: "all"
      n_cal:
        description: "Injected natural draws per calibrated panel (0 = config, 150)"
        required: false
        default: "0"
      n_cal_meteorite:
        description: "Measured-meteorite draws per panel (-1 = config, 50; 0 = off)"
        required: false
        default: "-1"
      names:
        description: "Comma-separated object names to screen (default: every object)"
        required: false
        default: ""
      max_panels:
        description: "Cap on objects (0 = no cap; use for a quick pass)"
        required: false
        default: "0"

permissions:
  contents: write

# The model matrices are ~30 x 18; threaded BLAS on them is pure overhead and
# measurably slows the process down.  One thread.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  slag:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected refinery vector must be recovered on this runner
        run: python -m pytest tests/test_slag.py -q -p no:cacheprovider -k "injected or end_to_end or dead_archive or designation or meteorite"

      - name: Override the meteorite draw count, if asked
        if: ${{ github.event.inputs.n_cal_meteorite != '-1' }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          n = int(os.environ["NCM"])
          p = pathlib.Path("config/slag.yaml")
          t = p.read_text()
          t2 = re.sub(r"(?m)^(  n_cal_meteorite:).*$", rf"\1 {n}", t)
          p.write_text(t2)
          print("n_cal_meteorite ->", n, "(changed)" if t2 != t else "(pattern not found!)")
          PY
        env:
          NCM: ${{ github.event.inputs.n_cal_meteorite }}

      - name: Probe
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'probe' }}
        run: |
          python -m seti.slag.run --stage probe
          python - <<'PY'
          import json
          d = json.load(open("results/slag/probe.json"))
          p = d["pewdd"]
          print("PEWDD", p["status"], "| tables:", [t["table_name"] for t in p["vizier"]["tables"]])
          m = d.get("measured_meteorites") or {}
          print("measured meteorites:", m.get("attached"), m.get("n_bodies"), "bodies;",
                m.get("n_cells_dropped_out_of_range"), "placeholder cells dropped")
          for k, v in (d.get("pair_envelopes_restricted") or {}).items():
              print(f"  {k:6s} endmembers [{v.get('endmember_lo')}, {v.get('endmember_hi')}]"
                    f" measured n={v.get('measured_n')} -> [{v.get('lo')}, {v.get('hi')}]"
                    f" ({v.get('envelope_source')})")
          PY

      - name: Acquire
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire' }}
        run: |
          python -m seti.slag.run --stage acquire
          python - <<'PY'
          import json
          d = json.load(open("results/slag/acquire.json"))
          p = d["pewdd"]
          print("route", p["route"], "status", p["status"], "rows", p["n_rows"])
          print("meteorite tables:", [(f["path"], f.get("status"), f.get("n_rows"))
                                      for f in (d.get("meteorites") or {}).get("files", [])])
          PY

      - name: Screen (unsharded)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen' }}
        run: |
          NC=""
          if [ "${{ github.event.inputs.n_cal || '0' }}" != "0" ]; then NC="--n-cal ${{ github.event.inputs.n_cal }}"; fi
          NM=""
          if [ -n "${{ github.event.inputs.names }}" ]; then NM="--names ${{ github.event.inputs.names }}"; fi
          MP=""
          if [ "${{ github.event.inputs.max_panels || '0' }}" != "0" ]; then MP="--max-panels ${{ github.event.inputs.max_panels }}"; fi
          python -m seti.slag.run --stage screen --shard 1/1 $NC $NM $MP
          python - <<'PY'
          import json
          d = json.load(open("results/slag/screen_1of1.json"))
          print("screen", d.get("status"), "objects", d.get("n_objects"), "panels",
                d.get("n_panels"), "elapsed", d.get("elapsed_s"), "ts", d.get("timescale_source"))
          print("object grouping:", d.get("object_grouping"))
          PY

      # Intermediate commit: if assess later overruns the job clock, the screen
      # output is already on the branch and stage=assess can finish it.
      - name: Commit the screen output
        if: ${{ success() && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen') }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "slag-solo: screen output" \
            results/slag/probe.json \
            results/slag/acquire.json \
            results/slag/acquisition_log.json \
            results/slag/screen_1of1.json \
            $(ls results/slag/data/*.csv 2>/dev/null)

      - name: Assess
        if: ${{ always() && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'assess') }}
        run: |
          python -m seti.slag.run --stage assess
          python - <<'PY'
          import json
          s = json.load(open("results/slag/summary.json"))
          skip = ("misfit_list_top", "tier2", "thresholds", "shards", "timescale_library",
                  "measured_meteorites")
          print(json.dumps({k: v for k, v in s.items() if k not in skip}, indent=2)[:9000])
          m = s.get("measured_meteorites") or {}
          print("=== measured meteorite suite ===")
          print(" bodies:", m.get("n_bodies"), "| reference:", m.get("reference"),
                "| classes:", m.get("classes"))
          for k, v in (m.get("pairs") or {}).items():
              print(f"  {k:6s} n={v.get('n')} [{v.get('lo')}, {v.get('hi')}]"
                    f" width {v.get('width_dex')} | class widths"
                    f" {v.get('narrowest_class_width_dex')}-{v.get('widest_class_width_dex')}")
          print("=== misfit list (top 25) ===")
          for r in s.get("misfit_list_top", [])[:25]:
              print(f"  {r['name'][:26]:26s} n={r['n_measured']:2d} p={r['p_misfit']:.3f}"
                    f" p_met={r.get('p_misfit_meteorite')} chi2/dof={r['chi2_per_dof']:.2f}"
                    f" {r['phase']:12s} {r['dominant_endmember']:14s}"
                    f" worst={r['worst_element']} {r['max_abs_residual_sigma']:.1f}s"
                    f" {r['misfit_class']}")
          print("=== controls ===")
          for c in json.load(open("results/slag/controls.json"))["controls"]:
              print(json.dumps({k: c.get(k) for k in
                                ("name", "status", "matched_key", "designations", "ra", "dec",
                                 "teff", "atmosphere", "n_sources", "n_measured", "misfit_class",
                                 "p_misfit", "p_misfit_meteorite", "phase", "dominant_endmember",
                                 "max_abs_residual_sigma")})[:900])
          PY

      - name: Assert the verdict is not a disguised no-data run
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/slag/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, f = s.get("verdict", ""), s.get("funnel", {})
          if f.get("panels_total", 0) == 0 and v != "NO_DATA_REACHED":
              print(f"::error::verdict {v!r} with 0 panels is a disguised no-data run"); sys.exit(1)
          if v == "MISFIT_LIST_PRODUCED":
              print(f"::notice::{f.get('panels_screened_and_calibrated')} panels calibrated; "
                    f"{f.get('misfit_unexplained')} UNEXPLAINED, {f.get('misfit_watch')} WATCH; "
                    f"{f.get('candidates_before_kills')} pair/flag exceedances, all killed.")
          if v == "REFINERY_VECTOR_CANDIDATE":
              print(f"::notice::{f.get('candidates_surviving')} surviving candidate(s) — PENDING vet")
          if s.get("degraded"):
              print("::warning::degraded: " + "; ".join(s["degraded"]))
          PY

      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "slag-solo: polluted WDs beyond the natural family — ${{ github.event.inputs.stage || 'all' }}" \
            results/slag/summary.json \
            results/slag/controls.json \
            results/slag/misfit_list.csv \
            results/slag/pairs.csv \
            results/slag/flags.csv \
            results/slag/candidates.csv \
            results/slag/screen_1of1.json \
            results/slag/probe.json \
            results/slag/acquire.json \
            results/slag/acquisition_log.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slag-solo
          path: results/slag/
          if-no-files-found: warn
