name: parallax4

# PARALLAX4 — Gaia DR4 intake (docs/parallax4.md).
#
#   probe ──▶ controls (GATE) ──▶ sweep (N shards over the DR3 epoch-photometry
#   CDN files) ──▶ reduce ▸ vet ▸ watchlist ▸ dr4 ▸ summary ──▶ commit-back
#
# The question: grey (G/BP/RP-achromatic) per-transit dips/brightenings with NO
# photocentre shift.  DR4 (scheduled 2026-12-02) carries the per-transit
# astrometry; until then the `dr4` stage answers DR4_NOT_RELEASED and the
# sweep runs the photometric half on Gaia DR3's ~11.75 M published light curves.
#
# Conventions encoded (docs/channel-brief.md):
#  * the offline suite gates the probe; the CONTROLS gate the sweep (a sweep
#    job does not start unless controls.json says gate_photometric=PASS, and
#    the sweep code refuses on its own if it does not see that file);
#  * shard hygiene §0.7: every shard purges checkout-inherited shard files
#    first and uploads only its own `_s<i>of<n>` files; the reducer purges
#    before downloading and downloads sweep artifacts BY NAME;
#  * checkpoint per CDN file; uploads `if: always()`;
#  * commit-back through scripts/commit_results.sh (verifies the push).
#
# Release day: dispatch with stage=dr4 (probe + photocentre test on the
# committed watchlist and survivors).  Before release it is inert.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, controls, sweep, reduce/vet/watchlist/dr4/summary),
          "probe", "controls", "sweep" (controls + sweep + reduce), "reduce",
          "dr4" (the release-day entry; inert before DR4), or "watchlist".
        required: false
        default: "all"
      shards:
        description: "Number of sweep shards (CDN files are split k mod n)"
        required: false
        default: "24"
      max_files:
        description: "Cap on CDN files per sweep shard (0 = all; a pilot sets this)"
        required: false
        default: "0"
      reduce_only_run_id:
        description: "Skip probe/controls/sweep; reduce from this prior run's sweep artifacts"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      n_shards: ${{ steps.mk.outputs.n_shards }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.shards || '24' }}" or 24)
          print("matrix=" + json.dumps({"include": [{"shard": i} for i in range(n)]}))
          print(f"n_shards={n}")
          PY

  probe:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' && contains(fromJSON('["all","probe","sweep","controls"]'), github.event.inputs.stage || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate (reader on the real DR4 prerelease, detector, controls logic)
        run: python -m pytest tests/test_parallax4.py -q -p no:cacheprovider
      - name: Probe (DR4 status, CDN list + real header, prerelease + draft data model, SSO schema)
        run: |
          python -m seti.parallax4.run --stage probe
          python - <<'PY'
          import json
          d = json.load(open("results/parallax4/probe.json"))
          print("verdict:", d.get("verdict"), "| DR4:", (d.get("dr4") or {}).get("verdict"))
          print("cdn:", json.dumps({k: v for k, v in (d.get("cdn") or {}).items() if k != "first_file"}))
          ff = (d.get("cdn") or {}).get("first_file") or {}
          print("first file:", {k: ff.get(k) for k in ("name", "bytes", "n_sources", "n_transits", "read_s", "mismatched_array_rows", "t_range", "error")})
          print("header:", ff.get("header"))
          print("resolution:", json.dumps(ff.get("resolution"))[:1500])
          print("prerelease:", json.dumps(d.get("prerelease"))[:1500])
          print("datamodel:", json.dumps(d.get("datamodel"))[:3000])
          print("sso:", json.dumps({k: {kk: vv for kk, vv in v.items() if kk != "columns"} for k, v in (d.get("sso") or {}).items()})[:1500])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallax4-probe
          path: |
            results/parallax4/probe.json
            results/parallax4/cdn_files.json
            results/parallax4/dr4_status.json
            results/parallax4/dr4_datamodel.json
            results/parallax4/_prerelease/
          if-no-files-found: warn
      - name: Commit the probe evidence
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh "parallax4: probe — DR4 status, CDN epoch-photometry files, DR4 data model" \
            results/parallax4/probe.json results/parallax4/cdn_files.json \
            results/parallax4/dr4_status.json results/parallax4/dr4_datamodel.json

  controls:
    needs: [plan, probe]
    if: ${{ always() && needs.probe.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      gate: ${{ steps.gate.outputs.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: parallax4-probe
          path: results/parallax4/
      - name: Controls FIRST (injection into real DR3 light curves, DR4 scenes, prerelease joint fit, varstrometry)
        run: |
          python -m seti.parallax4.run --stage controls
          python - <<'PY'
          import json
          d = json.load(open("results/parallax4/controls.json"))
          print(d["verdict"])
          for k in ("P_photometric", "P3_eclipsing_binaries", "pilot_funnel", "A3_varstrometry", "A3_varstrometry_excess_noise"):
              print(k, json.dumps(d.get(k), default=str)[:2500])
          a1 = d.get("A1_simulated_scenes") or {}
          print("A1", a1.get("gate"), a1.get("n_ok"), "/", a1.get("n"), "D err", a1.get("blend_D_max_frac_error"))
          a2 = d.get("A2_prerelease") or {}
          print("A2", a2.get("gate"), a2.get("n_parallax_ok"), "/", a2.get("n_sources"), "join_ok", a2.get("join_ok"))
          for j in a2.get("joint") or []:
              print("  joint", json.dumps({k: v for k, v in j.items() if k != "neighbours"}, default=str)[:900])
          print("pilot files", json.dumps(d.get("pilot_files"))[:1500])
          PY
      - id: gate
        if: always()
        run: |
          G=$(python -c "import json;print(json.load(open('results/parallax4/controls.json')).get('gate_photometric','FAIL'))" 2>/dev/null || echo FAIL)
          echo "gate=$G" >> "$GITHUB_OUTPUT"
          echo "photometric gate: $G"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallax4-controls
          path: |
            results/parallax4/controls.json
            results/parallax4/controls_injections.csv
            results/parallax4/dr4_controls.csv
            results/parallax4/varstrometry_eclipsing.csv.gz
            results/parallax4/varstrometry_quiet.csv.gz
          if-no-files-found: warn
      - name: Commit the controls
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh "parallax4: controls — injection/recovery on real DR3 light curves, DR4 scenes, prerelease joint fit, varstrometry" \
            results/parallax4/controls.json results/parallax4/controls_injections.csv \
            results/parallax4/dr4_controls.csv

  sweep:
    needs: [plan, controls]
    if: ${{ always() && needs.controls.outputs.gate == 'PASS' && contains(fromJSON('["all","sweep"]'), github.event.inputs.stage || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Shard hygiene (docs/channel-brief.md §0.7): the branch may carry an
      # earlier run's shard files; a shard uploads only what it wrote.
      - name: Purge checkout-inherited shard outputs
        run: |
          rm -f results/parallax4/sweep_s*of*.json results/parallax4/events_s*of*.csv
          rm -f results/parallax4/eventsAB_s*of*.csv results/parallax4/injections_s*of*.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: parallax4-probe
          path: results/parallax4/
      - uses: actions/download-artifact@v4
        with:
          name: parallax4-controls
          path: results/parallax4/
      - name: Sweep shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} (checkpointed per CDN file)
        run: |
          python -m seti.parallax4.run --stage sweep \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} \
            --max-files ${{ github.event.inputs.max_files || '0' }}
          ls -la results/parallax4/ | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallax4-sweep-${{ matrix.shard }}
          path: |
            results/parallax4/sweep_s${{ matrix.shard }}of${{ needs.plan.outputs.n_shards }}.json
            results/parallax4/events_s${{ matrix.shard }}of${{ needs.plan.outputs.n_shards }}.csv
            results/parallax4/eventsAB_s${{ matrix.shard }}of${{ needs.plan.outputs.n_shards }}.csv
            results/parallax4/injections_s${{ matrix.shard }}of${{ needs.plan.outputs.n_shards }}.csv
          if-no-files-found: warn

  reduce:
    needs: [plan, sweep]
    if: ${{ always() && needs.plan.result == 'success' && (github.event.inputs.reduce_only_run_id != '' || contains(fromJSON('["all","sweep","reduce","dr4","watchlist"]'), github.event.inputs.stage || 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Purge checkout-inherited shard outputs
        run: |
          rm -f results/parallax4/sweep_s*of*.json results/parallax4/events_s*of*.csv
          rm -f results/parallax4/eventsAB_s*of*.csv results/parallax4/injections_s*of*.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download this run's sweep artifacts by name
        if: ${{ github.event.inputs.reduce_only_run_id == '' && contains(fromJSON('["all","sweep"]'), github.event.inputs.stage || 'all') }}
        uses: actions/download-artifact@v4
        with:
          pattern: parallax4-sweep-*
          merge-multiple: true
          path: results/parallax4/
      - name: Download a prior run's sweep artifacts by name
        if: ${{ github.event.inputs.reduce_only_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: parallax4-sweep-*
          merge-multiple: true
          path: results/parallax4/
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: What reached this job
        run: |
          N=$(ls results/parallax4/sweep_s*of*.json 2>/dev/null | wc -l)
          echo "sweep records found: $N of ${{ needs.plan.outputs.n_shards }}"
          ls -la results/parallax4/ | head -80
      - name: Reduce, vet, watchlist, DR4 (inert before release), summary
        run: |
          STAGES="reduce,vet,watchlist,dr4,summary"
          case "${{ github.event.inputs.stage }}" in
            dr4) STAGES="watchlist,dr4,summary" ;;
            watchlist) STAGES="watchlist,summary" ;;
          esac
          python -m seti.parallax4.run --stage "$STAGES" --shards ${{ needs.plan.outputs.n_shards }}
          python - <<'PY'
          import json, os
          for f in ("reduce.json", "vet.json", "watchlist.json", "dr4_status.json", "summary.json"):
              p = "results/parallax4/" + f
              if os.path.exists(p):
                  d = json.load(open(p))
                  print(f, "->", d.get("verdict"))
                  if f == "summary.json":
                      print(json.dumps(d, indent=1, default=str)[:4000])
                  if f == "reduce.json":
                      print(json.dumps({k: d.get(k) for k in ("counts", "n_tier_A", "n_tier_B", "n_epoch_cluster_vetoed", "n_tier_A_after_epoch", "degraded", "completeness")}, default=str)[:3000])
                      print("epoch clusters:", json.dumps(d.get("epoch_clusters"))[:1500])
                  if f == "vet.json":
                      print(json.dumps({k: d.get(k) for k in ("classes", "kill_reasons", "degraded")}, default=str))
                      for s in (d.get("survivors") or [])[:25]:
                          print("  ", s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallax4-final
          path: |
            results/parallax4/reduce.json
            results/parallax4/events_AB.csv
            results/parallax4/vet.json
            results/parallax4/vetted.csv
            results/parallax4/summary.json
            results/parallax4/dr4_watchlist.csv
          if-no-files-found: warn
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh "parallax4: reduce + vet + watchlist + DR4 status + summary" \
            results/parallax4/reduce.json results/parallax4/events_AB.csv \
            results/parallax4/vet.json results/parallax4/vetted.csv \
            results/parallax4/watchlist.json results/parallax4/dr4_watchlist.csv \
            results/parallax4/dr4_watchlist_rows.csv.gz results/parallax4/dr4_status.json \
            results/parallax4/dr4.json results/parallax4/dr4_photocentre.csv \
            results/parallax4/summary.json
