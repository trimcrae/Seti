name: crypt

# CRYPT — artifacts in lunar permanent shadow (docs/crypt.md).  Signature S55.
#
#   [pcp × 2 shards (one pole each)] ──▶ assess_diurnal ──▶ commit-back
#   probe (optional, in parallel: re-records the archive inventory)
#
# WHAT THE ARCHIVE ACTUALLY HOLDS (run 35737908601, 2026-09-22, recorded in
# results/crypt/probe.json).  There is NO per-channel Diviner polar gridded
# product: all 912 Polar Cumulative Products are AVG TBOL.  So the
# multi-channel anisothermality of the original brief cannot be computed from
# a level-3/4 map product at all.  What the PCP does carry, and what nobody
# has screened, is the axis it is binned on: average bolometric temperature
# per 240 m pixel in local-time bins, separately for lunar summer and winter
# — a diurnal curve inside permanent shadow.
#
# THE SCREEN.  Inside the LOLA-mapped PSR (lpsr_65{n,s}_240m, the same 240 m
# polar stereographic grid), the statistic is the pixel's FLOOR bolometric
# temperature: the minimum over every loaded (season, local-time) bin,
# measured against a local square annulus with the local level AND the local
# curvature bias removed.  Every passive heating term inside a PSR —
# scattered light off a sunlit rim, re-radiated IR from surrounding terrain —
# has a clock: it rises and falls with the sun's position and collapses in
# winter.  Taking the minimum over the whole (season, local-time) grid is
# immune by construction to heating that switches off at any point in the
# year.  An internal source is not.  Flagging is on the floor OR the all-bin
# mean, so a seasonal or diurnal confounder is COUNTED as rejected rather
# than vanishing silently.
#
# The products are PDS3 ASCII tables of ~4.4 million rows (empty bins are
# omitted), 262 MB each, served from the PDS4 derived bundle.  Each is
# rasterised and DELETED before the next is fetched, so peak disk is one
# product.  Which local-time bins exist is read off ODE's own PCP file index,
# never assumed; which ones were used is recorded with every result.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (pcp + radar per pole shard, then assess_diurnal), "pcp", "assess"
          (re-assess the diurnal files already on the branch), or "probe"
          (re-record the archive inventory only).
        required: false
        default: "all"
      poles:
        description: "Comma list of poles to run (blank = both)"
        required: false
        default: ""
      ltim_bins:
        description: >-
          Local-time bin selection, overriding config/crypt.yaml:
          "every:16" | "n:8" | "1,25,49,73".  Each bin is one 262 MB table
          per season.
        required: false
        default: ""
      no_sensitivity:
        description: "Skip the injection-recovery table (faster iteration)"
        required: false
        default: "false"
      run_probe:
        description: "Also re-run the archive probe (slow, large output)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event.inputs.stage == 'probe' || github.event.inputs.run_probe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe (crawl the Diviner volume, read labels, classify; Mini-RF, ShadowCam, ODE, PSR routes)
        run: |
          python -m seti.crypt.run --stage probe
          python - <<'PY'
          import json
          d = json.load(open("results/crypt/probe.json"))
          print("verdict", d["verdict"], "reached", d["reached"])
          dv = d["diviner"]
          print("files", dv["n_files"], "products", dv["n_products"], "labels", dv["n_labels_read"])
          for q in (dv.get("ode") or {}).get("queries", []):
              print("ode", q.get("pt"), q.get("status"), q.get("n_products"), q.get("n_files"),
                    json.dumps(q.get("n_token_fields")))
          for r in d.get("formats", []):
              print("format", r.get("label") if isinstance(r.get("label"), str) else r.get("matched"),
                    r.get("status"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-probe
          path: results/crypt/probe.json
          if-no-files-found: warn
      - name: Commit the probe record
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "crypt: probe — Diviner level-3/4 inventory, Mini-RF, ShadowCam, ODE, PSR routes" \
            results/crypt/probe.json

  shard:
    if: ${{ github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'assess' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected source must be recovered and the confounders rejected
        run: |
          python -m pytest tests/test_crypt.py -q -p no:cacheprovider \
            -k "injected or lit_rim or empty_archive or pds3 or diurnal or pcp or psr"
      # NEVER remove $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache): that is where
      # setup-python put the interpreter this job installed seti into.  Run
      # 35744896637 shard 1 did, and the next step ran /usr/bin/python and died
      # with ModuleNotFoundError: No module named 'seti'.
      - name: Free disk (each PCP table is 262 MB and is deleted after it is rasterised)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android /usr/share/swift || true
          df -h /
          python -c "import sys, pandas, numpy, scipy; print('python', sys.version); \
                     print('pandas', pandas.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Optional override of the local-time bin selection
        if: ${{ github.event.inputs.ltim_bins != '' }}
        run: |
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("config/crypt.yaml")
          t = p.read_text()
          t = re.sub(r'(?m)^(  ltim_bins:).*$', r'\1 "${{ github.event.inputs.ltim_bins }}"', t, count=1)
          p.write_text(t)
          print([ln for ln in t.splitlines() if "ltim_bins" in ln])
          PY
      - name: Acquire the PCP local-time maps and run the diurnal screen (one pole)
        run: |
          P=""
          if [ -n "${{ github.event.inputs.poles }}" ]; then P="--poles ${{ github.event.inputs.poles }}"; fi
          NS=""
          if [ "${{ github.event.inputs.no_sensitivity }}" = "true" ]; then NS="--no-sensitivity"; fi
          python -m seti.crypt.run --stage pcp,radar --shard ${{ matrix.shard }}/2 $P $NS
          echo "=== acquisition ==="
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob("results/crypt/pcp_*.json")):
              if p.endswith("pcp_index.json"):
                  print(p, json.dumps(json.load(open(p)))[:1200]); continue
              d = json.load(open(p))
              print(p, d.get("status"), "layers", d.get("n_layers"), "missing", d.get("n_missing"),
                    "bytes", d.get("bytes"), "grid", d.get("grid"),
                    "bins", d.get("ltim_bins"), "of", d.get("n_bins_available"),
                    "axis", d.get("n_bins_axis"))
              print("  psr", json.dumps(d.get("psr"))[:1200])
              for k, v in (d.get("products") or {}).items():
                  print("  ", k, v.get("outcome"), v.get("status"), "n", v.get("n"),
                        "on_grid", v.get("n_on_grid"), "cells", v.get("n_cells"),
                        "collision", v.get("collision_frac"), "flip_y", v.get("flip_y"),
                        "origin", v.get("origin_frac"), "resid_deg", v.get("georef_resid_deg"),
                        "T", v.get("t_min"), v.get("t_max"), (v.get("error") or "")[:100])
          PY
          echo "=== diurnal screen ==="
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob("results/crypt/diurnal_*.json")):
              if "sensitivity" in p:
                  print(p, json.dumps(json.load(open(p)))[:1500]); continue
              d = json.load(open(p))
              print(p, d.get("status"), "mask", json.dumps(d.get("mask")), "degraded", d.get("degraded"))
              print("  stats", json.dumps(d.get("stats")))
              print("  floor", json.dumps(d.get("floor")))
              print("  flagged", d.get("n_flagged"), "floor", d.get("n_flagged_floor"),
                    "mean", d.get("n_flagged_mean"), "counts", json.dumps(d.get("counts")))
              for c in (d.get("top_flags") or [])[:20]:
                  print("   flag", {k: c.get(k) for k in
                                    ("line", "sample", "lon", "lat", "class", "reasons", "z_floor",
                                     "z_mean", "T_floor_K", "T_bg_K", "sigma_bg_K", "dT_K", "amp_K",
                                     "dseason_K", "n_bins_hot", "cluster_px", "area_m2_300K")})
          PY
          echo "=== radar ==="
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob("results/crypt/radar_*.json")):
              d = json.load(open(p))
              print(p, d.get("status"), "counts", json.dumps(d.get("counts")),
                    "n_high_cpr", d.get("n_high_cpr"), "mask", json.dumps(d.get("mask")),
                    (d.get("error") or "")[:200])
              print("  acquisition", json.dumps(d.get("acquisition"))[:1500])
              for c in (d.get("radar_candidates") or [])[:20]:
                  print("   RADAR", {k: c.get(k) for k in
                                     ("line", "sample", "lon", "lat", "cpr", "cluster_px",
                                      "bg_cpr", "s1", "s1_bg", "class", "reasons")})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-shard-${{ matrix.shard }}
          path: |
            results/crypt/pcp_*.json
            results/crypt/diurnal_*.json
            results/crypt/diurnal_flags_*.csv
            results/crypt/radar_*.json
            results/crypt/radar_flags_*.csv
          if-no-files-found: warn

  assess:
    needs: [shard]
    if: ${{ always() && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.stage != 'assess' }}
        with:
          pattern: crypt-shard-*
          path: results/crypt/
          merge-multiple: true
      - name: Assess (merge poles, write summary)
        run: |
          ls -la results/crypt/ || true
          python -m seti.crypt.run --stage assess_diurnal
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/crypt/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("candidates", "thresholds", "note")},
                           indent=1)[:12000])
          for c in s.get("candidates", [])[:30]:
              print("CANDIDATE", {k: c.get(k) for k in
                                  ("pole", "line", "sample", "lon", "lat", "z_floor", "z_mean",
                                   "T_floor_K", "T_bg_K", "sigma_bg_K", "dT_K", "amp_K",
                                   "dseason_K", "n_bins_hot", "cluster_px", "area_m2_300K")})
          PY
      # A verdict must never read as a science null when no pixel was screened.
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/crypt/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), int(s.get("n_psr_interior_px", 0))
          if n == 0 and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with 0 PSR pixels is a disguised no-data run"); sys.exit(1)
          if "NO_DATA_REACHED" in v:
              print("::warning::NO_DATA_REACHED — read results/crypt/pcp_index.json and "
                    "results/crypt/pcp_<pole>.json for the URLs tried and the HTTP answers.")
          if "NO_DIURNALLY_INVARIANT_SURVIVOR" in v:
              print(f"::notice::{n} PSR-interior pixels screened, no survivor. A COUNT at the "
                    "stated floor, NOT an occurrence limit — see docs/crypt.md.")
          if "DIURNALLY_INVARIANT_CANDIDATES" in v:
              print(f"::notice::{s.get('n_candidates')} candidate pixel(s) — PENDING the "
                    "optical/radar vet, see results/crypt/candidates.json")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The rasters and the 262 MB tables never leave the runner.
          scripts/commit_results.sh \
            "crypt: the diurnal/seasonal invariance screen inside the mapped PSRs — ${{ github.event.inputs.stage || 'all' }}" \
            results/crypt/summary.json \
            results/crypt/candidates.json \
            results/crypt/candidates.csv \
            $(ls results/crypt/pcp_index.json results/crypt/pcp_*.json results/crypt/diurnal_*.json results/crypt/diurnal_flags_*.csv results/crypt/radar_*.json results/crypt/radar_flags_*.csv 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-final
          path: results/crypt/
          if-no-files-found: warn
