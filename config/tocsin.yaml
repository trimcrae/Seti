# TOCSIN channel --- every selection / rejection threshold in one place.
#
# Signature S30 (docs/necrosignatures.md): "an unclassified blackbody transient
# on a catalogued nearby dwarf, matching neither flare, nova, nor microlensing",
# screened nightly on the Rubin/LSST alert stream, in BOTH flux polarities
# (flash and dip).  See docs/tocsin.md for the claim and the novelty position.
#
# THE GOVERNING METHODOLOGY (docs/tocsin.md §3): the observable is not one
# flash, it is COHERENCE ACROSS NIGHTS at a fixed catalogued position.  A single
# achromatic flash is indistinguishable from a cosmic ray, a satellite glint or
# an unflagged subtraction residual; what none of those do is come back to the
# same star.  So every threshold below is a *per-event* gate whose only job is to
# feed a clean ensemble to the cross-night ledger, and the promotion decision is
# made there, against the CUMULATIVE trial count.

target:
  # Distance limit for the anchored star list.  100 pc keeps the trial count at
  # ~10^5 (so a per-target p-value is interpretable), keeps Gaia astrometry
  # excellent, and is where a reflector of a given size subtends the most flux.
  d_max_pc: 100.0
  parallax_over_error_min: 10.0
  n_parallax_shells: 6
  # Rubin main-survey footprint.  Targets outside it can never alert and would
  # only inflate the denominator.
  dec_min: -90.0
  dec_max: 15.0
  g_max: 21.0
  # Gaia DR3 reference epoch for ra/dec; propagation to the alert epoch is
  # mandatory, not optional (see targets.py).
  gaia_epoch: 2016.0

acquire:
  # ALeRCE TAP: public, no credentials, indexed on mjd/ra/dec.  This is the only
  # broker path that supports an unattended nightly cron (see brokers.py).
  primary_broker: alerce_tap
  alerce_tap_url: "https://tap.alerce.online/tap"
  fink_lsst_url: "https://api.lsst.fink-portal.org"
  lasair_endpoint: "https://api.lasair.lsst.ac.uk/api"
  # Nights to pull per run.  >1 covers a missed cron firing; the ledger
  # de-duplicates by (target, night) so overlap is harmless.
  lookback_nights: 2.0
  # Server-side Gaia parallax pre-cut, in mas.  Matches target.d_max_pc; it is
  # what makes a night affordable (millions of rows -> thousands).
  parallax_min_mas: 10.0
  xmatch_max_arcsec: 1.5
  # ALeRCE cross-match catalogue id for Gaia DR3.  Measured by the probe
  # (`diagnostics.xmatch_catid`), not assumed.
  # MEASURED by the probe on 2026-07-30: catid 1 = Gaia DR3 (2.58M rows),
  # catid 0 = AllWISE (849k).
  gaia_catid: 1
  # ALeRCE `sid` value selecting diaObject-associated (i.e. NOT known
  # solar-system) detections.  `null` drops the filter entirely, which is the
  # SAFE default until the probe confirms the encoding: the inner join to
  # `lsst_detection` already restricts the result to LSST, so the sid clause is
  # an optimisation and a solar-system exclusion, and a wrong guess here would
  # silently return an empty night rather than an error.  Set it to the measured
  # value once `diagnostics.sample_detection` / `object_sid_tid` confirm it.
  # MEASURED by the probe on 2026-07-30 (`diagnostics.object_sid_tid`):
  #   sid=0, tid=0 -> ZTF          (9.09M objects)
  #   sid=1, tid=1 -> LSST diaObject (5.16M)
  #   sid=2, tid=1 -> LSST ssObject  (131k, known solar-system)
  # So sid=1 is correct, and it excludes ~300k solar-system detections per
  # 30 days without touching anything else.
  sid_diaobject: 1
  # The broker's TAP mirror is NOT live: measured lag was 15.6 days on
  # 2026-07-30 (newest LSST epoch MJD 61235.4 against a wall clock of 61251.1).
  # The screen therefore anchors its window to the newest epoch the broker
  # actually holds and advances a watermark, rather than asking for "the last
  # two nights" and receiving nothing every night forever.
  #
  # Nights per run.  LSST detections in ALeRCE already span MJD 60973 -> 61235
  # (~262 nights), so the first runs are a BACKFILL of real archival data, not a
  # wait for new sky.  This caps how much one job chews through.
  max_nights_per_run: 14.0
  # Where the walk starts when the ledger has no watermark yet.  MEASURED: the
  # broker's LSST holdings begin at MJD 60973 (`diagnostics.mjd_range_lsst_join`),
  # so the first runs backfill ~262 nights of real archival data rather than
  # waiting for new sky.  Set to null to start a few nights back instead.
  backfill_start_mjd: 60973.0
  # THE DENOMINATOR.  Forced photometry is the textbook source for "how many
  # times was this star looked at and showed nothing", but MEASUREMENT BEAT
  # THEORY: the broker's LSST forced photometry covered 0% of screened
  # star-nights in the first backfill, which pins the ensemble rate at 1.0 and
  # makes promotion impossible.  Detections instead trace where the camera
  # pointed, so a 1-degree sky bin holding any detection on night N was observed
  # on night N.  Aggregated server-side with GROUP BY, so a night's footprint is
  # one small result rather than millions of rows.
  # Wall-clock budget for one dispatch, well short of the workflow's
  # timeout-minutes.  A cancelled job discards EVERYTHING — the commit step never
  # runs, so chunks that already succeeded are lost too.  Yielding voluntarily
  # keeps the watermark committed and lets the next dispatch resume.
  max_run_seconds: 5400.0
  # Forced photometry: OFF.  Measured on the live service at 3151 s followed by
  # a ReadTimeout, covering 0-0.08% of screened star-nights, while the footprint
  # query answers the same question in 5 s with full coverage.  One stalled call
  # burned a 180-minute job to cancellation.  Turn on only if the broker's
  # forced-photometry table becomes both populated and fast; the epoch-level
  # history it returns is strictly richer than the night-level history the
  # footprint provides.
  use_forced_photometry: false
  use_footprint_denominator: true
  footprint_bin_deg: 1.0
  maxrec: 2000000
  timeout_s: 900
  # Periodically re-run with the Gaia join disabled to MEASURE what the cheap
  # server-side cut loses: ALeRCE cross-matches at the catalogue epoch, so the
  # highest-proper-motion nearby dwarfs --- this channel's best targets --- are
  # exactly the ones it can mis-associate.
  audit_without_gaia_join_every_n_runs: 14

screen:
  # Difference-image significance.  The stream is already cut at reliability
  # 0.5 upstream; this is our own floor on |dF|/sigma_dF.
  min_abs_snr: 6.0
  # DELIBERATELY 0: Rubin's production pipeline already applies
  # `minReliability: 0.5` before an alert is issued, and DMTN-337 measures the
  # true-positive rate of that model on VARIABLE STARS at 3.5% (v0.1, DP1) --- it
  # scores stellar point-source-on-point-source subtractions characteristically
  # low, which is precisely this channel's signal.  Cutting again here would
  # compound a completeness loss we did not choose and cannot undo.  The
  # incompleteness is reported, not deepened.
  min_reliability: 0.0
  require_reliability: false
  max_dipole_significance: 3.0
  max_extendedness: 0.5
  # Backstop only, and deliberately LOOSE.  A probe sample showed trailLength =
  # 1.38" on an ordinary unflagged point-like star, so the fitted length is not
  # a clean trail indicator and a tight cut here would discard real events.
  # Rubin's `trail_flag` is used as the trustworthy signal instead, and the
  # primary mover defences are the sid filter (known solar-system objects) and
  # Rubin's upstream deletion of trails longer than 10 deg/day (~12.5" per
  # 30 s visit).  NEEDS CALIBRATION against the observed trailLength
  # distribution before being tightened.
  max_trail_arcsec: 5.0
  # Association to the proper-motion-propagated stellar position.
  match_radius_arcsec: 1.5
  max_sep_arcsec: 1.0
  max_sep_sigma: 3.0
  # Band-to-band fractional-amplitude difference, in sigma.  |z| <= 3 is grey.
  # The LSST baseline takes intra-night pairs in DIFFERENT filters (u+g, u+r,
  # g+r, r+i, i+z, z+y; only y+y repeats a filter), ~33 min apart, so a colour
  # is the DEFAULT product for any event lasting more than half an hour --- the
  # test the ZTF glint channel could almost never apply.
  max_grey_z: 3.0
  # Relative error assigned to a Gaia-GSPC-derived baseline flux, covering the
  # SDSS-vs-LSST passband mismatch.  Not used when Rubin's own `templateFlux` is
  # available, which is the preferred path and carries no transformation error.
  baseline_rel_err: 0.03
  missing_pm_penalty_arcsec: 2.0

ledger:
  path: "results/tocsin/ledger.json"
  # Benjamini-Hochberg across all targets ever screened.  FDR rather than
  # Bonferroni: at 10^5 targets Bonferroni would reject a real repeater along
  # with the noise.
  alpha_fdr: 0.05
  # A star needs this many *visited nights* before its binomial p-value means
  # anything; below it the denominator is too small to distinguish rates.
  min_visits_for_rate: 5
  # Duty cycle = events / visited nights.  A star that alerts on a large
  # fraction of its visits is a subtraction residual --- a proper-motion dipole
  # or a template defect --- not a beacon.  This single test is the main defence
  # against the dominant systematic for a high-proper-motion sample.
  max_duty_cycle: 0.2
  # Randomisations for the cadence-matched timing null.  The smallest resolvable
  # p-value is 1/(n_null+1), so it is quoted as an inequality when zero
  # randomisations beat the data.
  n_null_timing: 2000
  timing_alpha: 0.01

report:
  results_dir: "results/tocsin"
  # Cap on rows written per nightly candidate table, so a pathological night
  # (bad template, new field) cannot commit a huge file.  Truncation is always
  # recorded in summary.json rather than applied silently.
  max_candidate_rows: 2000
