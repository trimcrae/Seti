# RELAY channel (S60) — every threshold, beam, site and seed in one place.
#
# The geometry: Earth intercepts a T -> R beam when the angle at T between
# T->R and T->Earth is <= theta/2.  Two geometries (spillover: T behind R on
# the same sightline; between: R near T's antipode, the beam passes Earth on
# its way) are counted separately.  See docs/relay.md.

sample:
  parallax_min_mas: 10.0          # d <= 100 pc: the GCNS volume
  parallax_over_error_min: 10.0   # a distance good to 10 % or better
  ruwe_max: 1.4                   # single-star astrometry (verify: standard DR3 cut)
  d_max_pc: 100.0
  rv_err_max_kms: 5.0             # RVs worse than this carry no kinematic prior
  rv_template_teff_max_k: 8500.0  # Katz+2023 zero-point applies to cool templates only
  # ESA parallax shells (mas), widest first; a shell that times out is retried
  # and then recorded as PARTIAL_SAMPLE rather than silently dropped.
  parallax_shells_mas: [10.0, 11.11, 12.5, 14.29, 16.67, 22.22, 33.33, 100000.0]
  max_rows_per_shell: 400000
  query_timeout_s: 1200           # a Gaia shell is a big job; its clock is longer than the probe's

beams:
  # theta is the FULL beam width 1.22 lambda/D (the FWHM-class number the brief
  # quotes); the cone half-angle is theta/2.
  - {name: optical_10m_1um,   aperture_m: 10.0,  wavelength_um: 1.0}     # 0.025 arcsec: un-interceptable
  - {name: radio_100m_1p4ghz, aperture_m: 100.0, frequency_ghz: 1.42}    # ~9 arcmin (GBT-class link)
  - {name: radio_10m_8ghz,    aperture_m: 10.0,  frequency_ghz: 8.0}     # 0.26 deg: the theta^2 check point
  - {name: radio_10m_1p4ghz,  aperture_m: 10.0,  frequency_ghz: 1.42}    # 1.5 deg
  - {name: overfilled_5deg,   theta_deg: 5.0}                            # deliberately over-filled

geometry:
  # wall clock on the WHOLE beam loop.  Beams run narrowest first, so the cheap,
  # scientifically central ones always finish; a beam the clock cuts short is
  # recorded as PARTIAL_COUNTS / NOT_COMPUTED and its count is never compared
  # with the analytic expectation or used in the theta^2 fit.
  budget_s: 9000
  min_separation_pc: 0.05        # ~10^4 AU: closer is a bound binary, not a field pair
  row_cap: 4000000               # kept rows per beam (artifact only); counts are always exact
  chunk_candidates: 3000000
  commit_full_catalogue_max_rows: 150000   # a beam's full directed-pair table is committed only below this
  # committed rows of the BL-target pair table, narrow beams kept whole and the
  # widest trimmed first.  250k rows of this table gzip to 28 MB (run
  # 35740854882 on the 264,973-star sample) -- far past the few-MB budget for a
  # committed artifact -- so the cap buys about 4 MB and the rest stays in the
  # run's uploaded artifact.
  commit_target_pairs_max_rows: 40000

drift:
  a_local_max_m_s2: 1.0          # envelope on a transmitter platform's acceleration (HZ planet of an M dwarf ~0.7)
  reference_frequency_ghz: 1.42
  magic_lines_mhz:               # supplementary frequency-offset test (trials stated)
    HI_1420: 1420.405751768
    OH_1665: 1665.4018
    OH_1667: 1667.3590
  # pipeline drift resolution when the catalogue row carries none (channel / T_obs)
  sigma_drift_default_hz_s: 0.0093       # 2.79 Hz / 300 s, the BL turboSETI L-band product

telescopes:
  # HPBW at the band centre (arcmin) -- verify: from the observatory guides;
  # GBT ~ 12.6'/f_GHz, Parkes ~ 14.4' at 1.4 GHz, MeerKAT primary ~ 1.1 deg/f_GHz.
  GBT:     {lat_deg: 38.4331,  lon_deg: -79.8398, hpbw_arcmin: {L: 8.7, S: 5.4, C: 2.1, X: 1.4}, default_band: L}
  Parkes:  {lat_deg: -32.9984, lon_deg: 148.2635, hpbw_arcmin: {L: 14.4, UWL: 14.4, "10cm": 6.4}, default_band: L}
  MeerKAT: {lat_deg: -30.7130, lon_deg: 21.4430,  hpbw_arcmin: {L: 66.0, UHF: 100.0}, default_band: L}
  ATA:     {lat_deg: 40.8178,  lon_deg: -121.4733, hpbw_arcmin: {L: 150.0}, default_band: L}
  APF:     {lat_deg: 37.3414,  lon_deg: -121.6429, hpbw_arcmin: {optical: 0.05}, default_band: optical}
  FAST:    {lat_deg: 25.6529,  lon_deg: 106.8567, hpbw_arcmin: {L: 2.9}, default_band: L}
  Arecibo: {lat_deg: 18.3442,  lon_deg: -66.7528, hpbw_arcmin: {L: 3.3}, default_band: L}
  in_beam_max_arcmin: 8.0        # neighbours within this of a target are candidate in-beam transmitters
  band_from_frequency_ghz:       # band name from a file's centre frequency
    - {band: UHF, lo: 0.3,  hi: 1.0}
    - {band: L,   lo: 1.0,  hi: 2.0}
    - {band: S,   lo: 2.0,  hi: 4.0}
    - {band: C,   lo: 4.0,  hi: 8.0}
    - {band: X,   lo: 8.0,  hi: 12.0}

bl_opendata:
  base_url: "http://seti.berkeley.edu/opendata"
  # verify: routes from github.com/ggroode/bl-opendata README (read 2026-09-21):
  #   api/list-targets, api/list-telescopes, api/list-file-types,
  #   api/query-files?target=&telescopes=&file-types=&pos-ra=&pos-dec=&pos-rad=&limit=&cadence=
  routes:
    targets: "api/list-targets"
    telescopes: "api/list-telescopes"
    file_types: "api/list-file-types"
    query_files: "api/query-files"
  timeout_s: 60
  per_target_limit: 200
  max_targets_for_files: 2500
  request_sleep_s: 0.15
  files_budget_s: 5400

resolver:
  simbad_tap: "https://simbad.cds.unistra.fr/simbad/sim-tap"
  batch: 120
  # positional fallback: Gaia positions propagated to J2000 by proper motion
  match_arcsec: 5.0

hit_catalogues:
  # verify: VizieR ids ASSERTED from the papers' journal references; the probe
  # lists whatever tables exist under each id and reads the real columns.  A
  # table is a HIT table only if it exposes a frequency and a drift rate; one
  # with names/positions but no frequency is a TARGET table (used as a second
  # route to the observed-star list).
  seeds:
    enriquez2017: {id: "J/ApJ/849/104",  telescope: GBT,    band: L, note: "692 stars, GBT 1.1-1.9 GHz; 11 events"}
    price2020:    {id: "J/AJ/159/86",    telescope: GBT,    band: L, note: "1,327 stars GBT+Parkes; the events table"}
    sheikh2020:   {id: "J/AJ/160/29",    telescope: GBT,    band: C, note: "restricted Earth transit zone, 3.95-8 GHz"}
    margot2021:   {id: "J/AJ/161/55",    telescope: GBT,    band: L, note: "UCLA GBT L-band; candidate signals"}
    traas2021:    {id: "J/AJ/161/286",   telescope: GBT,    band: L, note: "TESS targets, GBT"}
    gajjar2021:   {id: "J/AJ/162/33",    telescope: GBT,    band: C, note: "Galactic Centre survey"}
    franz2022:    {id: "J/AJ/163/104",   telescope: GBT,    band: L, note: "TESS TOIs in transit"}
    pinchuk2022:  {id: "J/AJ/163/76",    telescope: GBT,    band: L, note: "UCLA GBT, 2022 sample"}
    margot2023:   {id: "J/AJ/166/206",   telescope: GBT,    band: L, note: "UCLA, 11,680 stars"}
    choza2024:    {id: "J/AJ/167/10",    telescope: GBT,    band: L, note: "BL nearby stars re-analysis"}
    isaacson2017: {id: "J/PASP/129/54501", telescope: GBT,  band: L, note: "the BL target list itself (1,702 stars)"}
    # the deep-learning re-analysis and the single-target precedents the brief names
    ma2023:       {id: "J/other/NatAs/7.492",  telescope: GBT, band: L, note: "Ma+2023 deep-learning search, 820 nearby stars, 8 signals of interest"}
    sheikh2021:   {id: "J/other/NatAs/5.1153", telescope: Parkes, band: L, note: "Sheikh+2021 BLC1 analysis (Proxima); the 4.2 MHz family"}
    tusay2022:    {id: "J/AJ/164/116",   telescope: GBT,    band: L, note: "Tusay+2022 alpha Cen SGL antipode — the single-target relay precedent"}
    tusay2024:    {id: "J/AJ/168/40",    telescope: GBT,    band: L, note: "Tusay+2024 TRAPPIST-1 planet-planet occultations — the intra-system version"}
  keywords: ["technosignature", "Breakthrough Listen", "SETI", "narrowband", "narrow-band", "drift rate"]
  max_rows: 200000
  zero_drift_rfi_hz_s: 0.0093    # |drift| below one resolution element: co-rotating (terrestrial) source

  # The e-print route.  VERIFIED on the runner (run 35738937745): VizieR carries
  # the surveys' TARGET lists and not one of their EVENT lists -- 73 tables
  # discovered under the seed ids and by keyword, 0 of kind `hits`.  The event
  # tables exist only inside the papers, so they are read from the arXiv e-print
  # source.  `arxiv_id` is a HINT: the Atom title is fetched and must contain
  # every phrase in `title_contains`, otherwise the id is discarded and the
  # `query` is used instead; a seed that resolves to nothing is recorded
  # UNRESOLVED with the titles it saw, never silently dropped.
  arxiv:
    budget_s: 1800
    timeout_s: 120
    max_rows_per_table: 20000
    sweep_queries:
      - 'abs:"drift rate" AND abs:technosignature'
      - 'abs:"Breakthrough Listen" AND abs:narrowband'
      - 'abs:technosignature AND abs:"Green Bank Telescope"'
    sweep_results_per_query: 40
    sweep_max_papers: 30
    papers:
      enriquez2017:
        arxiv_id: "1709.03491"
        title_contains: ["Breakthrough Listen", "692"]
        query: 'all:"Breakthrough Listen" AND all:"692 Nearby Stars"'
        telescope: GBT
        band: L
      price2020:
        arxiv_id: "1906.07750"
        title_contains: ["Breakthrough Listen", "1327"]
        query: 'all:"Breakthrough Listen" AND all:"1327 Nearby Stars"'
        telescope: GBT
        band: L
      sheikh2020_etz:
        title_contains: ["Earth Transit Zone"]
        query: 'ti:"Earth Transit Zone"'
        telescope: GBT
        band: C
      margot2021:
        title_contains: ["Technosignatures", "31 Sun-like Stars"]
        query: 'ti:"31 Sun-like Stars"'
        telescope: GBT
        band: L
      pinchuk2019:
        title_contains: ["TRAPPIST-1", "LHS 1140"]
        query: 'ti:"LHS 1140"  AND all:technosignatures'
        telescope: GBT
        band: L
      traas2021:
        title_contains: ["Breakthrough Listen", "TESS"]
        query: 'all:"Breakthrough Listen" AND ti:"TESS Targets"'
        telescope: GBT
        band: L
      gajjar2021:
        title_contains: ["Galactic Center"]
        query: 'all:"Breakthrough Listen" AND ti:"Galactic Center"'
        telescope: GBT
        band: C
      franz2022:
        title_contains: ["Technosignature", "Transit"]
        query: 'all:"Breakthrough Listen" AND ti:"transit" AND all:technosignature'
        telescope: GBT
        band: L
      margot2023:
        title_contains: ["Technosignatures", "Green Bank Telescope"]
        query: 'all:"11,680 stars" AND all:technosignatures'
        telescope: GBT
        band: L
      ma2023:
        title_contains: ["820 nearby stars"]
        query: 'ti:"820 nearby stars"'
        telescope: GBT
        band: L
      sheikh2021_blc1:
        title_contains: ["blc1"]
        query: 'all:"blc1" AND all:technosignature'
        telescope: Parkes
        band: L
      tusay2022_sgl:
        title_contains: ["Gravitational Lens"]
        query: 'all:"solar gravitational lens" AND all:technosignature'
        telescope: GBT
        band: L
      tusay2024_trappist:
        title_contains: ["TRAPPIST-1"]
        query: 'ti:"TRAPPIST-1" AND all:technosignature'
        telescope: ATA
        band: L

probe:
  budget_s: 1500
  # per-call clock on VizieR/SIMBAD TAP. pyvo's run_async polls a remote job
  # with no limit of its own, so one wedged VizieR job would otherwise hold the
  # stage until the workflow cap killed it and nothing was written.
  query_timeout_s: 240

assess:
  match_window_sigma: 3.0        # a hit matches the prior within this many half-widths (tight)
  recurrence_khz: 1.0            # a frequency seen on >= 3 unrelated sightlines within this is instrumental
  recurrence_min_sightlines: 3
  # the same rule at a width a drifting emitter family actually occupies: the
  # 1 kHz rule missed seven Enriquez+2017 events inside 1380.88-1381.21 MHz on
  # seven different stars (run 35745111146).  With ~90 hits over ~800 MHz the
  # chance of three unrelated sightlines inside 500 kHz is ~0.05 per run.
  recurrence_wide_khz: 500.0
  # known terrestrial / satellite allocations in and around L band (MHz).
  # verify: ITU-R Radio Regulations Art. 5 and the GNSS interface documents;
  # these are the downlinks and radars every GBT L-band paper names as RFI.
  known_rfi_bands_mhz:
    - {name: "DME/TACAN aeronautical radionavigation", lo: 960.0,  hi: 1164.0}
    - {name: "GPS L5 / Galileo E5",                    lo: 1164.0, hi: 1215.0}
    - {name: "GPS L2 / GLONASS L2 / Galileo E6",       lo: 1215.0, hi: 1300.0}
    - {name: "GPS L3 (1381.05 MHz, P(Y) main lobe)",   lo: 1370.8, hi: 1391.3}
    - {name: "Inmarsat / MSS downlink",                lo: 1518.0, hi: 1559.0}
    - {name: "GPS L1 / Galileo E1 / BeiDou B1",        lo: 1559.0, hi: 1591.0}
    - {name: "GLONASS L1",                             lo: 1597.0, hi: 1606.0}
    - {name: "Iridium downlink",                       lo: 1616.0, hi: 1626.5}
  uniform_drift_range_hz_s: 4.0     # the +/-4 Hz/s every BL/UCLA pipeline searches, for the window-fraction figure
  # the supplementary rest-frequency test (drift.magic_lines_mhz): a relay
  # de-drifted so the RECEIVER sees a chosen rest line puts it, for Earth, at
  # f_rest (1 + (v_TR - v_TE)/c).  It needs both radial velocities, so it runs
  # only on pair lines with complete kinematics (~43 % of the sample), and its
  # trials are counted and priced separately from the drift test's.
  magic_line_window_kms: 5.0        # RV tolerance on the offset, both stars (Gaia DR3 envelope)
  magic_search_bandwidth_mhz: 800.0 # the 1.1-1.9 GHz span a BL L-band hit could have landed in

targetlist:
  # the nearest-neighbour link list (src/seti/relay/targetlist.py): which stars'
  # SHORT links put Earth in the beam.  Not a detection test -- a target list.
  k_neighbours: 5                 # each star links to its 5 nearest sample neighbours
  link_max_pc: 10.0               # ...within 10 pc (median NN distance in the sample is ~1-2 pc)
  min_separation_pc: 0.05         # same bound-binary cut as the geometry
  theta_min_rad: 1.0e-4           # radio beams only: the optical beam admits nothing
  alpha_prefilter_factor: 3.0     # Monte Carlo every link with measured alpha < 3x the widest half-beam
  n_mc: 400                       # parallax draws per link
  seed: 60
  parallax_diff_sigma_min: 3.0    # radial separation must be measured, or the alignment is parallax noise
  comoving_dv_tan_max_kms: 3.0    # |dv_tan| below this ...
  comoving_proj_sep_max_pc: 1.0   # ... at projected separation below this: likely bound, excluded
  observed_telescope: GBT         # "observed" = within half this telescope's L-band HPBW of a resolved BL target
  n_report: 40
  # bound systems: dv_tan below the escape speed at the projected separation
  # (m_tot below) plus a margin is consistent with orbital motion -> excluded.
  bound_m_tot_msun: 2.0
  bound_dv_margin_kms: 1.0
  # Gaia close-pair astrometry: parallaxes of pairs closer than this on the sky
  # are biased (run 35992222801's first list was all 1-2" pairs); never ranked.
  min_sky_sep_arcsec: 4.0
