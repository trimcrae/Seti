name: slag

# SLAG-WD — polluted white dwarfs beyond the natural family (docs/slag.md).
#
#   probe ──▶ acquire ──▶ screen (sharded) ──▶ assess ──▶ commit-back
#
# Signature S51 (docs/necrofrontier.md §2): a white-dwarf photosphere is a
# mass spectrometer of what fell in.  Natural processes move element ratios
# along four levers — condensation temperature, metal–silicate partitioning,
# melt incompatibility, photospheric sinking.  Tier 1 asks, per object, how
# badly the best NATURAL parcel (meteorite / planetary mixture × condensation
# fractionation × Koester 2009 accretion phase) reproduces the measured
# vector, calibrated by refitting injected natural draws: the misfit list
# nobody has published.  Tier 2 asks whether a process-orthogonal pair
# (Ti/Al, Sc/Ca, Ca/Al, Sr/Ca, Mn/Cr, Ni/Co) sits > 4 sigma outside the
# natural envelope while the rest of a >= 5-element panel is natural.
#
# THE GOVERNING DISCIPLINES (docs/slag.md §5):
#  * PEWDD's columns are read from its own ASU metadata before any row is
#    requested; no column is addressed by a guessed name; log(Z/H) vs
#    log(Z/He) is resolved per row and recorded;
#  * the natural model's freedom is the same for the data and for every
#    calibration draw; the sinking phase is one number per object, so a pair's
#    allowed shift comes from the rest of its own panel;
#  * records with < 5 measured elements are INFORMATION_LIMITED, never
#    candidates; every kill (cool-He line physics, asynchronous accretion,
#    carbonate crust, multi-reference disagreement) is recorded, never
#    silently applied;
#  * the literature outliers run as controls and their landing is reported;
#  * a null is a reason to change the question, not a result — the misfit
#    list itself is the deliverable.
#
# Commit-back through scripts/commit_results.sh, which VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, acquire, screen, assess), "probe" (VizieR/GitHub
          inventory and column roles — cheap, run this first), or one of
          acquire / screen / assess (earlier outputs taken from results/slag/
          on the branch).
        required: false
        default: "all"
      shards:
        description: "Number of screen shards (matrix jobs)"
        required: false
        default: "4"
      n_cal:
        description: "Injected natural draws per calibrated panel (0 = config, 150)"
        required: false
        default: "0"
      names:
        description: "Comma-separated object names to screen (default: every object; controls are always reported)"
        required: false
        default: ""
      max_panels:
        description: "Cap on objects per shard (0 = no cap; use for a quick pass)"
        required: false
        default: "0"

permissions:
  contents: write

# The model matrices are ~30 x 18.  Threaded BLAS on them is pure overhead,
# and it costs real time: measured in the sandbox, four screen processes each
# spawning eight OpenBLAS threads on four cores dropped each process to ~6 %
# CPU.  One thread per process throughout.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      n: ${{ steps.mk.outputs.n }}
    steps:
      - id: mk
        run: |
          N="${{ github.event.inputs.shards || '4' }}"
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(1,int('$N')+1))))")" >> "$GITHUB_OUTPUT"

  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected refinery vector must be recovered on this runner
        run: python -m pytest tests/test_slag.py -q -p no:cacheprovider -k "injected or end_to_end or dead_archive"
      - name: Probe (VizieR tables and columns, GitHub trees, PyllutedWD timescale files)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'probe' || github.event.inputs.stage == 'acquire' }}
        run: |
          python -m seti.slag.run --stage probe
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/slag/probe.json"))
          p = d["pewdd"]
          print("PEWDD status", p["status"], "| vizier tables:", [t["table_name"] for t in p["vizier"]["tables"]])
          print("columns served:", len(p["vizier"]["columns"]), p["vizier"]["columns"][:80])
          r = p.get("roles") or {}
          print("roles:", {k: v for k, v in r.items() if k != "elements"})
          print("elements resolved:", {e: (v["value"], v["error"], v["limit"]) for e, v in (r.get("elements") or {}).items()})
          print("github:", p["github"])
          t = d["timescales"]
          print("PyllutedWD:", t.get("branch"), t.get("n_entries"), "entries;", len(t["files"]), "timescale-like files; parsed:", t["parsed"])
          for f in t["files"]:
              print("   ", f["path"], f.get("status"), f.get("parsed_columns"))
          for k in t.get("koester_pages", []):
              print("   koester", k["url"], k["status"], k["bytes"], k["links"][:15])
          print("pair envelopes (restricted):", json.dumps(d["pair_envelopes_restricted"]))
          PY
      - name: Acquire (PEWDD rows over the VizieR ladder, GitHub second)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire' }}
        run: |
          python -m seti.slag.run --stage acquire
          echo "=== acquire ==="
          python - <<'PY'
          import json
          d = json.load(open("results/slag/acquire.json"))
          p = d["pewdd"]
          print("route", p["route"], "status", p["status"], "rows", p["n_rows"], "endpoint", p.get("endpoint"))
          print("routes tried:", p["routes_tried"])
          print("github files:", [(f["path"], f["status"], f.get("n_rows"), f.get("n_columns")) for f in p.get("github", {}).get("files", [])])
          print("columns:", p["columns"][:100])
          r = d.get("roles") or {}
          print("roles:", {k: v for k, v in r.items() if k != "elements"})
          print("elements:", {e: v["value"] for e, v in (r.get("elements") or {}).items()})
          print("sinking-time columns:", r.get("sinking_time_columns"))
          m = d.get("meteorites") or {}
          print("meteorite tables:", m.get("n_files"))
          for f in m.get("files", []):
              print("   ", f["path"], f.get("status"), f.get("n_rows"), f.get("n_columns"))
              print("      columns:", f.get("columns"))
              print("      head:", (f.get("head") or "")[:300].replace("\n", " | "))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slag-data
          path: |
            results/slag/probe.json
            results/slag/acquire.json
            results/slag/acquisition_log.json
            results/slag/data/
          if-no-files-found: warn
      - name: Commit probe/acquire
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "slag: PEWDD probe/acquire — ${{ github.event.inputs.stage || 'all' }}" \
            results/slag/probe.json \
            results/slag/acquire.json \
            results/slag/acquisition_log.json \
            $(ls results/slag/data/*.csv 2>/dev/null)

  screen:
    needs: [prepare, acquire]
    if: ${{ always() && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.stage == 'all' }}
        with:
          name: slag-data
          path: results/slag/
      - name: Screen shard ${{ matrix.shard }}/${{ needs.prepare.outputs.n }}
        run: |
          NC=""
          if [ "${{ github.event.inputs.n_cal || '0' }}" != "0" ]; then NC="--n-cal ${{ github.event.inputs.n_cal }}"; fi
          NM=""
          if [ -n "${{ github.event.inputs.names }}" ]; then NM="--names ${{ github.event.inputs.names }}"; fi
          MP=""
          if [ "${{ github.event.inputs.max_panels || '0' }}" != "0" ]; then MP="--max-panels ${{ github.event.inputs.max_panels }}"; fi
          python -m seti.slag.run --stage screen --shard ${{ matrix.shard }}/${{ needs.prepare.outputs.n }} $NC $NM $MP
          python - <<'PY'
          import json, glob
          for f in sorted(glob.glob("results/slag/screen_*of*.json")):
              d = json.load(open(f))
              print(f, d.get("status"), "objects", d.get("n_objects"), "panels", d.get("n_panels"), "elapsed", d.get("elapsed_s"), "ts", d.get("timescale_source"), d.get("error"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slag-screen-${{ matrix.shard }}
          path: results/slag/screen_*of*.json
          if-no-files-found: warn

  assess:
    needs: [prepare, acquire, screen]
    if: ${{ always() && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen' || github.event.inputs.stage == 'assess') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.stage == 'all' }}
        with:
          name: slag-data
          path: results/slag/
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.stage != 'assess' }}
        with:
          pattern: slag-screen-*
          path: results/slag/
          merge-multiple: true
      - name: Assess (misfit list, pair table, flags, controls, verdict)
        run: |
          python -m seti.slag.run --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/slag/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("misfit_list_top", "tier2", "thresholds", "shards", "timescale_library")}, indent=2)[:9000])
          lib = (s.get("timescale_library") or {}).get("elements") or {}
          print("=== relative sinking timescales from the catalogue's own rows ===")
          print("  beta refit:", (s.get("timescale_library") or {}).get("beta"),
                "| rows with the reference:", (s.get("timescale_library") or {}).get("n_rows_with_reference"))
          for e, v in sorted(lib.items(), key=lambda kv: kv[1]["median"]):
              print(f"   {e:3s} log10(tau/tau_Ca) = {v['median']:+.3f} +/- {v['sigma']:.3f}  (n={v['n']})")
          print("=== misfit list (top) ===")
          for r in s["misfit_list_top"][:25]:
              print(f"  {r['name']:28s} n={r['n_measured']:2d} p={r['p_misfit']:.3f} full={r['p_misfit_full']} chi2/dof={r['chi2_per_dof']:.2f} {r['phase']:12s} {r['dominant_endmember']:14s} worst={r['worst_element']} {r['max_abs_residual_sigma']:.1f}s {r['misfit_class']}")
          print("=== controls ===")
          for c in json.load(open("results/slag/controls.json"))["controls"]:
              print(json.dumps(c)[:900])
          PY
      # A verdict must never read as a science null when nothing was compared.
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/slag/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, f = s.get("verdict", ""), s.get("funnel", {})
          if f.get("panels_total", 0) == 0 and v != "NO_DATA_REACHED":
              print(f"::error::verdict {v!r} with 0 panels is a disguised no-data run"); sys.exit(1)
          if v == "MISFIT_LIST_PRODUCED":
              print(f"::notice::{f.get('panels_screened_and_calibrated')} panels calibrated; {f.get('misfit_unexplained')} UNEXPLAINED, {f.get('misfit_watch')} WATCH; {f.get('candidates_before_kills')} pair/flag exceedances, all killed. THE LIST IS THE DELIVERABLE — see results/slag/misfit_list.csv and docs/slag.md.")
          if v == "REFINERY_VECTOR_CANDIDATE":
              print(f"::notice::{f.get('candidates_surviving')} surviving pair/flag candidate(s) — PENDING vet, see results/slag/candidates.csv")
          if s.get("degraded"):
              print("::warning::degraded: " + "; ".join(s["degraded"]))
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "slag: polluted WDs beyond the natural family — ${{ github.event.inputs.stage || 'all' }}" \
            results/slag/summary.json \
            results/slag/controls.json \
            results/slag/misfit_list.csv \
            results/slag/pairs.csv \
            results/slag/flags.csv \
            results/slag/candidates.csv \
            $(ls results/slag/screen_*of*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slag-final
          path: results/slag/
          if-no-files-found: warn
