name: baffle-radio

# BAFFLE / radio — a hole in the LoTSS DR2 (LOFAR 144 MHz) source counts
# around a nearby star (src/seti/baffle/radio.py).
#
# A radio-opaque screen of radius R >= 1 AU on the Sun -> star line at
# 10^2 - 10^4 AU blocks, by reciprocity, every background radio source within
# R/d of the star as seen from Earth: 3.4' at 1000 AU.  LoTSS DR2 is the only
# public catalogue deep enough (~900 sources / deg^2) for such a void to be
# significant; NVSS / RACS / VLASS expect < 1 source in that aperture.
#
#   probe  TAP_SCHEMA discovery (VizieR J/A+A/659/A1, ASTRON fallback) and one
#          tiny box query -> results/baffle_radio/probe.json.  Cheap; run first.
#   run    Gaia DR3 targets (parallax > 20 mas) in the LoTSS DR2 sky, the
#          catalogue pulled once per 2 deg tile (checkpointed under tiles/,
#          ledgered, one failed tile never stops the run), the void statistic
#          at every target and four 45' controls, then voids.csv,
#          candidates.csv, summary.json.
#
# No table or column name is hard-coded: everything used is discovered from
# TAP_SCHEMA and written into the ledger.  Commit-back goes through
# scripts/commit_results.sh, which VERIFIES the push; the tiles/ checkpoints
# stay in the artifact only.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "probe (schema discovery + one box query) or run (the full screen)"
        required: false
        default: "probe"
        type: choice
        options:
          - probe
          - run
      max_targets:
        description: "Screen only the N nearest targets (0 = all)"
        required: false
        default: "0"
      tile_deg:
        description: "Catalogue tile size in degrees"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the statistic must behave on this runner
        run: python -m pytest tests/test_baffle_radio.py -q -p no:cacheprovider
      - name: Run (${{ inputs.stage }})
        run: |
          MT=""
          if [ "${{ inputs.max_targets || '0' }}" != "0" ]; then
            MT="--max-targets ${{ inputs.max_targets }}"
          fi
          python -m seti.baffle.radio --stage ${{ inputs.stage }} \
            --tile-deg "${{ inputs.tile_deg || '2' }}" $MT || echo "::warning::radio stage exited non-zero (NO_DATA_REACHED?)"
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          for name in ("probe.json", "summary.json"):
              p = os.path.join("results/baffle_radio", name)
              if not os.path.exists(p):
                  continue
              d = json.load(open(p))
              print(f"=== {name} ===")
              print("verdict:", d.get("verdict"))
              disc = d.get("discovery") or {}
              print("table:", disc.get("table"), "cols:", disc.get("ra_col"),
                    disc.get("dec_col"), disc.get("flux_col"), disc.get("flux_unit"))
              if name == "summary.json":
                  print("targets:", d.get("targets"))
                  print("tiles:", d.get("tiles"))
                  f = d.get("funnel") or {}
                  print("funnel:", {k: v for k, v in f.items() if isinstance(v, (int, float))})
                  print("control false-void rate:", d.get("control_false_void_rate"))
                  v = str(d.get("verdict_code"))
                  if "CANDIDATES" in v:
                      print(f"::notice::{d.get('n_candidates')} radio-void candidate(s) PENDING VET — results/baffle_radio/candidates.csv")
                  elif "NO_DATA" in v:
                      print("::warning::NO_DATA_REACHED — see tiles_ledger.json / discovery")
              else:
                  print("probe box:", d.get("probe_box", {}).get("n_rows"), "rows,",
                        d.get("probe_box", {}).get("density_per_deg2"), "/deg2")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baffle-radio-${{ inputs.stage }}
          path: results/baffle_radio/
          if-no-files-found: warn
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The push is VERIFIED against the remote (scripts/commit_results.sh);
          # a failure turns this run red rather than dropping the results in a
          # green one.  Only the small summary files are committed -- the
          # per-tile parquet checkpoints stay in the artifact.
          scripts/commit_results.sh \
            "baffle-radio: LoTSS voids around nearby stars" \
            results/baffle_radio/probe.json \
            results/baffle_radio/summary.json \
            results/baffle_radio/tiles_ledger.json \
            results/baffle_radio/voids.csv \
            results/baffle_radio/candidates.csv
