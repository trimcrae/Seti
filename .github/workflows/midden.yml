name: midden

# MIDDEN — survey-scale short-lived-radionuclide search (Whitmire & Wright
# 1980 nuclear-waste-disposal technosignature) in ESO Phase-3 HARPS+FEROS
# spectra (docs/midden.md).  Single job; every stage checkpoints to disk
# (targets parquet, per-chunk ObsCore parquets, per-batch measurement
# parquets), so a re-run — or an artifact-seeded resume — restarts at the
# batch where a kill happened.  Scores/report are committed back; bulk
# parquets travel only as artifacts.  The FIRST step re-verifies the encoded
# line list against the NIST Atomic Spectra Database and hard-fails the run
# on any mismatch: the wavelengths are never silently trusted.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (verify-lines|targets|acquire|score|all)"
        required: false
        default: "all"
      max_spectra:
        description: "v1 corpus cap (spectra, after per-star de-dup)"
        required: false
        default: "3000"
      resume_run_id:
        description: "Prior run id whose checkpoint artifact should seed this run (skips completed batches)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  midden:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import pyvo, astroquery, pyarrow; print('imports OK')"
      - name: Verify line list against NIST (hard gate)
        run: |
          python -m seti.cli midden --stage verify-lines
          cat results/midden/line_verification.json
      - name: Seed checkpoints from a prior run's artifact
        if: ${{ github.event.inputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: midden-outputs
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: results/midden/
      - name: Run radionuclide search
        if: ${{ github.event.inputs.stage != 'verify-lines' }}
        run: |
          ls -la results/midden/ 2>/dev/null || true
          python -m seti.cli midden \
            --stage ${{ github.event.inputs.stage || 'all' }} \
            --max-spectra ${{ github.event.inputs.max_spectra || '3000' }}
          echo "=== summary ==="
          cat results/midden/summary.json || true
      - name: Commit results (scores + report only; parquets stay artifacts)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/midden/line_verification.json \
                        results/midden/scores.csv \
                        results/midden/line_flag_rates.csv \
                        results/midden/candidates.json \
                        results/midden/summary.json \
                        results/midden/REPORT.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "midden: ESO HARPS+FEROS radionuclide search results"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midden-outputs
          path: results/midden/
          if-no-files-found: warn
