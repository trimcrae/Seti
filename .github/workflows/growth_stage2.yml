name: growth-stage2

# GROWTH stage 2 — MEASURE the depth in BOTH ERAS from the light curves
# (docs/growth.md §7).
#
#   probe ──▶ measure (KOI ephemerides + TOI depths + KEPLER and TESS light
#             curves, one fitter) ──▶ assess ──▶ commit-back
#
# WHY THIS STAGE EXISTS.  Stage 1 compares two heterogeneous CATALOGUE depths,
# and run 35038510064's own population shows its formal errors are not a sigma
# scale: of 108 measured planets, 31 sit above 5 sigma of the population median
# and 37 above 3.  A third of a sample cannot be five-sigma outliers unless the
# errors fail to describe the pipeline-to-pipeline scatter, so the z = 8.67 on
# K00897.01 (Kepler-718 b, KIC 7849854, TIC 268924036, TOI 4490.01) is not an
# 8.67-sigma statement.
#
# AND WHY IT WAS EXTENDED.  The first form of this stage fitted the TESS era and
# then compared it with cumulative.koi_depth — A CATALOGUE NUMBER, from another
# pipeline, another decade, another aperture.  That is the very heterogeneity
# the stage exists to escape.  BOTH eras are now fitted HERE, by the SAME code:
# same fold, same transit-masked local baseline, same exposure-shrunk core, same
# bootstrap, same dedupe.  Only the archive product and the time system differ
# (Kepler light curves are BKJD — the system koi_time0bk is already in — so the
# Kepler era applies NO epoch conversion; the TESS era subtracts 2167 days).
#
# THE PRIMARY VERDICT is therefore the like-for-like one:
#   MEASURED_DEPTH_CHANGED        our two fits disagree: the change survives a
#                                 comparison in which nothing but the sky differs
#   MEASURED_DEPTH_UNCHANGED      they agree AND the comparison had the power to
#                                 have seen the claimed change: nothing changed,
#                                 koi_depth is wrong for this object, candidate dies
#   MEASURED_DEPTH_UNRESOLVED     they agree WITHOUT that power — never a refutation
#   MEASURED_DEPTH_ERA_UNMEASURED one or both eras produced no depth; an
#                                 unmeasured era never agrees with anything
# Either of the first two is valuable and NEITHER IS FAVOURED.
#
# The three-number CATALOGUE comparison is kept and is now a diagnostic of the
# CATALOGUES rather than of the sky — MEASURED_DEPTH_MATCHES_KEPLER / _TOI /
# _NEITHER / _BOTH say which table is right about the TESS era.  Separately, our
# Kepler-era fit is checked against koi_depth in the Kepler band (no band
# ratio): a disagreement is KOI_DEPTH_CONTRADICTED, a finding about the KOI
# TABLE — stage 1's own input — and is surfaced as an annotation here.
#
# AND WHY IT WAS EXTENDED AGAIN — THE REDUCTION ENSEMBLE.  The quoted TESS error
# did not describe the real scatter, and the evidence is in this channel's own
# output.  Before dedupe_sectors existed, run 35041932130 measured THE SAME
# SEVEN SECTORS under two pipelines (results/growth/stage2/sectors.csv at commit
# 050402a): the 2-minute SPOC reductions gave 25,425–35,498 ppm and the FFI
# TESS-SPOC reductions OF THE SAME PIXELS gave 33,078–39,798 ppm.  Two
# reductions of identical photons disagreeing by 20–30 % is a systematic FAR
# larger than the 1,521 ppm the bootstrap quotes; the out-of-transit scatter is
# 414 ppm in Kepler against 67,631 ppm in TESS, a factor of 163, because at
# G = 15.23 the TESS light curve is faint and systematics-limited.  Stage 1's
# entire failure was a quoted error that did not describe the real scatter.
#
# So stage 2 now measures the depth under EVERY reduction the archive serves —
# every (pipeline author, flux column) member of the grid — and folds the spread
# over those members into the error as a systematic.  THE LIKE-FOR-LIKE VERDICT
# USES THE TOTAL ERROR.  A ratio that survives the ensemble is a much stronger
# statement than one that survives only the bootstrap; a ratio that does NOT
# survive it comes back MEASURED_DEPTH_UNRESOLVED, and that is the correct
# answer.  The ensemble does NOT move the depth: the reported depth is still the
# DEDUPLICATED one (one sector, one reduction, counted once) and the ensemble
# sets its ERROR and only its error.  SAP_FLUX is in the grid deliberately —
# PDC is where the crowding and background corrections are applied, so
# "an over-subtracted background inflates the depth" is answered with a number
# (sap_minus_pdcsap_ppm and its significance) rather than left as a worry.
# reductions.csv is the audit trail: one row per member, with its own reason
# when it produced no depth.
#
# THE GOVERNING DISCIPLINES:
#  * an era whose light curves could not be fetched is UNMEASURED with reason
#    QUERY_FAILED — and QUERY_RETURNED_ZERO_ROWS stays a different fact, as does
#    KEPLER_ERA_NOT_ATTEMPTED (nothing was ASKED of the archive);
#  * WHICH product (SPOC 2-min vs TESS-SPOC / QLP FFI; Kepler short vs 29.4-min
#    long cadence) and WHICH sectors/quarters were used is recorded per target:
#    a 29.4-minute integration on a 2.078-hour transit is smeared and the record
#    says so rather than reporting a shallow depth as a depth;
#  * every network stage has a WALL-CLOCK BUDGET (config/growth.yaml
#    stage2.mast.budget_s / per_target_budget_s, and the SEPARATE
#    kepler_budget_s / kepler_per_target_budget_s so one era cannot starve the
#    other), because an unbounded stage cost this channel a whole run
#    (34789826297);
#  * NO_DATA_REACHED / LIKE_FOR_LIKE_NO_DATA is not a null result and is not
#    written up (CLAUDE.md).
#
# What stage 2 still CANNOT do: a deeper TESS transit cannot be caused by
# dilution, but a signal ORIGINATING ON A DIFFERENT STAR inside the ~21" TESS
# pixel produces exactly this.  The odd-even statistic catches one flavour of
# it; the centroid test is stage 3 and is listed in checks_not_performed.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, measure, assess), "probe" (which MAST route exists on
          the runner — run this first), or "assess" to re-read the committed
          measurements.csv without touching any archive.
        required: false
        default: "all"

permissions:
  contents: write

jobs:
  growth-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `tess` brings lightkurve; the module falls back to astroquery.mast +
          # astropy.io.fits if it is absent, and probe.json records which route
          # this runner actually has.
          pip install -e ".[dev,tess]"
      # The gate is the load-bearing offline test: an injected, KNOWN depth must
      # be recovered to within the fit's own quoted error on THIS runner — at
      # TESS 2-minute cadence AND at Kepler's 29.4-minute long cadence — along
      # with the per-era epoch handling (BKJD stays BKJD on the Kepler side; a
      # double conversion is shown to destroy the fold), the smearing flag, the
      # short-cadence month-file merge, the odd-even EB signature, and every
      # branch of the like-for-like and three-way verdicts.
      - name: Offline gate — the injected depth must be recovered on this runner
        run: python -m pytest tests/test_growth_stage2.py -q -p no:cacheprovider
      - name: Probe (which MAST route exists here)
        if: ${{ github.event.inputs.stage != 'assess' }}
        run: |
          python -m seti.growth.stage2 --stage probe
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/growth/stage2/probe.json"))
          m = d["mast"]
          print("route_preferred:", m.get("route_preferred"))
          for k in ("lightkurve", "astroquery_mast", "astropy_io_fits"):
              print(" ", k, m[k])
          print("shortlist:", d.get("shortlist_size"))
          if not m.get("route_preferred"):
              print("::error::no route to MAST on this runner — neither lightkurve nor "
                    "astroquery.mast+astropy.io.fits imported")
          PY
      - name: Measure (KOI ephemerides, TOI depths, KEPLER + TESS light curves, one fitter)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == '' }}
        run: |
          python -m seti.growth.stage2 --stage measure
          echo "=== measure ==="
          python - <<'PY'
          import json
          d = json.load(open("results/growth/stage2/acquire.json"))
          print(json.dumps({k: d[k] for k in d if k != "acquisition"}, indent=2)[:8000])
          # Every failed attempt's exception TEXT, not a bare count — the
          # 2026-09-13 lesson from the Gaia stage.
          for s in (d.get("acquisition") or {}).get("stages") or []:
              if s.get("status") != "OK":
                  print(f"::warning::{s['stage']}: {s['status']} {s.get('error','')}")
          if d.get("budget_exhausted"):
              print("::warning::the stage-2 TESS wall-clock budget was exhausted; targets it "
                    "did not reach are UNMEASURED (BUDGET_EXHAUSTED), NOT refuted")
          if d.get("kepler_budget_exhausted"):
              print("::warning::the stage-2 KEPLER wall-clock budget was exhausted; the "
                    "like-for-like comparison it did not reach is ERA_UNMEASURED, NOT refuted")
          if not d.get("kepler_era_enabled"):
              print("::error::the Kepler era was not attempted — the PRIMARY (like-for-like) "
                    "comparison is switched off. Set stage2.mast.kepler_enabled: true in "
                    "config/growth.yaml.")
          print("kepler statuses:", d.get("kepler_lc_status_counts"),
                "routes:", d.get("kepler_lc_routes"),
                "compared like-for-like:", d.get("n_compared_like_for_like"))
          if not d.get("ensemble_enabled"):
              print("::error::the REDUCTION ENSEMBLE was not attempted, so the quoted error is "
                    "the bootstrap alone — the very error model that did not describe the "
                    "20-30 % SPOC-vs-TESS-SPOC disagreement on this object. Set "
                    "stage2.ensemble.enabled: true in config/growth.yaml.")
          if d.get("ensemble_budget_exhausted") or d.get("ensemble_kepler_budget_exhausted"):
              print("::warning::a reduction-ensemble wall-clock budget was exhausted; the "
                    "members it did not reach are BUDGET_EXHAUSTED and the spread is therefore "
                    "a LOWER BOUND on the true reduction systematic")
          print("ensemble members:", d.get("n_reduction_members"),
                d.get("reduction_member_status_counts"))
          PY
      - name: Assess (the like-for-like verdict, then the catalogue diagnostic)
        if: ${{ github.event.inputs.stage != 'probe' }}
        run: |
          python -m seti.growth.stage2 --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/growth/stage2/summary.json"))
          print(json.dumps({k: s[k] for k in s if k != "config"}, indent=2)[:12000])
          PY
      # A verdict must never read as a science statement when nothing was measured.
      - name: Assert the verdict is not a disguised no-data run
        if: ${{ github.event.inputs.stage != 'probe' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/growth/stage2/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), s.get("n_measured", 0)
          tv = s.get("target_verdicts") or {}
          pv = s.get("primary_verdict", "")
          nl = s.get("n_compared_like_for_like", 0)
          lv = s.get("like_for_like_verdicts") or {}
          acq = s.get("acquisition") or {}

          # ---- THE PRIMARY VERDICT: our Kepler-era fit vs our TESS-era fit ----
          if not s.get("primary_verdict_field"):
              print("::error::summary.json does not say which verdict is primary")
              sys.exit(1)
          if s.get("verdict_is_primary"):
              print("::error::the catalogue verdict is marked primary; the like-for-like "
                    "comparison is the primary one")
              sys.exit(1)
          if acq.get("kepler_era_enabled") is False:
              print("::error::the Kepler era was not attempted, so there is NO like-for-like "
                    "comparison: this run repeats the asymmetry stage 2 exists to remove. "
                    "Set stage2.mast.kepler_enabled: true in config/growth.yaml.")
              sys.exit(1)
          if nl == 0 and pv != "LIKE_FOR_LIKE_NO_DATA":
              print(f"::error::primary verdict {pv!r} with 0 like-for-like comparisons is a "
                    "disguised no-data run")
              sys.exit(1)
          if nl > 0 and pv == "LIKE_FOR_LIKE_NO_DATA":
              print(f"::error::LIKE_FOR_LIKE_NO_DATA with {nl} comparisons is incoherent")
              sys.exit(1)
          # An unresolved comparison may never be counted as a refutation.
          if pv == "MEASURED_DEPTH_CHANGE_REFUTED" and lv.get("MEASURED_DEPTH_UNRESOLVED"):
              print("::error::the run is REFUTED while carrying MEASURED_DEPTH_UNRESOLVED "
                    "targets — an agreement without the power to disagree is not a refutation")
              sys.exit(1)
          # An era that was not measured may never be scored as agreeing.
          for t in s.get("targets") or []:
              if t.get("like_for_like_verdict") == "MEASURED_DEPTH_ERA_UNMEASURED":
                  if t.get("measured_eras_agree"):
                      print(f"::error::{t.get('kepoi_name')} has an unmeasured era and yet its "
                            "two eras are scored as agreeing — a fabricated agreement")
                      sys.exit(1)
                  if not t.get("like_for_like_unmeasured_reason"):
                      print(f"::error::{t.get('kepoi_name')} has an unmeasured era with no "
                            "reason given")
                      sys.exit(1)

          if pv == "LIKE_FOR_LIKE_NO_DATA":
              print(f"::notice::{s.get('primary_reason')} — NOT a null result and NOT written "
                    "up (CLAUDE.md); the light curves of at least one era were not reached.")
          if pv == "MEASURED_DEPTH_CHANGE_CONFIRMED":
              print(f"::notice::{lv.get('MEASURED_DEPTH_CHANGED')} target(s) changed depth "
                    "between OUR Kepler-era fit and OUR TESS-era fit — same fitter, same fold, "
                    "same bootstrap. The change survives a like-for-like comparison. This is "
                    "STILL NOT A DETECTION: the centroid test is outstanding.")
          if pv == "MEASURED_DEPTH_CHANGE_REFUTED":
              print(f"::notice::{lv.get('MEASURED_DEPTH_UNCHANGED')} target(s): our own fit to "
                    "the KEPLER light curve agrees with our own fit to the TESS light curve. "
                    "NOTHING CHANGED — the KOI catalogue depth is simply wrong for this object, "
                    "the stage-1 candidate dies, and the channel has learned something about "
                    "its stage-1 INPUTS. See summary.json['koi_catalogue_check'].")
          if pv == "MEASURED_DEPTH_CHANGE_UNRESOLVED":
              print(f"::notice::{s.get('primary_reason')} — an agreement WITHOUT the power to "
                    "have seen the change under test is not a refutation; no pick is made.")

          # ---- THE REDUCTION ENSEMBLE: did the verdict use the total error? ----
          ens = s.get("reduction_ensemble") or {}
          if acq.get("ensemble_enabled") is False:
              print("::error::the reduction ensemble was not attempted, so the like-for-like "
                    "verdict rests on the BOOTSTRAP ALONE. Run 35041932130 measured the same "
                    "seven sectors under two pipelines and they disagreed by 20-30 % against a "
                    "1,521 ppm quoted error. Set stage2.ensemble.enabled: true in "
                    "config/growth.yaml.")
              sys.exit(1)
          for t in s.get("targets") or []:
              if t.get("like_for_like_verdict") not in ("MEASURED_DEPTH_CHANGED",
                                                        "MEASURED_DEPTH_UNCHANGED"):
                  continue
              # A verdict that decides the question must have carried the
              # systematic, or it is the stage-1 error one level down.
              if t.get("reduction_systematic_applied") is False:
                  print(f"::error::{t.get('kepoi_name')} reached "
                        f"{t.get('like_for_like_verdict')} WITHOUT a reduction systematic: the "
                        "quoted error is the bootstrap alone and describes only the photon "
                        "noise, not the pipeline-to-pipeline scatter")
                  sys.exit(1)
              tot = t.get("depth_tess_measured_total_err_ppm")
              stat = t.get("depth_tess_measured_err_ppm")
              if tot is not None and stat is not None and tot < stat:
                  print(f"::error::{t.get('kepoi_name')}: the TOTAL error is smaller than the "
                        "statistical one, which is arithmetically impossible")
                  sys.exit(1)
          for tgt in ens.get("targets") or []:
              for era in ("tess", "kepler"):
                  blk = tgt.get(era) or {}
                  if blk.get("ensemble_incomplete"):
                      print(f"::warning::{tgt.get('kepoi_name')} [{era}]: "
                            f"{blk.get('n_members_unavailable')} of {blk.get('n_members')} "
                            f"reductions produced no depth "
                            f"({blk.get('ensemble_unavailable_reasons')}) — the spread over the "
                            "survivors is a LOWER BOUND on the reduction systematic")
                  if blk.get("depth_reduction_spread_status") == "TOO_FEW_MEMBERS":
                      print(f"::warning::{tgt.get('kepoi_name')} [{era}]: fewer reductions came "
                            "back than the ensemble needs, so there is NO spread — the error is "
                            "the bootstrap alone and is NOT known to describe the real scatter")
              ve = tgt.get("verdict_errors") or {}
              print(f"::notice::{tgt.get('kepoi_name')}: z = {ve.get('z_measured_eras')} on the "
                    f"TOTAL error against {ve.get('z_measured_eras_stat_only')} on the bootstrap "
                    f"alone — verdict {ve.get('like_for_like_verdict')}")
          # The background/crowding hypothesis, answered with a number.
          if ens.get("background_test_finding"):
              print(f"::warning::{ens['background_test_finding']}")
              for b in ens.get("targets_where_sap_and_pdcsap_disagree") or []:
                  print(f"::warning::{b.get('kepoi_name')}: SAP - PDCSAP = "
                        f"{b.get('sap_minus_pdcsap_ppm')} ppm (z {b.get('z')}), "
                        f"{b.get('direction')}")

          # ---- the KOI table itself -------------------------------------------
          chk = s.get("koi_catalogue_check") or {}
          if chk.get("finding"):
              print(f"::warning::{chk['finding']}")
              for t in chk.get("targets_contradicting_the_koi_table") or []:
                  print(f"::warning::{t.get('kepoi_name')}: koi_depth {t.get('koi_depth_ppm')} "
                        f"ppm vs OUR Kepler-era fit {t.get('our_kepler_depth_ppm')} ppm "
                        f"(ratio {t.get('ratio')}, z {t.get('z')})")

          # ---- the secondary, catalogue-diagnostic verdict ---------------------
          if n == 0 and v != "NO_DATA_REACHED":
              print(f"::error::verdict {v!r} with 0 measured targets is a disguised no-data run")
              sys.exit(1)
          if n > 0 and v == "NO_DATA_REACHED":
              print(f"::error::verdict NO_DATA_REACHED with {n} measured targets is incoherent")
              sys.exit(1)
          # An UNMEASURED target may never have been scored as agreeing with anything.
          for t in s.get("targets") or []:
              if t.get("verdict") == "UNMEASURED":
                  if t.get("agrees_with_kepler") or t.get("agrees_with_toi"):
                      print(f"::error::{t.get('kepoi_name')} is UNMEASURED and yet agrees with "
                            "a catalogue depth — a fabricated agreement")
                      sys.exit(1)
                  if not t.get("unmeasured_reason"):
                      print(f"::error::{t.get('kepoi_name')} is UNMEASURED with no reason given")
                      sys.exit(1)
          if v == "NO_DATA_REACHED":
              print(f"::notice::{s.get('reason')} — NOT a null result and NOT written up "
                    "(CLAUDE.md); the light curves were not reached.")
          # These are statements about the CATALOGUES, not about the sky: the
          # sky question is the primary verdict above.
          if v == "STAGE1_DEPTH_CHANGE_REFUTED":
              print(f"::notice::[catalogue diagnostic] our TESS-era fit agrees with the KOI "
                    f"table's depth for {tv.get('MEASURED_DEPTH_MATCHES_KEPLER')} target(s): "
                    "the TOI catalogue value is wrong about the TESS era.")
          if v == "STAGE1_DEPTH_CHANGE_CONFIRMED":
              print(f"::notice::[catalogue diagnostic] our TESS-era fit agrees with the TOI "
                    f"table for {tv.get('MEASURED_DEPTH_MATCHES_TOI')} target(s): the TOI "
                    "value is right about the TESS era. Whether the depth CHANGED is the "
                    "primary verdict above, not this one.")
          if v == "STAGE1_DEPTH_CHANGE_UNRESOLVED":
              print(f"::notice::[catalogue diagnostic] {s.get('reason')} — reported, not "
                    "resolved; no pick is made.")
          for k, c in (s.get("flags") or {}).items():
              print(f"::warning::flag {k}: {c} target(s)")
          for k, c in (s.get("unmeasured_reasons") or {}).items():
              print(f"::warning::unmeasured ({k}): {c} target(s)")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The push is VERIFIED against the remote (scripts/commit_results.sh);
          # the downloaded FITS products stay in the artifact only.
          scripts/commit_results.sh \
            "growth stage 2: BOTH eras measured with one fitter, every reduction measured for the systematic — like-for-like depth verdict on the TOTAL error" \
            results/growth/stage2/probe.json \
            results/growth/stage2/acquire.json \
            results/growth/stage2/acquisition_log.json \
            results/growth/stage2/measurements.csv \
            results/growth/stage2/sectors.csv \
            results/growth/stage2/reductions.csv \
            results/growth/stage2/summary.json \
            results/growth/stage2/folds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-stage2-final
          path: results/growth/stage2/
          if-no-files-found: warn
