name: occult

# OCCULT (S40) --- an opaque microlens occulting its own images, searched in
# the public OGLE-IV EWS and KMTNet event photometry (docs/occult.md).
#
#   catalog ──▶ controls (GATE) ──▶ screen (N shards) ──▶ assess ──▶ commit-back
#
# * probe (stage=probe) measured what is reachable (runs 36003872955 and the
#   round-2 probe): OGLE data on www.astrouw.edu.pl (lenses.par + phot.dat),
#   KMTNet listpage.dat + one pysis.tar.gz per event, MOA unreachable.
# * controls run FIRST: named finite-source and binary-lens events must come
#   out NOT an occultation, and opaque lenses injected into the real baselines
#   of the finite-source events must be recovered.  A failed gate stops the
#   screen (force=true overrides, and the summary then says so).
# * every shard purges checkout-inherited shard outputs, appends one JSON line
#   per finished unit (resumable), uploads only its own files by name, and
#   stops starting units after budget_s.
# * assess downloads shard artifacts BY NAME (occult-shard-*), computes the
#   empirical null threshold from the anti-occultation template, the funnel,
#   the injection efficiency map, and commits through scripts/commit_results.sh.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (catalog, controls, screen, assess), "probe", "catalog",
          "controls", "screen" (uses the committed catalog + controls), or
          "assess" (with reduce_only_run_id).
        required: false
        default: "all"
      shards:
        description: "Number of screen shards"
        required: false
        default: "40"
      max_parallel:
        description: "Shards running at once"
        required: false
        default: "20"
      workers:
        description: "Processes per shard"
        required: false
        default: "4"
      budget_s:
        description: "Seconds after which a shard starts no new unit"
        required: false
        default: "17400"
      max_units:
        description: "Cap on units per shard (0 = all; small values for a smoke run)"
        required: false
        default: "0"
      force:
        description: "Run the screen even if the controls gate did not pass (the summary says so)"
        required: false
        default: "false"
      resume_run_id:
        description: "Resume each shard from occult-shard-<i> of this run (same shard count)"
        required: false
        default: ""
      reduce_only_run_id:
        description: "Skip everything but assess; use this run's shard artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event.inputs.stage == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe OGLE / KMTNet / MOA
        run: |
          python -m seti.cli occult probe
      - name: Commit the probe result
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "occult: probe --- OGLE/KMTNet/MOA reachability and formats" \
            results/occult/probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occult-probe
          path: results/occult/probe.json
          if-no-files-found: warn

  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' && contains(fromJSON('["all","screen"]'), github.event.inputs.stage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      n_shards: ${{ steps.mk.outputs.n_shards }}
      max_parallel: ${{ steps.mk.outputs.max_parallel }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.shards || '40' }}" or 40)
          mp = int("${{ github.event.inputs.max_parallel || '20' }}" or 20)
          print("matrix=" + json.dumps({"include": [{"shard": i} for i in range(n)]}))
          print(f"n_shards={n}")
          print(f"max_parallel={max(1, min(mp, n))}")
          PY

  catalog:
    if: ${{ github.event.inputs.reduce_only_run_id == '' && contains(fromJSON('["all","catalog"]'), github.event.inputs.stage) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build the catalogue (OGLE lenses.par x KMTNet listpage.dat)
        run: python -m seti.cli occult catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occult-catalog
          path: |
            results/occult/catalog.json.gz
            results/occult/catalog_meta.json
          if-no-files-found: warn
      - name: Commit the catalogue
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "occult: event catalogue (OGLE-IV EWS x KMTNet public seasons)" \
            results/occult/catalog.json.gz results/occult/catalog_meta.json

  controls:
    needs: [catalog]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && contains(fromJSON('["all","controls"]'), github.event.inputs.stage) && needs.catalog.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate on this runner (injected lens recovered, confounders rejected, empty archive honest)
        run: python -m pytest tests/test_occult.py -q -p no:cacheprovider
      - name: This run's catalogue
        if: ${{ needs.catalog.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: occult-catalog
          path: results/occult/
      - name: Positive controls on real photometry
        run: python -m seti.cli occult controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occult-controls
          path: results/occult/controls.json
          if-no-files-found: warn
      - name: Commit the controls
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "occult: positive controls (finite-source + binary-lens events, injections into real baselines)" \
            results/occult/controls.json

  screen:
    needs: [plan, catalog, controls]
    if: ${{ always() && needs.plan.result == 'success' && needs.catalog.result != 'failure' && needs.controls.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Purge checkout-inherited shard outputs
        run: |
          rm -rf results/occult/shards
          rm -rf results/occult/lc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: This run's catalogue
        if: ${{ needs.catalog.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: occult-catalog
          path: results/occult/
      - name: This run's controls
        if: ${{ needs.controls.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: occult-controls
          path: results/occult/
      - name: Resume this shard from a prior run
        if: ${{ github.event.inputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: occult-shard-${{ matrix.shard }}
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: results/occult/shards/
      - name: Gate --- the controls must have passed
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("results/occult/controls.json")
          c = json.loads(p.read_text()) if p.exists() else {}
          ok = bool(c.get("passed"))
          force = "${{ github.event.inputs.force }}" == "true"
          print(f"run={'true' if (ok or force) else 'false'}")
          print(f"controls={c.get('verdict', 'MISSING')}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Screen shard ${{ matrix.shard }}
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python -m seti.cli occult screen \
            --shard ${{ matrix.shard }} --n-shards ${{ needs.plan.outputs.n_shards }} \
            --budget-s ${{ github.event.inputs.budget_s || '17400' }} \
            --max-units ${{ github.event.inputs.max_units || '0' }} \
            --workers ${{ github.event.inputs.workers || '4' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occult-shard-${{ matrix.shard }}
          path: results/occult/shards/*_s${{ matrix.shard }}of${{ needs.plan.outputs.n_shards }}*
          if-no-files-found: warn

  assess:
    needs: [plan, screen]
    if: ${{ always() && (github.event.inputs.reduce_only_run_id != '' || (needs.plan.result == 'success' && needs.screen.result != 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Purge checkout-inherited shard outputs
        run: |
          rm -rf results/occult/shards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Shard artifacts of this run
        if: ${{ github.event.inputs.reduce_only_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: occult-shard-*
          merge-multiple: true
          path: results/occult/shards/
      - name: Controls of this run
        if: ${{ github.event.inputs.reduce_only_run_id == '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: occult-controls
          path: results/occult/
      - name: Shard artifacts of a prior run
        if: ${{ github.event.inputs.reduce_only_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: occult-shard-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/occult/shards/
      - name: Assess
        run: |
          ls results/occult/shards | head -50
          N=$(ls results/occult/shards/screen_s*of*.jsonl 2>/dev/null | head -1 | sed -E 's/.*of([0-9]+)\.jsonl/\1/')
          if [ -z "$N" ]; then echo "::error::no shard output reached assess"; N=${{ needs.plan.outputs.n_shards || '1' }}; fi
          python -m seti.cli occult assess --n-shards "$N"
          python - <<'PY'
          import json; s = json.load(open("results/occult/summary.json"))
          print(json.dumps({k: s[k] for k in ("verdict", "funnel", "null_threshold", "controls_verdict")}, indent=1))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occult-final
          path: |
            results/occult/summary.json
            results/occult/candidates.json
            results/occult/screen_compact.jsonl.gz
            results/occult/injections.jsonl.gz
            results/occult/lc/
          if-no-files-found: warn
      - name: Commit the assessment
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "occult: screen assessment --- funnel, null threshold, injection efficiency, candidates" \
            results/occult/summary.json results/occult/candidates.json \
            results/occult/screen_compact.jsonl.gz results/occult/injections.jsonl.gz \
            $(ls -d results/occult/lc 2>/dev/null)
