name: catrecon

# Pure catalogue-METADATA reconnaissance for the far-IR all-sky catalogues
# (AKARI FIS/IRC, IRAS PSC/FSC). Fetches VizieR ReadMe byte-by-byte column
# definitions, TAP_SCHEMA table/column listings, exact row counts, and
# empirical quality-flag histograms, then commits them under results/catrecon/.
# No science and no bulk data: this exists so that later catalogue jobs use
# exact, verified table and column names instead of guesses.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catrecon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests astroquery
      - name: Run catalogue metadata recon
        run: python scripts/catrecon4.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/catrecon/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "catrecon: exact VizieR metadata for AKARI FIS/IRC + IRAS PSC/FSC"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catrecon-outputs
          path: results/catrecon/
          if-no-files-found: warn
