name: necrofrontier-probe

# NECROFRONTIER data-source probe (scripts/necrofrontier_probe.py).
#
# docs/necrofrontier.md proposes signatures S46-S63 on archives this
# repository has never touched (SPHEREx, Euclid Q1, DASCH DR7, the Presolar
# Grain Database, PEWDD, the Sedimentary Geochemistry and Paleoenvironments
# Project, CASSIS, Diviner polar products, ShadowCam, Mini-RF, CDMS / JPL,
# JMMC OiDB, the Exoplanet Archive depth tables, Cassini CDA, Breakthrough
# Listen open data).  A "data source" is worth nothing until it has been asked,
# from a machine with egress, whether it answers and serves the product the
# signature needs.  Every endpoint here is egress-blocked in the sandbox
# (CLAUDE.md acquisition pattern); this asks first and commits the answer
# verbatim.  REACHED_NO_PRODUCT is a finding about the brief, not the sky.
#
# Public endpoints only.  Dispatch-only.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated endpoint names to probe (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe every data source
        run: |
          python scripts/necrofrontier_probe.py --only "${{ github.event.inputs.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: necrofrontier-probe
          path: results/necrofrontier/
          if-no-files-found: warn
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "necrofrontier-probe: data-source reachability for S46-S63" \
            results/necrofrontier
