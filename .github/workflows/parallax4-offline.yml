name: PARALLAX4 offline cohorts

on:
  push:
    branches: ["codex/**"]
    paths:
      - "src/seti/parallax4/**"
      - "tests/test_parallax4*.py"
      - ".github/workflows/parallax4*.yml"
      - "docs/usage-sprint-2026-10-01-parallax-cohorts.md"
  pull_request:
    paths:
      - "src/seti/parallax4/**"
      - "tests/test_parallax4*.py"
      - ".github/workflows/parallax4*.yml"
      - "docs/usage-sprint-2026-10-01-parallax-cohorts.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallax4-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint changed PARALLAX4 code
        run: ruff check tests/test_parallax4.py src/seti/parallax4/cohorts.py src/seti/parallax4/run.py tests/test_parallax4_cohorts.py src/seti/parallax4/deepvet.py src/seti/parallax4/vsx_association.py tests/test_parallax4_ztf_identity.py tests/test_parallax4_ztf_phase.py tests/test_parallax4_vsx_association.py src/seti/parallax4/cadence_control.py tests/test_parallax4_cadence.py src/seti/parallax4/spatial_control.py tests/test_parallax4_spatial.py
      - name: Offline PARALLAX4 science and cohort regressions
        run: python -m pytest tests/test_parallax4.py tests/test_parallax4_cohorts.py tests/test_parallax4_ztf_identity.py tests/test_parallax4_ztf_phase.py tests/test_parallax4_vsx_association.py tests/test_parallax4_cadence.py tests/test_parallax4_spatial.py -o addopts="" -q -p no:cacheprovider
      - name: Print pinned fixed-cadence synthetic control receipt
        run: python -m seti.parallax4.cadence_control
      - name: Print pinned synthetic spatial identifiability control receipt
        run: python -m seti.parallax4.spatial_control
