name: herdsman

# HERDSMAN staged pipeline — kinematic technosignature search (docs/herdsman.md).
#
# sample ──▶ scan-real ─────▶ reduce
#        └─▶ scan-mock (N parallel shards) ──▶
#
# Design goals learned the hard way (litcheck lost two runs to a job timeout):
#  * checkpointing: every completed scan writes its own JSON immediately, and
#    shard outputs upload with `if: always()`, so a killed shard loses minutes,
#    not hours; the reduce step aggregates whatever shards exist.
#  * parallelism: mock shards run as a fail-fast:false matrix — wall-clock is
#    one shard, not the sum; lost shards can be rerun with "re-run failed jobs".
#  * the Gaia pull happens once; the detection table travels as an artifact.

on:
  workflow_dispatch:
    inputs:
      d_max_pc:
        description: "Sample sphere radius (pc)"
        required: false
        default: "300"
      g_max:
        description: "G magnitude cut"
        required: false
        default: "14.5"
      rv_err_max:
        description: "Max Gaia radial_velocity_error (km/s)"
        required: false
        default: "1.5"
      sigv_max:
        description: "Max scalar velocity error incl. floors (km/s)"
        required: false
        default: "0.8"
      t_max_myr:
        description: "Scan horizon per direction (Myr)"
        required: false
        default: "20"
      n_min:
        description: "Minimum stars meeting simultaneously"
        required: false
        default: "4"
      lambda_cap:
        description: "Chance-occupancy cap that sets the horizon"
        required: false
        default: "0.5"
      n_shards:
        description: "Parallel mock shards"
        required: false
        default: "12"
      mocks_per_shard:
        description: "Mocks per shard (total mocks = shards x this, per direction-pair)"
        required: false
        default: "4"
      rec_every:
        description: "Detect every N integrator steps (2=0.5 Myr, 4=1.0 Myr)"
        required: false
        default: "2"
      sigv_int_max:
        description: "v2 cut: max internal dispersion at meeting (km/s; empty disables)"
        required: false
        default: "5"
      min_epochs:
        description: "v2 cut: minimum epochs of meeting persistence"
        required: false
        default: "2"
      sample_run_id:
        description: "Skip the Gaia fetch; reuse the herdsman-sample artifact from this prior run id"
        required: false
        default: ""
      reduce_only_run_id:
        description: "Skip fetch/scan; reduce from this prior run's artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sample:
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.sample_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch + preprocess Gaia 6D sample
        run: |
          python -m seti.cli herdsman-fetch \
            --d-max-pc ${{ github.event.inputs.d_max_pc || '300' }} \
            --g-max ${{ github.event.inputs.g_max || '14.5' }} \
            --rv-err-max ${{ github.event.inputs.rv_err_max || '1.5' }} \
            --sigv-max ${{ github.event.inputs.sigv_max || '0.8' }}
          cat results/herdsman/sample_meta.json
      - uses: actions/upload-artifact@v4
        with:
          name: herdsman-sample
          path: |
            results/herdsman/sample.parquet
            results/herdsman/sample_meta.json
          if-no-files-found: error

  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 -c "import json; print('shards=' + json.dumps(list(range(int('${{ github.event.inputs.n_shards || '12' }}')))))" >> "$GITHUB_OUTPUT"

  scan-real:
    needs: sample
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && (needs.sample.result == 'success' || needs.sample.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Purge checkout-inherited shard checkpoints
        run: rm -rf results/herdsman/shards
      - uses: actions/download-artifact@v4
        with:
          name: herdsman-sample
          run-id: ${{ github.event.inputs.sample_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: results/herdsman/
      - name: Scan real catalogue (both time directions)
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.sigv_int_max }}" ]; then
            EXTRA="--sigv-int-max ${{ github.event.inputs.sigv_int_max }}"
          fi
          python -m seti.cli herdsman-scan --mode real \
            --t-max-myr ${{ github.event.inputs.t_max_myr || '20' }} \
            --n-min ${{ github.event.inputs.n_min || '4' }} \
            --lambda-cap ${{ github.event.inputs.lambda_cap || '0.5' }} \
            --min-epochs ${{ github.event.inputs.min_epochs || '2' }} \
            --rec-every ${{ github.event.inputs.rec_every || '2' }} $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-real
          path: results/herdsman/shards/
          if-no-files-found: warn

  scan-mock:
    needs: [sample, plan]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && needs.plan.result == 'success' && (needs.sample.result == 'success' || needs.sample.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Purge checkout-inherited shard checkpoints
        run: rm -rf results/herdsman/shards
      - uses: actions/download-artifact@v4
        with:
          name: herdsman-sample
          run-id: ${{ github.event.inputs.sample_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: results/herdsman/
      - name: Scan mock shard ${{ matrix.shard }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.sigv_int_max }}" ]; then
            EXTRA="--sigv-int-max ${{ github.event.inputs.sigv_int_max }}"
          fi
          python -m seti.cli herdsman-scan --mode mock \
            --shard ${{ matrix.shard }} \
            --mocks-per-shard ${{ github.event.inputs.mocks_per_shard || '4' }} \
            --t-max-myr ${{ github.event.inputs.t_max_myr || '20' }} \
            --n-min ${{ github.event.inputs.n_min || '4' }} \
            --lambda-cap ${{ github.event.inputs.lambda_cap || '0.5' }} \
            --min-epochs ${{ github.event.inputs.min_epochs || '2' }} \
            --rec-every ${{ github.event.inputs.rec_every || '2' }} $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-mock-${{ matrix.shard }}
          path: results/herdsman/shards/
          if-no-files-found: warn

  reduce:
    needs: [scan-real, scan-mock]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Purge checkout-inherited shard checkpoints
        run: rm -rf results/herdsman/shards
      - uses: actions/download-artifact@v4
        with:
          name: herdsman-sample
          run-id: ${{ github.event.inputs.sample_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: results/herdsman/
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: results/herdsman/shards/
      - name: Reduce (aggregate shards, vet, p-values, report)
        run: |
          python -m seti.cli herdsman-reduce \
            --n-mocks-expected $(( ${{ github.event.inputs.n_shards || '12' }} * ${{ github.event.inputs.mocks_per_shard || '4' }} ))
          echo "=== summary ==="
          cat results/herdsman/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/herdsman ':(exclude)results/herdsman/sample.parquet' ':(exclude)results/herdsman/shards'
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "herdsman: Gaia DR3 N-star convergence search results (staged run)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herdsman-final
          path: |
            results/herdsman/
            !results/herdsman/sample.parquet
          if-no-files-found: warn

  reduce-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Purge checkout-inherited shard checkpoints
        run: rm -rf results/herdsman/shards
      - name: Fetch sample artifact from prior run
        uses: actions/download-artifact@v4
        with:
          name: herdsman-sample
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/herdsman/
      - name: Fetch shard artifacts from prior run
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/herdsman/shards/
      - name: Reduce (aggregate shards, vet top candidates, p-values, report)
        run: |
          ls results/herdsman/shards/ | head -80
          python -m seti.cli herdsman-reduce \
            --n-mocks-expected $(( ${{ github.event.inputs.n_shards || '12' }} * ${{ github.event.inputs.mocks_per_shard || '4' }} ))
          echo "=== summary ==="
          cat results/herdsman/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/herdsman ':(exclude)results/herdsman/sample.parquet' ':(exclude)results/herdsman/shards'
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "herdsman: Gaia DR3 N-star convergence search results (staged run)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: herdsman-final
          path: |
            results/herdsman/
            !results/herdsman/sample.parquet
          if-no-files-found: warn
