name: tailingslit

# TAILINGS novelty check: fetch the chemical-anomaly prior art on the runner.
# The sandbox blocks arxiv/OpenAlex/Crossref; the runner has egress.
#
# The decisive target is arXiv:2605.29811 (Huang, Tao & Zhang 2026) -- the one
# *executed* meteorite-calibrated test for processed/refined material, in
# polluted white dwarfs. TAILINGS claims a different population, discriminant
# and physics; whether that survives contact with their full text has to come
# off the record, not out of an assumption.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tailingslit:
    runs-on: ubuntu-latest
    # Politeness sleeps + retry backoff dominate the runtime. A soft deadline on
    # the fetch step keeps partial evidence even if the full list overruns.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch literature evidence (soft 75-min deadline, partials kept)
        run: |
          timeout -k 30 4500 python scripts/tailingslit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== summary ==="
          python -c "import json;d=json.load(open('results/tailingslit/summary.json'));print(d['n_ok'],'ok /',d['n_urls'],'urls')" || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/tailingslit/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "tailingslit: TAILINGS chemical-anomaly prior-art evidence"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailingslit
          path: results/tailingslit/
          if-no-files-found: warn
