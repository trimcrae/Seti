# ULINE channel — every archive root, species regex, source parameter and
# threshold in one place.
#
# Signature S54 (docs/necrofrontier.md §2): the molecule life and chemistry
# both refuse.  No interstellar molecule with more than one fluorine atom has
# ever been detected; fluorine chemistry terminates at HF and CF+; life makes
# no N–F, S–F or fully fluorinated bonds.  A rotational line PATTERN of a polar
# industrial fluorine species in a public unidentified-line list is a residue
# of chemistry, not astrochemistry.  CH3Cl (detected, Fayolle+2017) and CH3F
# are the natural organohalogen baseline.
#
# Species are found in the archives by NORMALISED FORMULA at runtime: the
# catalogue's own name and the species formula are both case-folded and
# stripped of everything that is not a letter or a digit, and are then compared
# directly, after a leading isotope mass, and by atom counts ("CH3-35Cl",
# "CH3Cl, v=0", "H3C-Cl" and "CH3CL" all reduce to the same thing).  The
# `patterns:` regexes below are an ADDITIONAL route, never the only one, and
# every entry whose normalised name merely CONTAINS the formula is reported as
# a `near_miss_names` entry so a miss names the catalogue's real spelling.
# No catalogue tag is hard-coded.

archives:
  jpl_catdir_url: "https://spec.jpl.nasa.gov/ftp/pub/catalog/catdir.cat"
  jpl_cat_url: "https://spec.jpl.nasa.gov/ftp/pub/catalog/c{tag:06d}.cat"
  # CDMS: the classic entries page is script-rendered (necrofrontier probe);
  # every root below is fetched and mined by regex for c<tag>.cat links and a
  # partition-function table.  Nothing beyond these roots is hard-coded.
  cdms_roots:
    - "https://cdms.astro.uni-koeln.de/classic/entries/"
    - "https://cdms.astro.uni-koeln.de/classic/predictions/catalog/"
    - "https://cdms.astro.uni-koeln.de/classic/predictions/catalog/partition_function.html"
    - "https://cdms.astro.uni-koeln.de/classic/entries/partition_function.html"
  cdms_cat_url: "https://cdms.astro.uni-koeln.de/classic/predictions/catalog/c{tag:06d}.cat"
  vizier_tap: "https://tapvizier.cds.unistra.fr/TAPVizieR/tap"
  # ---- the VizieR ROUTE LADDER -------------------------------------------
  # 2026-09-13: TAPVizieR answered 503 to five attempts over EACH of https and
  # http (results/uline/summary.json -> degraded), and this channel reported
  # NO_DATA_REACHED for an infrastructure reason — the one failure mode this
  # repository must never publish as a sky result.  So VizieR is now reached
  # over four routes in order, each recorded with its endpoint and error text:
  #   1. vizier_tap (above), the current primary;
  #   2. the other TAP hosts below;
  #   3. vizier_asu_tsv — the NON-TAP route (VizieR's own ASU interface,
  #      served by the web application, not by the TAP service), which also
  #      answers the table-EXISTENCE question via `-meta.all` and so replaces
  #      TAP_SCHEMA discovery while TAP is down;
  #   4. astroquery.vizier.Vizier (already a declared dependency).
  # These lists MIRROR the module defaults in src/seti/metronome/acquire.py
  # (VIZIER_TAP_MIRRORS / VIZIER_ASU_MIRRORS) — src/seti/uline/run.py passes
  # only `vizier_tap`, and tests/test_uline.py pins the two to be identical, so
  # the endpoints and their verify status are visible in one place.
  vizier_tap_mirrors:
    - "https://tapvizier.cds.unistra.fr/TAPVizieR/tap"
    # verify: historical CDS hostname for the same service (u-strasbg.fr is the
    # pre-2021 name of the domain that became cds.unistra.fr).  ASSERTED, not
    # confirmed — there is no egress from the sandbox, so the first runner
    # dispatch that reaches (or fails to reach) it is what settles it.
    - "https://tapvizier.u-strasbg.fr/TAPVizieR/tap"
    # verify: the CfA VizieR mirror.  ASSERTED, unconfirmed until a runner
    # reaches it; a host that fails is recorded with its error, never dropped.
    - "https://vizier.cfa.harvard.edu/TAPVizieR/tap"
    - "http://tapvizier.cds.unistra.fr/TAPVizieR/tap"
  vizier_asu_tsv:
    - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
    # verify: mirror hostnames, ASSERTED and unconfirmed as above.
    - "https://vizier.u-strasbg.fr/viz-bin/asu-tsv"
    - "https://vizier.cfa.harvard.edu/viz-bin/asu-tsv"
  # The ASU row request is `-source=<catalogue>&-out.max=<n>&-out=<col>...
  # &-out.form=TSV`; the existence check is `-source=<catalogue>&-meta.all`,
  # with the catalogue's ReadMe (cdsarc.cds.unistra.fr/ftp/<cat>/ReadMe) as the
  # backstop.  A run served this way reports `route: asu_tsv`, never a bare OK.
  # When a species has both a CDMS and a JPL entry, the first available in
  # this order is used for the MATCH; contaminant vetoes use the union.
  prefer_line_list: ["cdms", "jpl", "predicted"]
  fetch_retries: 3
  fetch_timeout_s: 180
  # TAPVizieR returned 503 on every attempt in run 34787988880 (both sources
  # QUERY_FAILED); the retry budget is separate from the HTTP one because a
  # 503 there is transient load, not a dead endpoint.
  tap_retries: 5
  max_rows: 200000
  # The `litfetch` ladder is long by design (four bibliographic services x
  # eight phrasings x five species, plus the database pages), so it gets its
  # own short per-call timeout and a wall clock.  One service that hangs must
  # not take the job's whole budget with it; unreached sources are recorded
  # NOT_ATTEMPTED, never as a route that answered with nothing.
  litfetch_timeout_s: 30
  litfetch_retries: 1
  litfetch_budget_s: 1800
  # ---- A WALL CLOCK ON DISCOVERY ----------------------------------------
  # The probe now walks TEN sources, and one slow catalogue runs its whole
  # route ladder (four TAP hosts, each retried, then ASU, then astroquery)
  # plus a column query and a row count for every table it lists.  Against a
  # loaded VizieR that is tens of minutes for a single id; FORGE diagnosed it
  # live on run 35744731075, which sat 70+ minutes in a 25-minute stage.  The
  # budget is therefore enforced INSIDE one source's discovery, not only
  # between sources, and each source gets its own share of it (spending what
  # earlier, faster sources left unused).  A source whose share runs out is
  # DISCOVERY_TIMED_OUT, one never started is DISCOVERY_NOT_ATTEMPTED; both
  # are statements about the archive and about this clock, never about the
  # sky.  The alternative is a job killed by `timeout-minutes`, which skips
  # the `if: always()` commit-back and leaves no results at all.
  probe_budget_s: 2400
  # Also list any VizieR table whose description mentions this word (recorded
  # in probe.json as further U-line inventories; screened only once they have
  # a `sources:` entry with v_LSR and linewidth).
  discover_description_word: "nidentified"
  # ---- THE U-LINE CENSUS -------------------------------------------------
  # Run ONCE per probe over TAP_SCHEMA.COLUMNS (probe.json ->
  # uline_column_census), not per source.  The per-source census inherited
  # each source's own terms, so run 35039345593 came back with 78 tables of
  # which ~70 were Orion STAR catalogues and Chandra "unidentified sources":
  # the word "unidentified" alone does not mean a spectral line.  These are
  # PHRASES that only a spectral U-line table's column description carries,
  # which is what makes the census a list of U-line lists rather than a list
  # of everything with an unknown counterpart.  It stays DIAGNOSTIC: a table
  # found here is screened only after it is asserted under `sources:` with its
  # own v_LSR, linewidth and verify note.
  uline_column_census_terms:
    - "unidentified line"
    - "unidentified lines"
    - "unidentified feature"
    - "unidentified molecular"
    - "unidentified transition"
    - "U-line"
    - "unidentified emission line"

species:
  # ---- the industrial fluorine set (S54) ---------------------------------
  targets:
    NF3:    {patterns: ["^NF3\\b"],                        note: "nitrogen trifluoride (N–F); JPL has an entry per the probe"}
    CHF3:   {patterns: ["^CHF3\\b", "^HCF3\\b", "^CF3H\\b"], note: "fluoroform; oblate symmetric top; predicted if absent"}
    CH2F2:  {patterns: ["^CH2F2\\b"],                      note: "difluoromethane; JPL has an entry per the probe"}
    CF3Cl:  {patterns: ["^CF3Cl\\b", "^CClF3\\b"],         note: "CFC-13; prolate symmetric top; predicted if absent"}
    CF2Cl2: {patterns: ["^CF2Cl2\\b", "^CCl2F2\\b"],       note: "CFC-12; asymmetric top; no predictor — catalogue only"}
    CFCl3:  {patterns: ["^CFCl3\\b", "^CCl3F\\b"],         note: "CFC-11; symmetric top but constants not trusted here — catalogue only"}
    CF3CN:  {patterns: ["^CF3CN\\b"],                      note: "trifluoroacetonitrile; prolate symmetric top; predicted if absent"}
    COF2:   {patterns: ["^COF2\\b", "^CF2O\\b", "^F2CO\\b"], note: "carbonyl fluoride; JPL has an entry per the probe"}
    SO2F2:  {patterns: ["^SO2F2\\b"],                      note: "sulfuryl fluoride (S–F); catalogue only"}
    CHClF2: {patterns: ["^CHClF2\\b", "^CHF2Cl\\b"],       note: "HCFC-22; catalogue only"}
    CF2:    {patterns: ["^CF2\\b"],                        note: "difluorocarbene radical; catalogue only"}
  # ---- natural organohalogen baseline: a U-line coinciding with these is not evidence
  baseline:
    CH3Cl:  {patterns: ["^CH3Cl\\b", "^CH3-?35Cl", "^CH3-?37Cl", "^CH3\\(35\\)Cl", "^CH3\\(37\\)Cl", "^H3C-?Cl"], note: "detected: Fayolle+2017 (IRAS 16293, 67P)"}
    CH3F:   {patterns: ["^CH3F\\b"],                       note: "methyl fluoride; not detected in the ISM but natural"}
  # AN ALIAS WITH THE SAME EMPIRICAL FORMULA MUST BE DECLARED HERE.
  # The matcher no longer accepts a catalogue entry just because its atom
  # counts agree: identical atom counts identify an empirical formula, which
  # ISOMERS share. Probe run 35039720676 accepted, through that route alone,
  # HCOCH2OH (glycolaldehyde) as HCOOCH3 (methyl formate), CH3NC as CH3CN, and
  # HCCNC and HNCCC as HC3N — all C2H4O2 or C3HN, all different molecules with
  # different spectra — and their frequencies were vetoing unidentified lines
  # under the target's name. A same-formula entry is now recorded as a near
  # miss with its reason, and becomes a match only once a pattern below says
  # so. That is the point: every accepted contaminant identification is a
  # declaration somebody can audit, not a coincidence of stoichiometry.
  # ---- the usual U-line explanations: vibrationally excited / torsional
  #      states and isotopologues of the abundant complex organics
  contaminants:
    CH3OH:   {patterns: ["^CH3OH\\b", "^13CH3OH\\b", "^CH3-?18OH"]}
    CH3CN:   {patterns: ["^CH3CN\\b", "^CH3C-?13-?N", "^13CH3CN"]}
    HCOOCH3: {patterns: ["^HCOOCH3", "^CH3OCHO", "^HCOOCH3-?[AE]"]}
    C2H5CN:  {patterns: ["^C2H5CN", "^CH3CH2CN", "^C2H5C-?N"]}
    # carbon-rich envelope contaminants (only applied to IRC+10216)
    HC3N:    {patterns: ["^HC3N\\b", "^HCCCN\\b"], only_sources: ["irc10216_he2008"]}
    SiC2:    {patterns: ["^SiC2\\b", "^SiCC\\b"], only_sources: ["irc10216_he2008"]}
    C4H:     {patterns: ["^C4H\\b", "^CCCCH\\b"], only_sources: ["irc10216_he2008"]}

# Placeholder rotational constants for the symmetric-top predictor, used ONLY
# when neither JPL nor CDMS has the species.  Every block is `verify: true`:
# the values are from memory of the microwave literature, not from a checked
# source, and the run reports every species that used PREDICTED frequencies.
# Species not listed here and absent from the archives are simply unsearchable
# in this run and are reported as such.
predicted:
  CHF3:
    B_mhz: 10348.7
    DJ_mhz: 0.011
    DJK_mhz: 0.018
    axial_mhz: 5673.8        # C0 (oblate top); only sets the K-ladder Boltzmann factor
    mu_debye: 1.65
    k3_weight: 2.0           # three equivalent I=1/2 F nuclei: K=3n levels carry 2x spin weight
    verify: true
    source: "placeholder (B, DJ, DJK as given in the channel brief; C0 and mu from memory) — verify against the original fit before any claim"
  CF3Cl:
    B_mhz: 3335.6            # CF3-35Cl
    DJ_mhz: null             # unknown here: the error model widens accordingly
    DJK_mhz: null
    axial_mhz: null          # A0 unknown here: K ladder taken Boltzmann-flat
    mu_debye: 0.50
    k3_weight: 2.0
    verify: true
    source: "placeholder B for CF3-35Cl (channel brief); 37Cl isotopologue and Cl hyperfine not modelled"
  CF3CN:
    B_mhz: 2945.6
    DJ_mhz: null
    DJK_mhz: null
    axial_mhz: null
    mu_debye: 1.26
    k3_weight: 2.0
    verify: true
    source: "placeholder B (channel brief); 14N hyperfine not modelled"
  NF3:
    B_mhz: 10681.0
    DJ_mhz: null
    DJK_mhz: null
    axial_mhz: null
    mu_debye: 0.235
    k3_weight: 2.0
    verify: true
    source: "placeholder B (channel brief); fallback only — JPL carries NF3"
  # Error model for predicted frequencies.  For a line of the asymmetric-top
  # predictor (src/seti/uline/rotor.py, constants in
  # src/seti/data_assets/rotor_constants.yaml):
  #
  #   err = base_mhz + rel*nu + 2*sigma_ABC*(J_up+1)
  #         + [each unknown quartic constant, at its own rate: DJ*|J'^2(J'+1)^2-J^2(J+1)^2|
  #            + DJK*|J'(J'+1)K'^2-J(J+1)K^2| + DK*|K'^4-K^4|]
  #         (+) hyperfine blend width, in quadrature, for Cl/N species
  #
  # An unmeasured quartic constant is sized by Delta ~ 4 X^3 / omega^2 with X
  # the rotational constant the term is built from: Bbar=(B+C)/2 for DJ,
  # A*Bbar^2 for DJK, A^3 for DK (src/seti/uline/rotor.py quartic_estimates).
  # Per term that lands 2-12x HIGH against SO2 and CH2F2 — conservative, as an
  # error bound must be — where a single scale for all three was ~80x high for
  # DJ and ~14x LOW for DK at once.  omega is the lowest bending fundamental;
  # 300 cm-1 is at or below every species here (CFCl3 ~240 is the lowest).
  # The three terms enter a line completely differently — DJ as J^2(J+1)^2,
  # which CANCELS in a Q branch, DJK as J(J+1)K^2, DK as K^4 — so a Q-branch
  # line is no longer reported as accurate just because DJ drops out of it.
  error_model:
    base_mhz: 0.5
    rel_with_distortion: 1.0e-5      # DJ and DJK given
    rel_without_distortion: 1.0e-4   # DJ/DJK unknown: 4 DJ (J+1)^3 is unmodelled
    distortion_omega_cm: 300.0

sources:
  orion_kl_hifi:
    label: "Orion KL, Herschel/HIFI 480–1907 GHz line survey (Crockett+2014, ApJ 787, 112)"
    vizier_like: "J/ApJ/787/112/"
    v_lsr_km_s: 9.0
    fwhm_km_s: 4.0
    # The table is expected to list REST frequencies at the survey's assumed
    # v_LSR (the probe records the column description's frame hint).  The
    # velocity components (hot core ~5.5, compact ridge ~7-8, plateau ~8-9,
    # extended ridge ~9 km/s) then enter as a tolerance, not a shift.
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 4.0
    contaminant_tex_k: 150.0
    enabled: true
    # MEASURED ABSENT (run 35038662696, with TAP healthy — the run before it
    # could not tell an outage from an absence). J/ApJ/787/112 does not exist
    # in VizieR under that id:
    #   TAP_SCHEMA.tables LIKE '%J/ApJ/787/112/%'  -> 0 rows
    #   asu-tsv -meta.all -source=J/ApJ/787/112    -> 0 rows on all 3 mirrors
    #   cdsarc.../ftp/J/ApJ/787/112/ReadMe         -> HTTP 404
    # Three independent routes agreeing is an absence claim; one silent route
    # is not. Crockett+2014's HIFI line list was evidently never deposited at
    # CDS under the paper's own id.
    #
    # The DESCRIPTION search that was supposed to find the real catalogue asked
    # TAP_SCHEMA.TABLES for a description containing "unidentified" and got 0,
    # which would read as "VizieR has no U-line tables at all". That is an
    # artefact of the wrong instrument: a VizieR table description is a
    # one-line title, and "unidentified" lives in a COLUMN description. The
    # terms below now search table descriptions for the SOURCE and the SURVEY,
    # and `column_census` searches TAP_SCHEMA.COLUMNS for the U-line flag
    # itself — which returns every U-line-bearing catalogue in VizieR, whatever
    # its source. Both are diagnostic only: NOTHING is selected from either
    # automatically, and a table found this way has to be asserted here as
    # `vizier_like` with its own verify note first.
    fallback_description_all: []
    fallback_description_any: ["Orion", "line survey", "spectral survey",
                               "unidentified", "molecular lines"]
    # ---- REACHING CROCKETT+2014 WITHOUT VIZIER -----------------------------
    # The table was never deposited at CDS under the paper's id (three routes
    # agreed, above).  It exists as an AAS MACHINE-READABLE TABLE attached to
    # the article, and the MRT and CDS .dat formats share one byte-by-byte
    # header, which src/seti/uline/textlists.py reads.  The MRT filenames carry
    # an internal manuscript id (apjNNNNNNtN_mrt.txt) that cannot be guessed,
    # so the article's own data page is scraped for them first.  Every URL is
    # tried and every answer — including a 403 or an HTML banner where a table
    # was expected — is recorded in acquire.json -> sources.*.text_route.
    #
    # The IOP CDN and suppdata spellings below are NOT guesses: a web search
    # for the AAS machine-readable tables of neighbouring ApJ 787 papers
    # returned the real forms
    #   content.cld.iop.org/journals/0004-637X/710/2/1032/revision1/apj317177t2_mrt.txt
    #   iopscience.iop.org/0004-637X/787/2/107/suppdata/apj493243t2_ascii.txt?doi=...
    #   iopscience.iop.org/0004-637X/787/1/18/suppdata/apj493688t1_ascii.txt
    # so the DIRECTORY is constructible from the article's DOI while the
    # manuscript id (apj4932xx) is not.  That is why the directories are
    # scraped for links rather than a filename being assembled: the id is the
    # one part no caller can derive.
    text_routes:
      index_urls:
        - "https://iopscience.iop.org/article/10.1088/0004-637X/787/2/112"
        - "https://iopscience.iop.org/article/10.1088/0004-637X/787/2/112/data"
        - "https://iopscience.iop.org/0004-637X/787/2/112/suppdata"
        - "https://content.cld.iop.org/journals/0004-637X/787/2/112/revision1/"
        - "https://cdsarc.cds.unistra.fr/ftp/J/ApJ/787/112/"
        # HEXOS is the observing programme behind the survey; IRSA serves its
        # delivered products with a release note that names the line lists.
        # verify: the directory layout is ASSERTED from the release-note URL a
        # web search returned, not confirmed — the runner settles it.
        - "https://irsa.ipac.caltech.edu/data/Herschel/HEXOS/"
        - "https://irsa.ipac.caltech.edu/data/Herschel/HEXOS/docs/"
      link_pattern: "(_mrt\\.txt|_ascii\\.txt|\\.mrt\\b|machine[-_]?readable|/table\\d+\\.dat)"
      urls:
        - "https://cdsarc.cds.unistra.fr/ftp/J/ApJ/787/112/table3.dat"
        - "https://cdsarc.u-strasbg.fr/ftp/J/ApJ/787/112/table3.dat"
        - "https://cdsarc.cds.unistra.fr/viz-bin/nph-Cat/txt?J/ApJ/787/112/table3"
      readme_urls:
        - "https://cdsarc.cds.unistra.fr/ftp/J/ApJ/787/112/ReadMe"
        - "https://cdsarc.u-strasbg.fr/ftp/J/ApJ/787/112/ReadMe"
      # a body that is a login page or an error document is NOT a table: it must
      # carry the byte-by-byte header that every MRT and CDS file has
      must_match: "Byte-by-byte Description"
  # FOUND BY THE COLUMN/TABLE CENSUS (run 35039345593), not asserted from a
  # paper: the table search returned 34 VizieR tables whose DESCRIPTION is a
  # U-line list, and the column census 78 tables carrying a U-line flag column.
  # This is the one that lands on a source this channel already models, so its
  # velocity handling is the existing IRC+10216 entry's and nothing new is
  # assumed. The census output is in results/uline/probe.json under
  # vizier.orion_kl_hifi.fallback (tables) and .fallback.by_column.
  irc10216_cernicharo2000:
    label: "IRC+10216, IRAM 30m lambda-2mm line survey (Cernicharo, Guelin & Kahane 2000, A&AS 142, 181)"
    # verify: the id comes from the census, whose recorded description for it
    # is literally "Unidentified lines ( Cernicharo J., Guelin M., Kahane C.)".
    # The probe scores its columns; a table without a frequency AND an
    # identification column is rejected there, not here.
    vizier_like: "J/A+AS/142/181/"
    # Same star as irc10216_he2008 below, so the same systemic velocity and the
    # same expansion-broadened width. Nothing about the source is new; only the
    # survey (30m, ~129-172.5 GHz) and therefore the line list.
    v_lsr_km_s: -26.0
    fwhm_km_s: 30.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 0.0
    contaminant_tex_k: 50.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["IRC+10216", "line survey", "spectral survey",
                               "unidentified", "molecular lines"]

  # TWO MORE the census found that are NOT enabled, because each needs a fact
  # established before its lines mean anything, and guessing it would put a
  # wrong Doppler shift on every frequency:
  #
  #   J/A+A/681/A50/tablea4  "All unidentified lines" (Wallstrom, Danilovich,
  #     Muller et al.) — ATOMIUM. A MULTI-SOURCE survey: v_LSR differs per star,
  #     so it needs a per-row source column and per-row velocity, which this
  #     channel's one-velocity-per-source model does not yet express.
  #   J/A+A/564/L2/table4    "Unidentified lines in comet Lovejoy" (Agundez,
  #     Biver, Santos-Sanz, Bockelee-Morvan) — a COMET: the rest frame is the
  #     nucleus, not the LSR, and the lines are ~1 km/s wide rather than 30.
  #     A genuinely new environment for this search, and worth doing once the
  #     frame is handled properly rather than approximated.

  # ---- OTHER ORION KL LINE SURVEYS, which VizieR MAY carry ----------------
  # Crockett+2014 is not the only deep Orion KL survey with a published U-line
  # residue, and the channel should not stand or fall on one catalogue id that
  # is measurably absent.  Each of these is ASSERTED from its paper and is
  # verify: unconfirmed until a runner reaches it.  A source that resolves to
  # no usable table reports QUERY_RETURNED_ZERO_ROWS with its scoreboard, which
  # is a statement about VizieR, never about the sky.  Orion KL's velocity and
  # linewidth are the existing entry's, so nothing new is assumed about the
  # source — only about which survey's residue is being read.
  orion_kl_tercero2010:
    label: "Orion KL, IRAM 30m 80-280 GHz line survey (Tercero et al. 2010, A&A 517, A96)"
    vizier_like: "J/A+A/517/A96/"
    v_lsr_km_s: 9.0
    fwhm_km_s: 4.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 4.0
    contaminant_tex_k: 150.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["Orion", "unidentified", "line survey"]
  orion_kl_crockett2015:
    label: "Orion KL, HIFI 1.2 THz wide spectral survey (Crockett et al. 2015, ApJ 806, 239)"
    vizier_like: "J/ApJ/806/239/"
    v_lsr_km_s: 9.0
    fwhm_km_s: 4.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 4.0
    contaminant_tex_k: 150.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["Orion", "unidentified", "line survey"]

  # ---- THE U-LINE TABLE ITSELF, not the survey's identified list -----------
  # Discovery picks ONE table per source, and it picks the biggest usable one:
  # for J/A+AS/142/181 that is table2 (399 identified lines), whose `Mol` column
  # names a molecule on every row.  The catalogue's actual U-line list is
  # table3, whose VizieR description is literally "Unidentified lines
  # (Cernicharo J., Guelin M., Kahane C.)" and whose `Name` column holds the
  # U-labels.  It is asserted here as its own source, with:
  #   all_unidentified: true   — every row of a table whose PUBLISHED
  #       description is "Unidentified lines" is a U-line.  This does not
  #       depend on parsing the label column, which is what made the old route
  #       fragile ("U 130156.3" matched no uline_values regex).
  #   coverage_from            — the coverage mask (is the survey even
  #       sensitive at this frequency?) must come from ALL the survey's
  #       catalogued lines, which live in the sibling table, not from the 63
  #       U-lines alone.  Without this a predicted line would be called "out of
  #       coverage" wherever the survey had no U-line, which is backwards.
  irc10216_cernicharo2000_u:
    label: "IRC+10216 U-lines (Cernicharo, Guelin & Kahane 2000, A&AS 142, 181, table 3)"
    vizier_like: "J/A+AS/142/181/table3"
    all_unidentified: true
    coverage_from: irc10216_cernicharo2000
    v_lsr_km_s: -26.0
    fwhm_km_s: 30.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 0.0
    contaminant_tex_k: 50.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["IRC+10216", "unidentified", "line survey"]

  # ---- NEW SOURCE, found by this channel's own column/description census ---
  # J/ApJS/117/427/table46, description "Unidentified lines (Nummelin A.,
  # Bergman P., Hjalmarson A., Friberg P., Irvine W.M., Millar T.J., Ohishi M.,
  # Saito S.)" — the SEST 3 mm spectral survey of Sgr B2, ApJS 117, 427 (1998).
  # A hot-core source in a completely different chemistry from IRC+10216, and
  # the U-line table of a survey with published intensities.
  #
  # verify: the survey observed THREE positions (Sgr B2 N, M and NW) whose
  # systemic velocities differ by a few km/s (N ~ +64, M ~ +62, NW ~ +64).
  # Until the table is read and its columns seen, the velocity is taken as
  # +64 km/s with a 6 km/s UNCERTAINTY that covers all three, which widens the
  # tolerance rather than putting a wrong Doppler shift on every line.  The
  # linewidth is Sgr B2's own: 15 km/s is typical of the hot core.
  sgrb2_nummelin1998_u:
    label: "Sgr B2 U-lines (Nummelin et al. 1998, ApJS 117, 427, table 46; SEST 3 mm survey)"
    vizier_like: "J/ApJS/117/427/table46"
    all_unidentified: true
    coverage_from: sgrb2_nummelin1998
    v_lsr_km_s: 64.0
    fwhm_km_s: 15.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 6.0
    contaminant_tex_k: 100.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["Sgr B2", "unidentified", "line survey"]
  sgrb2_nummelin1998:
    label: "Sgr B2, SEST 3 mm line survey (Nummelin et al. 1998, ApJS 117, 427) — identified lines"
    vizier_like: "J/ApJS/117/427/"
    v_lsr_km_s: 64.0
    fwhm_km_s: 15.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 6.0
    contaminant_tex_k: 100.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["Sgr B2", "line survey", "unidentified"]

  # ---- A GENUINELY NEW ENVIRONMENT: a comet ------------------------------
  # J/A+A/564/L2/table4, "Unidentified lines in comet Lovejoy" (Agundez, Biver,
  # Santos-Sanz, Bockelee-Morvan, Moreno 2014), 251.8-264.8 GHz.  The rest
  # frame is the nucleus, not the LSR, and the lines are ~1 km/s wide rather
  # than 30 — so the tolerance here is TIGHTER than anywhere else in the
  # channel, which makes a coincidence worth more and a chance alignment
  # rarer.  A cometary coma is also the one place where a species with no
  # interstellar formation route could be sublimated from ice rather than made.
  #
  # verify: the column description read "[251766/264753] Frequency of
  # Unidentified line" in the census, i.e. MHz, already in the comet's rest
  # frame.  frequency_frame: rest with a zero systemic velocity is the right
  # reading of that, and a 0.5 km/s uncertainty covers the outgassing.
  comet_lovejoy_agundez2014_u:
    label: "Comet C/2013 R1 (Lovejoy) U-lines (Agundez et al. 2014, A&A 564, L2, table 4)"
    vizier_like: "J/A+A/564/L2/table4"
    all_unidentified: true
    v_lsr_km_s: 0.0
    fwhm_km_s: 1.5
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 0.5
    contaminant_tex_k: 50.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["Lovejoy", "comet", "unidentified", "line survey"]

  # ---- Sgr B2(N) and (M), the other deep hot-core survey with a U-residue --
  # Belloche et al. 2013, A&A 559, A47: the IRAM 30 m 3/2/1 mm survey of
  # Sgr B2(N) and (M) behind the EMoCA/ReMoCA programme.  Asserted here
  # because the S54 brief names it as one of the few U-line lists with real
  # statistics, and a web search puts the catalogue at J/A+A/559/A47.
  #
  # verify, twice over: (a) the catalogue id is asserted, not confirmed
  # against TAP_SCHEMA — a miss reports QUERY_RETURNED_ZERO_ROWS with its
  # scoreboard, which is a statement about VizieR and never about the sky;
  # (b) the survey covers TWO positions whose systemic velocities differ
  # (N ~ +64, M ~ +62 km/s), so the velocity is +63 with a 4 km/s
  # UNCERTAINTY covering both, which widens the tolerance rather than putting
  # a wrong Doppler shift on every line.  Linewidth 12 km/s: Sgr B2(N)'s
  # complex-organic lines are 7-10 km/s, (M)'s broader.
  sgrb2_belloche2013:
    label: "Sgr B2(N)+(M), IRAM 30m 3/2/1mm line survey (Belloche et al. 2013, A&A 559, A47)"
    vizier_like: "J/A+A/559/A47/"
    v_lsr_km_s: 63.0
    fwhm_km_s: 12.0
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 4.0
    contaminant_tex_k: 150.0
    enabled: true
    fallback_description_all: []
    fallback_description_any: ["Sgr B2", "unidentified", "line survey", "spectral survey"]

  irc10216_he2008:
    label: "IRC+10216, ARO 12 m + SMT 2 mm / 1.3 mm line survey (He+2008, ApJS 177, 275)"
    vizier_like: "J/ApJS/177/275/"
    v_lsr_km_s: -26.0
    fwhm_km_s: 30.0           # expansion velocity ~14.5 km/s: full width ~29 km/s
    frequency_frame: rest
    v_lsr_uncertainty_km_s: 0.0
    contaminant_tex_k: 50.0
    enabled: true
    # verify: the ApJS 177,275 VizieR id is asserted from the published paper
    # and has NOT yet been confirmed against TAP_SCHEMA.
    # As above: "unidentified" moves from `all` to `any`, because it is a
    # COLUMN description and requiring it of a TABLE description matches
    # nothing. `column_census` searches TAP_SCHEMA.columns for it directly.
    fallback_description_all: []
    fallback_description_any: ["IRC+10216", "line survey", "spectral survey",
                               "unidentified", "molecular lines"]

match:
  tex_grid_k: [10, 30, 50, 100, 150, 200]
  top_n_predicted: 40          # strongest predicted features (at T_ex, in coverage) that are tested
  min_coincidences: 3          # a PATTERN needs >= 3 coincident transitions
  spearman_min: 0.3            # LTE consistency: rho(pred intensity, observed U-line intensity)
  min_top5_fraction: 0.6       # of the 5 strongest predicted features, this fraction must coincide with SOME catalogued line
  p_false_max: 0.01
  n_trials: 1000               # random rigid shifts of the predicted set
  shift_min_mhz: 50
  shift_max_mhz: 500
  coverage_window_mhz: 1500    # a predicted line is "observable" if the survey catalogued any line within this window
  veto_dynamic_range_dex: 4.0  # contaminant lines within this many dex of their strongest in-range line can veto
  seed: 20260913

columns:
  # role -> ordered regexes over canonicalised (lower-case) TAP column names
  freq: ["^freq(uency)?$", "^nu$", "^f$", "^freq_?rest$", "^frest$", "^fobs$", "^freqobs$",
         "^freq_?obs$", "^nu_?rest$", "^rest_?freq$", "^f_?rest$", "^fcen$", "^f_?obs$",
         "^freq_?mhz$", "^freq_?ghz$", "^nu_?ghz$", "^nu_?mhz$"]
  freq_err: ["^e_?freq(uency)?$", "^e_?nu$", "^e_?f$", "^freq_?err$", "^efreq$", "^err_?freq$", "^dfreq$", "^e_?frest$"]
  ident: ["^species$", "^mol(ecule)?$", "^ident(ification)?$", "^id$", "^name$", "^assign(ment)?$",
          "^line$", "^formula$", "^molec$", "^spec$", "^carrier$", "^mole$", "^spname$", "^molname$"]
  # THE LTE TEST DIED ON THIS LIST, not on the archives.  Runs 35039822190 and
  # 35041128720 reported `lte_testable: false` for every pair and the channel
  # recorded "no intensity column" as a property of the surveys — but
  # Cernicharo+2000 tables 2 and 3 carry `T(MB)dv` and He+2008 table 4 carries
  # `Iint`, both integrated line intensities, and NEITHER matched any regex
  # here.  An integrated intensity is exactly what the Spearman test wants (it
  # is the quantity proportional to the column in the optically thin LTE limit),
  # so the integrated forms now come FIRST, before the peak temperatures.
  # e_T(MB)dv and the like never match: every pattern is anchored at ^.
  intensity: ["^t\\(?mb\\)?dv$", "^t\\(?a\\*?\\)?dv$", "^tdv$", "^i_?int$", "^intint$",
              "^int_?flux$", "^w_?int$", "^wint$", "^integ(rated)?(_?int(ensity)?)?$",
              "^t_?a\\*?$", "^ta$", "^tmb$", "^t_?mb$", "^t_?peak$", "^tpk$", "^peak$", "^tpeak$",
              "^t_?max$", "^i_?peak$", "^ipeak$", "^tlc$", "^int(ensity)?$", "^w$", "^area$",
              "^flux$", "^s$", "^snu$", "^tb$", "^t$", "^amp$", "^tant$", "^tr$", "^t_?r$"]
  transition: ["^trans(ition)?$", "^qn$", "^qns$", "^quantum$", "^levels$", "^qnum$"]
  # an identification value meaning "unidentified"
  uline_values: ["^\\s*u\\s*$", "^\\s*u[-_ ]?line", "^\\s*unid", "^\\s*\\?+\\s*$", "^\\s*unknown",
                 "^\\s*u\\s*\\d*\\s*$", "^\\s*u\\s*[-:]",
                 # U-line labels are usually the frequency: "U 130156.3", "U-93870",
                 # "U131.4".  The decimal point made the old \\d* pattern miss them.
                 "^\\s*u[\\s\\-_]*[0-9]+(\\.[0-9]+)?\\s*$"]
