name: spectra-persist

# Per-exposure persistence of the narrow-line survivors (docs/spectra-persist.md).
#
#   probe ──▶ run (sharded) ──▶ reduce ──▶ commit-back
#
# A survey coadd is the sum of individual exposures.  A real monochromatic line
# persists at the same strength in every exposure; a cosmic ray or a
# single-exposure artefact lives in one; a sky residual tracks the sky line.
# For SDSS-DR17 survivors the FULL spec-PLATE-MJD-FIBER.fits (HDUs 4+ are the
# spCFrame exposures) is pulled from the SAS; for DESI-DR1 the coadd's
# EXP_FIBERMAP names the (night, expid, petal, fiber) and each cframe / sky row
# is read from the public NERSC portal.  Every survivor also gets: a second
# epoch (any other SPARCL spectrum at the position), SIMBAD, and a rest-frame
# line identification at its own catalogue redshift.  Checkpointed per spectrum;
# results/spectra_persist/ is committed back to the branch that ran.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, run, reduce), "probe" (SPARCL fields + archive URL
          reconnaissance only — cheap, run first), "diagnose" (raw side-by-side
          of the SPARCL coadd, the SAS file coadd and each exposure for the top
          `top` survivors — use when a class looks like a systematic), "run"
          (per-exposure measurements, sharded), "reduce" (merge checkpoints
          on the branch, SIMBAD, NIST, summary), or "control" (the same
          wavelength in unrelated stars of the same type — the only test that
          rejects a feature of the spectral type itself; needs a reduce first).
        required: false
        default: "all"
      n_control:
        description: "control stage: comparison spectra per surviving line"
        required: false
        default: "40"
      n_shards:
        description: "Number of parallel shards for the run stage (1-8)"
        required: false
        default: "4"
      top:
        description: "Only the N most significant survivors (0 = every survivor)"
        required: false
        default: "0"
      max_exposures:
        description: "Cap on exposures tested per DESI target"
        required: false
        default: "10"
      release:
        description: "Restrict to one release: SDSS or DESI (blank = both)"
        required: false
        default: ""
      recheck:
        description: "recheck stage: PLATE:MJD:FIB1,FIB2,..."
        required: false
        default: ""
      recheck_lam:
        description: "recheck stage: observed vacuum wavelength (A)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spectra]"
          pip install --upgrade --force-reinstall --no-cache-dir "numpy>=2.0" pandas pyarrow scipy
          pip install fsspec aiohttp requests astropy-healpix
          python -c "import sparcl.client, fsspec, aiohttp, astropy; print('imports OK')"
      - name: Offline gate
        run: python -m pytest tests/test_spectra_persist.py -q -p no:cacheprovider
      - name: Probe (SPARCL fields, SAS / NERSC URL patterns, range support)
        run: python -m seti.spectra.persist --stage probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persist-probe
          path: results/spectra_persist/probe.json
          if-no-files-found: warn
      - name: Commit probe
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh "spectra-persist probe" results/spectra_persist/probe.json

  diagnose:
    if: ${{ github.event.inputs.stage == 'diagnose' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spectra]"
          pip install --upgrade --force-reinstall --no-cache-dir "numpy>=2.0" pandas pyarrow scipy
          pip install fsspec aiohttp requests astropy-healpix
          python -c "import sparcl.client, astropy; print('imports OK')"
      - name: Diagnose (SPARCL coadd vs SAS file coadd vs exposures)
        run: |
          python -m seti.spectra.persist --stage diagnose \
            --top "${{ github.event.inputs.top || '8' }}" \
            --release "${{ github.event.inputs.release || 'SDSS' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persist-diagnose
          path: results/spectra_persist/diagnose.json
          if-no-files-found: warn
      - name: Commit diagnose
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh "spectra-persist diagnose" results/spectra_persist/diagnose.json

  control:
    # The comparison sample: the same wavelength in unrelated stars of the same
    # kind.  It is the only test that can reject a feature the star's spectral
    # TYPE produces, which persists in every exposure and in every epoch and so
    # survives both the per-exposure test and a second epoch.
    if: ${{ github.event.inputs.stage == 'control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spectra]"
          pip install --upgrade --force-reinstall --no-cache-dir "numpy>=2.0" pandas pyarrow scipy
          pip install requests
          python -c "import sparcl.client, astropy; print('imports OK')"
      - name: Control sample (same wavelength, unrelated stars of the same type)
        run: |
          python -m seti.spectra.persist --stage control \
            --n-control "${{ github.event.inputs.n_control || '40' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persist-control
          path: results/spectra_persist/control.json
          if-no-files-found: warn
      - name: Commit control
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh "spectra-persist control sample" \
            results/spectra_persist/control.json

  recheck:
    # Close one open line: same-plate co-detections (galaxies?), per-exposure
    # sky residual, and every other plate observed the same MJD.
    if: ${{ github.event.inputs.stage == 'recheck' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spectra]"
          pip install --upgrade --force-reinstall --no-cache-dir "numpy>=2.0" pandas pyarrow scipy
          pip install requests
      - name: Recheck
        run: |
          python -m seti.spectra.persist --stage recheck \
            --recheck "${{ github.event.inputs.recheck }}" \
            --recheck-lam "${{ github.event.inputs.recheck_lam }}"
      - name: Commit recheck
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          f=$(ls results/spectra_persist/recheck_*.json 2>/dev/null | tr '\n' ' ')
          [ -n "$f" ] && scripts/commit_results.sh "spectra-persist recheck" $f || echo "nothing to commit"

  plan:
    # A fixed [0..7] matrix asks the scheduler for EIGHT runners even when four
    # shards were requested: the four extra jobs have to acquire a runner just
    # to evaluate their own skip condition and exit.  With 18 channels sharing
    # one account's concurrency that is four slots taken from other channels
    # for nothing, and four more scheduling events this run has to wait behind.
    # The matrix is built from n_shards instead.
    if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        env:
          N_SHARDS: ${{ github.event.inputs.n_shards || '4' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          try:
              n = int((os.environ.get("N_SHARDS") or "4").strip())
          except ValueError:
              n = 4
          n = max(1, min(8, n))
          print("shards=" + json.dumps(list(range(n))))
          PY
          cat "$GITHUB_OUTPUT"

  run:
    if: ${{ always() && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'run') && needs.probe.result != 'failure' && needs.plan.result == 'success' }}
    needs: [probe, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Shard identity
        id: gate
        run: echo "skip=false" >> "$GITHUB_OUTPUT"
      # Pin the SHARDS to the dispatched commit, not to the branch head.  Run
      # 35738206630 queued for 45 minutes; its early shards checked out the
      # median-continuum estimator and its late ones the linear-fit estimator,
      # so one "run" produced two different measurements of the same survey.
      # (The ckpt_version guard caught it -- 36 of 98 checkpoints were ignored
      # as stale -- but a run must not be able to split in the first place.)
      # The shards only upload artifacts; `reduce` still checks out the branch
      # because it commits back to it.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip == 'false'
        with:
          python-version: "3.11"
      - name: Install
        if: steps.gate.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spectra]"
          pip install --upgrade --force-reinstall --no-cache-dir "numpy>=2.0" pandas pyarrow scipy
          pip install fsspec aiohttp requests astropy-healpix
          python -c "import sparcl.client, fsspec, aiohttp, astropy; print('imports OK')"
      - name: Per-exposure measurements (shard ${{ matrix.shard }})
        if: steps.gate.outputs.skip == 'false'
        run: |
          # Pick up checkpoints already committed on the branch WITHOUT pulling
          # the branch's code over the pinned commit: only the ckpt directory.
          git fetch --quiet origin ${{ github.ref_name }} || true
          git checkout --quiet FETCH_HEAD -- results/spectra_persist/ckpt || true
          git reset --quiet || true
          # Mark time AFTER the fetched checkpoints land: only files written
          # by THIS shard are uploaded (see the upload step).
          sleep 1; touch "$RUNNER_TEMP/ckpt_marker"; sleep 1
          ARGS="--stage run --shard ${{ matrix.shard }} --n-shards ${{ github.event.inputs.n_shards || '4' }}"
          ARGS="$ARGS --top ${{ github.event.inputs.top || '0' }} --max-exposures ${{ github.event.inputs.max_exposures || '10' }}"
          if [ -n "${{ github.event.inputs.release }}" ]; then ARGS="$ARGS --release ${{ github.event.inputs.release }}"; fi
          echo "seti.spectra.persist $ARGS"
          python -m seti.spectra.persist $ARGS
          ls results/spectra_persist/ckpt | wc -l
      # Upload ONLY the checkpoints this shard wrote.  Run 35758868818 uploaded
      # the whole directory from every shard; the reduce then unpacked the
      # archives concurrently into one place and the overlapping files raced
      # (14 came out interleaved, not JSON; 35 as the stale copy).
      - name: Collect this shard's checkpoints
        if: always() && steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/ckpt_out"
          if [ -f "$RUNNER_TEMP/ckpt_marker" ]; then
            find results/spectra_persist/ckpt -name '*.json' -newer "$RUNNER_TEMP/ckpt_marker" \
              -exec cp {} "$RUNNER_TEMP/ckpt_out/" \;
          fi
          echo "this shard wrote $(ls "$RUNNER_TEMP/ckpt_out" | wc -l) checkpoints"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.skip == 'false'
        with:
          name: persist-ckpt-${{ matrix.shard }}
          path: ${{ runner.temp }}/ckpt_out/
          if-no-files-found: warn

  reduce:
    if: ${{ always() && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'run' || github.event.inputs.stage == 'reduce') && needs.run.result != 'cancelled' }}
    needs: [run]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spectra]"
          pip install --upgrade --force-reinstall --no-cache-dir "numpy>=2.0" pandas pyarrow scipy
          pip install requests
      # One directory per shard artifact (no merge-multiple): the choice between
      # two copies of a checkpoint is made per file by merge_checkpoints, never
      # by which concurrent unzip happened to write last.
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.stage != 'reduce' }}
        with:
          pattern: persist-ckpt-*
          path: ${{ runner.temp }}/ckpt_incoming/
          merge-multiple: false
      - name: Reduce (merge checkpoints; SIMBAD; NIST context; rest-frame IDs; summary)
        run: |
          mkdir -p "$RUNNER_TEMP/ckpt_incoming"
          ls results/spectra_persist/ckpt | wc -l
          find "$RUNNER_TEMP/ckpt_incoming" -name '*.json' | wc -l
          python -m seti.spectra.persist --stage reduce --incoming "$RUNNER_TEMP/ckpt_incoming"
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/spectra_persist/summary.json"))
          print(json.dumps({k: s[k] for k in s if k != "alive"}, indent=2))
          for a in s.get("alive", []):
              print("ALIVE", a)
          PY
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("results/spectra_persist/summary.json"))
          c = s["persistence_class_counts"]
          tested = sum(v for k, v in c.items() if k not in ("not_run", "untestable"))
          print(f"::notice::{tested} survivor lines measured per exposure; {s['n_alive']} alive; verdict {s['verdict']}")
          if tested == 0 and s["verdict"] != "NO_DATA_REACHED":
              print("::error::no line was measured per exposure but the verdict is not NO_DATA_REACHED"); sys.exit(1)
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "spectra-persist: per-exposure persistence of the narrow-line survivors (${{ github.event.inputs.stage || 'all' }})" \
            results/spectra_persist/summary.json \
            results/spectra_persist/persistence.csv \
            results/spectra_persist/exposures.json \
            results/spectra_persist/nist_lines.json \
            results/spectra_persist/ckpt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persist-results
          path: results/spectra_persist/
          if-no-files-found: warn
