name: occult

# OCCULT (S40) --- an opaque microlens occulting its own images, searched in
# the public OGLE-IV EWS / KMTNet / MOA event photometry (docs/occult.md).
#
# stage=probe: what is reachable from a runner, and in what format.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: '"probe" (reachability and formats only)'
        required: false
        default: "probe"

permissions:
  contents: write

jobs:
  probe:
    if: ${{ github.event.inputs.stage == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe OGLE / KMTNet / MOA
        run: |
          python -m seti.cli occult probe
      - name: Commit the probe result
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "occult: probe --- OGLE/KMTNet/MOA reachability and formats" \
            results/occult/probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occult-probe
          path: results/occult/probe.json
          if-no-files-found: warn
