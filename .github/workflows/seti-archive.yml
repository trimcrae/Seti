name: seti-archive

# Targeted radio + optical technosignature archive search and EIRP-limit dossier
# for LHS 1140 (temperate habitable-zone world with a claimed atmosphere; a prime
# Breakthrough Listen / GBT / MeerKAT / Parkes / ATA target). Probes the reachable
# public archives (Breakthrough Listen open data, CADC ObsCore) for observations
# at LHS 1140's coordinates, degrades honestly to a cited representative-facility
# inventory when an archive is down, computes the minimum detectable narrowband-
# beacon EIRP each configuration reaches (vs the ~2e13 W Arecibo radar yardstick),
# and writes a coverage-and-limit map. Needs egress; runs on the runner and
# commits results back to the branch.

on:
  workflow_dispatch:
    inputs:
      snr:
        description: "Detection threshold (sigma) for the EIRP limits"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  seti-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -c "import numpy,pandas,requests; print('imports OK')"
      - name: Run LHS 1140 SETI archive + limit dossier
        run: |
          python -m seti.cli seti-archive --snr ${{ github.event.inputs.snr || '5' }}
          echo "=== summary ==="
          cat results/seti_archive/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/seti_archive/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "seti-archive: LHS 1140 radio/optical coverage + EIRP-limit dossier"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seti-archive-outputs
          path: results/seti_archive/
          if-no-files-found: warn
