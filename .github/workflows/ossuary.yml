name: ossuary

# OSSUARY — warm dust around stars that cannot make it (docs/ossuary.md).
#
#   acquire (matrix: one shard per sample track) ──▶ analyze ──▶ (commit)
#
# Design copied from herdsman.yml, which encodes what previous runs cost:
#  * checkpointing — every declination band writes its own parquet immediately and
#    is skipped on re-run, so a killed shard loses minutes, not hours; every
#    upload is `if: always()`.
#  * sharding — the three sample tracks (spec / phot / halo) are an independent
#    fail-fast:false matrix, so wall-clock is one track and a lost track can be
#    re-run on its own with "re-run failed jobs".
#  * artifact passthrough — the archive pull happens once; the sample travels to
#    the analysis job as an artifact.
#  * reduce_only_run_id — re-analyse a prior run's sample without refetching, which
#    is the normal way to retune a threshold.
#
# WHAT THE FIRST RUN TAUGHT (run 30203264572, 2026-07-26).  All three tracks
# acquired (6,192,472 stars in 36 checkpointed bands); the analyze step then ran
# for 238 minutes without a line of output and was killed by the job's own
# 240-minute timeout, so nothing was committed.  The cost was the per-star
# Monte-Carlo dust fit (400 redraws x 300 grid temperatures in a Python loop)
# and a full-frame vet on six million rows.  The analysis now runs a
# memory-lean path with a matrix fit (src/seti/ossuary/run.py, `analyze`), logs
# every stage with a timestamp, checkpoints summary.json BEFORE the per-object
# follow-up, and commits through scripts/commit_results.sh, which verifies the
# push.  Python runs unbuffered so the log shows where a run is.
#
# Reading a prior run's artifacts (`reduce_only_run_id`) needs `actions: read`:
# an explicit `permissions:` block drops every unlisted permission, and the
# first version of this file listed only `contents: write`.

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: "Sample tracks to pull (comma-separated: spec,phot,halo)"
        required: false
        default: "spec,phot,halo"
      g_max:
        description: "G magnitude ceiling on the sample (WISE confusion limit)"
        required: false
        default: "18.0"
      limit_per_band:
        description: "Row cap per 15-degree declination band"
        required: false
        default: "400000"
      max_followup:
        description: "Cap on candidates sent to per-object follow-up"
        required: false
        default: "200"
      skip_followup:
        description: "Set to 'true' to skip the reddening/neighbour/SIMBAD stage"
        required: false
        default: "false"
      reduce_only_run_id:
        description: "Skip the archive pull; re-analyse this prior run's sample"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tracks: ${{ steps.mk.outputs.tracks }}
    steps:
      - id: mk
        run: |
          python3 -c "import json,os; s=os.environ['T']; print('tracks=' + json.dumps([x.strip() for x in s.split(',') if x.strip()]))" >> "$GITHUB_OUTPUT"
        env:
          T: ${{ github.event.inputs.tracks || 'spec,phot,halo' }}

  acquire:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    # The Gaia join is over gaia_source x astrophysical_parameters x AllWISE x
    # 2MASS in 12 declination bands; be generous, the bands checkpoint anyway.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(needs.plan.outputs.tracks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Shard hygiene (docs/channel-brief.md §0.7): chunks are track-prefixed and untracked today; the purge keeps
      # it that way if a commit step ever lands one.
      - name: Purge checkout-inherited shard outputs
        run: rm -rf results/ossuary/chunks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch track ${{ matrix.track }}
        run: |
          python -u - <<'PY'
          import os
          from pathlib import Path
          from seti.config import load_config
          from seti.ossuary import acquire as acq
          from seti.ossuary.run import out_dir

          cfg = load_config()
          s = cfg.thresholds["ossuary"]["sample"]
          track = os.environ["TRACK"]
          d = out_dir(cfg) / "chunks"
          df = acq.fetch_track(
              track, d,
              feh_max=s["feh_max"],
              poe_min=s["parallax_over_error_min"],
              ruwe_max=s["ruwe_max"],
              g_max=float(os.environ.get("G_MAX") or s["g_max"]),
              limit_per_band=int(os.environ.get("LIMIT") or 400000),
          )
          print(f"track {track}: {len(df)} rows")
          PY
        env:
          TRACK: ${{ matrix.track }}
          G_MAX: ${{ github.event.inputs.g_max || '18.0' }}
          LIMIT: ${{ github.event.inputs.limit_per_band || '400000' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ossuary-chunks-${{ matrix.track }}
          path: results/ossuary/chunks/
          if-no-files-found: warn

  analyze:
    needs: acquire
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected warm excess must be recovered on this runner
        run: python -m pytest tests/test_ossuary.py -q -p no:cacheprovider
      - uses: actions/download-artifact@v4
        with:
          pattern: ossuary-chunks-*
          merge-multiple: true
          path: results/ossuary/chunks/
      - name: Assemble, analyze, follow up
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.skip_followup }}" = "true" ]; then
            EXTRA="--no-followup"
          fi
          scripts/ossuary_assemble.sh
          python -u -m seti.cli ossuary --stage analyze \
            --max-followup ${{ github.event.inputs.max_followup || '200' }} $EXTRA
          echo "=== summary ==="
          python -c "import json; s=json.load(open('results/ossuary/summary.json')); print(json.dumps({k: v for k, v in s.items() if k != 'locus'}, indent=2))" || true
      - name: Assert the verdict is not a disguised no-data run
        if: always()
        run: scripts/ossuary_assert.sh
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ossuary: warm dust around metal-poor / halo-kinematic hosts (staged run)" \
            results/ossuary/summary.json \
            results/ossuary/REPORT.md \
            results/ossuary/sample_meta.json \
            results/ossuary/excess_flagged.csv \
            results/ossuary/candidates.csv \
            results/ossuary/giants_excess.csv \
            results/ossuary/followup.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ossuary-final
          path: |
            results/ossuary/
            !results/ossuary/chunks
            !results/ossuary/sample.parquet
          if-no-files-found: warn

  reduce-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected warm excess must be recovered on this runner
        run: python -m pytest tests/test_ossuary.py -q -p no:cacheprovider
      - name: Fetch the prior run's checkpointed bands
        uses: actions/download-artifact@v4
        with:
          pattern: ossuary-chunks-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/ossuary/chunks/
      - name: Re-assemble, re-analyze, follow up
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.skip_followup }}" = "true" ]; then
            EXTRA="--no-followup"
          fi
          scripts/ossuary_assemble.sh
          python -u -m seti.cli ossuary --stage analyze \
            --max-followup ${{ github.event.inputs.max_followup || '200' }} $EXTRA
          echo "=== summary ==="
          python -c "import json; s=json.load(open('results/ossuary/summary.json')); print(json.dumps({k: v for k, v in s.items() if k != 'locus'}, indent=2))" || true
      - name: Assert the verdict is not a disguised no-data run
        if: always()
        run: scripts/ossuary_assert.sh
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ossuary: re-analysis of run ${{ github.event.inputs.reduce_only_run_id }}'s sample" \
            results/ossuary/summary.json \
            results/ossuary/REPORT.md \
            results/ossuary/sample_meta.json \
            results/ossuary/excess_flagged.csv \
            results/ossuary/candidates.csv \
            results/ossuary/giants_excess.csv \
            results/ossuary/followup.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ossuary-final
          path: |
            results/ossuary/
            !results/ossuary/chunks
            !results/ossuary/sample.parquet
          if-no-files-found: warn
