name: baffle-bright

# BAFFLE bright tier — AKARI/IRC + IRAS mid-IR deficits on the stars 2MASS and
# WISE saturate on (docs/baffle.md §4; src/seti/baffle/bright.py).
#
#   probe ──▶ TAP_SCHEMA discovery for II/246/out, II/297/irc, II/125/main,
#             I/311/hip2 + one tiny query each + a 3-star 2MASS upload
#   run   ──▶ Gaia G < 7.5 targets (12 RA slabs) + Hipparcos-2 supplement
#             ──▶ 2MASS anchor (PM-propagated upload cones)
#             ──▶ AKARI/IRC PSC and IRAS PSC pulled in full (RA slices, local match)
#             ──▶ empirical Ks−[b] locus ──▶ screen ──▶ commit-back
#
# Signature S38 at the bright end: a star whose 9/12/18/25 µm flux is far
# below its photospheric prediction while its optical / near-IR is normal.
# The main track (baffle.yml) cannot see these ~10^4 stars, which include
# most of the NEAREST ones — the highest-prior observers a warden would shield.
#
# Disciplines (inherited from cenotaph.yml / metronome.yml): every archive
# call is a ledger line with QUERY_OK / QUERY_RETURNED_ZERO_ROWS / QUERY_FAILED
# kept apart; a failed slab never stops the run; column names are discovered at
# runtime and nothing not seen in TAP_SCHEMA is queried; positions are
# propagated to each survey's epoch (2MASS 2000.0, AKARI 2006.7, IRAS 1983.5)
# before matching; commit-back only through scripts/commit_results.sh, which
# VERIFIES the push.  targets.parquet and chunks/ stay in the artifact.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "probe" (schema discovery + tiny queries — run this first), "run"
          (the whole tier), or "vet" (AllWISE W3/W4 coverage check on the
          no-detection stars of the committed results — needs a prior run).
        required: false
        default: "run"
      max_targets:
        description: "Cap on targets, brightest first (0 = all ~40k)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  bright:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — planted deficits must be recovered on this runner
        run: python -m pytest tests/test_baffle_bright.py -q -p no:cacheprovider
      - name: Probe (TAP_SCHEMA discovery, tiny queries, upload test)
        if: ${{ github.event.inputs.stage != 'vet' }}
        run: |
          python -m seti.baffle.bright --stage probe
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/baffle_bright/probe.json"))
          for k, v in d["tables"].items():
              print(k, v.get("status"), v.get("n_columns"), "columns via", v.get("discovery_route"),
                    "resolved:", sorted(v.get("resolved", {})))
          print("gaia", d["gaia"].get("status"), d["gaia"].get("n_rows"))
          print("tmass_upload", d["tmass_upload"].get("status"), d["tmass_upload"].get("routes"))
          print("verdict", d["verdict"])
          PY
      - name: Run (targets → anchors → mid-IR → locus → screen)
        if: ${{ github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'vet' }}
        run: |
          MT=""
          if [ "${{ github.event.inputs.max_targets || '0' }}" != "0" ]; then
            MT="--max-targets ${{ github.event.inputs.max_targets }}"
          fi
          python -m seti.baffle.bright --stage run $MT
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/baffle_bright/summary.json"))
          keys = ("verdict", "science_verdict", "reason", "degradations", "n_targets",
                  "n_targets_gaia", "n_hipparcos_added", "brightest_300_not_covered",
                  "n_with_2mass", "n_with_2mass_read1_regime", "n_with_akari", "n_with_iras",
                  "n_with_2mass_and_midir", "n_candidates", "n_candidates_etz",
                  "n_candidates_nearby", "n_missing_bright_candidates", "counters",
                  "tail_asymmetry", "sensitivity", "denominators", "locus", "ledger_counts")
          print(json.dumps({k: s.get(k) for k in keys if k in s}, indent=2)[:8000])
          PY
      - name: Vet (AllWISE W3/W4 on the no-detection stars, control locus in-query)
        if: ${{ github.event.inputs.stage == 'vet' }}
        run: |
          python -m seti.baffle.bright --stage vet
          echo "=== vet ==="
          python - <<'PY'
          import json
          v = json.load(open("results/baffle_bright/bright_vet.json"))
          keys = ("verdict", "reason", "n_stars_to_vet", "n_stars_answered", "counters",
                  "wise_routes", "ledger_counts")
          print(json.dumps({k: v.get(k) for k in keys if k in v}, indent=2))
          c = v.get("control", {})
          print("control:", c.get("n_selected"), "selected,", c.get("n_answered"), "answered;",
                json.dumps(c.get("locus")))
          for k in v:
              if k.startswith("etz_star_"):
                  print(k, json.dumps(v[k]))
          for s in v.get("stars", []):
              print(s["source_id"], s.get("vet_set"), s["verdict"], "resid_w3", s.get("resid_w3"),
                    "resid_w4", s.get("resid_w4"), "-", (s.get("note") or "")[:100])
          if "NO_DATA_REACHED" in v.get("verdict", ""):
              print("::error::vet reached no AllWISE route — a transport failure, not a science result")
          if "ESCALATE" in v.get("verdict", ""):
              print(f"::notice::{v['counters']['W3_W4_DEFICIT']} no-detection star(s) are ALSO faint in W3 and W4 — escalate")
          PY
      # A verdict must never read as a science null when no data was reached.
      - name: Assert the verdict is not a disguised no-data run
        if: ${{ github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'vet' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/baffle_bright/summary.json")
          if not p.exists():
              print("::error::no summary.json — the run produced nothing"); sys.exit(1)
          s = json.loads(p.read_text())
          v = s.get("verdict", "")
          n = s.get("n_with_2mass_and_midir", 0)
          if n == 0 and "NO_DATA_REACHED" not in v and "DEGRADED_SOURCE" not in v:
              print(f"::error::verdict {v!r} with 0 measured stars is a disguised no-data run"); sys.exit(1)
          if "NO_BRIGHT_MIDIR_DEFICIT_SURVIVOR" in v:
              print(f"::notice::{n} bright stars measured, no two-band mid-IR deficit survivor. "
                    "A COUNT, NOT A LIMIT — and the missing_bright_candidates list still needs eyes.")
          if "CANDIDATES_PENDING_VET" in v:
              print(f"::notice::{s.get('n_candidates')} bright-star deficit candidates PENDING vet — "
                    "see results/baffle_bright/candidates.csv")
          if s.get("brightest_300_not_covered"):
              print("::warning::Hipparcos supplement not reached: the ~300 stars brighter than "
                    "G≈3 are NOT covered by this run")
          if "DEGRADED_SOURCE" in v:
              print(f"::warning::{v}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baffle-bright
          path: results/baffle_bright/
          if-no-files-found: warn
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # Push VERIFIED against the remote; paths this run did not produce
          # are skipped by the script (targets.parquet and chunks/ are never
          # listed — they live in the artifact).
          scripts/commit_results.sh \
            "baffle-bright: AKARI/IRAS mid-IR deficits on the brightest stars" \
            results/baffle_bright/summary.json \
            results/baffle_bright/candidates.csv \
            results/baffle_bright/missing_bright_candidates.csv \
            results/baffle_bright/bright_residuals.csv \
            results/baffle_bright/locus_bright.json \
            results/baffle_bright/ledger.json \
            results/baffle_bright/probe.json \
            results/baffle_bright/bright_vet.json \
            results/baffle_bright/bright_vet.csv
