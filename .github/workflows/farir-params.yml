name: farir-params

# Instrumental + systematics parameters for an AKARI-FIS / IRAS far-IR
# x optical-NIR (Gaia / 2MASS / AllWISE) crossmatch design.
#
#  docs  : beam FWHM, positional accuracy, sensitivity, flag definitions and
#          adopted crossmatch radii, from JAXA release notes, VizieR ReadMes,
#          the IRAS Explanatory Supplement, arXiv and OpenAlex.
#  stats : the same quantities MEASURED from the catalogues themselves, plus
#          the Gaia surface-density map that fixes the chance-coincidence rate.
#
# Sandbox egress is blocked at the policy proxy; the runner has network.
# Results are committed back to the branch (CLAUDE.md acquisition pattern).

on:
  workflow_dispatch:
    inputs:
      run_docs:
        description: "Run the documentation/literature harvest"
        type: boolean
        default: true
      run_stats:
        description: "Run the catalogue-statistics measurement"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: farir-params-${{ github.ref_name }}

jobs:
  docs:
    if: ${{ inputs.run_docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install text-extraction tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet --upgrade pip pypdf
      - name: Harvest instrument documentation (soft deadline, partials kept)
        run: |
          timeout -k 30 3300 python scripts/farir_docs.py \
            || echo "docs fetcher hit soft deadline or errored; keeping partials"
          echo "=== outputs ==="
          ls -la results/farir_docs/ || true
          du -sh results/farir_docs/* 2>/dev/null || true
      - name: Trim oversized raw blobs before commit
        run: |
          # Keep the harvest reviewable in git: drop raw files > 6 MB, we have
          # the extracted text for those already.
          find results/farir_docs/raw -type f -size +6M -print -delete || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/farir_docs/ || true
          if git diff --cached --quiet; then
            echo "No doc changes to commit."
          else
            git commit -m "farir-params: AKARI FIS / IRAS instrument + systematics documentation harvest"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin ${{ github.ref_name }} || true
              git push origin HEAD:${{ github.ref_name }} && break
              echo "push retry $i"; sleep $((5 * i))
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farir-docs
          path: results/farir_docs/
          if-no-files-found: warn

  stats:
    if: ${{ inputs.run_stats }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific stack
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            "numpy<2.3" "astropy>=6.0" "astroquery>=0.4.7" healpy dustmaps requests
          python -c "import numpy, astropy, astroquery; \
            print('numpy', numpy.__version__, 'astropy', astropy.__version__, \
                  'astroquery', astroquery.__version__)"
      - name: Measure catalogue systematics (soft deadline, partials kept)
        run: |
          timeout -k 60 9600 python scripts/farir_stats.py \
            || echo "stats runner hit soft deadline or errored; keeping partials"
          echo "=== outputs ==="
          ls -la results/farir_stats/ || true
          du -sh results/farir_stats/* 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # never commit the bulk downloads
          rm -rf work_farir || true
          find results/farir_stats -type f -size +20M -print -delete || true
          git add -f results/farir_stats/ || true
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "farir-params: measured AKARI FIS / IRAS column, flag, flux, density and chance-coincidence statistics"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin ${{ github.ref_name }} || true
              git push origin HEAD:${{ github.ref_name }} && break
              echo "push retry $i"; sleep $((5 * i))
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farir-stats
          path: results/farir_stats/
          if-no-files-found: warn
