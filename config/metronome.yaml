# METRONOME channel — every selection / rejection threshold in one place.
#
# Signature S28 (docs/necrosignatures.md §2.VI): "structure in timing series".
# Do any star's catalogued flares occur on a STRICT CLOCK?  Natural flares are
# Poisson-like; the only natural quasi-periodicity (rotational modulation of
# flare visibility) has a phase jitter of order a tenth of a cycle.  A pulsed
# transmitter / duty-cycled engine / beacon is a clock with jitter far below
# that.  The observable is timing regularity, not the events themselves.
#
# Table ids below are PREFERRED seeds.  The probe stage lists every table under
# each id in VizieR's TAP_SCHEMA, reads the real column names, resolves the
# roles it needs, and falls back to the keyword search when the seed is dead.
# Nothing is queried by a column name that was not seen in TAP_SCHEMA.columns.

# MEASURED column names (ARC's acquire, run of 2026-09-16, results/arc/probe.json)
# — the first METRONOME dispatch (2026-09-06) saw none of them because
# TAP_SCHEMA.columns hands names back double-quoted and every role pattern is
# anchored; that is fixed at the source now.  Per-flare TIMES exist in:
#   Yang & Liu 2019   J/ApJS/241/29/table2   KIC, Q, Begin, End, logE      (start+end, no peak)
#   Okamoto+2021      J/ApJ/906/72/table2    KIC, Date, Dur, E, Prot, Amp   (Date = peak, BKJD)
#   Shibayama+2013    J/ApJS/209/5/table7    KIC, Date, FAmp, Dur, E        (Date = peak, BKJD)
#   Tu+2022           J/ApJ/935/90/table2    ID, Sector, PDate, Energy      (PDate = peak, BTJD)
#   Günther+2020      J/AJ/159/60/table1     TIC, Sec, tpeak, Ebol, Prot    (tpeak, BJD)
# and do NOT exist in Davenport 2016 (J/ApJ/829/23/table1 is a per-star FFD
# summary: KIC, Prot, Nfl, alpha, beta — nothing per flare) — it is a rotation
# source below, not an event catalogue.  Pietras+2022 (ApJ 935, 143) and the
# brief's "Tu 2020" id (J/ApJS/253/35) returned ZERO rows from TAP_SCHEMA on
# 2026-09-06; Pietras is re-tried by author keyword and recorded either way.
catalogues:
  kepler_yang2019:
    mission: kepler
    preferred: "J/ApJS/241/29/table2"   # Yang & Liu 2019, ApJS 241, 29 — 162,262 flares / 3,420 stars; Begin/End (BKJD)
    keywords: ["flare", "Kepler"]
    enabled: true
  kepler_okamoto2021:
    mission: kepler
    preferred: "J/ApJ/906/72/table2"    # Okamoto+2021, ApJ 906, 72 — 2,344 superflares / 266 solar-type stars; Date = peak
    keywords: ["superflare", "solar-type"]
    enabled: true
  kepler_shibayama2013:
    mission: kepler
    preferred: "J/ApJS/209/5/table7"    # Shibayama+2013, ApJS 209, 5 — 1,547 superflares / 279 G dwarfs; Date = peak
    keywords: ["superflare", "Kepler"]
    enabled: true
  tess_gunther2020:
    mission: tess
    preferred: "J/AJ/159/60/table1"     # Günther+2020, AJ 159, 60 — 8,695 flares / 1,228 stars, sectors 1-2; tpeak
    keywords: ["flare", "TESS"]
    enabled: true
  tess_tu2022:
    mission: tess
    preferred: "J/ApJ/935/90/table2"    # Tu+2022, ApJ 935, 90 — 15,638 superflare candidates / 3,715 stars; PDate = peak
    keywords: ["superflare", "TESS"]
    enabled: true
  tess_pietras2022:
    mission: tess
    preferred: "J/ApJ/935/143"          # Pietras+2022, ApJ 935, 143 — ZERO rows in TAP_SCHEMA on 2026-09-06; re-tried by author
    keywords: ["Pietras"]
    enabled: true

rotation_catalogues:
  kepler:
    - {name: mcquillan2014, preferred: "J/ApJS/211/24/table1", keywords: []}   # KIC, Prot (34,030 stars)
    - {name: santos2021, preferred: "J/ApJS/255/17/table1", keywords: []}      # KIC, Prot (39,591 stars)
    - {name: reinhold2013, preferred: "J/A+A/560/A4", keywords: []}
    - {name: yang2019_stars, preferred: "J/ApJS/241/29/table1", keywords: []}  # KIC, Prot — the flare catalogue's own
    - {name: davenport2016_stars, preferred: "J/ApJ/829/23/table1", keywords: []}
  tess:
    - {name: tu2022_stars, preferred: "J/ApJ/935/90/table1", keywords: []}     # ID, Per (71,732 stars)
    - {name: gunther2020_stars, preferred: "J/AJ/159/60/table2", keywords: []} # TIC, Prot (1,228 stars)

# Per-star positions for the cone crossmatches (shortlist only)
position_tables:
  kepler: ["V/133/kic"]
  tess: ["IV/39/tic82", "IV/38/tic"]

# Periodic-variable contamination: a pulsator's cycles chopped into "flares"
variability_catalogues:
  vsx:
    table: "B/vsx/vsx"
    period_patterns: ["^period$", "^per$"]
    type_patterns: ["^type$", "^vtype$"]
  gaia_dr3_vari:
    table: "I/358/vclassre"
    period_patterns: ["^period$", "^pf$", "^p_?f$"]
    type_patterns: ["^class$", "^best_?class_?name$", "^type$"]
  ztf_chen2020:
    table: "J/ApJS/249/18"
    period_patterns: ["^per$", "^period$"]
    type_patterns: ["^type$", "^class$"]
cone_radius_arcsec: 3.0

windows:
  # Data-driven windows from the density of EVERY event in a catalogue.
  # Tenth-day bins; an empty run is a gap when it is >= min_gap_days long AND
  # the catalogue's mean rate predicts >= min_expected_in_gap events in it
  # (an e^-20 fluke at worst).  Kepler's inter-quarter gaps are ~1-3 d and its
  # monthly downlinks ~1 d; at ~10^2 events/day both resolve.  A sparse
  # catalogue resolves only its long gaps (the window label records the
  # effective minimum gap).  Below min_events_for_data_driven the published
  # Kepler quarter table (approximate) is used instead.
  bin_days: 0.1
  min_gap_days: 0.5
  min_expected_in_gap: 20.0
  min_events_for_data_driven: 2000
  pad_days: 0.5
  # A window with no events where the star's own rate predicts >= this many is
  # presumed unobserved (module failure / not on silicon) and dropped.  Stated
  # approximation: it slightly weakens the evidence against a clock that fell
  # silent for a window.
  drop_expected: 5.0
  cadence_days:
    kepler: 0.020434       # 29.42-min long cadence
    tess: 0.0013889        # 2-min
  # A catalogue that records the sector / quarter of every event states the
  # span of everything it saw per sector; the density windows are intersected
  # with those spans, so a sparse TESS catalogue no longer bridges sector
  # boundaries it cannot resolve from density alone.
  use_sector_spans: true
  sector_pad_days: 0.0
  # The cadence above is a FALLBACK.  The screen stage measures the lattice the
  # catalogue's own peak times lie on (windows.infer_time_grid) and uses that
  # when one is detectable; grid_tol_frac is the fraction of a step a time may
  # miss the lattice by, grid_min_on_grid the fraction of distinct times that
  # must be on it.
  grid_tol_frac: 0.12
  grid_min_on_grid: 0.97

cross_star:
  # Epochs at which anomalously many DISTINCT stars have an event are
  # spacecraft (momentum dumps, Argabrightenings, scattered light), removed
  # from every star BEFORE any star is scanned.
  bin_days:
    kepler: 0.0409         # two long cadences
    tess: 0.0069           # five 2-min cadences
  min_stars: 5
  tail_p: 1.0e-6

scan:
  n_min: 8                 # events per star after declustering + cross-star removal
  decluster_gap_days: 0.1  # complex/sympathetic flares within 2.4 h are one event
  min_period_days: 0.2
  n_cadences_min: 10       # a peak time cannot define a clock finer than ~10 cadences
  max_period_days: 400.0
  span_fraction_max: 0.3333  # fewer than three cycles is a trend, not a clock
  oversample: 5.0
  m_max: 4                 # H-test harmonics; a delta in phase fills all of them
  chunk: 8192
  refine_points: 41
  refine_halfwidth_steps: 2.0
  phase_window: 0.05       # f_in_window = fraction within ±0.05 cycle of the clock phase
  gap_tol: 0.05            # waiting time counts as an integer number of periods within this
  harmonic_walk_tol: 0.02
  harmonic_walk_max: 12    # must exceed the small primes: a duty-0.25 clock can peak at P/7
  # The CORE of the phase distribution: events within ±core_window cycle of
  # the clock phase.  jitter_core and gap_integer_frac_core are measured over
  # them, so a clock mixed with a natural flare background (a beacon on a
  # star that also flares) is judged on its ticks, not on the background.
  core_window: 0.15

null:
  # Besag & Clifford (1991) sequential Monte Carlo: stop at h_stop exceedances
  # or n_max trials.  An ordinary star stops after ~20 trials; a star nothing
  # exceeds runs the full n_max and its p is Gumbel-extrapolated (flagged).
  h_stop: 10
  n_max: 2000
  n_min_trials: 20
  budget_s: 300.0
  # Loose Bonferroni screen: rate 0.3 overstates the H tail (0.4 is the
  # single-trial value), so a star screened out here could not have been
  # significant under the empirical null either.
  screen_rate: 0.3
  screen_p_max: 0.5
  n_shuffle: 100
  shuffle_min_gaps: 4
  # NULL 3, the empirical one: N times drawn from the OTHER stars' catalogued
  # event times inside this star's own windows.  It models nothing -- it
  # resamples the catalogue's real time lattice, sector duty cycle and epoch
  # preferences as they are.  Nulls 1 and 2 both snap to a cadence taken from
  # configuration; when that cadence is wrong (Tu+2022's peak times are spaced
  # by 0.0069 d, five 2-min cadences) every period commensurate with the true
  # lattice looks significant, and only this null notices.
  n_pool: 200
  pool_min_size: 24
  pool_factor: 3           # need >= 3N other-star times inside the star's windows
  pool_max_times: 120000   # cap on the resampling pool per catalogue
  # A star whose Q / jitter already fail the WATCH thresholds (vet: below)
  # can never rank above tier `none`, whatever its p, so its null is capped at
  # n_max_not_clock trials.  Exact restatement of the tier condition, not a
  # heuristic; it keeps a catalogue of rotation-modulated stars from spending
  # the whole budget on p-values that cannot change a tier.
  n_max_not_clock: 200
  Q_watch: 0.6
  jitter_watch: 0.12
  f_core_watch: 0.4        # the core route to the watch quality (vet: below)

vet:
  rotation_ratios: [1.0, 0.5, 0.33333, 0.25, 2.0, 3.0]
  rotation_tol: 0.03
  cadence_harmonics: [1.0, 2.0, 3.0, 0.5, 0.33333]
  cadence_tol: 0.02
  variable_harmonics: [1.0, 0.5, 0.33333, 2.0, 3.0]
  variable_tol: 0.03
  fdr_alpha: 0.05
  fdr_alpha_watch: 0.25
  shuffle_alpha: 0.05
  # A star must be rarer than pool_alpha against null 3 as well.  Loose on
  # purpose: with n_pool = 200 the smallest reachable p is ~0.005, and this
  # null exists to kill lattice artefacts, not to re-rank clocks that null 1
  # already puts at p ~ 1e-20.
  pool_alpha: 0.05
  # Report-only.  A catalogue that rounds peak times to a lattice of spacing g
  # forces an rms phase jitter >= g / (P sqrt(12)) on any clock whatever.  A
  # star within quantisation_factor of that floor is as tight as its time
  # stamps allow and no tighter: the tightness is the catalogue's rounding, not
  # the star.  (KIC 5879574: g = 0.0204 d, P = 0.4233 d -> floor 0.0139 cycles
  # against a measured 0.0431, so NOT quantisation-limited -- the flag is meant
  # to catch the cases where it is.)
  quantisation_factor: 1.5
  # STRICT clock quality (candidate / interest).  Rotational modulation with
  # rate ∝ 1+cos gives jitter ~0.15-0.3 in units of P; a 30-min-cadence clock
  # at P = 1 d cannot do worse than ~0.006.  The assess stage reports where
  # these sit against the measured natural distribution (calibration block).
  Q_min: 0.85
  jitter_max: 0.05
  gap_frac_min: 0.6
  gap_min_count: 4
  # LOOSE quality (watch)
  Q_watch: 0.6
  jitter_watch: 0.12
  # The CORE route to either quality, robust to a natural flare background:
  # >= f_core_min of ALL events within ±phase_window of the clock phase AND
  # the core's own jitter <= jitter_max over >= core_n_min core events
  # (watch: f_core_watch / jitter_watch).  MEASURED offline: a strict clock
  # with 30% random flares mixed in has Q = 0.49, jitter = 0.13 (fails even
  # watch on the rms route) at p ~ 1e-64 with f_in_window = 0.75 and a core
  # jitter of 0.002.  Rotational modulation (rate ∝ 1 + cos) has
  # f_in_window ≈ 0.20 and core jitter ≈ 0.087: below both gates.
  f_core_min: 0.6
  f_core_watch: 0.4
  core_n_min: 8
  energy_p_max: 0.01
  instrumental_periods:
    kepler:
      long_cadence: 0.020434
      momentum_dump: 3.0            # reaction-wheel desaturation, ~every 3 d
      monthly_downlink: 31.0
      quarter: 93.0
    tess:
      cadence_2min: 0.0013889
      cadence_10min: 0.0069444
      cadence_200s: 0.0023148
      ffi_30min: 0.0208333
      momentum_dump_early: 3.5      # 2.5-4.5 d in early sectors
      orbit: 13.7
      sector: 27.4
  # The brief mentioned a "6.02 h" Kepler systematic; it could not be verified
  # here and is NOT applied.  Add it under kepler: above if a source is found.

acquire:
  chunk_rows: 50000
  max_rows: 0                       # 0 = no cap
  rotation_max_rows: 0

# Flare RE-DETECTION on the shortlist's own MAST light curves
# (src/seti/metronome/redetect.py; the `redetect` job of metronome.yml).  Every
# star at watch or better after assess, plus the most flare-rich stars per
# catalogue, gets its Kepler / TESS light curve fetched through GROWTH's bounded
# MAST loop; a stated detector finds the brightenings again; the identical
# clock statistic runs on the re-detected peaks with the windows read off the
# light curve.  A catalogue clock is CONFIRMED only when the independent
# detector finds it at the same period (or a low harmonic) with strict quality.
redetect:
  enabled: true
  max_stars: 40
  tiers: ["candidate", "interest", "watch"]
  top_by_events: 12
  # the detector: running-median baseline, MAD sigma, >= n_consecutive cadences
  # above sigma_lo with the peak above sigma_hi (Chang+2015 / Yang+2019 shape)
  detrend_window_days: 0.5
  sigma_lo: 2.5
  sigma_hi: 3.5
  n_consecutive: 3
  gap_days: 0.5
  cadence: long                     # Kepler: long cadence only, as the catalogues used
  budget_s: 5400.0
  per_target_budget_s: 900.0
  max_quarters: 60
  retries: 2
  match_tol_days: 0.1               # a catalogued flare is recovered within this
  period_tol: 0.02
  period_harmonics: [1.0, 0.5, 2.0, 0.33333, 3.0]
  confirm_p_max: 0.05
  confirm_Q_min: 0.85
  confirm_jitter_max: 0.05

# The VizieR ROUTE LADDER shared by every channel that imports
# seti.metronome.acquire (METRONOME, ARC, ULINE).  On 2026-09-13 TAPVizieR
# answered 503 to five attempts over EACH of https and http, and two channels
# reported NO_DATA_REACHED for an infrastructure reason.  VizieR is now reached
# over four routes in order, each recorded with its endpoint and error text:
#   1. the primary TAP host;
#   2. the other TAP hosts in tap_mirrors;
#   3. asu_tsv — the NON-TAP route: VizieR's own ASU interface, served by the
#      web application rather than the TAP service.  `-source=<cat>&-out.max=<n>
#      &-out=<col>...&-out.form=TSV` returns the rows as tab-separated text with
#      `#` metadata; `-source=<cat>&-meta.all` (ReadMe as the backstop) answers
#      the table-EXISTENCE question and so replaces TAP_SCHEMA discovery while
#      TAP is down.  A COUNT(*) has no ASU equivalent: the row count is then
#      reported as unknown, never invented.
#   4. astroquery.vizier.Vizier (already a declared dependency).
# This block MIRRORS the module defaults VIZIER_TAP_MIRRORS / VIZIER_ASU_MIRRORS
# in src/seti/metronome/acquire.py; tests/test_metronome.py pins the two to be
# identical so the endpoints and their verify status live in one visible place.
vizier_routes:
  tap_mirrors:
    - "https://tapvizier.cds.unistra.fr/TAPVizieR/tap"
    # verify: historical CDS hostname for the same service (u-strasbg.fr is the
    # pre-2021 name of the domain that became cds.unistra.fr).  ASSERTED, not
    # confirmed — there is no egress from the sandbox, so the first runner
    # dispatch that reaches (or fails to reach) it is what settles it.
    - "https://tapvizier.u-strasbg.fr/TAPVizieR/tap"
    # verify: the CfA VizieR mirror.  ASSERTED, unconfirmed until a runner
    # reaches it; a host that fails is recorded with its error, never dropped.
    - "https://vizier.cfa.harvard.edu/TAPVizieR/tap"
    - "http://tapvizier.cds.unistra.fr/TAPVizieR/tap"
  asu_tsv:
    - "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
    # verify: mirror hostnames, ASSERTED and unconfirmed as above.
    - "https://vizier.u-strasbg.fr/viz-bin/asu-tsv"
    - "https://vizier.cfa.harvard.edu/viz-bin/asu-tsv"
  readme: "https://cdsarc.cds.unistra.fr/ftp/{catalogue}/ReadMe"
  # The NON-TAP existence check.  The ASU interface has no TAP_SCHEMA, so
  # "does TAP_SCHEMA.tables contain J/ApJ/906/72/table2" becomes "ask ASU for
  # ONE ROW of -source=J/ApJ/906/72/table2 and read the column names off the
  # TSV header".  ARC's 2026-09-14 dispatch (run 34792280736) failed because
  # -meta.all was the only non-TAP route and it did not resolve three of the
  # six catalogues.
  # verify: every spelling below is ASSERTED from the VizieR ASU documentation
  # and is NOT confirmed from this sandbox (there is no egress here).  The
  # first runner dispatch that gets a well-formed TSV back is what settles it;
  # a body that comes back as a VizieR error page (#*** lines) or that names a
  # DIFFERENT catalogue is recorded as a failed attempt, never read as rows.
  asu_params:
    source: "-source"           # verify: the catalogue or table id
    max_rows: "-out.max"        # verify: row cap
    all_columns: "-out.all"     # verify: every column
    column: "-out"              # verify: repeated, once per requested column
    form: "-out.form=TSV"       # verify: tab-separated text
    metadata: "-meta.all"       # verify: catalogue metadata instead of rows
    existence_rows: 1           # one row is enough to prove a table exists
  # Per-endpoint circuit breaker (seti.metronome.acquire).  Short cooldown, and
  # a host that has ALREADY SERVED a query in this process is never skipped --
  # it is intermittent, not down, and skipping it is what starved ARC's run.
  circuit_breaker:
    fail_limit: 2
    cooldown_s: 45
    never_skip_after_success: true
