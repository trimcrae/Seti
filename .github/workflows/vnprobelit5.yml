name: vnprobelit5

# Prior-art / novelty adjudication for a POPULATION search for alien
# self-replicating (von Neumann) probes among solar-system objects using
# Rubin/LSST SSO alerts (ephemeris residuals + non-gravitational parameters).
# The sandbox blocks arxiv.org / api.openalex.org; the runner has egress
# (CLAUDE.md acquisition pattern). Results are committed back to the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vnprobelit5:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch prior-art evidence (soft 50-min deadline, partials kept)
        run: |
          timeout -k 30 3300 python scripts/vnprobelit5_pdf.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== files ==="
          ls -la results/vnprobelit5/ || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/vnprobelit5/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "vnprobelit5: PDF full text for the papers arXiv serves no HTML for"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnprobelit5-outputs
          path: results/vnprobelit5/
          if-no-files-found: warn
