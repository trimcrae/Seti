name: survey-recon

# What else can TOCSIN and LOOM be fed while Rubin is dark?
# (`scripts/survey_recon.py`)
#
# Not a shortlist --- a measurement. Whether a channel can run on a substitute
# survey turns on whether the specific column carrying its observable exists, is
# populated and is reachable in bulk without a human in the loop, and none of
# that can be established from the sandbox: every endpoint here is egress-
# blocked. TOCSIN's whole ADQL layer had to be corrected against a live schema
# once already; this asks first and commits the answer verbatim.
#
# Public endpoints only. Dispatch-only.

on:
  workflow_dispatch:
    inputs:
      out_dir:
        description: "Override the results directory (blank = results/survey_recon)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Probe every candidate archive
        run: |
          if [ -n "${{ github.event.inputs.out_dir }}" ]; then
            python scripts/survey_recon.py --out-dir "${{ github.event.inputs.out_dir }}"
          else
            python scripts/survey_recon.py
          fi

      - name: Commit the reconnaissance
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ONE PATHSPEC AT A TIME: `git add` with several is atomic, so one
          # unmatched glob would stage nothing and discard the run.
          git add -f -- results/survey_recon/recon.json || echo "no recon.json"
          echo "=== staged ==="
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "survey-recon: what each candidate archive actually serves"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survey-recon
          path: results/survey_recon/
