name: vanishing-lit3

# Literature survey acquisition, pass 2 (breadth sweep): VASCO / wide-field
# vanishing searches, SN impostors, PHL 293B rebuttals, SPIRITS, M31-2014-DS1,
# failed-SN theory, recurrent-obscuration analogues. Runs alongside pass 1.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vanishing-lit3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch literature evidence (soft 45-min deadline, partials kept)
        run: |
          timeout -k 30 2700 python scripts/vanishing_lit_fetch3.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== files ==="
          ls -la results/vanishlit3/ || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/vanishlit3/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "vanishing-lit3: pass 3 gap-fill (specific IDs, VASCO critiques, wide-field searches)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanishing-lit3-outputs
          path: results/vanishlit3/
          if-no-files-found: warn
