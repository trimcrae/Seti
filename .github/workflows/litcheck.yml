name: litcheck

# HERDSMAN literature novelty check: fetch verbatim arXiv abstracts, citation
# lists (Semantic Scholar / OpenAlex), and full-text HTML of candidate-overlap
# papers. The sandbox blocks these hosts; the runner has egress (CLAUDE.md
# acquisition pattern). Results are committed back to the branch.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  litcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch literature evidence
        run: |
          python scripts/litcheck_fetch.py
          echo "=== summary ==="
          cat results/litcheck/summary.json | tail -20
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/litcheck/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "litcheck: HERDSMAN novelty-check literature evidence (arXiv abstracts + citation lists)"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litcheck-outputs
          path: results/litcheck/
          if-no-files-found: warn
