name: baffle

# BAFFLE — reciprocal mid-IR absorbing screens on Sun-star lines (docs/baffle.md).
#
#   probe ──▶ acquire (matrix: one shard per group of 5-degree dec bands)
#         ──▶ screen + patch + radio + assess ──▶ commit-back
#   reduce-only: re-screen a prior run's chunk artifacts without refetching.
#
# The observable: a star whose W1 AND W2 sit significantly below the
# photospheric locus set by its own (J-Ks), with normal Ks.  No natural
# foreground does this; interstellar extinction makes the IR relatively
# brighter.  Two tracks: `deficit` (in-archive pre-cut on Ks-W1 / Ks-W2 plus a
# uniform random_index locus subsample) and `missing` (bright stars with a
# 2MASS match and NO AllWISE counterpart at all, with per-band denominators).
#
# Operational design inherited from cenotaph.yml / metronome.yml / ossuary.yml:
#  * checkpointing — every leaf chunk writes its own parquet immediately and is
#    reused on re-run; every upload is `if: always()`;
#  * sharding — 36 declination bands dealt round-robin over `n_shards` shards in
#    a fail-fast:false matrix; a lost shard re-runs alone;
#  * a per-chunk acquisition ledger keeps QUERY_OK / QUERY_RETURNED_ZERO_ROWS /
#    QUERY_FAILED / QUERY_TRUNCATED apart; a truncated or failed band is split
#    recursively on random_index; one failed chunk never destroys the others;
#  * reduce_only_run_id — re-screen a prior run's chunks without refetching;
#  * commit-back through scripts/commit_results.sh, which VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, acquire matrix, screen+patch+radio+assess), "probe"
          (schema probe + one timed TOP 100 per track; run this first), or
          "screen" / "assess" with reduce_only_run_id to re-reduce a prior run.
        required: false
        default: "all"
      tracks:
        description: "Comma-separated tracks: deficit,missing"
        required: false
        default: "deficit,missing"
      n_shards:
        description: "Acquire shards (the 36 dec bands are dealt round-robin over them)"
        required: false
        default: "6"
      g_max:
        description: "Deficit-track Gaia G ceiling (config default 15.0)"
        required: false
        default: ""
      reduce_only_run_id:
        description: "Skip probe/acquire; screen from this prior run's chunk artifacts"
        required: false
        default: ""
      run_patch:
        description: "Run the patch stage on the survivors (true/false)"
        required: false
        default: "true"
      max_patch_objects:
        description: "Cap on candidates handed to the patch stage"
        required: false
        default: "200"

permissions:
  contents: write

jobs:
  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.mk.outputs.shards }}
    steps:
      - id: mk
        run: |
          python3 -c "import json,os; n=int(os.environ['N'] or 6); print('shards=' + json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
        env:
          N: ${{ github.event.inputs.n_shards || '6' }}

  probe:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — injected deficit must be recovered on this runner
        run: python -m pytest tests/test_baffle.py -q -p no:cacheprovider -k "injected or methane or null or ledger"
      - name: Probe (schema of the five archive tables + one timed TOP 100 per track)
        run: |
          python -m seti.baffle.run --stage probe --tracks "${{ github.event.inputs.tracks || 'deficit,missing' }}"
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/baffle/probe.json"))
          print("status", d["status"], d["n_tables_ok"], "/", d["n_tables"], "tables")
          for k, v in d["tables"].items():
              print(f"  {k:6s} {v['status']:7s} {v['table']} {v.get('n_columns')} cols {v.get('seconds')} s")
          c = d["columns"]
          print("  wise missing", c.get("missing_wise"), "| 2mass missing", c.get("missing_tmass"), "| xt id", c.get("tmass_id"))
          for k, v in d["timed_queries"].items():
              print(f"  {k:20s} {v['status']:26s} {v['n_rows']:5d} rows {v['seconds']:7.1f} s via {v.get('transport')}")
              if v.get("error"):
                  print("     error:", str(v["error"])[:300])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baffle-probe
          path: results/baffle/probe.json
          if-no-files-found: warn

  acquire:
    needs: [plan, probe]
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage == 'all' }}
    runs-on: ubuntu-latest
    # Six shards x six 5-degree bands x two tracks, each band one COUNT(*) plus
    # one join over five tables; the leaves checkpoint, so be generous.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Acquire shard ${{ matrix.shard }} (both tracks, chunked, ledgered)
        run: |
          GM=""
          if [ -n "${{ github.event.inputs.g_max }}" ]; then
            GM="--g-max ${{ github.event.inputs.g_max }}"
          fi
          python -m seti.baffle.run --stage acquire \
            --tracks "${{ github.event.inputs.tracks || 'deficit,missing' }}" \
            --shard ${{ matrix.shard }} --n-shards ${{ github.event.inputs.n_shards || '6' }} $GM
          echo "=== ledger ==="
          python - <<'PY'
          import glob, json
          for p in sorted(glob.glob("results/baffle/acquisition_ledger*.json")):
              s = json.load(open(p))["summary"]
              print(p, s["acquisition_verdict"], s["n_rows_returned"], "rows;",
                    s["n_leaves_ok"], "ok /", s["n_leaves_failed"], "failed /",
                    s["n_leaves_truncated"], "truncated leaves; completeness", s["completeness"])
          PY
          ls -la results/baffle/chunks/ | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baffle-acquire-${{ matrix.shard }}
          path: |
            results/baffle/chunks/
            results/baffle/acquisition_ledger*.json
            results/baffle/columns*.json
            results/baffle/acquire*.json
          if-no-files-found: warn

  screen:
    needs: [probe, acquire]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: baffle-*
          merge-multiple: true
          path: results/baffle/
      - name: Screen (assemble chunks, fit locus, residuals, named vetoes, missing track)
        run: |
          ls results/baffle/ | head -40
          ls results/baffle/chunks/ 2>/dev/null | wc -l
          python -m seti.baffle.run --stage screen
      - name: Patch (per-candidate neighbourhood; another module, guarded)
        if: ${{ github.event.inputs.run_patch != 'false' }}
        run: |
          python -m seti.baffle.run --stage patch \
            --max-patch-objects ${{ github.event.inputs.max_patch_objects || '200' }}
      - name: Radio (another module, guarded)
        run: python -m seti.baffle.run --stage radio
      - name: Assess
        run: |
          python -m seti.baffle.run --stage assess
      # A verdict must never read as a science null when no data was screened.
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/baffle/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the screen stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v = s.get("verdict", "")
          n = (s.get("deficit") or {}).get("n_rows", 0) + (s.get("missing") or {}).get("n_rows", 0)
          if n == 0 and "NO_DATA_REACHED" not in v and "QUERY_RETURNED_ZERO_ROWS" not in v:
              print(f"::error::verdict {v!r} with 0 screened rows is a disguised no-data run"); sys.exit(1)
          if "NO_MIDIR_DEFICIT_SURVIVOR" in v:
              print(f"::notice::{(s.get('deficit') or {}).get('n_rows')} deficit-track rows screened, no two-band survivor. A COUNT, NOT A LIMIT — see docs/baffle.md.")
          if "PENDING_VET" in v:
              print(f"::notice::{v} — PENDING per-object vet, see results/baffle/candidates.csv and missing_candidates.csv")
          PY
      - name: Commit results (small files only; sample.parquet and chunks stay artifacts)
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The push is VERIFIED against the remote and a failure turns this
          # run red rather than dropping the results in a green one -- see
          # scripts/commit_results.sh (run 33029076779 lost 169 minutes of
          # results to a swallowed rebase conflict).
          scripts/commit_results.sh \
            "baffle: mid-IR deficit screen (staged run)" \
            results/baffle/probe.json \
            results/baffle/columns.json \
            results/baffle/locus.json \
            results/baffle/screen.json \
            results/baffle/summary.json \
            results/baffle/candidates.csv \
            results/baffle/vetoed.csv \
            results/baffle/deferred_lpv.csv \
            results/baffle/missing_candidates.csv \
            results/baffle/patch.json \
            results/baffle/patches.csv \
            results/baffle/patch_profiles.json \
            results/baffle/radio.json \
            results/baffle/radio \
            $(ls results/baffle/acquisition_ledger*.json 2>/dev/null) \
            $(ls results/baffle/columns_s*.json 2>/dev/null) \
            $(ls results/baffle/acquire*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baffle-final
          path: |
            results/baffle/
            !results/baffle/chunks
          if-no-files-found: warn

  reduce-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch the prior run's chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: baffle-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/baffle/
      - name: Re-screen / re-assess
        run: |
          ls results/baffle/chunks/ 2>/dev/null | wc -l
          if [ "${{ github.event.inputs.stage }}" = "assess" ]; then
            python -m seti.baffle.run --stage assess
          else
            python -m seti.baffle.run --stage screen
            if [ "${{ github.event.inputs.run_patch }}" != "false" ]; then
              python -m seti.baffle.run --stage patch \
                --max-patch-objects ${{ github.event.inputs.max_patch_objects || '200' }}
            fi
            python -m seti.baffle.run --stage radio
            python -m seti.baffle.run --stage assess
          fi
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "baffle: re-screen of a prior run's chunks" \
            results/baffle/locus.json \
            results/baffle/screen.json \
            results/baffle/summary.json \
            results/baffle/candidates.csv \
            results/baffle/vetoed.csv \
            results/baffle/deferred_lpv.csv \
            results/baffle/missing_candidates.csv \
            results/baffle/patch.json \
            results/baffle/patches.csv \
            results/baffle/patch_profiles.json \
            results/baffle/radio.json \
            results/baffle/radio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baffle-final
          path: |
            results/baffle/
            !results/baffle/chunks
          if-no-files-found: warn
