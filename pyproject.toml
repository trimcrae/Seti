[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seti-wd"
version = "0.1.0"
description = "A multi-channel, contamination-robust search for novel technosignatures in public astronomical catalogues (Gaia, WISE, ZTF, SDSS/DESI, Rubin alerts, MPC orbits)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Seti project" }]
keywords = ["SETI", "technosignatures", "white dwarfs", "infrared excess", "Dyson sphere", "Gaia", "WISE", "ZTF", "Rubin", "LSST", "alert stream", "von Neumann probe"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "astroquery>=0.4.7",
    "pyvo>=1.4",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.0", "ruff>=0.1"]
extinction = ["dustmaps>=1.0"]
spectra = ["sparclclient>=1.2"]   # SPARCL survey-spectra retrieval (runner only)
tess = ["lightkurve>=2.4"]        # TESS/K2 light curves via MAST (runner only)
parallax = ["gaiadr3-zeropoint>=0.0.4"]   # Lindegren+2021 Z5/Z6 tables (CENOTAPH)

[project.scripts]
seti = "seti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seti = ["data_assets/*.csv", "data_assets/*.ecsv"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-off runner-side fetch scripts (incl. the parallel session's): style
# rules stay relaxed so CI is not hostage to scratch tooling.
"scripts/*" = ["UP031", "B023", "B905", "E702", "B007", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
