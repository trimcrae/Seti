name: watchdog

# Hourly sweep that survives any Claude session dying: runs on GitHub's
# scheduler from the default branch, needs no external state.
#
# TWO DIFFERENT FAILURES, and the second one is invisible to the first:
#  1. RUNS THAT FAILED.  Finds workflow runs from the last 24 h that ended
#     failure / cancelled / timed_out (cancelled is how job-timeout kills
#     present); auto-retries their failed jobs (<=2 retries for
#     failures/timeouts, <=1 for cancels, so a deliberate human cancel is not
#     fought forever); commits a ledger to results/watchdog/ when anything was
#     found.  Green sweeps commit nothing (no hourly noise).
#  2. RUNS THAT NEVER STARTED.  GitHub's scheduler is best effort and drops
#     firings under load -- `tocsin-altfeeds` lost its first scheduled slot on
#     2026-08-26, and this workflow itself, nominally hourly at :17, fired that
#     day at 19:16, 16:33, 14:02, 13:13, 11:42, 10:50, 09:55 and 09:00 UTC.  A
#     dropped firing leaves NO failed run for step 1 to find, and no stale
#     result until the staleness window in alerts.py expires days later.  So
#     `seti.cronwatch` asks the API when each scheduled workflow last actually
#     ran on a schedule event, reports anything past its own grace window, and
#     re-dispatches it once (workflow_dispatch is one of the two events GitHub
#     exempts from the no-recursive-triggering rule, so the token here can).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Sweep recent runs and auto-retry failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/actions/runs?per_page=50" --jq '
            [.workflow_runs[]
             | select(.name != "watchdog" and .name != "ci")
             | select(.created_at > "'"$cutoff"'")
             | select(.conclusion == "failure" or .conclusion == "cancelled"
                      or .conclusion == "timed_out")
             | {id, name, head_branch, conclusion, run_attempt,
                html_url, created_at}]' > /tmp/failures.json
          # Superseded runs (root cause fixed, replacement dispatched) are
          # listed in the skiplist and never resurrected — retrying them just
          # races the replacement run for commits and API quota.
          skip='[]'
          [ -f results/watchdog/skiplist.json ] && skip=$(cat results/watchdog/skiplist.json)
          jq --argjson skip "$skip" \
            '[.[] | select(.id as $i | ($skip | index($i)) == null)]' \
            /tmp/failures.json > /tmp/failures_filtered.json
          mv /tmp/failures_filtered.json /tmp/failures.json
          n=$(jq length /tmp/failures.json)
          echo "failed/cancelled/timed-out runs in last 24h (after skiplist): $n"
          retried=0
          if [ "$n" -gt 0 ]; then
            mapfile -t rows < <(jq -c '.[]' /tmp/failures.json)
            for row in "${rows[@]}"; do
              id=$(jq -r .id <<<"$row")
              att=$(jq -r .run_attempt <<<"$row")
              conc=$(jq -r .conclusion <<<"$row")
              max=3; [ "$conc" = "cancelled" ] && max=2
              if [ "$att" -lt "$max" ]; then
                echo "re-running failed jobs of run $id ($conc, attempt $att)"
                gh api -X POST \
                  "repos/${{ github.repository }}/actions/runs/$id/rerun-failed-jobs" \
                  && retried=$((retried+1)) \
                  || echo "rerun request failed for $id (may be running already)"
              else
                echo "run $id ($conc) exhausted retries (attempt $att) — ledger only"
              fi
            done
            mkdir -p results/watchdog
            jq -n --slurpfile f /tmp/failures.json \
              --arg t "$(date -u +%FT%TZ)" --argjson r "$retried" \
              '{checked_at_utc: $t, retried: $r, failures: $f[0]}' \
              > results/watchdog/status.json
          fi
      - name: Commit ledger (only when failures were found)
        run: |
          [ -f results/watchdog/status.json ] || { echo "green sweep"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/watchdog/status.json
          if git diff --cached --quiet; then
            echo "ledger unchanged"
          else
            git commit -m "watchdog: failure sweep ledger ($(date -u +%FT%TZ))"
            git pull --rebase --autostash || true
            git push || echo "ledger push failed (non-fatal)"
          fi

      # ---------------------------------------------------------------------
      # 2. Runs that never started.
      # ---------------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pyyaml + requests only)
        # NOT `pip install -e .`: this job runs every hour, and the scheduler
        # watch needs to read YAML and make two HTTP calls per workflow, not the
        # whole scientific stack.  scripts/cron_watch.py imports seti.cronwatch
        # directly for exactly this reason.
        run: python -m pip install --quiet --upgrade pip pyyaml requests
      - name: Did the scheduled screens actually FIRE?
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/cron_watch.py \
            --ref "${{ github.event.repository.default_branch || 'main' }}"
      - name: Commit the scheduler ledger
        if: always()
        run: |
          [ -f results/cronwatch/status.json ] || { echo "no sweep written"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/cronwatch/status.json results/cronwatch/state.json
          if git diff --cached --quiet; then
            echo "scheduler ledger unchanged"
          else
            git commit -m "cronwatch: scheduler sweep ($(date -u +%FT%TZ))"
            git pull --rebase --autostash || true
            git push || echo "scheduler ledger push failed (non-fatal)"
          fi
