name: alertlit3

# Prior-art / novelty adjudication for technosignature searches on real-time
# transient ALERT STREAMS (Rubin/LSST, ZTF, ATLAS, Pan-STARRS, Gaia alerts).
# The sandbox blocks arxiv.org / api.openalex.org; the runner has egress
# (CLAUDE.md acquisition pattern). Results are committed back to the branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alertlit3:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch prior-art evidence (soft 55-min deadline, partials kept)
        run: |
          timeout -k 30 3300 python scripts/alertlit3_verify.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== files ==="
          ls -la results/alertlit3/ || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/alertlit3/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "alertlit3: arXiv+OpenAlex prior-art sweep for alert-stream technosignature angles id verification + decisive full text"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alertlit3-outputs
          path: results/alertlit3/
          if-no-files-found: warn
