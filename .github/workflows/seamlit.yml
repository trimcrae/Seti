name: seamlit

# Waste-heat SETI "seam" literature survey: the structural-assumption questions
# (attenuation-only detection, cold/far-IR re-radiation, halo/metal-poor hosts,
# time-variable IR excess, IRAS-vs-WISE longitudinal, exotic hosts, SED shape).
# The sandbox blocks arxiv/ADS/IOP/OUP; the runner has egress (CLAUDE.md pattern).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch literature evidence (soft 45-min deadline, partials kept)
        run: |
          timeout -k 30 2700 python scripts/seamlit_fetch.py \
            || echo "fetcher hit soft deadline or errored; committing partials"
          echo "=== files ==="
          ls -la results/seamlit/ || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/seamlit/ || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "seamlit: waste-heat SETI structural-assumption literature evidence"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seamlit-outputs
          path: results/seamlit/
          if-no-files-found: warn
