name: arc

# ARC — superflares above the starspot energy ceiling (docs/arc.md).
#
#   probe ──▶ acquire ──▶ screen ──▶ assess ──▶ commit-back
#
# Signature S59: a flare's energy is bounded by the magnetic energy its spots
# store, E_mag = f (B^2/8pi) A_spot^(3/2) (B = 3 kG, f <= 1; Okamoto+2021 find
# the Kepler envelope at f ~ 0.1).  The spot area follows from the rotational
# amplitude.  xi = log10 E_flare - log10 E_mag(f = 1, A_conservative) > 0 on
# >= 2 independent flares, surviving the companion / blend / evolved /
# pulsator vetoes, is a candidate PENDING the stage-2 pixel-centroid test.
#
# THE GOVERNING DISCIPLINES (docs/arc.md §5):
#  * the amplitude is a LOWER bound on the spot area, so the ceiling is
#    computed at the conservative (3x) area and the residual reported at both;
#  * every rejection is a named mechanism with its own counter, and the
#    funnel records the xi > 0 count before and after each;
#  * schema discovery at runtime — no column name is queried that was not
#    seen in TAP_SCHEMA.columns; QUERY_FAILED and QUERY_RETURNED_ZERO_ROWS
#    are kept apart in the artefact;
#  * a null is a reason to change the question, not a result.
#
# The whole channel is small (a few thousand superflare stars), so one job
# runs every stage; commit-back through scripts/commit_results.sh, which
# VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          Which stage to run: "all" (probe, acquire, screen, assess),
          "probe" (schema discovery only — cheap, run this first), or one of
          acquire / screen / assess (the earlier stages' outputs are taken
          from the branch's results/arc/).
        required: false
        default: "all"
      catalogues:
        description: >-
          Comma-separated catalogue keys from config/arc.yaml (default: every
          enabled one).  e.g. "kepler_okamoto2021,tess_tu2022"
        required: false
        default: ""
      max_rows:
        description: "Cap on rows pulled per catalogue (0 = no cap)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  arc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected ceiling excess must be recovered on this runner
        run: python -m pytest tests/test_arc.py -q -p no:cacheprovider
      - name: Probe (schema discovery, row counts)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'probe' }}
        run: |
          CATS=""
          if [ -n "${{ github.event.inputs.catalogues }}" ]; then
            CATS="--catalogues ${{ github.event.inputs.catalogues }}"
          fi
          python -m seti.arc.run --stage probe $CATS
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/arc/probe.json"))
          for k, v in d["catalogues"].items():
              print("flares", k, v["status"], v.get("table"), v.get("n_rows"), v.get("roles"))
          for k, v in d["star_catalogues"].items():
              print("stars ", k, v["status"], v.get("table"), v.get("n_rows"), v.get("roles"))
          PY
      - name: Acquire (flare tables + star tables, chunked, logged)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire' }}
        run: |
          CATS=""
          if [ -n "${{ github.event.inputs.catalogues }}" ]; then
            CATS="--catalogues ${{ github.event.inputs.catalogues }}"
          fi
          MR=""
          if [ "${{ github.event.inputs.max_rows || '0' }}" != "0" ]; then
            MR="--max-rows ${{ github.event.inputs.max_rows }}"
          fi
          python -m seti.arc.run --stage acquire $CATS $MR
          echo "=== acquire ==="
          python - <<'PY'
          import json
          d = json.load(open("results/arc/acquire.json"))
          for k, v in d["catalogues"].items():
              print("flares", k, v["status"], v.get("n_flares"), "flares", v.get("n_stars"), "stars", v.get("time_system_guess"))
          for k, v in d["star_catalogues"].items():
              print("stars ", k, v["status"], v.get("n_rows"), "rows")
          PY
      - name: Screen (spot ceiling and xi per star)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen' }}
        run: |
          CATS=""
          if [ -n "${{ github.event.inputs.catalogues }}" ]; then
            CATS="--catalogues ${{ github.event.inputs.catalogues }}"
          fi
          python -m seti.arc.run --stage screen $CATS
          ls -la results/arc/
      - name: Assess (Berger+2020 / TIC parameters, Gaia DR3 cones, the gauntlet)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'assess' }}
        run: |
          python -m seti.arc.run --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/arc/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("acquisition", "physics", "vet", "param_tables")}, indent=2)[:6000])
          PY
      # A verdict must never read as a science null when no data was assessed.
      - name: Assert the verdict is not a disguised no-data run
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'assess' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/arc/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), s.get("n_stars_assessable", 0)
          if n == 0 and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with 0 assessable stars is a disguised no-data run"); sys.exit(1)
          if "NO_CEILING_EXCESS" in v:
              print(f"::notice::{n} stars assessed, none above the conservative ceiling at interest tier. A COUNT, NOT AN OCCURRENCE LIMIT — see docs/arc.md.")
          if "CEILING_EXCESS_CANDIDATES" in v:
              print(f"::notice::{s.get('n_candidates')} candidate / {s.get('n_interest')} interest stars — PENDING the stage-2 centroid test, see results/arc/candidates.json")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The result of the push is VERIFIED against the remote (see
          # scripts/commit_results.sh); parquet intermediates stay in the artifact.
          scripts/commit_results.sh \
            "arc: superflares above the spot ceiling — ${{ github.event.inputs.stage || 'all' }}" \
            results/arc/probe.json \
            results/arc/acquire.json \
            results/arc/acquisition_log.json \
            results/arc/summary.json \
            results/arc/candidates.json \
            results/arc/candidates.csv \
            results/arc/xi_table.csv \
            $(ls results/arc/screen_*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-run
          path: results/arc/
          if-no-files-found: warn
