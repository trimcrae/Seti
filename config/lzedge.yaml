# LZEDGE — the LZ 248 keV nuclear-recoil candidate at the kinematic edge.
#
# Every number that describes the event, the run and the halo lives here.
# Values marked PLACEHOLDER are what the press record supports and are to be
# replaced by the numbers read from arXiv:2609.02823 (results/lzlit/) before a
# result is quoted.

# Verified 2026-09-07 against the arXiv:2609.02823 source (results/lzlit/src/2609.02823/):
#   analysis.tex: 220 live days between 27 March 2023 and 1 April 2024; FV 4.71 +- 0.08 t;
#   WS ROI S1c 3-600 phd, S2c 10^2.75-10^4.15 phd; NR efficiency averages 96% between
#   14 and 250 keV, crosses 50% at 5.4 keV and 269.9 keV (SupplementalMaterial.tex,
#   Fig. S2); the event: 248 +- 23 (stat) +- 23 (sys) keV, S1c 540.1 phd, S2c 9268 phd,
#   recorded 21:22:39 UTC on 16 June 2023; halo: SHM with the Baxter+2021 conventions.
event:
  energy_keV: 248.0
  sigma_stat_keV: 23.0
  sigma_sys_keV: 23.0            # energy-scale systematic, treated as a shift nuisance
  date: "2023-06-16"
  time_utc: "2023-06-16T21:22:39"
  s1c_phd: 540.1
  s2c_phd: 9268.0

run:                              # LZ WS2024 as used in arXiv:2609.02823
  start: "2023-03-27"
  end: "2024-04-01"
  live_days: 220.0
  exposure_tonne_year: 2.84      # 4.71 t x 220 d
  fiducial_tonne: 4.71

window:                           # extended nuclear-recoil window (50% points 5.4 and 269.9 keV)
  E_lo_keV: 5.4
  E_hi_keV: 290.0
  efficiency:                    # from the text of Fig. S2: 96% plateau 14-250 keV, 50% at 269.9 keV;
    - [5.4, 0.50]                # the roll-off above 250 keV is the S1c < 600 phd ROI edge.
    - [14.0, 0.96]               # Replace with the Data Release table when it is reached.
    - [250.0, 0.96]
    - [269.9, 0.50]
    - [290.0, 0.0]
  resolution_scaling: sqrt       # sigma(E) = sigma_stat * sqrt(E / E_event)

halo_models:
  shm_lz:                        # Baxter+2021 conventions used by LZ
    type: shm
    v0: 238.0
    v_esc: 544.0
    rho: 0.3
  shm_pp:                        # Evans, O'Hare & McCabe 2019
    type: shmpp
    v0: 233.0
    v_esc: 528.0
    eta_sausage: 0.2
    beta: 0.9
    rho: 0.55
  shm_vesc_low:                  # Gaia DR3 low end (Roche+2024-like), PLACEHOLDER value
    type: shm
    v0: 238.0
    v_esc: 500.0
    rho: 0.3
  shm_vesc_high:                 # high end of the Gaia posteriors, PLACEHOLDER value
    type: shm
    v0: 238.0
    v_esc: 600.0
    rho: 0.3
  shm_lmc_026:                   # SHM + LMC boosted Gaussian exactly as arXiv:2609.04175 eq. (1):
    type: shm_lmc                # |v_b| = 570 km/s along the LMC's velocity direction (cos beta = -0.70 to the
    v0: 238.0                    # Sun's), sigma_b = 100 km/s, hard cut |v - v_b| < 200 km/s, w = 0.26 %
    v_esc: 544.0                 # (Smith-Orlik+2023 present-day kappa_LMC; Besla+2019 ~0.2 %)
    lmc_speed: 570.0
    lmc_sigma: 100.0
    lmc_cut: 200.0
    lmc_fraction: 0.0026
    rho: 0.3
  shm_lmc_060:                   # the same with w = 0.6 % (2609.04175's upper value; Auriga 0.6 +0.4 -0.4 %)
    type: shm_lmc
    v0: 238.0
    v_esc: 544.0
    lmc_speed: 570.0
    lmc_sigma: 100.0
    lmc_cut: 200.0
    lmc_fraction: 0.006
    rho: 0.3

sideband:                         # LZ's empty high-energy sideband (SupplementalMaterial.tex: HE SB
  use: true                      # 800 < S1c < 1700 phd; ~350-590 keV NR per 2609.04175 (2.3 phd/keV), 350-680 per
  E_lo_keV: 350.0                # 2609.04673; 0 science events). Spectra die well below the upper edge.
  E_hi_keV: 600.0
  plateau_efficiency: 0.96       # assumes the plateau extends (as 2609.04673 does); the 270-350 keV gap is unconstrained
  observed_window_events: 1.0

posterior:
  sigma_ceiling_cm2: 1.0e-37   # log-uniform prior on sigma_n up to here; Z-exchange (Higgsino-like) is ~1e-39
  m_chi_gev: [200, 500, 1000, 3000, 10000]
  delta_keV: {min: 0.0, max: 480.0, step: 10.0}

scan:
  m_chi_gev: [50, 100, 200, 500, 1000, 3000, 10000]
  delta_keV: {min: 0.0, max: 460.0, step: 10.0}
  livetime_step_days: 6.0
  year_samples: 73

# Escape-speed measurements to integrate over (PLACEHOLDER values from memory:
# replace with the numbers read from results/lzlit/ text before quoting).
vesc_tail: {tail: sharp}
vesc_v0_kms: 238.0
vesc_grid: {min: 440.0, max: 640.0, step: 10.0}
vesc_measurements:               # VERIFIED 2026-09-07 against results/lzlit/text
  deason2019_gaia_dr2:   {v_esc: 528.0, plus: 24.0, minus: 25.0, source: "arXiv:1901.02016 abstract: 528 +24 -25 km/s"}
  koppelman_helmi2021:   {v_esc: 497.0, plus: 8.0,  minus: 8.0,  source: "arXiv:2006.16283 abstract: 497 +8 -8 km/s (5D sample)"}
  necib_lin2022_dr2:     {v_esc: 484.6, plus: 17.8, minus: 7.4,  source: "arXiv:2102.02211 abstract: 484.6 +17.8 -7.4 km/s (three bound components)"}
  roche2024_gaia_dr3:    {v_esc: 521.0, plus: 46.0, minus: 30.0, source: "arXiv:2402.00108 text: v_esc(r_sun) = 521 +46 -30 km/s"}
  monari2018_gaia_dr2:   {v_esc: 580.0, plus: 63.0, minus: 63.0, source: "arXiv:1807.04565 abstract: 580 +- 63 km/s"}
  rave2007_lz_assumed:   {v_esc: 544.0, plus: 40.0, minus: 30.0, source: "Baxter+2021 (arXiv:2105.00599) Table: 544 km/s, 90% range 498-608 (Smith+2007 RAVE); +-1sigma approximated from the 90% range"}
