# GOO — propagation of uncontrolled self-replicating machines across four
# scales (planet, planetary system, galaxy, observable universe) and the
# inference from their observational absence to our own risk.
#
# Every number in the manuscript is generated from this file by
# `python -m seti.goo.run --stage all`; nothing numerical is typed into the
# LaTeX.  Each parameter carries the source it was taken from.  Where a
# quantity is uncertain by orders of magnitude the model scans it and the
# paper reports the scan, not a point value.

replicator:
  # A generic diamondoid / silicon-carbide nanoreplicator.  Freitas (2000,
  # "Some limits to global ecophagy") and Phoenix & Drexler (2004) use
  # ~1 micron devices of density ~1-3 g/cc and ~10^7-10^8 J/kg construction
  # energy (mechanosynthesis at ~1 eV per atom placed).
  radius_um: 0.5                 # device size scale (scanned 0.05-100 um in passive.py)
  density_gcc: 2.0               # diamondoid-like
  e_rep_J_per_kg: 1.0e7          # energy to build 1 kg of replicator from feedstock (~1 eV/atom); Freitas 2000 (full text) assumes "~100 MJ/kg for chemical transformations" -- every radiative/energy ceiling scales linearly with this, so his value makes them 10x longer
  tau_doubling_s: [100.0, 1.0e3, 1.0e4, 1.0e5, 3.2e7]   # replication time scan: 100 s ... 1 yr
  t_operate_max_K: 500.0         # ceiling on the device's own operating temperature (thermal limit)
  q_pr: 1.0                      # radiation-pressure efficiency (geometric optics)

planet:
  name: Earth
  mass_kg: 5.972e24
  radius_m: 6.371e6
  t_eq_K: 255.0                  # effective temperature (bond albedo 0.3)
  absorbed_solar_W: 1.22e17      # (1-A) * S * pi R^2, A = 0.3, S = 1361 W/m^2
  biomass_dry_kg: 1.1e15         # ~550 Gt C -> ~1.1e15 kg dry biomass (Bar-On, Phillips & Milo 2018)
  crust_kg: 2.4e22               # continental + oceanic crust
  ocean_kg: 1.4e21
  crust_U_Th_kg: 1.0e17          # ~2.8 ppm U + 10 ppm Th in 2.4e22 kg crust -> ~3e17; take 1e17 (accessible)
  fission_J_per_kg: 8.0e13
  deuterium_fraction: 1.56e-4    # D/H by number in seawater
  dd_fusion_J_per_kg: 3.4e14     # per kg of deuterium consumed (rough)
  surface_T_max_K: [500.0, 1000.0, 2000.0]   # temperatures at which a surface process must radiate its heat

system:
  star_L_W: 3.828e26
  star_M_kg: 1.989e30
  reservoirs:                    # feedstock reservoirs and where they sit
    - {name: "asteroid belt", mass_kg: 2.4e21, r_AU: 2.7, n_bodies_gt_1km: 1.0e6}
    - {name: "Kuiper belt", mass_kg: 1.2e23, r_AU: 40.0, n_bodies_gt_1km: 1.0e9}
    - {name: "terrestrial planets", mass_kg: 1.2e25, r_AU: 1.0, n_bodies_gt_1km: 4}
    - {name: "giant planets", mass_kg: 2.66e27, r_AU: 5.2, n_bodies_gt_1km: 4}
  hop_speed_kms: 1.0             # delta-v scale of a body-to-body hop inside a belt
  branching_per_body: 100.0      # launches per converted body (branching factor of the front)
  local_saturation_doublings: 100.0   # log2(body mass / seed mass) ~ 100 for a km body from a 1e-16 kg seed
  swarm_areal_density_kg_m2: [1.0e-3, 1.0, 1.0e3]   # micron film, kg/m^2 sheet, metre-scale slab
  hephaistos_II_n_stars: 5.0e6   # Suazo et al. 2024, MNRAS 531, 695 (Gaia DR3 x 2MASS x WISE, < 300 pc)
  hephaistos_II_gamma_min: 0.1   # minimum covering fraction their template grid is sensitive to
  ghat_III_n_galaxies: 1.0e5     # Griffith et al. 2015, ApJS 217, 25
  ghat_III_gamma_max: 0.85       # no galaxy with > 85 % of starlight reprocessed

passive:
  target_r_AU: 1.0               # habitable-zone target orbit
  inflow_speed_kms: 26.0         # interstellar-medium flow speed through the heliosphere (Ulysses)
  release_r_AU: 2.7              # where the machines are released (the belt)
  galaxy:
    R_sun_kpc: 8.2
    annulus_width_kpc: 1.6       # 2 x epicyclic amplitude (sigma_R ~ 30 km/s, kappa ~ 37 km/s/kpc)
    scale_height_kpc: 0.3        # thin disc; the annulus is taken 2h thick
    rotation_period_Myr: 230.0
    sigma_v_kms: 30.0
    n_stars_annulus: 1.0e10      # stars within the annulus (of ~1e11 in the disc)
    n_earthlike_per_star: 0.1    # eta_Earth-like rocky planets in the HZ per star (order of magnitude)
  t_survive_yr: [1.0e6, 1.0e7, 1.0e8, 1.0e9]   # e-folding time of a machine's functional survival in the ISM (scan)
  t_ism_grain_destruction_yr: 5.0e8            # Jones, Tielens & Hollenbach 1996 silicate lifetime (mass)
  release_mass_kg: [1.0e15, 2.4e21, 1.2e23]    # a biosphere's worth; the asteroid belt; the Kuiper belt

active:
  d_hop_pc: 1.0                  # nearest-neighbour hop in the solar neighbourhood
  v_ship_c: [1.0e-4, 1.0e-3, 1.0e-2, 0.1]     # 30 km/s (Voyager x2) ... 0.1 c
  tau_build_yr: [10.0, 100.0, 1000.0]
  R_galaxy_kpc: 15.0             # radius to fill from the solar circle (outer disc)
  cosmology: {H0: 67.7, Om: 0.31}
  n_gal_per_Mpc3: 0.01           # L* galaxies per comoving Mpc^3 (order of magnitude)
  v_cosmic_c: [0.1, 0.5, 0.8, 0.99]

inference:
  window_Gyr: 5.0                # time over which technological civilisations could have arisen in the disc
  t_fill_active_Myr: 10.0        # galaxy crossing time for the active branch (from active.py, mid case)
  t_fill_passive_Gyr: 1.5        # annulus phase-mixing time for the passive branch
  lambda_grid_log10: [-2.0, 6.0, 81]      # expected number of civilisations in the window: 0.01 ... 1e6
  lambda_points: [0.1, 1.0, 10.0, 100.0, 1.0e3, 1.0e4]
  p_prior: {kind: loguniform, lo: 1.0e-12, hi: 1.0}
  p_persist: [1.0e-4, 1.0e-2, 1.0]   # fraction of the window a system/galaxy-scale residue stays visible
  n_gal_observed: 1.0e5
  own_galaxy_datum_shadowed: true     # SSA: our own galaxy's state carries no information (anthropic shadow)
  human_prior_p_goo: [1.0e-4, 1.0e-3, 1.0e-2]   # elicited planet-scale nanotech-accident probabilities to map through

# ---------------------------------------------------------------------------
# CONTACT GRAPH — every natural channel by which mass moves between planetary
# systems, and the directed one.  "touch" has two definitions: STRICT = a
# carrier lands on an Earth-sized planet of the target system; LOOSE = a carrier
# passes through the target system (within r_loose) or is captured by it.
# Each channel: carriers per source system over the window (or a standing
# density for the natural, all-systems-emitting case), speed, mass-survival and
# functional-survival times, and the cross-sections.  Every number names its
# source; entries marked verify: true are provisional until the sentence that
# carries them is read in results/goolit_contact/REPORT.md.
# ---------------------------------------------------------------------------
contact:
  n_systems_annulus: 1.0e10          # stars in the 1.6 kpc x 0.6 kpc solar annulus
  n_systems_galaxy: 1.0e11
  n_earthlike_per_star: 0.1          # rocky HZ planets per star, order of magnitude
  r_loose_AU: 100.0                  # "passes through the system" radius
  t_mix_annulus_yr: 1.2e9            # differential-rotation phase mixing (passive.py)
  t_mix_disc_yr: 1.0e10              # radial migration across the disc (Frankel+2018 scale)
  channels:
    - name: "interstellar objects (>100 m)"
      standing_density_per_AU3: 0.2  # Do, Tucker & Tonry 2018: "n_IS ~ 0.2 au^-3 ... cannot be populated unless every star is contributing"; Jewitt & Seligman 2023: ~0.1 AU^-3, 1e25-1e26 objects in the Milky Way
      capture_rate_per_yr_natural: 2.0e-3   # FULL TEXT, Dehnen+2022: "in 1000 years the planets capture ~2 ISOs (while ~17 fall into the Sun)" at n = 0.1 AU^-3; Hands & Dehnen 2020: "1e4 per Myr for 'Oumuamua-like rocks" (0.051 AU^3/yr x 0.2 AU^-3), i.e. 2e-3 to 1e-2 per yr; the conservative end is used
      speed_kms: 26.0
      t_mass_survive_yr: 1.0e12      # rocks and ices persist
      t_func_survive_yr: [1.0e8, 1.0e9, 1.0e12]   # a device shielded inside a 100 m body
      emitted_when: "early (planet formation); ongoing at a low rate"
      source: "Do+2018 (0.2 AU^-3, verified); Jewitt & Seligman 2023 (verified); Dehnen+2022 and Hands & Dehnen 2020 capture rates (verified); Portegies Zwart+2018: ~3e5 within 100 AU of the Sun at any time (verified)"
      verify: false
    - name: "impact ejecta from a planet (rocks > 1 m)"
      carriers_per_source: 6.0e10    # FULL TEXT: Siraj & Loeb 2020: "20 per year of 30-cm objects penetrating the Earth's atmosphere and eventually likely being ejected from the Solar System ... Over 3e9 yr, this translates to 6e10 ejected objects (95% Poisson bounds 2e9-3e11)"; Adams & Napier 2022: "15 biologically active rocks, with masses 1e4 g, should be ejected from an Earth-like planet per year" (previous authors) -> 6e10 over 4 Gyr
      capture_rate_per_yr_natural: 0.0
      speed_kms: 26.0
      t_mass_survive_yr: 1.0e12
      t_func_survive_yr: [1.0e8, 1.0e9, 1.0e12]
      emitted_when: "throughout, in large impacts"
      source: "Siraj & Loeb 2020 (full text); Adams & Napier 2022 (full text: field capture of rocks per system ~70 over its life, direct strikes on Earth 1e4 times rarer); Melosh 2003; Worth+2013"
      verify: false
    - name: "Earth-grazing objects captured by binaries"
      carriers_per_source: 1.0e8     # Siraj & Loeb 2020: "10^7-10^9 such objects could have been captured by binary star systems over the lifetime of the Solar System" (verified) -- these are LOOSE (bound) touches of other systems by Earth-touched material
      loose_is_capture_count: true
      speed_kms: 26.0
      t_mass_survive_yr: 1.0e12
      t_func_survive_yr: [1.0e8, 1.0e9, 1.0e12]
      emitted_when: "throughout"
      source: "Siraj & Loeb 2020 (verified)"
      verify: false
    - name: "free-floating planets"
      carriers_per_source: 21.0      # Sumi+2023: "21 (+23/-13) FFP or very wide orbit planets of mass 0.33 < M/M_earth < 6660 per star" (verified); Mroz+2017: < 0.25 Jupiter-mass per star (verified)
      capture_rate_per_yr_natural: 2.0e-12   # Goulinski & Ribak 2018: "about 1% of all stars are expected to experience a temporary capture of a free-floating planet during their lifetime" (verified) -> 0.01 / 5 Gyr
      speed_kms: 26.0
      t_mass_survive_yr: 1.0e12
      t_func_survive_yr: [1.0e12]
      emitted_when: "early (planet-planet scattering)"
      source: "Sumi+2023; Mroz+2017; Goulinski & Ribak 2018; Perets & Kouwenhoven 2012 (3-6% x f_FFP in clusters) -- all verified"
      verify: false
    - name: "interstellar dust (ISM grains, 0.1-1 um)"
      standing_flux_per_m2_s: 1.5e-4 # FULL TEXT, Kruger+2019: "The derived average particle flux was 1.5e-4 m^-2 s^-1 in the mass range 5e-18 kg < m_d < 5e-16 kg" (Cassini, 0.7-1.2 AU, 1999); Ulysses/Galileo grains of charge-to-mass 0.5-1.4 C/kg, 0.1-0.7 um (Landgraf 2000 full text)
      speed_kms: 26.0
      t_mass_survive_yr: 5.0e8       # Jones, Tielens & Hollenbach 1996
      t_func_survive_yr: [1.0e6, 1.0e7, 1.0e8]
      emitted_when: "continuous (stellar outflows, supernovae, blown-out circumstellar grains)"
      source: "Grun+1993; Landgraf 2000; Kruger+2019; Jones+1996"
      verify: true
    - name: "radiation-pressure grains from a converted belt"
      carriers_per_source: 2.3e36    # passive.py: belt mass in 0.5 um devices
      speed_kms: 26.0
      t_mass_survive_yr: 5.0e8
      t_func_survive_yr: [1.0e7, 1.0e8, 1.0e9]
      emitted_when: "on conversion"
      source: "this paper, Section 5"
      verify: false
    - name: "stellar encounters (within the Oort cloud, 2e4 AU)"
      encounter_rate_per_Myr_within_1pc: 19.7   # Bailer-Jones+2018: "the present rate of encounters within 1 pc to be 19.7 +/- 2.2 per Myr, a quantity expected to scale quadratically with the encounter distance" (verified)
      r_encounter_AU: 2.0e4
      speed_kms: 30.0
      emitted_when: "continuous"
      source: "Bailer-Jones 2015, 2018 (verified); Garcia-Sanchez+2001"
      verify: false
    - name: "supernova ejecta on a planet"
      events_per_Myr: 0.3            # FULL TEXT, Wallner+2016: "60Fe interstellar influxes onto Earth 1.7-3.2 Myr and 6.5-8.7 Myr ago ... multiple supernova and massive-star events during the last ~10 Myr at nearby distances <= 100 pc"; Knie+2004; live 60Fe accreting now (Koll+2019): ~ one per few Myr
      speed_kms: 100.0
      emitted_when: "on the death of a massive star within ~100 pc"
      source: "Wallner+2016; Knie+2004; Koll+2019; Fields+2019"
      verify: true
    - name: "birth-cluster exchange (first ~10-100 Myr)"
      bodies_transferred_to_nearest_neighbour: 1.0e11   # FULL TEXT range: Belbruno+2012 weak transfer "1E14-3E16" bodies > 10 kg (weak capture probability 1.5e-3 x N_R 8e16-2e19); Adams & Napier 2022 dynamical capture "N_RC ~ 1e7 from the birth cluster" per star; geometric middle of 1e7-1e15, both ends reported
      bodies_transferred_range: [1.0e7, 3.0e16]
      planet_landing_probability_per_captured_body: 1.0e-4   # FULL TEXT, Adams & Spergel 2005: "Only a small fraction (f_imp ~ 1e-4) of the captured rocks impact the surfaces of terrestrial planets, so that N_lps ~ 1e-3 - 1.6 lithopanspermia events are expected (per cluster)"
      captures_per_cluster_range: [10.0, 16000.0]   # Adams & Spergel 2005: "capture of life bearing rocks is expected to occur 10 -- 16,000 times per cluster" (verified)
      t_cluster_Myr: 100.0
      n_siblings: 1000.0
      source: "Belbruno+2012; Adams & Spergel 2005; Levison+2010 (Oort-cloud capture from siblings); Portegies Zwart 2009 (siblings)"
      verify: false
