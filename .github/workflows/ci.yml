name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Only the newest commit on a branch needs its gate run. Parallel channel agents
# push many small commits, and without this each push queues another full CI run
# behind the last, starving the data-touching searches of runners. Superseded
# runs are cancelled; the newest one still gates the branch.
concurrency:
  # On a feature branch only the newest commit needs its gate run, so every
  # commit shares one group and supersedes the older runs. On `main` the group
  # additionally carries the commit, so no two runs ever share a group and none
  # can cancel another: merges land faster than a run takes, and cancelling
  # meant no run on `main` ever finished, leaving the branch everything is
  # merged into as the one branch that had stopped being gated.
  #
  # This is expressed through the GROUP rather than through `cancel-in-progress`
  # on purpose. The obvious spelling, `cancel-in-progress: ${{ github.ref !=
  # 'refs/heads/main' }}`, was tried first and did NOT work — runs on `main`
  # went on being cancelled with it in place (six consecutive ones on
  # 2026-09-22, 16:02-16:14 UTC). A group name is plain string interpolation
  # and has no such ambiguity.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'head' }}
  cancel-in-progress: true

jobs:
  offline:
    # Default job: fully offline, runs on the committed sample. Fast, <2 GB, no
    # network access required -- this is the reproducibility gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build the synthetic model asset and sample
        run: |
          python scripts/make_bergeron_asset.py
          python -m seti.cli make-sample
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        # Every test is network-guarded (tests/conftest.py) and writes only to
        # tmp_path, so the suite parallelises across the runner's cores.
        run: pytest -q -n auto
      - name: Reproduce analysis + forecast on the sample
        run: |
          python -m seti.cli analyze
          python -m seti.cli completeness
          python -m seti.cli forecast
          python -m seti.cli contamination-budget
          python -m seti.cli figures
          python -m seti.cli paper-numbers
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: results/

  paper:
    # Verify the manuscript compiles to PDF from the auto-generated numbers and
    # figures. Runs on every push; GitHub runners have unrestricted apt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-bibtex-extra latexmk
      - name: Build figures, numbers, and PDF
        run: |
          python scripts/make_bergeron_asset.py
          python -m seti.cli make-sample
          make paper
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: paper/main.pdf

  # The real (network) acquisition + analysis run is `science.yml`
  # (workflow_dispatch); it is deliberately not part of this gate so pushes and
  # PRs stay fast and deterministic.
