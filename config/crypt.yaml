# CRYPT channel — artifacts in lunar permanent shadow (S55, docs/crypt.md).
# Every threshold, URL and classification pattern in one place.  The product
# naming inside the Diviner level-3/4 volume is NOT known in the sandbox: the
# probe stage crawls the volume, downloads the labels and classifies each
# product by regex over its NAME and LABEL TEXT; the inventory is committed so
# the patterns below can be corrected from evidence.

acquire:
  timeout_s: 120
  listing_timeout_s: 60
  download_timeout_s: 900
  retries: 2
  max_bytes_per_file: 400000000       # 400 MB cap on any single raster
  max_total_bytes: 6000000000         # 6 GB cap on the whole acquisition
  max_labels_probe: 400               # labels read at probe (each small)
  label_max_bytes: 400000
  crawl_max_depth: 5
  crawl_max_entries: 8000

  # Diviner gridded products.  CORRECTED after run 2026-09-22T01:25Z: the
  # first guess, lro-l-dlre-4-rdr-v1/lrodlr_1002/data/, answers 200 but holds
  # the PDS4 *calibrated RDR* collection (by-year dirs 2017..2026) and two
  # collection files — no gridded product at all, hence NO_DATA_REACHED.
  # The authoritative identifiers come from ODE's own Moon instrument table
  # (results/crypt/probe.json, ode.instrument_types):
  #   LRO / DLRE / PCP     lro_diviner_derived_pcp     Polar Cumulative Products
  #   LRO / DLRE / GDR_L3  lro_diviner_derived_gdr_l3  Gridded Data Record L3
  #   LRO / DLRE / GCP     lro_diviner_derived_gcp     Global Cumulative Products
  #   LRO / DLRE / PRP     lro_diviner_derived_prp     Polar Resource Products
  diviner_volume_roots:
    - "https://pds-geosciences.wustl.edu/lro/lro-l-dlre-5-gdr-v1/lrodlr_1001/"
    - "https://pds-geosciences.wustl.edu/lro/lro-l-dlre-5-gdr-v1/lrodlr_1002/"
    - "https://pds-geosciences.wustl.edu/lro/lro-l-dlre-4-rdr-v1/lrodlr_1002/"
  diviner_data_subdirs: ["data/pcp/", "data/prp/", "data/gdr_l3/", "data/gdr_l4/", "data/gcp/", "data/"]

  # The route that needs no knowledge of the directory layout at all: ODE
  # indexes every product of a type and ``results=f`` returns absolute URLs.
  diviner_ode:
    ihid: "LRO"
    iid: "DLRE"
    product_types: ["PCP", "GDR_L3", "GCP", "PRP"]
    limit: 2000
  # subdirectories worth descending (skip the by-year RDR tree of lrodlr_1001)
  diviner_dir_regex: "(?i)^(?!20\\d\\d$)(pcp|prp|gdr|gcp|polar|pole|north|south|n|s|240|cumul|season|summer|winter|all|lbl|img|data|.*pcp.*|.*polar.*|.*pol.*|\\d+m|\\w{1,4})$"
  # the PDS4 mirror of the same holdings, if the PDS3 tree is empty.  Bundle
  # directory names follow the ODE DataSetId (urn-nasa-pds-<bundle>).
  diviner_pds4_roots:
    - "https://pds-geosciences.wustl.edu/lro/urn-nasa-pds-lro_diviner_derived1/"
    - "https://pds-geosciences.wustl.edu/lro/urn-nasa-pds-lro_diviner_derived2/"
    - "https://pds-geosciences.wustl.edu/lro/urn-nasa-pds-lro_diviner_derived_pcp/"
    - "https://pds-geosciences.wustl.edu/lro/urn-nasa-pds-lro_diviner_derived_gdr_l3/"

  # Mini-RF (PDS Geosciences): the level-5 mosaics and level-4 CDRs.
  minirf_roots:
    - "https://pds-geosciences.wustl.edu/lro/lro-l-mrflro-5-global-mosaic-v1/"
    - "https://pds-geosciences.wustl.edu/lro/lro-l-mrflro-4-cdr-v1/"
  minirf_dir_regex: "(?i)^(?!.*(browse|extras|document|catalog|index)).*$"
  # WIDENED after run 2026-09-22T01:25Z.  The polar mosaics that exist are
  # named lsz_xxxxx_3s1_pfu_90n000_v1.img / ..._90s000_... — the Mini-RF PDS3
  # code for a CPR mosaic is "cp", not "cpr", so the old pattern could not have
  # matched one.  Match every Stokes/CPR product code and every polar tag.
  minirf_product_regex: "(?i)(cpr|\\dcp[_\\-.]|[_\\-.]cp[_\\-.]|\\ds[1-4][_\\-.]|[_\\-.]s[1-4][_\\-.]|stokes|mosaic|polar|90n|90s|85n|85s|80n|80s|north|south)"

  # ShadowCam (PDS4, KPLO) and LROC NAC via ODE footprint search.
  shadowcam_roots:
    - "https://pds.shadowcam.im-ldi.com/"
    - "https://pds.shadowcam.im-ldi.com/data/"
    - "https://shadowcam.im-ldi.com/archive"
  ode_rest: "https://oderest.rsl.wustl.edu/live2/"
  # CORRECTED from the ODE Moon instrument table returned by the first probe:
  # the ShadowCam iid is "ShadowCam", not "SHADOWCAM" — the wrong case returned
  # HTTP 200 with zero products at both poles, which reads like no coverage.
  ode_instruments:
    shadowcam: {ihid: "KPLO", iid: "ShadowCam", pt: "CAL"}
    shadowcam_umos: {ihid: "KPLO", iid: "ShadowCam", pt: "UMOS"}
    lroc_nac: {ihid: "LRO", iid: "LROC", pt: "EDRNAC4"}
    minirf: {ihid: "LRO", iid: "MRFLRO", pt: "MOSCDR"}
    diviner: {ihid: "LRO", iid: "DLRE", pt: "PCP"}
  ode_footprint_half_deg: 0.02
  ode_limit: 25

  # PSR polygons/rasters (LOLA illumination).  Each route is tried and
  # recorded; when none serves a raster on the Diviner grid the cold-trap
  # definition (Tmax < psr_tmax_K) stands alone and is recorded as such.
  psr_routes:
    - "https://pgda.gsfc.nasa.gov/products/54"
    - "https://pgda.gsfc.nasa.gov/products/78"
    - "https://pgda.gsfc.nasa.gov/products/90"
    - "https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/"
    - "https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/illumination/"
    - "https://pds-geosciences.wustl.edu/lro/lro-l-lola-3-rdr-v1/lrolol_1xxx/data/lola_gdr/polar/img/"
  psr_product_regex: "(?i)(psr|shadow|illum|ill_|_ill|perm|lit|sun)"
  # ODE indexes the LOLA GDR permanently-shadowed map itself
  # (LRO / LOLA / GDRPSR, dataset LRO-L-LOLA-4-GDR-V1.0), so the polygons do
  # not have to be scraped out of a PGDA product page.
  psr_ode:
    ihid: "LRO"
    iid: "LOLA"
    product_types: ["GDRPSR", "GDRVIS"]
    limit: 500

  # Read one real product of each kind end to end.  Probe 2026-09-22T14:11Z
  # showed the Diviner gridded polar products are PDS3 ASCII TABLES
  # (PCP_AVG_TBOL_POLN_SUM_LTIM01_240.TAB), not rasters; the column layout has
  # to be read off the label, never guessed.
  format_probe:
    - {label: "diviner_pcp_summer", pt: "PCP", match: "^PCP_AVG_TBOL_POLN_SUM_LTIM01_240\\.", head_bytes: 40000}
    - {label: "diviner_pcp_winter", pt: "PCP", match: "^PCP_AVG_TBOL_POLN_WIN_LTIM01_240\\.", head_bytes: 12000}
    - {label: "diviner_pcp_south_winter", pt: "PCP", match: "^PCP_AVG_TBOL_POLS_WIN_LTIM01_240\\.", head_bytes: 12000}
    - {label: "diviner_prp_north", pt: "PRP", match: "^DLRE_PRP_NORTH\\.", head_bytes: 40000}
    - {label: "diviner_gdr_l3", pt: "GDR_L3", match: "_IMG\\.(LBL|IMG)$", head_bytes: 20000}
    - {label: "lola_psr_north", pt: "LOLA_GDRPSR", match: "^LPSR_65N_240M.*\\.(LBL|IMG)$", head_bytes: 20000}
    - {label: "lola_psr_south", pt: "LOLA_GDRPSR", match: "^LPSR_65S_240M.*\\.(LBL|IMG)$", head_bytes: 20000}
    - {label: "minirf_polar_s1_north", pt: null, match: "^lsz_.*90n000.*\\.lbl$", head_bytes: 20000,
       extra_files: {
         "lsz_xxxxx_3s1_pfu_90n000_v1.lbl": "https://pds-geosciences.wustl.edu/lro/lro-l-mrflro-4-cdr-v1/lromrf_0005/data/sar/mosaics/lsz_xxxxx_3s1_pfu_90n000_v1.lbl"}}
    - {label: "minirf_global_cpr", pt: null, match: "^global_cpr_128ppd.*\\.lbl$", head_bytes: 20000,
       extra_files: {
         "global_cpr_128ppd_simp_0c.lbl": "https://pds-geosciences.wustl.edu/lro/lro-l-mrflro-5-global-mosaic-v1/lromrf_1001/data/128ppd/global_cpr_128ppd_simp_0c.lbl"}}

# Which products the screen needs, in priority order.  ``channels`` are the
# Diviner channels used (6 and 7 are the anisothermal discriminant, 8/9 the
# reference); ``stats`` per season.
products:
  poles: ["north", "south"]
  seasons: ["summer", "winter"]
  channels: ["6", "7", "8", "9"]
  stats: ["avg", "count"]
  mask_products:                       # the cold-trap mask: first that exists
    - {season: "all", channel: "tbol", stat: "max"}
    - {season: "summer", channel: "tbol", stat: "max"}
    - {season: "all", channel: "9", stat: "max"}
    - {season: "summer", channel: "9", stat: "max"}
  optional:
    - {season: "winter", channel: "tbol", stat: "max"}
    - {season: "summer", channel: "tbol", stat: "avg"}
    - {season: "winter", channel: "tbol", stat: "avg"}

# Regexes over the product NAME (then label text) → pole / channel / stat /
# season.  Corrected from the committed inventory after the first probe.
patterns:
  # ``\d{2,4}n\d*`` added so the Mini-RF polar tag 90n000 (latitude 90 N,
  # longitude 000) is recognised; the old form required a separator straight
  # after the "n" and so matched none of the polar mosaics.
  pole:
    north: "(?i)(^|[_\\-.])(n|np|north|npole|poln|npol|80n|85n|75n|\\d{2,4}n\\d*)([_\\-.]|$)|north\\s*pol"
    south: "(?i)(^|[_\\-.])(s|sp|south|spole|pols|spol|80s|85s|75s|\\d{2,4}s\\d*)([_\\-.]|$)|south\\s*pol"
  channel:
    tbol: "(?i)(^|[_\\-.])(tbol|tb|bol|bolo|bolometric)([_\\-.]|$)|bolometric"
    "3": "(?i)(^|[_\\-.])(t3|tb3|ch3|c3|ch03|t03|b3)([_\\-.]|$)|channel\\s*0?3\\b"
    "4": "(?i)(^|[_\\-.])(t4|tb4|ch4|c4|ch04|t04|b4)([_\\-.]|$)|channel\\s*0?4\\b"
    "5": "(?i)(^|[_\\-.])(t5|tb5|ch5|c5|ch05|t05|b5)([_\\-.]|$)|channel\\s*0?5\\b"
    "6": "(?i)(^|[_\\-.])(t6|tb6|ch6|c6|ch06|t06|b6)([_\\-.]|$)|channel\\s*0?6\\b"
    "7": "(?i)(^|[_\\-.])(t7|tb7|ch7|c7|ch07|t07|b7)([_\\-.]|$)|channel\\s*0?7\\b"
    "8": "(?i)(^|[_\\-.])(t8|tb8|ch8|c8|ch08|t08|b8)([_\\-.]|$)|channel\\s*0?8\\b"
    "9": "(?i)(^|[_\\-.])(t9|tb9|ch9|c9|ch09|t09|b9)([_\\-.]|$)|channel\\s*0?9\\b"
  stat:
    avg: "(?i)(^|[_\\-.])(avg|ave|mean|average)([_\\-.]|$)|average"
    max: "(?i)(^|[_\\-.])(max|maximum)([_\\-.]|$)|maximum"
    min: "(?i)(^|[_\\-.])(min|minimum)([_\\-.]|$)|minimum"
    count: "(?i)(^|[_\\-.])(cnt|count|num|nobs|counts)([_\\-.]|$)|number of obs"
    std: "(?i)(^|[_\\-.])(std|stdev|sd|sigma)([_\\-.]|$)|standard dev"
  season:
    summer: "(?i)(^|[_\\-.])(sum|summer|smr)([_\\-.]|$)|summer"
    winter: "(?i)(^|[_\\-.])(win|winter|wtr)([_\\-.]|$)|winter"
    all: "(?i)(^|[_\\-.])(all|yr|year|annual|cum|cumulative|total|tot)([_\\-.]|$)|all seasons|cumulative"
  resolution_m: "(?i)(^|[_\\-.])(\\d{2,4})m([_\\-.]|$)"
  subsolar: "(?i)(^|[_\\-.])(ssl|sslon|lon|sl|sub)\\d{2,3}([_\\-.]|$)|sub[- ]?solar"

# The screen the PDS polar holdings support: diurnal/seasonal invariance of
# bolometric temperature (src/seti/crypt/diurnal.py).
#
# Ninety-six local-time bins x 2 seasons x 2 poles at 262 MB each is ~100 GB.
# The screen does not need every bin, it needs the diurnal curve sampled well
# enough to measure its amplitude and its floor: "every:16" takes bins
# 1,17,33,49,65,81 — six bins four hours apart around the clock — in each
# season, so 12 products and ~3.1 GB per pole.  Raise it once the channel has
# a measurement; which bins were used is recorded with every result.
diurnal:
  min_lat_deg: 80.0          # the PCP cap; sets the 2535 x 2535 grid at 240 m
  ltim_bins: "every:16"
  seasons: ["summer", "winter"]
  psr_tmax_K: 110.0
  edge_px: 2
  n_bins_min: 8              # (season, local-time) bins that must carry data
  n_bins_excess: 5           # bins in which the excess must be present
  z_min: 5.0
  z_bin_min: 3.0
  amp_max_K: 2.0             # winter diurnal amplitude allowed of a candidate
  dseason_max_K: 2.0         # |summer - winter| allowed of a candidate
  elevated_frac: 0.5
  max_cluster_px: 6
  stripe_min: 4
  r_in_px: 4
  r_out_px: 16
  bg_min_px: 40
  sigma_floor_K: 0.05
  floor_t_hot_K: 300.0
  floor_nsigma: 5.0

# The multi-channel thermal screen (docs/crypt.md §3).  Retained: it runs the
# moment a per-channel POLAR gridded product exists.  None does today.
thermal:
  psr_tmax_K: 110.0          # cold trap: never warmer than this (Diviner definition)
  edge_px: 2                 # footprints from the illumination boundary
  n_min: 10                  # observations per pixel per season
  z_min: 5.0                 # primary short-channel excess, in empirical sigma
  z_other_max: 2.5           # below this in the other season → seasonal (lit rim / scatter)
  max_cluster_px: 6          # larger connected warm patch → extended (rocks, slope)
  stripe_min: 4              # flagged pixels sharing a row/column → stripe
  stripe_window: 200
  dchi2_min: 9.0             # two-component must beat one-component by this
  f_ratio_max: 3.0           # seasonal excess-radiance ratio beyond which → unstable
  bin_width_K: 2.0
  bin_min_n: 50
  sigma_floor_K: 0.05
  min_coverage_frac: 0.2
  t_hot_grid_K: [150, 200, 250, 300, 350, 400, 500, 600, 800]
  f_grid_log10: [-7.0, 0.0, 71]
  floor_t_hot_K: 300.0
  floor_nsigma: 5.0

# Injection-recovery on the real maps (the honest sensitivity statement).
sensitivity:
  areas_m2: [1, 3, 10, 30, 100, 300, 1000, 3000, 10000]
  t_hot_K: [300.0, 500.0]
  n_per_area: 20
  seed: 11

radar:
  cpr_min: 1.0
  max_cluster_px: 4
  bg_r_in: 3
  bg_r_out: 12
  bg_max: 0.6
  s1_contrast_min: 3.0
  edge_px: 2
  max_rows: 5000

# Human hardware inside the polar caps (flagged, never silently dropped).
# Coordinates are the published nominal sites; radius is generous.
hardware:
  - {name: "LCROSS Centaur impact (Cabeus, 2009-10-09)", lat: -84.675, lon: 311.275, radius_m: 3000}
  - {name: "LCROSS shepherding spacecraft impact", lat: -84.73, lon: 310.6, radius_m: 3000}
  - {name: "IM-1 Odysseus (Malapert A, 2024-02-22)", lat: -80.13, lon: 1.44, radius_m: 2000}
  - {name: "IM-2 Athena (Mons Mouton, 2025-03-06)", lat: -84.76, lon: 29.19, radius_m: 3000}
  - {name: "Chang'e-7 landing region (2026, south-polar highlands; approximate)", lat: -85.0, lon: 0.0, radius_m: 10000}

vet:
  ode_half_deg: 0.02
  max_candidates_vet: 200
