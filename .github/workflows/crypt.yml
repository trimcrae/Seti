name: crypt

# CRYPT — artifacts in lunar permanent shadow (docs/crypt.md).  Signature S55.
#
#   probe ──▶ [acquire ▶ screen] × 2 shards (one pole each) ──▶ assess ──▶ commit-back
#
# THERMAL: inside the Diviner cold-trap mask (all-time bolometric maximum
# < 110 K, eroded 2 px), a pixel whose short-channel (6/7) brightness
# temperature exceeds the long-channel reference (9/8) by >= 5 empirical sigma
# in BOTH the summer and the winter cumulative product, with the same excess
# radiance in both, compact, unstriped, well observed, and better fitted by a
# two-component spectrum than by one temperature.  A lit rim or scattered light
# is present in summer and absent in winter; an internal heat source is not.
# RADAR: compact (<= 4 px) Mini-RF CPR >= 1 pixels inside the mask with a
# quiet neighbourhood (rock fields and ejecta are extended and sit in an
# elevated background).  OPTICAL: ShadowCam / LROC NAC coverage of every
# survivor through the ODE footprint service, listed, not inspected.
#
# THE DATA-ACCESS FACT (results/necrofrontier/probe.json): the PDS Geosciences
# node answers the runner with directory listings; lrodlr_1002 holds the
# level-3/4 products; the UCLA mirror fails TLS.  The product NAMING inside
# the volume is not known in the sandbox, so the probe stage crawls it, reads
# every label it can (<= 400, small), classifies by regex over name + label
# text and commits the INVENTORY — the first run's job is to teach the
# classifier, and NO_DATA_REACHED with the inventory attached is a finding
# about the patterns, not the sky.  Injection-recovery on the real maps is
# the sensitivity statement; nothing is fabricated.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, then acquire+screen per pole shard, then assess),
          "probe" (inventory only — cheap, run this first), or
          "assess" (re-assess the screen files already on the branch).
        required: false
        default: "all"
      poles:
        description: "Comma list of poles to run (blank = both)"
        required: false
        default: ""
      no_sensitivity:
        description: "Skip the injection-recovery table (faster iteration)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected warm component must be recovered on this runner
        run: python -m pytest tests/test_crypt.py -q -p no:cacheprovider -k "injected or lit_rim or empty_archive or pds3"
      - name: Probe (crawl the Diviner volume, read labels, classify, select; Mini-RF, ShadowCam, ODE, PSR routes)
        if: ${{ github.event.inputs.stage != 'assess' }}
        run: |
          python -m seti.crypt.run --stage probe
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/crypt/probe.json"))
          print("verdict", d["verdict"], "reached", d["reached"])
          dv = d["diviner"]
          print("diviner roots:", json.dumps(dv["roots_tried"], indent=1))
          print("files", dv["n_files"], "products", dv["n_products"], "labels", dv["n_labels_read"])
          print("axis counts", json.dumps(dv["axis_counts"], indent=1))
          print("selected", dv["n_selected"], "of", dv["n_needed"])
          print("example names", dv["example_names"][:40])
          for pole, sel in dv["selection"].items():
              for k, v in sel.items():
                  print(" ", pole, k, "->", (v or {}).get("stem"))
          print("minirf", d["minirf"]["n_files"], "files,", d["minirf"]["n_matching"], "matching;", d["minirf"]["example_names"][:20])
          print("ode iipy", d["ode"].get("iipy", {}).get("status"), (d["ode"].get("iipy", {}).get("error")))
          print("ode types (first 40):", json.dumps(d["ode"].get("instrument_types", [])[:40])[:3000])
          for u, v in d["psr"].items():
              print("psr", v.get("status"), v.get("n_bytes"), u)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-probe
          path: results/crypt/probe.json
          if-no-files-found: warn
      - name: Commit the probe record
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "crypt: probe — Diviner level-3/4 inventory, Mini-RF, ShadowCam, ODE, PSR routes" \
            results/crypt/probe.json

  shard:
    needs: probe
    if: ${{ github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'assess' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: crypt-probe
          path: results/crypt/
      - name: Cache the polar rasters
        uses: actions/cache@v4
        with:
          path: results/crypt/data
          key: crypt-data-${{ matrix.shard }}-${{ hashFiles('config/crypt.yaml') }}
          restore-keys: |
            crypt-data-${{ matrix.shard }}-
      - name: Acquire + screen this shard's pole
        run: |
          P=""
          if [ -n "${{ github.event.inputs.poles }}" ]; then P="--poles ${{ github.event.inputs.poles }}"; fi
          NS=""
          if [ "${{ github.event.inputs.no_sensitivity }}" = "true" ]; then NS="--no-sensitivity"; fi
          python -m seti.crypt.run --stage acquire,screen --shard ${{ matrix.shard }}/2 $P $NS
          echo "=== acquire ==="
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob("results/crypt/acquire_*.json")):
              d = json.load(open(p))
              print(p, d["status"], "ok", d["n_ok"], "missing", d["n_missing"], "bytes", d["bytes"], "minirf", d.get("minirf", {}).get("status"))
              for k, v in d["products"].items():
                  lab = v.get("label") or {}
                  print("  ", k, v["status"], v.get("stem"), lab.get("dtype"), lab.get("unit"), lab.get("lines"), lab.get("samples"),
                        (lab.get("georef") or {}).get("projection"), (lab.get("georef") or {}).get("map_scale_m"),
                        "origin_check", (lab.get("georef") or {}).get("origin_check_px"), (v.get("error") or "")[:120])
          PY
          echo "=== screen ==="
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob("results/crypt/screen_*.json")):
              d = json.load(open(p))
              print(p, d.get("status"), "mask", d.get("mask"), "degraded", d.get("degraded"))
              print("  layers", d.get("layers"), "notes", json.dumps(d.get("layers_notes"))[:1500])
              print("  flagged", d.get("n_flagged_any_season"), "counts", d.get("counts"))
              for s, r in (d.get("per_season") or {}).items():
                  print("  ", s, r.get("status"), "ref", r.get("ref"), "primary", r.get("primary"), "coverage", r.get("coverage"))
                  for k, nz in (r.get("noise") or {}).items():
                      print("     ch", k, "global sigma", nz.get("global_sigma_K"), "bins", len(nz.get("bins", [])),
                            [(b["T_lo"], b["n"], round(b["sigma_K"], 3), b["A_min_m2"]) for b in nz.get("bins", [])[:12]])
              print("  sensitivity", d.get("sensitivity"))
              for c in (d.get("top_flags") or [])[:10]:
                  print("   flag", {k: c[k] for k in c if k in ("line", "sample", "lon", "lat", "class", "reasons", "z_primary_min", "z_primary_max", "T_ref_summer", "T_ref_winter", "area_m2_summer", "area_m2_winter")})
          for p in sorted(glob.glob("results/crypt/radar_*.json")):
              d = json.load(open(p))
              print(p, d.get("status"), d.get("counts"), d.get("n_high_cpr"), (d.get("error") or "")[:200])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-shard-${{ matrix.shard }}
          path: |
            results/crypt/acquire_*.json
            results/crypt/screen_*.json
            results/crypt/flags_*.csv
            results/crypt/sensitivity_*.json
            results/crypt/radar_*.json
          if-no-files-found: warn

  assess:
    needs: [probe, shard]
    if: ${{ always() && github.event.inputs.stage != 'probe' && needs.probe.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.stage != 'assess' }}
        with:
          pattern: crypt-*
          path: results/crypt/
          merge-multiple: true
      - name: Assess (merge poles, vet candidates, write summary)
        run: |
          ls -la results/crypt/ || true
          python -m seti.crypt.run --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/crypt/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("candidates", "thresholds", "note")}, indent=1)[:8000])
          for c in s.get("candidates", [])[:20]:
              print("CANDIDATE", {k: c.get(k) for k in ("pole", "line", "sample", "lon", "lat", "z_primary_min", "z_primary_max",
                                                        "T_ref_summer", "T_ref_winter", "area_m2_summer", "area_m2_winter", "radar")})
              print("   coverage", {k: (v.get("status"), v.get("count"), v.get("n_listed"), (v.get("error") or "")[:80]) for k, v in (c.get("coverage") or {}).items() if isinstance(v, dict)})
              print("   unexcluded", c.get("unexcluded_systematics"))
          PY
      # A verdict must never read as a science null when no pixel was screened.
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/crypt/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), int(s.get("n_psr_interior_px", 0))
          if n == 0 and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with 0 PSR pixels is a disguised no-data run"); sys.exit(1)
          if "NO_DATA_REACHED" in v:
              print("::warning::NO_DATA_REACHED — read results/crypt/probe.json (axis_counts, example_names, selection) and correct config/crypt.yaml patterns.")
          if "NO_ANISOTHERMAL_SURVIVOR" in v:
              print(f"::notice::{n} PSR-interior pixels screened, no survivor. A COUNT at the stated floor, NOT an occurrence limit — see docs/crypt.md.")
          if "ANISOTHERMAL_CANDIDATES" in v:
              print(f"::notice::{s.get('n_candidates')} candidate pixel(s) — PENDING the optical/radar vet, see results/crypt/candidates.json")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The push is VERIFIED against the remote by commit_results.sh; the
          # rasters (results/crypt/data/) never leave the runner.
          scripts/commit_results.sh \
            "crypt: artifacts in lunar permanent shadow — ${{ github.event.inputs.stage || 'all' }}" \
            results/crypt/probe.json \
            results/crypt/summary.json \
            results/crypt/candidates.json \
            results/crypt/candidates.csv \
            $(ls results/crypt/acquire_*.json results/crypt/screen_*.json results/crypt/sensitivity_*.json results/crypt/radar_*.json results/crypt/flags_*.csv 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypt-final
          path: results/crypt/
          if-no-files-found: warn
