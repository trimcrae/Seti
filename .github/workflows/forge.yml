name: forge

# FORGE — hot exozodis read as ~1500 K swarm candidates (docs/forge.md).
#
#   probe ──▶ acquire ──▶ screen ──▶ assess ──▶ commit-back
#
# Signature S47: the cheapest place to collect stellar energy per unit
# collector mass is as close to the star as materials allow, ~1500 K.
# Interferometry finds a ~1 % H/K-band excess around 10-30 % of nearby
# main-sequence stars, read as sub-micron grains whose emissivity collapses
# beyond a few microns (K-bright / N-faint).  A grey Planck body cannot do
# that: 1 % in K gives ~8 % at 10 um.  The observable is the OUTLIER whose
# N-band excess IS consistent with the Planck extrapolation of its K excess.
#
# THE GOVERNING DISCIPLINES (docs/forge.md §5):
#  * the embedded published values are SEEDS: every one is unverified until
#    this runner reads it back from VizieR; a star whose driving values were
#    not confirmed is UNVERIFIED_INPUT, never a candidate;
#  * a star with no N-band measurement is N_UNTESTED, never a candidate;
#  * schema discovery at runtime — no column name is queried that was not
#    seen in TAP_SCHEMA.columns / the ASU header; QUERY_FAILED and
#    QUERY_RETURNED_ZERO_ROWS are kept apart;
#  * a null is a reason to change the question, not a result.
#
# The whole channel is small (~250 stars plus the < 30 pc broadband
# population), so one job runs every stage; commit-back through
# scripts/commit_results.sh, which VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          Which stage to run: "all" (probe, acquire, screen, assess),
          "probe" (schema discovery only — cheap, run this first), or one of
          acquire / screen / assess (the earlier stages' outputs are taken
          from the branch's results/forge/).
        required: false
        default: "all"
      tables:
        description: >-
          Comma-separated table keys from config/forge.yaml (default: every
          enabled one).  e.g. "absil2013,ertel2020"
        required: false
        default: ""
      skip_population:
        description: "Skip the Gaia < 30 pc population pull (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — the injected 1500 K swarm must be recovered on this runner
        run: python -m pytest tests/test_forge.py -q -p no:cacheprovider
      - name: Probe (schema discovery, row counts, endpoint reachability)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'probe' }}
        run: |
          TABS=""
          if [ -n "${{ github.event.inputs.tables }}" ]; then
            TABS="--tables ${{ github.event.inputs.tables }}"
          fi
          python -m seti.forge.run --stage probe $TABS
          echo "=== probe ==="
          python - <<'PY'
          import json
          d = json.load(open("results/forge/probe.json"))
          for k, v in d["tables"].items():
              print("table", k, v.get("status"), v.get("table"), v.get("n_rows"), v.get("roles"))
          for k, v in d.get("endpoints", {}).items():
              print("endpoint", k, v)
          print("usable:", d.get("n_tables_usable"), "elapsed:", d.get("elapsed_s"))
          PY
      - name: Acquire (excess tables, verification, positions, companions, photometry)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire' }}
        run: |
          TABS=""
          if [ -n "${{ github.event.inputs.tables }}" ]; then
            TABS="--tables ${{ github.event.inputs.tables }}"
          fi
          POP=""
          if [ "${{ github.event.inputs.skip_population || 'false' }}" = "true" ]; then
            POP="--skip-population"
          fi
          python -m seti.forge.run --stage acquire $TABS $POP
          echo "=== acquire ==="
          python - <<'PY'
          import json
          d = json.load(open("results/forge/acquire.json"))
          for k, v in d["tables"].items():
              print("table", k, v.get("status"), v.get("n_rows"), "rows", v.get("n_matched"), "matched",
                    v.get("n_added"), "added", v.get("n_measurements"), "measurements")
          print("verification:", d.get("verification"))
          print("positions:", d.get("positions"))
          print("companions:", d.get("companions"))
          print("sample photometry:", d.get("sample_photometry"))
          print("population:", {k: v for k, v in (d.get("population") or {}).items() if k != "bands"})
          PY
      - name: Screen (grey vs nano likelihood ratio per star; broadband leg)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen' }}
        run: |
          python -m seti.forge.run --stage screen
          ls -la results/forge/
          python - <<'PY'
          import json
          d = json.load(open("results/forge/screen.json"))
          print("tiers:", d.get("tiers"))
          print("broadband sample:", d.get("broadband_sample_classes"))
          print("broadband population:", d.get("broadband_population"))
          PY
      - name: Assess (verdict, funnel, coverage, candidates)
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'assess' }}
        run: |
          python -m seti.forge.run --stage assess
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/forge/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("candidates", "coverage")}, indent=2)[:6000])
          for c in s.get("candidates", []):
              print("CANDIDATE", c["key"], c["tier"], c["reason"])
          PY
      # A verdict must never read as a science null when no data was assessed.
      - name: Assert the verdict is not a disguised no-data run
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'assess' }}
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/forge/summary.json")
          if not p.exists():
              print("::warning::no summary.json — the assess stage produced nothing"); sys.exit(0)
          s = json.loads(p.read_text())
          v, n = s.get("verdict", ""), s.get("n_stars_assessable", 0)
          if n == 0 and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with 0 N-band-tested stars is a disguised no-data run"); sys.exit(1)
          if "NO_PLANCK_CONSISTENT_OUTLIER" in v:
              print(f"::notice::{n} stars carry an N-band test, none Planck-consistent. A COUNT, NOT A LIMIT — {s['funnel'].get('n_N_UNTESTED')} stars never tested; see docs/forge.md.")
          if "PLANCK_CONSISTENT_CANDIDATES" in v:
              print(f"::notice::{s.get('n_candidates')} candidate / {s.get('n_interest')} interest stars — see results/forge/candidates.json")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # The result of the push is VERIFIED against the remote (see
          # scripts/commit_results.sh); the population parquet stays in the artifact.
          scripts/commit_results.sh \
            "forge: hot exozodis as 1500 K swarms — ${{ github.event.inputs.stage || 'all' }}" \
            results/forge/probe.json \
            results/forge/acquire.json \
            results/forge/acquisition_log.json \
            results/forge/forge_excess_verified.csv \
            results/forge/data/archive_measurements.json \
            results/forge/data/positions.csv \
            results/forge/data/targets.csv \
            results/forge/data/companions.json \
            results/forge/data/sample_photometry.csv \
            results/forge/screen.json \
            results/forge/star_table.csv \
            results/forge/broadband_sample.csv \
            results/forge/broadband_population.json \
            results/forge/broadband_population_flagged.csv \
            results/forge/summary.json \
            results/forge/candidates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-run
          path: results/forge/
          if-no-files-found: warn
