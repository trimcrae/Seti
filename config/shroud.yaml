# SHROUD channel — every selection / rejection threshold in one place.
#
# Signature S33 (docs/necrosignatures.md): sources present in POSS-I (1949-1958)
# and absent in the modern optical, but WITH an infrared counterpart =
# "enshrouded, not destroyed".  The control sample is the same selection with
# NO counterpart at any wavelength.
#
# Scoping (docs/shroud.md): this channel uses the Solano+2022 catalogue
# BY-PRODUCT (the optical-absent / IR-present crossmatch) only.  It does not
# use, replicate, or depend on the contested VASCO transient / Earth-shadow /
# nuclear-test analyses.

acquire:
  # Route 0 - the IVOA registry.  Runs 30203741898 and 35653059591 could only
  # GUESS URL paths for the SVO service and spent themselves on 404s from
  # svo2.cab.inta-csic.es and TCP timeouts from svocats.cab.inta-csic.es.  The
  # registry is the authoritative index of every published VO service, so it
  # answers "where does the VASCO cone search say it lives" directly, and a
  # moved or renamed service is found here or nowhere.  RegTAP mirrors are
  # tried in order; the first that answers is used.
  try_registry: true
  regtap_endpoints:
    - "https://reg.g-vo.org/tap/sync"
    - "http://dc.g-vo.org/tap/sync"
    - "https://registry.euro-vo.org/regtap/tap/sync"
  # Literal VizieR catalogue ids, looked up BY NAME with -meta.all.  The
  # TAP_SCHEMA keyword sweep can only find a catalogue whose description
  # happens to carry the keyword; run 35653059591's sweep returned nothing but
  # "Vasco D." and "Vasconcelos" and never looked the Solano+2022 catalogue up
  # by its own bibcode-derived name.  -meta.all separates "not in VizieR" from
  # "there, but the row query was wrong".
  vizier_direct_catalogues:
    - "J/MNRAS/515/1380"      # Solano, Villarroel & Rodrigo 2022 (the by-product)
    - "J/AJ/159/8"            # Villarroel+2020 surviving candidates (known good)
    - "J/other/NatSR/11.12794"  # Villarroel+2021 nine simultaneous transients
    - "I/284"                 # USNO-B1.0, the reconstruction's own source
  # The VO archive published with Solano, Villarroel & Rodrigo 2022, MNRAS 515,
  # 1380.  It is TWO SVO "svocats" catalogues, not one:
  #   vanish-neowise  the 172 163 optically-absent / IR-present sources  <- SHROUD
  #   vanish-possi    the 5 399 unidentified transients (no IR)          <- control
  # Both URLs are quoted verbatim in Watters et al. 2026 (arXiv:2601.21946)
  # Table 1 footnotes, "Retrieved on 2025-12-08 from ...", and independently in
  # the jannefi/vasco reimplementation README.  Roots are probed in order; the
  # first that returns a parseable table wins and its URL is recorded in the
  # provenance block.  None is reachable from the sandbox (egress 403) - they
  # are probed on the GitHub Actions runner.
  # Run 35653059591 (2026-09-21): svocats.cab.inta-csic.es times out at the
  # TCP level (http and https); svo2.cab.inta-csic.es is ALIVE (403 on the
  # /vocats/ directory listing, 404 on the two catalogue paths in 0.2 s), so
  # the catalogues are simply not at those paths.  More spellings are probed,
  # each costing a fifth of a second.
  svo_catalogs:
    vanish_neowise:
      - "http://svocats.cab.inta-csic.es/vanish-neowise"
      - "https://svocats.cab.inta-csic.es/vanish-neowise"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vanish-neowise"
      - "http://svo2.cab.inta-csic.es/vocats/vanish-neowise"
      - "https://svo2.cab.inta-csic.es/vocats/v2/vanish-neowise"
      - "http://svo2.cab.inta-csic.es/svocats/vanish-neowise"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vanish_neowise"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vanish"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vasco"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vanishing"
      - "http://svo2.cab.inta-csic.es/vocats/v2/poss1"
    vanish_possi:
      - "http://svocats.cab.inta-csic.es/vanish-possi"
      - "https://svocats.cab.inta-csic.es/vanish-possi"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vanish-possi"
      - "http://svo2.cab.inta-csic.es/vocats/vanish-possi"
      - "https://svo2.cab.inta-csic.es/vocats/v2/vanish-possi"
      - "http://svo2.cab.inta-csic.es/svocats/vanish-possi"
      - "http://svo2.cab.inta-csic.es/vocats/v2/vanish_possi"
  # Whole-sky dump in one request: SR=180 about (RA,DEC)=(180,0).  The first
  # form is the parameter set used by working production code against another
  # svocats catalogue (jeroenbouwman/CASCADe scripts/check_phase_error.py).
  # The variants exist because `nocoor=1` is not documented and may mean
  # "drop the coordinate COLUMNS" rather than "drop the cone CONSTRAINT" - a
  # response without RA/DEC is useless here, so the fetcher rejects it and
  # falls through to the next form rather than accepting a truncated table.
  svo_allsky_queries:
    - "RA=180.000000&DEC=0.000000&SR=180.000000&VERB=2&format=ascii"
    - "RA=180.000000&DEC=0.000000&SR=180.000000&VERB=1&nocoor=1&format=ascii"
    - "RA=180.000000&DEC=0.000000&SR=180.000000&VERB=2&format=votable"
    - "RA=180.000000&DEC=0.000000&SR=180.000000&VERB=3&format=ascii"
  svo_paths: ["cs.php", "", "cs"]
  # Published row counts.  The abstract says 172 163 for the IR set; the LIVE
  # archive served 171 753 on 2025-12-08 (Watters et al. 2026, stated four
  # times).  A fetch landing near 171 753 is CORRECT, not a bug.
  expected_rows:
    vanish_neowise: 171753
    vanish_possi: 5399
  expected_rows_tolerance_frac: 0.05
  svo_index_urls:
    - "https://svo.cab.inta-csic.es/docs/index.php?pagename=Archives"
    - "http://svocats.cab.inta-csic.es/"
    - "http://svo2.cab.inta-csic.es/vocats/"
    - "http://svo2.cab.inta-csic.es/"
    - "http://svo2.cab.inta-csic.es/vocats/v2/"
    - "http://svo2.cab.inta-csic.es/vocats/v2/index.php"
    - "https://svo.cab.inta-csic.es/main/index.php"
    - "http://svo2.cab.inta-csic.es/theory/vosa/"
  # Minnesota APS (MAPS) scan of POSS-I E+O: an INDEPENDENT digitization of the
  # same plates, ~90M objects.  Watters et al. used it as the null-distribution
  # reference; it is the natural artifact control here too (a real object is on
  # both the E and O plate, a defect on one).
  maps_catalog_url: "https://aps.umn.edu/catalog/download/"
  # VizieR fallback: Villarroel+2020 (AJ 159, 8) surviving candidates.
  # Solano+2022 (J/MNRAS/515/1380) is NOT in VizieR - verified 2026-07-26 on the
  # runner, the server returns "Table or Catalog not found".
  vizier_votable: "https://vizier.cds.unistra.fr/viz-bin/votable?-source={cat}&-out.max={maxrows}"
  vizier_vasco2020_cat: "J/AJ/159/8"
  # Reachability probes are SHORT.  Run 30203741898 (2026-07-26) found the SVO
  # host answering nothing at the TCP level and then spent its whole 70-minute
  # budget in a 300 s-timeout retry ladder; only a root that answered a probe
  # gets the long bulk-fetch timeout below.
  probe_timeout_s: 25
  probe_retries: 1
  try_svo: true
  # VizieR: TAP for TAP_SCHEMA discovery, ASU for bulk table pulls.
  vizier_tap: "https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync"
  vizier_asu: "https://vizier.cds.unistra.fr/viz-bin/asu-tsv"
  tap_timeout_s: 120
  # Keyword search of TAP_SCHEMA.tables (name AND description); the 2026-07-26
  # "not found" was a single-name probe of J/MNRAS/515/1380.
  tap_schema_keywords: ["vanish", "VASCO", "Villarroel", "MNRAS/515/1380", "AJ/159/8"]
  # Route 3: reconstruct the Solano+2022 parent selection from USNO-B1.0, the
  # PMM scan of the same POSS-I plates.  Ndet = 1 with R1mag present = seen on
  # the POSS-I red plate and on no other plate.  dec >= -25 keeps to the sky
  # where USNO-B1.0's first-epoch plates ARE POSS-I (south of -30 they are
  # SERC-J / ESO-R).  R1 <= 19.3 stays 0.7 mag above the E plate limit, the
  # emulsion-noise regime the vet would flag anyway (Hambly & Blair 2024).
  reconstruct:
    enabled: true
    usnob1_table: "I/284/out"
    n_fields: 40
    field_radius_deg: 0.5
    seed: 0
    dec_min_deg: -25.0
    dec_max_deg: 88.0
    abs_glat_min_deg: 20.0
    ndet: 1
    r1_max_mag: 19.3
    # A field's answer is only usable if it can EXPRESS the selection.  Run
    # 35738062833 returned 1380-5899 rows from every field and reconstructed
    # zero sources, because the rows carried positions and no plate magnitudes:
    # "POSS-I red and nothing else" is a statement about which magnitudes are
    # present, so a frame without them yields a guaranteed, meaningless zero.
    # A query form whose answer lacks these is rejected and the next rung of
    # the ladder is tried.
    required_columns: ["RAJ2000", "DEJ2000", "R1mag"]
    max_rows_per_field: 200000
    field_timeout_s: 240
    field_retries: 2
    max_consecutive_failures: 6
    pause_s: 0.5
  # CDS X-Match: the only sane way to crossmatch 10^5 uploaded positions.
  xmatch_urls:
    - "https://cdsxmatch.cds.unistra.fr/xmatch/api/v1/sync"
    - "http://cdsxmatch.u-strasbg.fr/xmatch/api/v1/sync"
  xmatch_timeout_s: 600
  xmatch_chunk_rows: 25000
  # VizieR table identifiers used through X-Match / TAP.
  catalogs:
    allwise: "vizier:II/328/allwise"
    catwise: "vizier:II/365/catwise"
    twomass: "vizier:II/246/out"
    gaia_dr3: "vizier:I/355/gaiadr3"
    usnob1: "vizier:I/284/out"
    ps1_dr1: "vizier:II/349/ps1"
  http_timeout_s: 300
  retries: 2
  retry_backoff_s: 8.0

  # Wall clock on the SVO probe ladder, per catalogue.  Each probe is short
  # (probe_timeout_s), but the NUMBER of roots is not bounded by this channel:
  # RegTAP contributes however many the registry publishes and the index
  # scrape however many links it mines, so roots x 5 forms x 25 s grows without
  # limit.  Run 35741075121 spent > 45 min in this step alone, and the route
  # after it -- the USNO-B1.0 reconstruction, the only one that can restore the
  # channel's scale -- gets whatever is left of the acquisition deadline.  A
  # ladder that cannot find a service must not consume the run that would have
  # worked without it.  Also capped at 25% of the remaining deadline.
  svo_probe_budget_s: 600

  # An INDEPENDENT digitisation of the same POSS-I glass is the strongest kill
  # this channel could have: a detection that a second scan of the same plate
  # does not see is a scan artefact, not a source that vanished.  Solano+2022
  # classified 3,592 of their 298,165 objects exactly this way (SuperCOSMOS
  # against the USNO-B1.0-era scans), and Hambly & Blair 2024 argue the whole
  # VASCO transient class is emulsion artefacts.
  #
  # Reachability is PROBED and recorded; nothing is vetoed on a route that did
  # not answer.  And the test is asymmetric: presence confirms a plate image,
  # while absence means something only where the second scan is demonstrably
  # DEEPER than the magnitude claimed for the source.  A source missing from a
  # shallower catalogue is not missing.
  second_digitisation:
    probe: true
    probe_timeout_s: 25
    discovery_keywords: ["SuperCOSMOS", "Hambly", "MNRAS/326/1279",
                         "MNRAS/326/1295", "MNRAS/326/1315", "SSS"]
    # WFAU serves the SuperCOSMOS Science Archive from Edinburgh, not CDS.
    ssa_tap_urls:
      - "http://ssa.roe.ac.uk/TAP/tap/sync"
      - "https://ssa.roe.ac.uk/TAP/tap/sync"
    # Literal ids a keyword sweep cannot reach, asked by name via -meta.all.
    # GSC 2.3.2 is STScI's own scan of the Palomar/UKST plate material; which
    # of its magnitudes come from POSS-I is NOT assumed here and must be read
    # off the catalogue's metadata before any kill is built on it.
    candidate_tables:
      - table: "I/305"
      - table: "I/305/out"
    # Absence only counts where the second scan is this much deeper.
    min_depth_margin_mag: 0.5
    match_radius_arcsec: 3.0

epochs:
  # POSS-I plates: 1949-1958.  Mid-survey default when a plate date is absent.
  poss1_default: 1953.0
  poss1_min: 1949.0
  poss1_max: 1958.0
  # Survey reference epochs used for proper-motion propagation.
  gaia_dr3: 2016.0
  ps1_dr1: 2012.0
  allwise: 2010.5
  catwise: 2015.4
  twomass: 1999.3

crossmatch:
  # Solano+2022 used 5".  Kept as the nominal radius so the sample is the
  # published one, but the chance-match rate at this radius is a first-class
  # output, not an afterthought (see docs/shroud.md).  Watters et al. 2026 note
  # that dataset W "comprises an undetermined number of NeoWISE objects along
  # with an undetermined number of incidentally object-proximate SPFs" -
  # determining that number is a deliverable of this channel.
  radius_arcsec: 5.0
  # A tighter radius used for the "clean" subsample.
  tight_radius_arcsec: 2.0
  # pi*(5/3600)^2 deg^2 = 6.06e-6 deg^2; density 1.65e5/deg^2 -> P_chance = 1.
  chance_match_warn_prob: 0.05
  chance_match_reject_prob: 0.30
  # The chance rate is MEASURED, not assumed: the same positions are offset by a
  # random angle at this separation and re-matched.  An offset-position null
  # absorbs the real local source density, which is exactly the assumption
  # (spatial uniformity) that Watters et al. 2026 showed to be false.
  offset_null_arcsec: 45.0
  offset_null_realisations: 4
  # The excess is also measured as a FUNCTION of radius, because one radius
  # cannot separate a real counterpart population from the background: at 5"
  # against AllWISE the matched subsample is chance-dominated by construction.
  # Unrelated matches accumulate with the search area (chance fraction ~ r^2)
  # while a genuine counterpart is already counted at the smallest radius, so
  # a real population shows as an excess concentrated at small separation with
  # a significance that PEAKS near the combined astrometric error.  Evidence
  # only: the channel's selection radius stays radius_arcsec above.
  excess_radii_arcsec: [1.0, 1.5, 2.0, 3.0, 4.0, 5.0]

proper_motion:
  # Largest proper motion searched for when testing "did it just move?".
  # 3000 mas/yr covers everything but Barnard's Star (10.36"/yr).
  mu_max_mas_yr: 3000.0
  # Radius of the wide Gaia pull used for back-propagation: 60" = 950 mas/yr
  # over 63 yr; only a few dozen stars in the whole sky move faster, and all of
  # them are famous.  Photometry is taken only from matches inside the 5"
  # crossmatch radius - a star 40" away is a neighbour, not a counterpart.
  gaia_search_radius_arcsec: 60.0
  # A modern source that propagates back to within this of the POSS-I position
  # is the same star -> HIGH_PM_STAR, rejected.
  match_radius_arcsec: 3.0
  # Below this the star had not moved far enough for PM to explain anything.
  min_displacement_arcsec: 2.0

plate:
  # POSS-I E (103a-E, red) plate limit.  Sources this close to the limit are
  # emulsion-noise-dominated (Hambly & Blair 2024) and are flagged.
  poss1_e_limit_mag: 20.0
  poss1_o_limit_mag: 21.0
  limit_proximity_mag: 0.7
  # Below this magnitude a POSS-I "detection" is brighter than the plate can
  # linearly record; saturation makes the photometry unusable for a budget.
  saturation_mag: 12.0

# The depth kill.  Absence is the whole signature here, so an absence is only
# as good as the search that failed to find it.  Two ways it goes wrong:
#   * the modern catalogue was never successfully queried, so every source in
#     the run gets an empty ps1_r / gaia_g -- and empty reads as GONE;
#   * the source sits outside that survey's footprint (Pan-STARRS stops at
#     dec = -30), so only the shallower all-sky catalogue is behind it.
# A catalogue contributes its depth only if its X-Match actually answered AND
# the source is inside its footprint; a source nothing covered is excluded
# from the disappearance count rather than counted as a disappearance.
modern_optical:
  require_depth_margin: true
  # The claim "it vanished" is only as strong as (limit - plate magnitude):
  # POSS-I E ~ 20.0, so an R1 = 19.3 source absent from Pan-STARRS has faded
  # by >= 3.9 mag, while the same source absent from Gaia alone has faded by
  # >= 1.4 mag -- within ordinary stellar variability.  2.0 mag is a factor of
  # 6.3 in flux and is not reachable by the plate's own photometric scatter.
  min_depth_margin_mag: 2.0
  limits:
    ps1:
      mag: 23.2            # PS1 DR1 stacked r, 5 sigma (Chambers+2016 Table 11)
      band: "r"
      dec_min_deg: -30.0
      dec_max_deg: 90.0
    gaia:
      mag: 20.7            # Gaia DR3 G completeness limit
      band: "G"
      dec_min_deg: -90.0
      dec_max_deg: 90.0

sed:
  # Blackbody temperature grids for the two competing models.
  teff_star_grid_k: [2500, 2800, 3200, 3600, 4000, 4500, 5000, 5800, 6500, 7500, 9000, 11000, 15000, 20000]
  tdust_grid_k: [80, 120, 180, 250, 350, 500, 700, 1000, 1400, 1800]
  av_grid_mag: [0.0, 0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 12.0, 20.0, 30.0]
  # Systematic floor folded into every sigma (mag).  Photographic photometry is
  # good to ~0.3 mag at best; modern catalogue bands get 0.05.
  sys_floor_mag_photographic: 0.30
  sys_floor_mag_modern: 0.05
  # Fitted dust hotter than this is a companion photosphere, not grains
  # (repository contamination ledger).
  tdust_max_physical_k: 1800.0
  # Minimum number of detected bands for a meaningful two-component fit.
  min_bands_for_fit: 4
  min_ir_bands: 2

energy_budget:
  # eta = F_IR(now) / [F_bol(POSS-I) - F_bol(modern optical)].
  # Distance cancels: eta is a pure flux ratio.
  eta_conserving_lo: 0.30
  eta_conserving_hi: 3.0
  # eta far below 1 for EVERY allowed progenitor temperature = the infrared
  # cannot be the missing optical light.
  eta_too_faint: 0.10
  # Fores-Toribio & Kochanek 2026: merger remnants are 10-100x MORE luminous
  # than their progenitors at late phases; genuine disappearance remnants are
  # ~10x DIMMER.  Asymmetric dust cannot manufacture a factor ~100.
  ftk_merger_ratio_min: 10.0
  ftk_disappearance_ratio_max: 0.30

classify:
  # WISE colour diagnostics (Wright+2010 Fig. 12; Stern+2012 AGN wedge).
  agn_w1w2_min: 0.80
  # A bare photosphere has W1-W2 >= 0 (ledger).  Negative = blend.
  blend_w1w2_max: -0.10
  # Dusty AGB / evolved giants: very red and IR-bright.
  agb_w1w2_min: 0.30
  agb_w3w4_min: 1.20
  agb_ks_max: 8.0
  # YSOs concentrate at low galactic latitude with a rising mid-IR SED.
  yso_abs_glat_max: 5.0
  yso_w2w3_min: 1.0
  # Asteroids concentrate near the ecliptic and are single-epoch.
  asteroid_abs_ecl_lat_max: 20.0
  # Extragalactic-safe latitude band for the clean subsample.
  clean_abs_glat_min: 20.0
  # A modern optical counterpart this much fainter than the plate magnitude
  # means the star was simply caught bright -> variable, not vanished.
  variable_delta_mag_min: 1.0

vet:
  # Inherited contamination ledger (docs/channel-brief.md sec. 4).
  require_two_ir_bands: true
  reject_w4_only: true
  reject_negative_w1w2: true
  max_ir_neighbours_in_psf: 1
  wise_psf_arcsec: 6.0
  # Artefact flags from the reconstruction and the WISE join.  USNO-B1.0
  # Flags 's' = diffraction spike; AllWISE ccf letters in W1/W2 = the source
  # is a diffraction spike (D), persistence (P), halo (H) or optical ghost (O)
  # of a nearby bright star.  A Gaia star this bright inside the wide pull
  # means the plate "source" sits in a halo / spike footprint.
  reject_usnob_spike: true
  reject_wise_artifact_flags: true
  bright_neighbour_gmag_max: 10.0
