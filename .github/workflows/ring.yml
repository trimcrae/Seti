name: ring

# RING — rings around the dead (S63; docs/ring.md).
#
#   probe ──▶ [wd | pulsar | bd(shards) | ffp] acquire+screen ──▶ assess ──▶ commit
#
# Post-biological hosts by construction: white dwarfs, pulsars, Y/T dwarfs,
# free-floating planets.  One temperature prior (Osmanov's 300-700 K ring:
# a W1/W2 excess) over every host class the catalogues allow.
#
# Design (channel-brief §3): every leg is its own job (fail-fast: false), so
# a lost leg costs that leg; the white-dwarf pull checkpoints per declination
# band and the NEOWISE pull per batch; every upload is `if: always()`; the
# assess job runs `if: always()` and names any leg that reached no data in the
# verdict; commit-back goes through scripts/commit_results.sh, which verifies
# the push.  `actions: read` is required for artifact passthrough between jobs
# of the same run under an explicit permissions block.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "all | probe | acquire | screen | assess"
        required: false
        default: "all"
      legs:
        description: "Comma-separated legs to run: wd,pulsar,bd,ffp"
        required: false
        default: "wd,pulsar,bd,ffp"
      bd_shards:
        description: "Number of NEOWISE shards for the brown-dwarf leg"
        required: false
        default: "3"
      skip_followup:
        description: "Set to 'true' to skip the white-dwarf shortlist follow-up"
        required: false
        default: "false"
      solo:
        description: "'true' (default): the whole channel in ONE job. 'false': the sharded path."
        required: false
        default: "true"

permissions:
  contents: write
  actions: read

jobs:
  # ------------------------------------------------------------------------
  # SOLO: the whole channel on one runner, and the default.
  #
  # The sharded path below is NINE scheduling events (plan, probe, four legs,
  # two NEOWISE shards, assess).  With 18 channels sharing one account's
  # concurrency that is nine chances to wait: run 35747779136 sat queued for
  # over two hours without its five-minute `plan` job ever starting, while a
  # run dispatched two seconds later on another channel ran to completion.
  # A run that never starts measures nothing, so the default is one job.
  #
  # Ordering inside the job is by decisiveness per minute, because a wall
  # clock may end it early: the pulsars first (3.9 k hosts and the named
  # two-target vet, minutes), then the free-floating planets (tens of
  # objects), then the white dwarfs (the census, and the expensive pull),
  # then the NEOWISE series.  Every leg is wrapped in `timeout ... || true`,
  # so a leg that hangs costs that leg and the rest still reach `assess`.
  #
  # The commit is at the END and only there.  commit_results.sh works by
  # resetting the checkout to the head of RESULTS_BRANCH and laying the
  # generated files over it, which inside a single job would swap the source
  # tree mid-run for anything pushed to the branch since checkout.
  # ------------------------------------------------------------------------
  solo:
    if: ${{ (github.event.inputs.solo || 'true') == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psrqpy || echo "::warning::psrqpy not installable; the tarball route will be used"
          python -c "import pandas, numpy, astropy; print('stack:', pandas.__version__, numpy.__version__, astropy.__version__)"
      - name: Offline gate — the injected 500 K ring must be recovered on this runner
        run: python -m pytest tests/test_ring.py -q -p no:cacheprovider
      - name: Probe every endpoint
        run: |
          timeout 1800 python -u -m seti.ring.run --stage probe || true
          cat results/ring/probe.json || echo "::warning::no probe.json"
      - name: Pulsars
        if: ${{ contains(github.event.inputs.legs || 'wd,pulsar,bd,ffp', 'pulsar') }}
        run: |
          timeout 3000 python -u -m seti.ring.run --stage acquire --leg pulsar || true
          timeout 1200 python -u -m seti.ring.run --stage screen  --leg pulsar || true
          cat results/ring/pulsar/screen.json || true
      - name: Free-floating planetary-mass objects
        if: ${{ contains(github.event.inputs.legs || 'wd,pulsar,bd,ffp', 'ffp') }}
        run: |
          timeout 1800 python -u -m seti.ring.run --stage acquire --leg ffp || true
          timeout 600  python -u -m seti.ring.run --stage screen  --leg ffp || true
          cat results/ring/ffp/screen.json || true
      - name: White dwarfs — the census
        if: ${{ contains(github.event.inputs.legs || 'wd,pulsar,bd,ffp', 'wd') }}
        run: |
          timeout 7200 python -u -m seti.ring.run --stage acquire --leg wd || true
          timeout 2400 python -u -m seti.ring.run --stage screen  --leg wd || true
          cat results/ring/wd/screen.json || true
      - name: Brown dwarfs — NEOWISE per-epoch W2
        if: ${{ contains(github.event.inputs.legs || 'wd,pulsar,bd,ffp', 'bd') }}
        run: |
          timeout 5400 python -u -m seti.ring.run --stage acquire --leg bd || true
          timeout 900  python -u -m seti.ring.run --stage screen  --leg bd || true
          cat results/ring/bd/screen.json || true
      - name: Assess
        if: always()
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.skip_followup }}" = "true" ]; then EXTRA="--no-followup"; fi
          timeout 5400 python -u -m seti.ring.run --stage assess $EXTRA
          echo "=== summary ==="
          python -c "import json; s=json.load(open('results/ring/summary.json')); print(json.dumps({k: v for k, v in s.items() if k not in ('legs',)}, indent=2)[:6000]); print(json.dumps({k: {kk: vv for kk, vv in v.items() if kk not in ('flagged','ring_candidates','survivors')} for k, v in s['legs'].items()}, indent=2)[:8000])"
      - name: Assert the verdict is not a disguised no-data run
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/ring/summary.json")
          if not p.exists():
              print("::error::no summary.json"); sys.exit(1)
          s = json.loads(p.read_text())
          v = s.get("verdict", "")
          legs = s.get("legs", {})
          reached = [k for k, l in legs.items() if l.get("status") == "OK"]
          if not reached and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with no leg reaching data is a disguised no-data run"); sys.exit(1)
          print(f"::notice::{v} -- legs reached: {reached}; degraded: {s.get('degraded_legs')}")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ring: rings around the dead — solo run over ${{ github.event.inputs.legs || 'wd,pulsar,bd,ffp' }}" \
            results/ring/summary.json \
            results/ring/REPORT.md \
            results/ring/probe.json \
            results/ring/wd/acquire.json \
            results/ring/wd/screen.json \
            results/ring/wd/excess.csv \
            results/ring/wd/followup.csv \
            results/ring/pulsar/acquire.json \
            results/ring/pulsar/screen.json \
            results/ring/pulsar/pulsars_screened.csv \
            results/ring/pulsar/counterparts.csv \
            results/ring/bd/acquire_targets.json \
            results/ring/bd/screen.json \
            results/ring/bd/targets.csv \
            results/ring/bd/bd_screened.csv \
            results/ring/ffp/acquire.json \
            results/ring/ffp/screen.json \
            results/ring/ffp/ffp_screened.csv \
            $(ls results/ring/bd/acquire_shard*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-solo
          path: |
            results/ring/
            !results/ring/wd/chunks
            !results/ring/wd/sample*.parquet
          if-no-files-found: warn

  plan:
    if: ${{ (github.event.inputs.solo || 'true') != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.mk.outputs.legs }}
      bd_shards: ${{ steps.mk.outputs.bd_shards }}
      has_bd: ${{ steps.mk.outputs.has_bd }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          legs = [x.strip() for x in os.environ["LEGS"].split(",") if x.strip()]
          n = int(os.environ["SHARDS"] or 1)
          print("legs=" + json.dumps([x for x in legs if x != "bd"] or ["none"]))
          print("bd_shards=" + json.dumps(list(range(n))))
          print("has_bd=" + ("true" if "bd" in legs else "false"))
          PY
        env:
          LEGS: ${{ github.event.inputs.legs || 'wd,pulsar,bd,ffp' }}
          SHARDS: ${{ github.event.inputs.bd_shards || '3' }}

  probe:
    if: ${{ (github.event.inputs.solo || 'true') != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psrqpy || echo "::warning::psrqpy not installable; the tarball route will be used"
      - name: Offline gate — the injected 500 K ring must be recovered on this runner
        run: python -m pytest tests/test_ring.py -q -p no:cacheprovider
      - name: Probe every endpoint
        run: |
          python -u -m seti.ring.run --stage probe
          cat results/ring/probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-probe
          path: results/ring/probe.json
          if-no-files-found: warn

  leg:
    # Deliberately NOT gated on `probe`.  The probe is a diagnostic — every
    # fetcher resolves its own columns at run time — and with 18 channels
    # sharing one account's concurrency, a serial plan -> probe -> leg chain
    # costs three separate waits in a queue that has been 97 runs deep.  The
    # legs queue alongside the probe instead; `assess` still needs both.
    needs: [plan]
    if: ${{ github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'assess' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.leg != 'none' }}
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        if: ${{ matrix.leg != 'none' }}
        with:
          python-version: "3.11"
      - name: Install
        if: ${{ matrix.leg != 'none' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.leg }}" = "pulsar" ]; then pip install psrqpy || true; fi
      - name: Acquire ${{ matrix.leg }}
        if: ${{ matrix.leg != 'none' && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire') }}
        run: python -u -m seti.ring.run --stage acquire --leg ${{ matrix.leg }}
      - name: Screen ${{ matrix.leg }}
        if: ${{ always() && matrix.leg != 'none' && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'screen' || github.event.inputs.stage == 'acquire') }}
        run: |
          python -u -m seti.ring.run --stage screen --leg ${{ matrix.leg }}
          cat results/ring/${{ matrix.leg }}/screen.json || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && matrix.leg != 'none' }}
        with:
          name: ring-leg-${{ matrix.leg }}
          path: |
            results/ring/${{ matrix.leg }}/
            !results/ring/${{ matrix.leg }}/chunks
          if-no-files-found: warn

  # One brown-dwarf target list per run, fetched ONCE and handed to every
  # NEOWISE shard (scripts/ring_bd_handoff.py).  Before, shard 0 fetched it
  # fresh while shards > 0 read the checked-out targets.csv of an EARLIER run,
  # so one run's shards could partition two different lists.
  bd-targets:
    needs: [plan]
    if: ${{ needs.plan.outputs.has_bd == 'true' && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Purge the checked-out target list
        run: rm -f results/ring/bd/targets.csv results/ring/bd/acquire_targets.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch the bd target list once
        run: python -u scripts/ring_bd_handoff.py targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-bd-targets
          path: |
            results/ring/bd/targets.csv
            results/ring/bd/acquire_targets.json
          if-no-files-found: warn

  bd:
    needs: [plan, bd-targets]
    if: ${{ always() && needs.plan.outputs.has_bd == 'true' && github.event.inputs.stage != 'probe' && github.event.inputs.stage != 'assess' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.bd_shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      # Shard hygiene (docs/channel-brief.md §0.7): drop earlier runs' per-shard
      # NEOWISE records AND the checked-out target list; the list comes from
      # this run's bd-targets job.
      - name: Purge checkout-inherited shard outputs
        run: rm -f results/ring/bd/acquire_shard*.json results/ring/bd/acquire_bd_shard*.json results/ring/bd/epochs_bd_shard*.csv results/ring/bd/neowise_stars_bd_shard*.csv results/ring/bd/targets.csv results/ring/bd/acquire_targets.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # A missing list is NOT refetched here: the shard then records
      # NO_DATA_REACHED rather than acquiring a list of its own.
      - name: Take this run's target list
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ring-bd-targets
          path: ${{ runner.temp }}/bd_targets/
      - name: Acquire NEOWISE epochs (shard ${{ matrix.shard }} of ${{ github.event.inputs.bd_shards || '3' }})
        if: ${{ github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire' }}
        run: |
          python -u scripts/ring_bd_handoff.py acquire \
            --targets "$RUNNER_TEMP/bd_targets" \
            --shard ${{ matrix.shard }}/${{ github.event.inputs.bd_shards || '3' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-bd-shard-${{ matrix.shard }}
          # Only this shard's own files (IGNITION's EpochStore, tag bd_shard<i>,
          # plus run.py's acquire_shard<i>.json).  The whole of bd/ carried the
          # checked-out targets.csv / screen.json / bd_screened.csv into every
          # shard's artifact, and `assess` merges them with merge-multiple.
          # The target list travels once, as the ring-bd-targets artifact.
          path: |
            results/ring/bd/epochs_bd_shard${{ matrix.shard }}.csv
            results/ring/bd/neowise_stars_bd_shard${{ matrix.shard }}.csv
            results/ring/bd/acquire_bd_shard${{ matrix.shard }}.json
            results/ring/bd/acquire_shard${{ matrix.shard }}.json
          if-no-files-found: warn

  assess:
    needs: [plan, probe, leg, bd-targets, bd]
    # `always()` must not mean "also when the sharded path was never chosen":
    # in solo mode every job it needs is skipped, and an assess job running on
    # an empty results/ring would race the solo job's commit with a verdict
    # composed from nothing.
    if: ${{ always() && (github.event.inputs.solo || 'true') != 'true' && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # A leg that produced no artifact must cost that leg, not the assess job:
      # stage_assess reads NOT_RUN / NO_DATA_REACHED for whatever is missing and
      # names it in the verdict, which is the honest outcome.  Without this a
      # single failed upload skips the assess step and the run commits nothing
      # at all.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ring-leg-*
          path: results/ring/_legs/
      # The bd screen globs acquire_shard*.json / epochs_bd_shard*.csv: when
      # this run acquired, only its own shards' files may be on disk (§0.7).
      - name: Purge checkout-inherited shard outputs
        if: ${{ needs.plan.outputs.has_bd == 'true' && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire') }}
        run: rm -f results/ring/bd/acquire_shard*.json results/ring/bd/acquire_bd_shard*.json results/ring/bd/epochs_bd_shard*.csv results/ring/bd/neowise_stars_bd_shard*.csv
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ring-bd-shard-*
          merge-multiple: true
          path: results/ring/bd/
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.has_bd == 'true' && (github.event.inputs.stage == 'all' || github.event.inputs.stage == 'acquire') }}
        continue-on-error: true
        with:
          name: ring-bd-targets
          path: results/ring/bd/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ring-probe
          path: results/ring/
      - name: Lay the leg artifacts out under results/ring/<leg>/
        if: always()
        run: |
          set -e
          mkdir -p results/ring
          for d in results/ring/_legs/ring-leg-*; do
            [ -d "$d" ] || continue
            leg="${d##*/ring-leg-}"
            mkdir -p "results/ring/$leg"
            cp -R "$d/." "results/ring/$leg/"
          done
          rm -rf results/ring/_legs
          ls -R results/ring | head -80
      - name: Screen the brown-dwarf epochs (all shards together) and assess
        if: always()
        run: |
          python -u -m seti.ring.run --stage screen --leg bd || true
          EXTRA=""
          if [ "${{ github.event.inputs.skip_followup }}" = "true" ]; then EXTRA="--no-followup"; fi
          python -u -m seti.ring.run --stage assess $EXTRA
          echo "=== summary ==="
          python -c "import json; s=json.load(open('results/ring/summary.json')); print(json.dumps({k: v for k, v in s.items() if k not in ('legs',)}, indent=2)[:6000]); print(json.dumps({k: {kk: vv for kk, vv in v.items() if kk not in ('flagged','ring_candidates','survivors')} for k, v in s['legs'].items()}, indent=2)[:8000])"
      - name: Assert the verdict is not a disguised no-data run
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/ring/summary.json")
          if not p.exists():
              print("::error::no summary.json"); sys.exit(1)
          s = json.loads(p.read_text())
          v = s.get("verdict", "")
          legs = s.get("legs", {})
          reached = [k for k, l in legs.items() if l.get("status") == "OK"]
          if not reached and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with no leg reaching data is a disguised no-data run"); sys.exit(1)
          print(f"::notice::{v} -- legs reached: {reached}; degraded: {s.get('degraded_legs')}")
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ring: rings around the dead — ${{ github.event.inputs.stage || 'all' }} (${{ github.event.inputs.legs || 'wd,pulsar,bd,ffp' }})" \
            results/ring/summary.json \
            results/ring/REPORT.md \
            results/ring/probe.json \
            results/ring/wd/acquire.json \
            results/ring/wd/screen.json \
            results/ring/wd/excess.csv \
            results/ring/wd/followup.csv \
            results/ring/pulsar/acquire.json \
            results/ring/pulsar/screen.json \
            results/ring/pulsar/pulsars_screened.csv \
            results/ring/pulsar/counterparts.csv \
            results/ring/bd/acquire_targets.json \
            results/ring/bd/screen.json \
            results/ring/bd/targets.csv \
            results/ring/bd/bd_screened.csv \
            results/ring/ffp/acquire.json \
            results/ring/ffp/screen.json \
            results/ring/ffp/ffp_screened.csv \
            $(ls results/ring/bd/acquire_shard*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-final
          path: |
            results/ring/
            !results/ring/wd/chunks
            !results/ring/wd/sample*.parquet
          if-no-files-found: warn
