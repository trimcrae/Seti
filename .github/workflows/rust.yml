name: rust

# RUST — structures losing station-keeping (docs/rust.md).
#
#   novelty ────────────────────────────────────────────────┐
#   plan ──▶ sweep (N parallel field shards) ──▶ vet ───────┴─▶ (commit-back)
#
# The claim: a megaswarm whose guidance has failed enters a collisional cascade
# (Lacki 2025, arXiv:2504.21151), so its host star's APERIODIC VARIABILITY
# AMPLITUDE rises secularly over the survey decade.  That is the SECOND moment
# of the light curve; the `dimming` channel trended the FIRST (season-median
# brightness) and is exhausted at the ZTF systematics floor.  Different moment,
# different systematics — see docs/rust.md for how far that is demonstrated
# rather than asserted.
#
# Design inherited from herdsman.yml, which encodes what earlier runs cost:
#  * checkpointing — every field writes its own field_summary.json and
#    rust_candidates.csv immediately, and uploads use `if: always()`, so a
#    killed shard loses minutes rather than the run.
#  * sharding — fields run as a fail-fast:false matrix; wall clock is one shard.
#  * artifact passthrough — the sweep's candidate tables travel to the vet job.
#  * reduce_only_run_id — re-vet a prior run's shards without refetching ZTF.
#  * the novelty job is independent of the search, so the literature evidence
#    lands even if IRSA is having a bad day.

on:
  workflow_dispatch:
    inputs:
      fields:
        description: >-
          Semicolon-separated ra,dec field centres. Default is a high-galactic-
          latitude set (low crowding => the blending confounder is suppressed at
          selection rather than at vetting).
        required: false
        default: "225.0,10.0;240.0,20.0;255.0,25.0;190.0,30.0;205.0,35.0;170.0,25.0;150.0,30.0;135.0,35.0"
      radius_deg:
        description: "Half-width of each square field (deg)"
        required: false
        default: "0.5"
      box_deg:
        description: "IRSA bulk-fetch tile size (deg)"
        required: false
        default: "0.12"
      min_epochs:
        description: "Minimum ZTF epochs per band (a second moment needs many)"
        required: false
        default: "60"
      min_epochs_season:
        description: "Minimum epochs per season per band"
        required: false
        default: "8"
      min_seasons:
        description: "Minimum usable seasons"
        required: false
        default: "4"
      time_budget_s:
        description: "Per-field IRSA wall-clock budget (s)"
        required: false
        default: "2400"
      max_candidates:
        description: "Cap on candidates carried into the vetting gauntlet"
        required: false
        default: "200"
      run_novelty:
        description: "Run the literature novelty fetch (true/false)"
        required: false
        default: "true"
      reduce_only_run_id:
        description: "Skip the sweep; vet from this prior run's artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Novelty: establish from the record, on a machine with egress, that the
  # second-moment statistic is unoccupied.  Independent of the search jobs.
  # ------------------------------------------------------------------
  novelty:
    if: ${{ github.event.inputs.run_novelty != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Fetch RUST prior art + decoy-aware concept scan
        run: python scripts/rustlit_fetch.py
      - name: Show the verdict inputs
        run: |
          echo "=== concept scan ==="
          python -c "import json;d=json.load(open('results/rustlit/concept_scan.json'));d.pop('all_hits',None);print(json.dumps(d,indent=2)[:6000])"
          echo "=== fetch status ==="
          python -c "import json;d=json.load(open('results/rustlit/summary.json'));print(d['n_ok'],'/',d['n_urls'],'ok')"
      - name: Commit novelty evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/rustlit
          if git diff --cached --quiet; then
            echo "No novelty changes to commit."
          else
            git commit -m "rust: literature evidence for the second-moment novelty claim"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-novelty
          path: results/rustlit/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fields: ${{ steps.mk.outputs.fields }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = """${{ github.event.inputs.fields }}""".strip()
          fields = [f.strip() for f in raw.split(";") if f.strip()]
          print("fields=" + json.dumps(fields))
          PY

  sweep:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4          # be a good citizen toward the IRSA light-curve API
      matrix:
        field: ${{ fromJSON(needs.plan.outputs.fields) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Sweep field ${{ matrix.field }}
        run: |
          RA="$(echo '${{ matrix.field }}' | cut -d, -f1)"
          DEC="$(echo '${{ matrix.field }}' | cut -d, -f2)"
          python -m seti.cli rust-sweep \
            --ra "$RA" --dec "$DEC" \
            --radius-deg ${{ github.event.inputs.radius_deg || '0.5' }} \
            --box-deg ${{ github.event.inputs.box_deg || '0.12' }} \
            --min-epochs ${{ github.event.inputs.min_epochs || '60' }} \
            --min-epochs-season ${{ github.event.inputs.min_epochs_season || '8' }} \
            --min-seasons ${{ github.event.inputs.min_seasons || '4' }} \
            --time-budget-s ${{ github.event.inputs.time_budget_s || '2400' }}
          echo "=== field summary ==="
          cat results/rust/*/field_summary.json
      - name: Shard name
        id: nm
        run: echo "tag=$(echo '${{ matrix.field }}' | tr ',.-' '___')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-field-${{ steps.nm.outputs.tag }}
          path: results/rust/
          if-no-files-found: warn

  vet:
    needs: sweep
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: rust-field-*
          merge-multiple: true
          path: results/rust/
      - name: Vetting gauntlet
        run: |
          python -m seti.cli rust-vet \
            --max-candidates ${{ github.event.inputs.max_candidates || '200' }}
          echo "=== summary ==="
          cat results/rust/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/rust ':(exclude)results/rust/**/*.parquet'
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "rust: secular rise in aperiodic variability amplitude — ZTF g+r sweep"
            git checkout -- . 2>/dev/null || true
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || \
              { git checkout -- . 2>/dev/null || true; \
                git pull --rebase --autostash origin ${{ github.ref_name }}; \
                git push origin HEAD:${{ github.ref_name }}; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-final
          path: results/rust/
          if-no-files-found: warn

  vet-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch field artifacts from prior run
        uses: actions/download-artifact@v4
        with:
          pattern: rust-field-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/rust/
      - name: Vetting gauntlet
        run: |
          ls results/rust/ | head -40
          python -m seti.cli rust-vet \
            --max-candidates ${{ github.event.inputs.max_candidates || '200' }}
          cat results/rust/summary.json || true
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- results/rust ':(exclude)results/rust/**/*.parquet'
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "rust: re-vet of a prior sweep's field artifacts"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-final
          path: results/rust/
          if-no-files-found: warn
