name: ignition

# IGNITION — an infrared excess being born on an old star (docs/ignition.md).
#
#   fields mode:  sample ──▶ acquire+screen (N shards) ──▶ assess ──▶ commit-back
#   tiles  mode:  probe  ──▶ sweep+screen  (N shards, each samples AND acquires
#                            its own tiles under one wall clock and commits its
#                            own sweep/screen record) ──▶ assess ──▶ commit-back
#     ▲
#   probe (first, cheap): the Gaia x AllWISE join, the NEOWISE cone on a
#   resolved star, and the UPLOAD LADDER on two stars — decides the acquire route.
#
# Signature S61 (docs/necrofrontier.md §2 XIV): a takeover's resource-
# acquisition phase is exponential over decades, so the residue in a decade-
# baseline archive is a MONOTONIC W1/W2 RISE sustained >= 5 yr on a Gaia-
# astrometric, kinematically old field star that was photospheric in AllWISE
# 2010, with a flat optical light curve.  The natural background differs in
# TIME SIGNATURE: born excesses (impacts, comet swarms) rise in < 1 yr and
# decay; obscured-AGN turn-ons rise for a decade but have no parallax.
#
# What run 35039105536 (2026-09-16, the first full run) taught, encoded below:
#  * the field route at 1 degree near the ecliptic poles is 2.4-4.7 M rows a
#    cone: 1.5 GB VOTables, IncompleteRead / RemoteDisconnected / 502, 20-65 min
#    per query, TOP-4M truncation, two shards killed at the job limit with no
#    checkpoint — 314 of 336 attempted stars lost.  It is never recommended now;
#  * the TAP_UPLOAD join was refused with `QUERY must be set`: pyvo's multipart
#    form on the async queue.  A transport failure, so the probe now walks a
#    LADDER (pyvo sync, raw HTTP sync/async with the parameters in the URL,
#    IRSA Gator multi-object) and records the rung that answered;
#  * the per-star cone worked (4,110 rows in 15.6 s) and is the fallback, per
#    chunk and per shard, running `cone_workers` at a time;
#  * 97 of 172 screened stars were FADING at 5 sigma in both bands: the
#    survey's zero point, not the stars.  The screen now subtracts the shard's
#    ensemble offset per 0.25-yr bin and records it, with the raw slope kept
#    per star;
#  * a stale shard file from an earlier matrix (s0of8 next to s0of16) must not
#    be summed into a new verdict: assess reads only `*of{N}` files.
#
# What VIGIL's run taught, still encoded:
#  * VIGIL's summary.json said NO_DATA_REACHED over eight field summaries that
#    said SEARCHED: the aggregator ran without the per-field artefacts.  The
#    assess job here LISTS what it downloaded, and FAILS if the acquire matrix
#    ran but no shard output reached it (a disguised no-data run);
#  * every shard checkpoints (CSV append + progress JSON; tiles mode also per
#    tile) and uploads with `if: always()`, so a killed shard loses one batch;
#  * commit-back through scripts/commit_results.sh, which VERIFIES the push.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: >-
          "all" (probe, sample, acquire+screen matrix, assess), "probe" (the
          archive probe only), or "assess" with reduce_only_run_id to
          re-assess a prior run's shard artifacts.
        required: false
        default: "all"
      mode:
        description: >-
          Sample mode: "fields" (the 20 configured ecliptic-pole cones),
          "allsky" (parallax shells; needs the upload route) or "tiles" (the
          whole |b| > 15 sky in ~4-degree boxes, each shard sampling AND
          acquiring its own tiles under a wall clock — the scale mode).
        required: false
        default: "fields"
      shards:
        description: "Number of acquire+screen (or sweep) shards"
        required: false
        default: "8"
      max_parallel:
        description: "Shards running at once (each holds cone_workers IRSA connections)"
        required: false
        default: "4"
      budget_min:
        description: >-
          tiles mode: minutes after which a shard stops STARTING tiles (its
          finished tiles are complete and committed).  The job timeout is this
          plus 60.  Default 150 (~3 h wall clock per dispatch).
        required: false
        default: "150"
      tile_deg:
        description: "tiles mode: box side in degrees (0 = config default, 4)"
        required: false
        default: "0"
      max_stars:
        description: >-
          fields/allsky: cap on stars per shard (sample rows per shard AND stars
          fetched per shard).  0 = config default (20000).
        required: false
        default: "2000"
      route:
        description: "NEOWISE route: auto (from probe.json) | upload | cone | field"
        required: false
        default: "auto"
      parent_route:
        description: >-
          Parent-sample route: "auto" (ESA Gaia TAP first, then the IRSA route,
          then VizieR's non-TAP ASU mirrors) or "esa_only" (no fallback).
        required: false
        default: "auto"
      sample_from_run_id:
        description: >-
          Skip the probe AND the sample: take probe.json / sample.json /
          parent.parquet from this prior run's `ignition-sample` artifact and
          go straight to acquire.  Run 35653615329's sample step ran 2 h 22 min
          over the same 20 cones without finishing (ESA was slow that night)
          and the acquire matrix never started; the 846-star parent it needs
          was already pulled, in 719 s, by run 35039105536.  A parent that is
          already on disk is not worth re-pulling.
        required: false
        default: ""
      resume_run_id:
        description: >-
          Resume each shard from the `ignition-shard-<i>` artifact of this prior
          run (same shard count): finished tiles and stars are not re-fetched.
        required: false
        default: ""
      reduce_only_run_id:
        description: "Skip probe/sample/acquire; assess from this prior run's artifacts"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  plan:
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      n_shards: ${{ steps.mk.outputs.n_shards }}
      max_parallel: ${{ steps.mk.outputs.max_parallel }}
      timeout_min: ${{ steps.mk.outputs.timeout_min }}
      budget_s: ${{ steps.mk.outputs.budget_s }}
    steps:
      - id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = int("${{ github.event.inputs.shards || '8' }}" or 8)
          mp = int("${{ github.event.inputs.max_parallel || '4' }}" or 4)
          budget_min = int("${{ github.event.inputs.budget_min || '150' }}" or 150)
          mode = "${{ github.event.inputs.mode || 'fields' }}"
          # tiles: the shard clock plus an hour for the screen and the upload;
          # fields/allsky: the old generous limit.  Never above GitHub's 360.
          timeout_min = min(budget_min + 60, 355) if mode == "tiles" else 350
          print("matrix=" + json.dumps({"include": [{"shard": i} for i in range(n)]}))
          print(f"n_shards={n}")
          print(f"max_parallel={max(1, min(mp, n))}")
          print(f"timeout_min={timeout_min}")
          print(f"budget_s={budget_min * 60}")
          PY

  sample:
    needs: plan
    if: ${{ github.event.inputs.reduce_only_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline gate — injected ramp recovered, impact rejected, drift removed, on this runner
        run: |
          python -m pytest tests/test_ignition.py -q -p no:cacheprovider -k "injected or impact or no_data or one_band"
          python -m pytest tests/test_ignition_scale.py -q -p no:cacheprovider -k "ladder or drift or tile_grid or sweep_stage or adds_a_tile"
          python -m pytest tests/test_ignition_vetladder.py -q -p no:cacheprovider
      - name: Reuse a prior run's parent sample (skip probe + sample)
        if: ${{ github.event.inputs.sample_from_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ignition-sample
          run-id: ${{ github.event.inputs.sample_from_run_id }}
          github-token: ${{ github.token }}
          path: results/ignition/
      - name: What the reused sample contains
        if: ${{ github.event.inputs.sample_from_run_id != '' }}
        run: |
          ls -la results/ignition/
          # The reused artifact's probe.json is an OLDER run's archive record.
          # Drop it: the branch's own probe.json (the most recent live probe) is
          # what `--route auto` must read, and it must not be overwritten by a
          # record this dispatch did not gather.
          git checkout -- results/ignition/probe.json 2>/dev/null || rm -f results/ignition/probe.json
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/ignition/parent.parquet")
          if not p.exists():
              print("::error::run ${{ github.event.inputs.sample_from_run_id }} carried no parent.parquet"); sys.exit(1)
          import pandas as pd
          df = pd.read_parquet(p)
          print(f"reused parent: {len(df)} stars, columns {list(df.columns)[:12]}")
          s = json.loads(pathlib.Path("results/ignition/sample.json").read_text())
          print("route_used:", s.get("route_used"), "n_units:", s.get("n_units"),
                "parent_count:", s.get("parent_count"), "elapsed_s:", s.get("elapsed_s"))
          PY
      - name: Probe the archives (Gaia shapes, the IRSA and VizieR ASU routes, NEOWISE cone, the upload ladder)
        if: ${{ github.event.inputs.sample_from_run_id == '' }}
        run: |
          python -m seti.ignition.run --stage probe
          echo "=== probe.json ==="
          python - <<'PY'
          import json
          d = json.load(open("results/ignition/probe.json"))
          print("gaia_shape_working:", d.get("gaia_shape_working"))
          for s in d.get("gaia_shapes", []):
              print(f"  {s.get('shape')}: {s.get('status')} in {s.get('elapsed_s')} s "
                    f"queue={s.get('queue')} {str(s.get('error') or '')[:200]}")
          print("parent_route_recommended:", d.get("parent_route_recommended"))
          print("neowise_route_recommended:", d.get("neowise_route_recommended"),
                "upload_transport:", d.get("neowise_upload_transport"))
          up = d.get("neowise_upload") or {}
          print(f"  upload: {up.get('status')} label={up.get('label')} rows={up.get('n_rows')} "
                f"{up.get('elapsed_s')} s")
          print("  upload errors:", str(up.get("error") or "")[:1500])
          nc = d.get("neowise_cone") or {}
          print(f"  cone: {nc.get('status')} rows={nc.get('n_rows')} {nc.get('elapsed_s')} s")
          print(json.dumps({k: d[k] for k in d
                            if k not in ("allwise_columns_seen", "gaia_shapes", "vizier_asu",
                                         "neowise_upload", "neowise_cone", "irsa_tap")},
                           indent=2)[:4000])
          PY
      - name: Sample (Gaia DR3 x AllWISE parent — ESA first, IRSA and VizieR ASU as fallbacks)
        # fields/allsky only: in tiles mode every shard samples its own tiles.
        if: ${{ github.event.inputs.stage != 'probe' && github.event.inputs.mode != 'tiles' && github.event.inputs.sample_from_run_id == '' }}
        run: |
          MS=""
          if [ "${{ github.event.inputs.max_stars || '0' }}" != "0" ]; then
            MS="--max-stars ${{ github.event.inputs.max_stars }}"
          fi
          VZ=""
          if [ "${{ github.event.inputs.parent_route || 'auto' }}" = "esa_only" ]; then
            VZ="--no-vizier --no-irsa"
          fi
          python -m seti.ignition.run --stage sample \
            --shards ${{ needs.plan.outputs.n_shards }} \
            --mode "${{ github.event.inputs.mode || 'fields' }}" $MS $VZ
          echo "=== sample.json ==="
          python - <<'PY'
          import json
          d = json.load(open("results/ignition/sample.json"))
          print(json.dumps({k: d[k] for k in d if k not in ("ledger", "per_unit")}, indent=2)[:4000])
          print("routes:", d.get("routes"), "fractions:", d.get("route_fractions"))
          print("DEGRADED:", d.get("degraded"))
          for u in d.get("per_unit", []):
              print(u)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-sample
          path: |
            results/ignition/probe.json
            results/ignition/sample.json
            results/ignition/parent.parquet
          if-no-files-found: warn
      - name: Commit the probe and sample evidence
        # A GREEN RUN THAT COMMITS NOTHING IS A LOST RUN.  The artifact upload
        # above runs first, so the evidence is safe even if the push cannot land.
        # A REUSED sample produced nothing this run, and its probe.json is an
        # older run's: committing it would overwrite the branch's own record
        # with evidence this dispatch did not gather.
        if: ${{ always() && github.event.inputs.sample_from_run_id == '' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ignition: probe — which Gaia shape, which NEOWISE route and which upload rung answered" \
            results/ignition/probe.json \
            $(ls results/ignition/sample.json 2>/dev/null)

  acquire:
    needs: [plan, sample]
    if: ${{ github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout_min) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start from a clean results tree
        # The checkout carries the committed shard files of EARLIER dispatches
        # (a resumed shard's own record is restored from its artifact below).
        run: |
          rm -f results/ignition/epochs_s*.csv results/ignition/neowise_stars_s*.csv \
                results/ignition/acquire_s*.json results/ignition/stars_s*.csv \
                results/ignition/screen_s*.json results/ignition/sweep_s*.json \
                results/ignition/parent_s*.parquet
      - uses: actions/download-artifact@v4
        with:
          name: ignition-sample
          path: results/ignition/
      - name: Resume this shard from a prior run's artifact
        if: ${{ github.event.inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ignition-shard-${{ matrix.shard }}
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: results/ignition/
      - name: Sweep shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} (tiles mode — sample + acquire per tile under one wall clock)
        if: ${{ github.event.inputs.mode == 'tiles' }}
        run: |
          TD=""
          if [ "${{ github.event.inputs.tile_deg || '0' }}" != "0" ]; then
            TD="--tile-deg ${{ github.event.inputs.tile_deg }}"
          fi
          VZ=""
          if [ "${{ github.event.inputs.parent_route || 'auto' }}" = "esa_only" ]; then
            VZ="--no-vizier --no-irsa"
          fi
          python -m seti.ignition.run --stage sweep \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} \
            --route "${{ github.event.inputs.route || 'auto' }}" \
            --budget-s ${{ needs.plan.outputs.budget_s }} $TD $VZ
      - name: Acquire shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} (NEOWISE frames -> epochs, checkpointed)
        if: ${{ github.event.inputs.mode != 'tiles' }}
        run: |
          MS=""
          if [ "${{ github.event.inputs.max_stars || '0' }}" != "0" ]; then
            MS="--max-stars ${{ github.event.inputs.max_stars }}"
          fi
          python -m seti.ignition.run --stage acquire \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} \
            --route "${{ github.event.inputs.route || 'auto' }}" $MS
      - name: Screen shard ${{ matrix.shard }} (ensemble correction, rise statistics, two-band rule, injections)
        if: always()
        run: |
          python -m seti.ignition.run --stage screen \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }}
          ls -la results/ignition/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-shard-${{ matrix.shard }}
          path: |
            results/ignition/epochs_s*.csv
            results/ignition/neowise_stars_s*.csv
            results/ignition/acquire_s*.json
            results/ignition/sweep_s*.json
            results/ignition/parent_s*.parquet
            results/ignition/stars_s*.csv
            results/ignition/screen_s*.json
          if-no-files-found: warn
      - name: Commit this shard's own record (tiles mode)
        # Each shard lands its sweep + screen record itself, so a run whose
        # assess job never ran (or a shard the job limit killed after its
        # checkpoint) still leaves what it covered on the branch.  Contention
        # between shards is handled by the script's fetch/reset/retry loop.
        if: ${{ always() && github.event.inputs.mode == 'tiles' }}
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
          RESULTS_PUSH_ATTEMPTS: "12"
        run: |
          scripts/commit_results.sh \
            "ignition: sweep shard ${{ matrix.shard }}/${{ needs.plan.outputs.n_shards }} — tiles covered and screened" \
            $(ls results/ignition/sweep_s*.json 2>/dev/null) \
            $(ls results/ignition/screen_s*.json 2>/dev/null)

  assess:
    needs: [plan, sample, acquire]
    if: ${{ always() && github.event.inputs.reduce_only_run_id == '' && github.event.inputs.stage != 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ASAS-SN Sky Patrol client for the optical rung (a failed install is a recorded degradation)
        continue-on-error: true
        run: pip install "git+https://github.com/asas-sn/skypatrol.git"
      - name: Start from a clean results tree (stale shard files of earlier dispatches)
        run: |
          rm -f results/ignition/epochs_s*.csv results/ignition/neowise_stars_s*.csv \
                results/ignition/acquire_s*.json results/ignition/stars_s*.csv \
                results/ignition/screen_s*.json results/ignition/sweep_s*.json \
                results/ignition/parent_s*.parquet
      - uses: actions/download-artifact@v4
        with:
          pattern: ignition-*
          merge-multiple: true
          path: results/ignition/
      - name: What reached this job (VIGIL's aggregator ran on an empty tree and called it a null)
        run: |
          ls -la results/ignition/ | head -120
          N=$(ls results/ignition/screen_s*.json 2>/dev/null | wc -l)
          echo "shard screen files found: $N of ${{ needs.plan.outputs.n_shards }}"
          if [ "$N" = "0" ] && [ "${{ needs.acquire.result }}" != "skipped" ]; then
            echo "::error::the acquire matrix ran (result=${{ needs.acquire.result }}) but no shard output reached assess — artifact passthrough failed; refusing to write a verdict over nothing"
            exit 1
          fi
      - name: Assess (merge shards, contaminant ladder, candidates.csv, summary.json)
        run: |
          python -m seti.ignition.run --stage assess --shards ${{ needs.plan.outputs.n_shards }} --online-vet
          echo "=== summary ==="
          python - <<'PY'
          import json
          s = json.load(open("results/ignition/summary.json"))
          print(json.dumps({k: s[k] for k in s if k not in ("config",)}, indent=2)[:12000])
          PY
      - name: Assert the verdict is not a disguised no-data run
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("results/ignition/summary.json")
          if not p.exists():
              print("::error::no summary.json — the assess stage produced nothing"); sys.exit(1)
          s = json.loads(p.read_text())
          v = s.get("verdict", "")
          n = int((s.get("stage_counts") or {}).get("screened", 0) or 0)
          if n == 0 and "NO_DATA_REACHED" not in v:
              print(f"::error::verdict {v!r} with 0 screened stars is a disguised no-data run"); sys.exit(1)
          if "NO_DATA_REACHED" in v:
              print(f"::warning::NO_DATA_REACHED ({s.get('reason')}) — nothing was tested; see summary.json")
          if "NO_IGNITION_CANDIDATE" in v:
              print(f"::notice::{n} stars screened, no sustained two-band rise survived. A COUNT, NOT AN OCCURRENCE LIMIT — see docs/ignition.md.")
          if "IGNITION_CANDIDATES" in v:
              print(f"::notice::{s.get('n_candidates')} candidate(s) ({s.get('n_clean')} with the optical checked) — see results/ignition/candidates.csv")
          if s.get("degraded"):
              print(f"::warning::degraded: {s['degraded']}")
          cov = s.get("coverage") or {}
          if cov:
              print(f"::notice::coverage: {cov.get('tiles_done')}/{cov.get('tiles_in_sky')} tiles, "
                    f"sky fraction {cov.get('sky_fraction_done')}, {cov.get('n_parent_done_tiles')} parent stars")
          PY
      - name: Drop a reused run's probe record — this dispatch did not gather it
        if: ${{ always() && github.event.inputs.sample_from_run_id != '' }}
        run: |
          # The sample job deliberately does not commit a reused artifact's
          # probe.json: the branch's own probe record is the most recent LIVE
          # one.  The reused file is still sitting in the tree, though, and the
          # commit-back below would put it back over the branch's newer record
          # — which is what run 35738088082 did to run 35740159635's probe.
          # Remove it, so only a probe this dispatch actually ran is committed.
          rm -f results/ignition/probe.json
          echo "sample_from_run_id=${{ github.event.inputs.sample_from_run_id }}:" \
               "probe.json in the tree came from that run's artifact, not this" \
               "dispatch — not committing it over the branch's live probe record"
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          # Small files only: the epochs CSVs and parquet files travel as artifacts.
          scripts/commit_results.sh \
            "ignition: an infrared excess being born — probe/sample/acquire/screen/assess" \
            $(ls results/ignition/probe.json 2>/dev/null) \
            results/ignition/sample.json \
            results/ignition/summary.json \
            $(ls results/ignition/summary_*.json 2>/dev/null) \
            results/ignition/candidates.csv \
            results/ignition/stars_vetted.csv \
            $(ls results/ignition/vet_online.json 2>/dev/null) \
            $(ls results/ignition/screen_s*.json 2>/dev/null) \
            $(ls results/ignition/sweep_s*.json 2>/dev/null) \
            $(ls results/ignition/acquire_s*.json 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-final
          path: results/ignition/
          if-no-files-found: warn

  assess-only:
    if: ${{ github.event.inputs.reduce_only_run_id != '' && github.event.inputs.stage != 'revet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ASAS-SN Sky Patrol client for the optical rung (a failed install is a recorded degradation)
        continue-on-error: true
        run: pip install "git+https://github.com/asas-sn/skypatrol.git"
      - name: Start from a clean results tree
        run: |
          rm -f results/ignition/epochs_s*.csv results/ignition/neowise_stars_s*.csv \
                results/ignition/acquire_s*.json results/ignition/stars_s*.csv \
                results/ignition/screen_s*.json results/ignition/sweep_s*.json \
                results/ignition/parent_s*.parquet
      # Named downloads of the artifacts the in-run reducer reads, never one
      # merge-multiple over ignition-*: that also pulled the run's -final
      # artifact, which holds second copies of the same files, with no rule
      # for which copy won (docs/channel-brief.md §0.7).
      - name: Fetch the prior run's sample
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ignition-sample
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/ignition/
      - name: Fetch the prior run's shards
        uses: actions/download-artifact@v4
        with:
          pattern: ignition-shard-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/ignition/
      - name: Assess
        run: |
          ls results/ignition/ | head -120
          N=$(ls results/ignition/screen_s*.json 2>/dev/null | wc -l)
          echo "shard screen files found: $N"
          if [ "$N" = "0" ]; then
            echo "::error::no shard output in run ${{ github.event.inputs.reduce_only_run_id }}'s artifacts; refusing to write a verdict over nothing"
            exit 1
          fi
          SH=""
          if [ "${{ github.event.inputs.shards || '0' }}" != "0" ]; then
            SH="--shards ${{ github.event.inputs.shards }}"
          fi
          python -m seti.ignition.run --stage assess $SH --online-vet
          head -c 8000 results/ignition/summary.json
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ignition: re-assess of a prior run's shards" \
            results/ignition/summary.json \
            $(ls results/ignition/summary_*.json 2>/dev/null) \
            results/ignition/candidates.csv \
            results/ignition/stars_vetted.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-final
          path: results/ignition/
          if-no-files-found: warn

  # stage=revet with reduce_only_run_id=<run>: the re-vet of a finished sweep
  # (seti.ignition.revet) — the survey drift by brightness and |beta|, the
  # stratified ensemble and full re-screen, and the archive ladder for each
  # candidate (Gaia neighbours with proper motion, Gaia vari/QSO/AP, SIMBAD,
  # VSX, Milliquas, AllWISE neighbours, ZTF).  Pass `shards` = that run's count.
  revet:
    if: ${{ github.event.inputs.reduce_only_run_id != '' && github.event.inputs.stage == 'revet' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ASAS-SN Sky Patrol client (optical trend; a failed install is recorded, not fatal)
        continue-on-error: true
        run: pip install "git+https://github.com/asas-sn/skypatrol.git"
      - name: Offline gate — a brightness-dependent drift is removed by the stratified ensemble
        run: python -m pytest tests/test_ignition_revet.py -q -p no:cacheprovider
      - name: Start from a clean results tree
        run: |
          rm -f results/ignition/epochs_s*.csv results/ignition/neowise_stars_s*.csv \
                results/ignition/acquire_s*.json results/ignition/stars_s*.csv \
                results/ignition/parent_s*.parquet
      - name: Fetch the shard artifacts of the run being re-vetted
        uses: actions/download-artifact@v4
        with:
          pattern: ignition-shard-*
          merge-multiple: true
          run-id: ${{ github.event.inputs.reduce_only_run_id }}
          github-token: ${{ github.token }}
          path: results/ignition/
      - name: Re-vet
        run: |
          ls -la results/ignition/ | head -80
          N=$(ls results/ignition/stars_s*of${{ github.event.inputs.shards }}.csv 2>/dev/null | wc -l)
          echo "stars files of${{ github.event.inputs.shards }}: $N"
          if [ "$N" = "0" ]; then
            echo "::error::no stars_s*of${{ github.event.inputs.shards }}.csv in run ${{ github.event.inputs.reduce_only_run_id }}'s artifacts"
            exit 1
          fi
          python -m seti.ignition.revet --shards ${{ github.event.inputs.shards }} \
            --run-id ${{ github.event.inputs.reduce_only_run_id }} --workers 4
          python - <<'PY'
          import json
          r = json.load(open("results/ignition/revet.json"))
          print(json.dumps({k: r[k] for k in r if k not in ("archive",)}, indent=1, default=str)[:20000])
          PY
      - name: Commit results
        if: always()
        env:
          RESULTS_BRANCH: ${{ github.ref_name }}
        run: |
          scripts/commit_results.sh \
            "ignition: re-vet of run ${{ github.event.inputs.reduce_only_run_id }} — drift by brightness, stratified re-screen, archive ladder" \
            $(ls results/ignition/revet.json 2>/dev/null) \
            $(ls results/ignition/revet_candidates.csv 2>/dev/null) \
            $(ls results/ignition/revet_rescreen.csv 2>/dev/null)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ignition-revet
          path: |
            results/ignition/revet*.json
            results/ignition/revet*.csv
          if-no-files-found: warn
